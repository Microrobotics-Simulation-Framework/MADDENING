name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  # Decide which lanes a change needs.  A change that touches only
  # documentation (docs/, Markdown, plans/, .claude/, LICENSE) runs the
  # compliance job alone: that job owns the docs checks (citations,
  # implementation mapping, anomaly registry) and the only tests that read
  # docs/ (tests/compliance).  Anything else, including this workflow, runs
  # every lane.  A push with no usable base (new branch, force-push) counts
  # as code.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF" 2>/dev/null || true
            base="$(git merge-base "origin/$BASE_REF" HEAD || true)"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=""
          fi
          if [ -z "$base" ]; then
            echo "no diff base; running every lane"
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git diff --name-only "$base" HEAD)"
          echo "changed files vs $base:"; printf '  %s\n' $changed
          code=false
          for f in $changed; do
            case "$f" in
              docs/*|plans/*|.claude/*|*.md|*.rst|LICENSE|LICENSE.*|CITATION.cff) ;;
              *) code=true; break ;;
            esac
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code lanes needed: $code"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin JAX to known-good version to avoid jaxlib segfaults
          pip install "jax==0.10.2" "jaxlib==0.10.2"
          pip install -e ".[ci]"

      - name: Install C toolchain for the FMU wrapper tests
        # gcc + clang ship on ubuntu-latest; valgrind does not.  tests/fmi/
        # test_c_unit.py builds the wrapper plain, with ASan/UBSan, runs the
        # unit + fuzz binaries under both and under valgrind, and a short
        # libFuzzer campaign with clang; each part self-skips if its tool is
        # missing, so this step is what makes CI actually exercise them.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind clang

      - name: Run tests
        env:
          JAX_PLATFORMS: cpu
          XLA_FLAGS: "--xla_gpu_autotune_level=0"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest tests/ -v --tb=short --ignore=tests/viz

  test-usd:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (with USD)
        run: |
          python -m pip install --upgrade pip
          pip install "jax==0.10.2" "jaxlib==0.10.2"
          pip install -e ".[ci,usd]"

      - name: Run USD tests
        env:
          JAX_PLATFORMS: cpu
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest tests/usd/ -v --tb=short

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jax==0.10.2" "jaxlib==0.10.2"
          pip install -e ".[ci]"

      - name: Validate anomaly registry
        run: python scripts/check_anomalies.py

      - name: Check implementation mapping
        run: python scripts/check_impl_mapping.py

      - name: Check bibliography citations
        run: python scripts/check_citations.py

      - name: Check transform registry
        run: python scripts/check_transforms.py

      - name: Run compliance tests
        env:
          JAX_PLATFORMS: cpu
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest tests/compliance/ -v --tb=short

  verify-hypothesis:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jax==0.10.2" "jaxlib==0.10.2"
          pip install -e ".[ci]"

      - name: Run hypothesis property tests
        env:
          JAX_PLATFORMS: cpu
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest tests/verification/hypothesis/ -v --tb=short
