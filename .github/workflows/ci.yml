name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

jobs:
  # Decide which lanes a change needs.  A change that touches only
  # documentation (docs/, Markdown, plans/, .claude/, LICENSE) runs the
  # compliance job alone: that job owns the docs checks (citations,
  # implementation mapping, anomaly registry) and the only tests that read
  # docs/ (tests/compliance).  Anything else, including this workflow, runs
  # every lane.  A push with no usable base (new branch, force-push) and an
  # empty diff (a commit and its revert in one push) count as code: the
  # safe side.  Pattern semantics, on purpose: POSIX `case` `*` matches `/`,
  # so `docs/*` covers every nested path under docs/ and `*.md` / `*.rst`
  # match anywhere in the tree, including a README inside src/maddening
  # (package content, but nothing the test lanes read).  Renames are not
  # detected, so a rename out of a code path lists the source path too.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF" 2>/dev/null || true
            base="$(git merge-base "origin/$BASE_REF" HEAD || true)"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=""
          fi
          if [ -z "$base" ]; then
            echo "no diff base; running every lane"
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed="$(git -c core.quotePath=false diff --name-only --no-renames "$base" HEAD)"
          if [ -z "$changed" ]; then
            echo "empty diff vs $base (nothing changed in the tree); running every lane"
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "changed files vs $base:"
          code=false
          while IFS= read -r f; do
            case "$f" in
              docs/*|plans/*|.claude/*|*.md|*.rst|LICENSE|LICENSE.*|CITATION.cff)
                echo "  $f  (docs)" ;;
              *)
                echo "  $f  (code)"; code=true ;;
            esac
          done <<< "$changed"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code lanes needed: $code"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Pin JAX to known-good version to avoid jaxlib segfaults
          pip install "jax==0.10.2" "jaxlib==0.10.2"
          pip install -e ".[ci]"

      - name: Install C toolchain for the FMU wrapper tests
        # gcc + clang ship on ubuntu-latest; valgrind does not.  tests/fmi/
        # test_c_unit.py builds the wrapper plain, with ASan/UBSan, runs the
        # unit + fuzz binaries under both and under valgrind, and a short
        # libFuzzer campaign with clang; each part self-skips if its tool is
        # missing, so this step is what makes CI actually exercise them.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq valgrind clang

      - name: Run tests
        env:
          JAX_PLATFORMS: cpu
          XLA_FLAGS: "--xla_gpu_autotune_level=0"
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest tests/ -v --tb=short --ignore=tests/viz

  test-usd:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (with USD)
        run: |
          python -m pip install --upgrade pip
          pip install "jax==0.10.2" "jaxlib==0.10.2"
          pip install -e ".[ci,usd]"

      - name: Run USD tests
        env:
          JAX_PLATFORMS: cpu
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest tests/usd/ -v --tb=short

  typecheck:
    # Phase 1 of the typing policy (docs/developer_guide/typing.md): the
    # pyright run is visible but non-blocking until the 0.4.0 API freeze,
    # after which the STABLE surface is annotated and the check becomes
    # blocking in two tiers (tier 1 at zero errors; tier 2 every public
    # signature annotated, bodies ratcheted).  Two steps so that a broken
    # tool never looks like an unchanged count: the first runs pyright and
    # FAILS THE JOB when the run cannot be trusted (pyright missing, exit
    # code other than 0/1, no JSON, zero files analysed, core imports
    # unresolved: exit 2 from scripts/typing_baseline.py); the second
    # reports the error count and fails under `continue-on-error`, so
    # the count is visible while the workflow stays green.  The summary
    # goes to the step summary and the log.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Same JAX pin and extra as the test job so pyright resolves the
        # optional imports (matplotlib, zmq, fastapi, skypilot, ...) the
        # way the tests see them; pyright itself comes from the ci extra.
        run: |
          python -m pip install --upgrade pip
          pip install "jax==0.10.2" "jaxlib==0.10.2"
          pip install -e ".[ci]"

      - name: Run pyright (infrastructure; fails the job)
        id: pyright
        run: |
          pyright --version
          status=0
          python scripts/typing_baseline.py --markdown --top 15 --fail-on-errors \
            > typing_summary.md || status=$?
          cat typing_summary.md
          if [ -s typing_summary.md ]; then
            {
              echo "## pyright (typeCheckingMode from pyrightconfig.json, non-blocking in phase 1)"
              cat typing_summary.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          case "$status" in
            0|1) ;;
            *) echo "::error title=pyright::type check did not complete (exit $status); see the log"
               exit "$status" ;;
          esac

      - name: Report error count (non-blocking in phase 1)
        continue-on-error: true
        env:
          STATUS: ${{ steps.pyright.outputs.status }}
        run: |
          if [ "$STATUS" = "0" ]; then
            echo "pyright: no errors"; exit 0
          fi
          n="$(sed -n 's/^files analysed:.*; errors: \([0-9]*\);.*/\1/p' typing_summary.md)"
          echo "::warning title=pyright::${n:-?} type errors in src/maddening (phase 1: visible, non-blocking)"
          exit 1

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jax==0.10.2" "jaxlib==0.10.2"
          pip install -e ".[ci]"

      - name: Validate anomaly registry
        run: python scripts/check_anomalies.py

      - name: Check implementation mapping
        run: python scripts/check_impl_mapping.py

      - name: Check bibliography citations
        run: python scripts/check_citations.py

      - name: Check transform registry
        run: python scripts/check_transforms.py

      - name: Run compliance tests
        env:
          JAX_PLATFORMS: cpu
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest tests/compliance/ -v --tb=short

  verify-hypothesis:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "jax==0.10.2" "jaxlib==0.10.2"
          pip install -e ".[ci]"

      - name: Run hypothesis property tests
        env:
          JAX_PLATFORMS: cpu
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python -m pytest tests/verification/hypothesis/ -v --tb=short
