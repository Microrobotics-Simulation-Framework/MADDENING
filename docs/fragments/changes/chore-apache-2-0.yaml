# This branch's changelog bullets and release-notes text.  Never edit
# CHANGELOG.md or docs/release_notes/ in a pull request: the release assembly
# (scripts/fragments.py assemble --release) writes them from this file.
line: "0.4"
changelog:
  Changed:
    - "**MADDENING is now licensed under the Apache License, Version 2.0** (`Apache-2.0`), and ships a `NOTICE` file. Releases up to and including 0.4.1 were distributed under the LGPL, and copies obtained under those terms keep them. The package metadata, `CITATION.cff`, the SOUP document, the SBOMs and the regulatory guides (`intended_use.md`, `downstream_integration.md`) say so; the guides' LGPL replaceability statement becomes a licence statement."
release_notes:
  Summary: |
    MADDENING is now licensed under the Apache License, Version 2.0.
  What changes for existing code: |
    - **The licence is Apache-2.0** (it was LGPL). Nothing in the library's
      behaviour changes. Apache-2.0 is permissive, with no copyleft: a
      product that uses MADDENING keeps the copyright and licence notices,
      ships the attributions in the new `NOTICE` file, and marks any of
      MADDENING's files it changed. The licence includes an explicit patent
      grant from each contributor. The LGPL replaceability statement in the
      regulatory guides is replaced by a licence statement. Releases up to and
      including 0.4.1 were distributed under the LGPL, and copies obtained
      under those terms keep them.
