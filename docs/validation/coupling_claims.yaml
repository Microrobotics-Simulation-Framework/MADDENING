- id: CPL-009
  area: configuration
  claim: >-
    convergence_norm: "All three scale each field's change by the field's own
    magnitude, so a group's verdict does not depend on the units its
    quantities are written in."
  sources:
    - src/maddening/core/coupling/group.py:80 (CouplingGroup, convergence_norm)
    - docs/developer_guide/coupling_algorithm_guide.md#reading-coupling_diagnostics
  conditions: >-
    the verdict (converged); atol=0 (a declared dead band is units by
    definition); every quantity rescaled by the same factor and the map
    equivariant under it (no absolute forcing); magnitudes inside the normal
    float range.  Exact for power-of-two factors: bit-identical runs (state,
    pass count, residual, error estimate, verdict).  A decimal factor rounds
    the inputs differently: the error estimate moves by rounding, within 1%
    of itself plus 16 float floors (residual_precision_floor) of the
    unscaled one (measured, float32: 0.17% and 4.7 floors), so the pass
    count can move, and so can the verdict of a group that stops at its
    iteration cap with the estimate inside that band about the threshold
