- id: CPL-092
  area: report
  claim: >-
    spectral_usable: "the bound above is finite and the Arnoldi space had
    settled: the Arnoldi residual h_{k+1,k} is at most 5% of
    1 - rho_spectral.  False where nothing was computed, where the bound is
    inf, for a group with more independent interface scalars than the eight
    Krylov steps resolve ... where the residual never entered the Krylov
    space ... and where the residual is at its float floor
    (precision_limited) while a node in the group has not declared
    update_evaluations()."
  sources:
    - src/maddening/core/graph_manager.py:7994 (coupling_diagnostics, spectral_usable)
    - src/maddening/core/coupling/acceleration.py:1249 (spectral_rate_settled)
    - docs/developer_guide/coupling_algorithm_guide.md#a-stalled-float32-iterate-reads-convergedtrue
