    group's spurious GMRES breakdown is gone, and the default coupling group
    is differentiable on a base install with no extra.
  sources:
    - docs/user_guide/installation.md#installation
    - src/maddening/core/coupling/_ift.py::_ift_linear_solve
  conditions: default settings.
  oracle: generated spectra and cotangents; an install with every extra unimportable.
  tests:
    - tests/property/test_coupling_adjoint_solve.py::test_grad_through_the_default_coupling_solver_never_raises
    - tests/core/test_solver_ift_lineax_is_core.py::test_default_coupling_group_differentiable_with_no_extra_installed
    - tests/core/test_krylov_solves_propagate_a_non_finite_rhs.py::test_a_non_finite_cotangent_gives_a_nan_gradient_not_zero
  status: verified
  notes: >-
    16bit domain failing on d2429a6: jax.grad and jax.jvp through a bfloat16
    or float16 group raised NotImplementedError (lineax's QR TypeError on
    jax 0.11.2), the IFT rule's linear solve running in the group's dtype
    (MADD-ANO-161). Fixed: the solve runs in float32 on the group's own
    operator and is cast back. adaptive domain failing on d2429a6: jax.grad
    through run_adaptive_scan read NaN (0.0 on 3fe7f275) where the
    step-doubling estimates agreed exactly -- the controller's error norm, a
    square root, had an infinite derivative there (MADD-ANO-160). Fixed with
    a double where in adaptive._tree_error_norm.
    It lied for a non-finite cotangent until 0.4.0's fix (MADD-ANO-154):
    the gradient read exactly 0.0, reported successful, where dense and
    fori read NaN.  The generated cotangents of the property test are
    finite; the non-finite case is CPL-185's.
