- id: CPL-143
  area: ift gradients
  claim: >-
    The adjoint's Krylov criterion: "atol is scaled to the largest rhs entry
    -- the usual "relative to ||b||" Krylov criterion -- and rtol is no
    tighter than ~100 ulp of the dtype", so exact zeros in a cotangent no
    longer read as a breakdown.
  sources:
    - src/maddening/core/graph_manager.py:2021 (_ift_linear_solve)
    - docs/release_notes/v0.4.0.md#the-iqn-family-corrected
  conditions: any rhs scale with a normal largest entry; a zero rhs is answered with zeros; a rhs with a NaN or infinite entry is answered with NaN in every entry (CPL-185).
  oracle: the gradient of s * sum(x*) divided by s, against the analytic 1 / (1 - g) at s = 1e-12.
  tests:
    - tests/core/test_coupling_claims_graphs.py::test_the_ift_gradient_is_scale_equivariant_in_the_cotangent
    - tests/property/test_coupling_adjoint_solve.py::test_grad_through_the_default_coupling_solver_never_raises
