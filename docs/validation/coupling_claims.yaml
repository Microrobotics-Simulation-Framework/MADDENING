- id: CPL-189
  area: report
  claim: >-
    "The floor is measured on the state the step returned, and stays so when
    the state is written afterwards (set_node_state, PUT /graph/state, a node
    replaced): the entry describes the step that ran until the group steps
    again, the state is reset or a member is removed.  A checkpoint is
    a copy of the state, _meta included, so one saved after such a write to
    a member holds the written state and not the returned one; it carries a
    marker saying so, and the graph that loads it reports the group with
    spectral_error_bound NaN, spectral_usable, gradient_bound_usable and
    precision_limited False and a not_usable_reason, until the group
    steps.  The entry's other numbers are the slots' own."
  sources:
    - src/maddening/core/graph_manager.py::GraphManager.coupling_diagnostics (precision_limited)
    - src/maddening/core/graph_manager.py::GraphManager._keep_state_for_reports
    - src/maddening/core/graph_manager.py::GraphManager._groups_written_after_their_step
    - src/maddening/core/graph_manager.py::GraphManager._loaded_after_a_write
    - src/maddening/core/simulation/checkpoint.py::_load_from_archive
    - src/maddening/core/simulation/checkpoint.py::save_state
  conditions: >-
    The slots carry the numbers of the step that wrote them, not its settings:
    after load_state into a graph whose group has another rtol, norm or
    schedule, and before the next step, the report is judged under the loading
    group, with no warning (saved under rtol=1e-3 and loaded with rtol=1e-6:
    converged=True, bound 0.88, both flags set, 788 of the new tolerances off;
    loaded under "mixed": a usable bound in a norm no step took; loaded under
    Jacobi: the Gauss-Seidel rho_spectral 0.72 where its own is 0.8485).  It
    corrects at the next step.  A fingerprint of the group beside the slots is
    planned for 0.5.0.
    as stated: writes through set_node_state (which the REST state route and
    load_state use), add_node and remove_node.  An assignment into the
    private gm._state is not seen.  A group that stores its floor in the
    step (CPL-188) does not read the kept state and is never marked.  The
    marker is the archive member _reports/<group>/written_after_step,
    present only for such a group; an archive without it loads as before,
    and a marker for a group the graph does not have is ignored.
  oracle: the report read before the write, key for key.
  tests:
    - tests/core/test_coupling_report_describes_the_step_that_ran.py::test_a_write_after_the_step_does_not_move_its_report
    - tests/core/test_coupling_report_describes_the_step_that_ran.py::test_the_report_of_every_stepping_entry_point_survives_a_write
    - tests/core/test_coupling_report_describes_the_step_that_ran.py::test_the_next_step_is_reported_from_the_state_it_left
    - tests/core/test_coupling_report_describes_the_step_that_ran.py::test_a_loaded_checkpoint_is_reported_as_the_step_it_saved
    - tests/core/test_coupling_report_describes_the_step_that_ran.py::test_a_checkpoint_is_a_copy_of_the_state_and_says_when_it_was_written_after_the_step
    - tests/core/test_coupling_report_describes_the_step_that_ran.py::test_a_checkpoint_keeps_the_report_where_no_member_changed
    - tests/core/test_coupling_report_describes_the_step_that_ran.py::test_an_archive_without_the_marker_loads_as_it_always_did
    - tests/core/test_coupling_report_describes_the_step_that_ran.py::test_a_node_cannot_take_the_markers_prefix
    - tests/core/test_coupling_report_describes_the_step_that_ran.py::test_a_failed_load_leaves_the_report_of_the_step_before_it
    - tests/core/test_coupling_report_describes_the_step_that_ran.py::test_a_recompile_keeps_the_report_and_what_it_was_measured_on
    - tests/core/test_coupling_report_describes_the_step_that_ran.py::test_reset_state_and_a_removed_member_still_end_the_report
    - tests/core/test_coupling_report_describes_the_step_that_ran.py::test_a_transform_that_stepped_the_graph_leaves_the_report_of_the_step_before_it
    - tests/core/test_coupling_report_describes_the_step_that_ran.py::test_a_traced_write_keeps_no_tracer_for_the_report
