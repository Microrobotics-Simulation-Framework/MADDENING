# ---------------------------------------------------------------------------
# Convergence norms and the stopping criterion
# ---------------------------------------------------------------------------

- id: CPL-040
  area: norms
  claim: >-
    coupling_residual_l2 is the "L2 norm of the relative state change between
    iterations.  Each field's change is divided by the field's own magnitude
    before the norm is taken"; coupling_residual_mixed is the RMS of
    |new_i - old_i| / (rtol * ref_field) over every float field above the
    dead band, ref_field = max|v| over the field, "converged when the result
    is <= 1.0".
  sources:
    - src/maddening/core/coupling/acceleration.py:237 (coupling_residual_l2)
    - src/maddening/core/coupling/acceleration.py:289 (coupling_residual_mixed)
    - src/maddening/core/coupling/acceleration.py:41 (_field_reference)
  conditions: >-
    float fields; integer, boolean and key leaves are skipped; a bfloat16 or
    float16 field is measured, squared and summed in float32 and the entry
    count divided in float32 (MADD-ANO-186).
  oracle: closed form.
  tests:
    - tests/core/test_coupling_convergence.py::TestResidualNorms::test_l2_known_value
