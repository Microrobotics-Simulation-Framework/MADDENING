- id: CPL-011
  area: configuration
  claim: >-
    atol is a dead band: "a field whose magnitude does not exceed atol counts
    as being at zero, leaves the norm entirely and is no longer held to any
    criterion"; the default 0.0 "excludes only a field with no scale at
    all", and a group every one of whose moving fields is excluded "reports
    residual=0.0, converged=True after one pass however far it is from its
    fixed point".
  sources:
    - src/maddening/core/coupling/group.py:89 (CouplingGroup, atol)
    - src/maddening/core/coupling/acceleration.py:65 (_scaled_change)
  conditions: >-
    WHAT HOLDS NOW: the oracle below (the distance of the kept field to its
    fixed point) is claimed for any group with atol = 0, and for NO group
    with atol > 0, whatever its member count and schedule: a change that has
    to cross a field inside the dead band is not in the residual until it
    reaches a kept field, and the loop accepts on the first residual it
    measures.  It takes two lagged reads in series between a kept field and
    itself.  Measured, each under all
    three norms: (1) under Jacobi (the residual of p <- f(q), q <- g(p) with
    p dropped tests only that q agrees with the p it was computed from) a
    plain-edge pair whose three forces of 1e-8 are inside atol = 1e-6 and are
    amplified by the member that reads them reported converged=True after one
    pass on every other step, 4.5e5 to 7.4e5 tolerances from the fixed point
    (two to four passes and 5e5 to 6.3e5 where the dropped member carries
    state); (2) under Gauss-Seidel a float32 ring of three swept against its
    data flow (members added A, B, C; edges A -> C -> B -> A; two fields of
    1e-8 inside atol = 1e-6 in series) reported converged=True after one pass
    with its kept field 4.6e3 to 1.8e4 tolerances off, with no acceleration,
    Aitken and IQN-ILS; (3) under Gauss-Seidel a PAIR whose loop passes its
    one lagged read twice (a float32 pair of 2-vectors with one field a
    member and one plain edge each way, a pair with two fields a member, a
    pair with one edge from a member to itself) and a group of ONE member
    with two edges to itself, forces of 1e-8 inside atol = 1e-6 and the kept
    field's forcing moving from step to step, reported converged=True after
    one pass on every other step with the kept field 4.3e3 to 7.7e3
    tolerances off at rtol = 1e-5 (1.6e5 in the pairs' other sweep order;
    6.4e7 to 1.6e9 in float64 at rtol = 1e-9), with no acceleration and with
    IQN-ILS.  Some groups held with the band declared, as measured instances
    and not as a rule: the ring swept C, B, A; a Gauss-Seidel pair with one
    loop and one lagged read in both sweep orders (0.5 to 4.9 tolerances on
    a float64 pair, 0.65 to 0.75 and 0.41 to 0.75 on two float32 ones, the
    last with one scalar field a member).  Which groups hold is not a proved
    criterion, so none is inside the claim.  atol = 0 held on every one of
    these groups.  validate() and compile() advise on atol > 0 on EVERY
    group (MADD-ANO-254, open; the dead band is to be redesigned in 0.5.0).
    The three cases are pinned as strict xfails with their controls:
    tests/core/test_the_dead_band_under_jacobi.py,
    tests/core/test_the_dead_band_of_a_ring_of_three.py and
    tests/core/test_the_dead_band_of_a_pair_and_of_one_member.py (all three
    are outside this claim).
    Under "interface" the reading of an edge read at its source is dropped
    only where both the source field and what the edge delivers are at or
    below atol (CPL-041).
    all three norms. atol is compared after rounding to each field's own
    dtype, so the band's edge is drawn at that dtype's resolution: a field
    at exactly atol leaves the norm and one ulp above it stays.
  oracle: closed-form norm values; distance to the fixed point of the kept field.
  tests:
    - 'tests/core/test_the_dead_band_under_jacobi.py::test_validate_advises_on_a_dead_band_declared_under_jacobi'
    - 'tests/core/test_the_dead_band_under_jacobi.py::test_gauss_seidel_holds_the_pair_with_the_field_inside_the_dead_band'
    - 'tests/core/test_the_dead_band_of_a_ring_of_three.py::test_a_pair_holds_with_the_force_inside_the_dead_band_in_both_sweep_orders'
    - tests/core/test_the_dead_band_of_a_ring_of_three.py::test_the_same_ring_with_no_dead_band_is_held
    - tests/core/test_the_dead_band_of_a_ring_of_three.py::test_validate_advises_on_a_dead_band_declared_on_three_members
    - tests/core/test_the_dead_band_of_a_ring_of_three.py::test_a_group_with_no_dead_band_gets_no_advisory
    - tests/core/test_the_dead_band_of_a_pair_and_of_one_member.py::test_validate_advises_on_the_dead_band_of_a_pair_and_of_one_member
    - tests/core/test_the_dead_band_of_a_pair_and_of_one_member.py::test_compile_warns_once_for_the_dead_band_of_a_pair_and_of_one_member
    - tests/core/test_the_dead_band_of_a_pair_and_of_one_member.py::test_the_same_pair_or_member_with_no_dead_band_is_held
    - tests/core/test_the_dead_band_of_a_pair_and_of_one_member.py::test_the_banded_pair_or_member_accepts_after_one_pass_far_from_its_fixed_point
    - tests/core/test_coupling_convergence.py::TestResidualNorms::test_l2_ignores_a_field_inside_the_dead_band
    - tests/core/test_coupling_error_bound.py::test_the_dead_band_excludes_a_field_only_when_the_caller_declares_it
    - tests/core/test_coupling_error_bound.py::test_a_field_that_is_legitimately_zero_does_not_block_the_group
    - tests/core/test_coupling_non_finite_state.py::test_the_dead_band_still_drops_a_field_that_is_exactly_zero
    - tests/core/test_coupling_spectral_bound_certificate.py::test_a_loop_the_dead_band_hides_from_the_residual_is_seen_by_the_bound
  status: verified
  domains:
    f32: tests/core/test_coupling_error_bound.py::test_the_dead_band_excludes_a_field_only_when_the_caller_declares_it
    f64:
      - 'tests/core/test_coupling_norm_edges_in_every_domain.py::test_the_dead_band_is_drawn_at_each_fields_own_resolution[f64]'
