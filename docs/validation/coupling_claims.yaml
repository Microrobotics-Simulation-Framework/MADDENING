- id: CPL-095
  area: report
  claim: >-
    The gradient bound "carries a Newton-Kantorovich check ... the bound is
    multiplied by 1 / sqrt(1 - 2h) ... and is inf -- unusable -- at
    h >= 1/2 ... h is exactly zero on an affine map", with h the larger of
    beta L eta -- beta the full-operator resolvent norm (exact from the range
    basis; not the Krylov-restricted factor, MADD-ANO-142), L the Jacobian's
    change along the Newton step -- and the affine-covariant
    ||(I - J(x_k))^{-1} (J(x_k + delta) - J(x_k))|| on the Jacobian's row
    space (MADD-ANO-188); gradient_bound_usable
    is "finite and spectral_usable is True"; NaN "for "fori", for
