- id: CPL-009
  area: configuration
  claim: >-
    convergence_norm: "All three scale each field's change by the field's own
    magnitude, so a group's verdict does not depend on the units its
    quantities are written in."
  sources:
    - src/maddening/core/coupling/group.py:80 (CouplingGroup, convergence_norm)
    - docs/developer_guide/coupling_algorithm_guide.md#reading-coupling_diagnostics
  conditions: >-
    the verdict (converged); atol=0 (a declared dead band is units by
    definition); every quantity rescaled by the same factor and the map
    equivariant under it (no absolute forcing); magnitudes inside the normal
    float range.  Power-of-two factors give bit-identical runs; decimal
    factors change the inputs' rounding and so can move the pass count, not
    the verdict.
  oracle: the same group at another scale (bit-identity for powers of two).
  tests:
    - tests/core/test_coupling_error_bound.py::test_the_verdict_does_not_depend_on_the_units_a_field_is_written_in
    - tests/property/test_differential_coupling_units.py::test_a_coupled_group_takes_the_same_passes_at_every_scale
    - tests/property/test_coupling_convergence_at_every_field_scale.py::test_a_small_field_is_not_dropped_merely_for_being_small
  status: verified
  domains:
