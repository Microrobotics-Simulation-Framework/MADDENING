    Failing until 0.4.0's fix (MADD-ANO-147, never in a release): the solve
    was posed on b framed by max|b| with the tolerance rtol * max|b|, which
    a non-finite entry made NaN or inf, and the zero initial guess passed
    lineax's test at once -- the derivative read 0.0 at both sizes and in
    both modes.  NaN fills every entry, including any the non-finite entry
    cannot reach, as an honest Krylov iteration does (its first basis
    vector is b / ||b||); the dense LU can keep such an entry finite.

