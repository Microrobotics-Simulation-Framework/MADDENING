- id: CPL-088
  area: report
  claim: >-
    spectral_error_bound: "For a linear F the error of any iterate is
    (A - I)^{-1} of its residual, whatever the step sequence, relaxation or
    accelerator did -- so this is a bound on ||x - x*||" where
    spectral_usable is True.
  sources:
    - src/maddening/core/graph_manager.py::GraphManager.coupling_diagnostics (spectral_error_bound)
    - src/maddening/core/coupling/acceleration.py:1435 (spectral_error_bound)
    - docs/developer_guide/coupling_algorithm_guide.md#spectral_error_bound-the-spectrum-measured
    - src/maddening/core/inspection.py:1397 (coupling_report, the error_estimate note)
    - src/maddening/core/coupling/_bounds.py::_interface_spectral_rate_at
    - src/maddening/core/coupling/_group_layout.py::_reading_is_the_fields
  conditions: >-
    F linear; solver="ift", diagnostics=True; one pass depending on the
    previous one through at most seven independent scalars, eight where
    they are the whole state -- a rank, not a count of points: what the
    loop closes through under Gauss-Seidel, both directions under Jacobi
    (spectral_usable says so, and where it does not the report's reason
    code tells a pass that is too wide from an estimate whose check of
    itself failed: CPL-196); the group's own norm at the
    returned state -- each field divided by its own max|field| at the
    returned state, the residual put in those weights (MADD-ANO-146), and
    under convergence_norm="interface" the fields are what that norm reads,
    the value each internal edge delivers: its source value through the
    edge's interface mapping (the weights the step ran with) and then its
    transform -- or the source value itself on an edge whose static mapping
    delivers more entries than its source holds (CPL-188: the report of an
    edge-mapped pair with such a scatter is its marker-side twin's, every
    number of it, where the spectrum settles) -- with the mappings linear
    and the transforms affine (offsets,
    scales, selections; a non-affine transform makes the map non-linear in
    the reading) (MADD-ANO-187, MADD-ANO-195), and a field that several
    internal edges read counted once for each of them, as that norm counts
    it (MADD-ANO-213); every acceleration and schedule; long
    Gauss-Seidel chains, sub-cycled and multi-rate groups; float16 to
    float64, a delivered value wider than its source field resolved at the
    source's eps (MADD-ANO-211).  Where the residual is at its float floor
    the bound rests on the counted floor (CPL-092, CPL-102), which does not
    see a same-pass read that differences entries of one field
    (MADD-ANO-212, open), nor, under convergence_norm="interface", a
    delivered value that is itself such a difference, under either
    schedule (MADD-ANO-247, open).
    A group with a geometry edge (experimental; MAP-036: multilinear_grid
    mappings, one rate, the l2 or the mixed norm) is not a linear F: a
    gather or a scatter is nonlinear in the positions it reads.  The bound
    is the linearisation's at the returned iterate, in the norm of the
    members' state, positions included, and is held against the float64
    reference's fixed point with the factor 1 / (1 - h) of the nonlinear
    search, h the reference's measure of how far the Jacobian moves
    between the returned iterate and the fixed point, on examples whose
    points stay in one lattice cell between the two.
    Under convergence_norm="interface" x is the iterate the loop accepted:
    the state returned has the fields the norm does not measure whole one
    plain pass on (CPL-191).  Of that state, in the same norm taken at it
    (each reading over its own magnitude as returned), the distance is at
    most (bound + reported residual) / (1 - rtol * residual * sqrt(N)), N
    the entries the norm pools, wherever rtol * residual * sqrt(N) < 1:
    the bound is of x, the readings of the state returned are within the
    residual of those of x, and no reading's own magnitude moved by more
    than rtol * residual * sqrt(N) of itself.  For a converged solve
    (residual at most 1) that denominator is within rtol * sqrt(N) of
    one.  It is not "the bound plus the residual": at a cap of five
    passes a field returned recomputed at a fiftieth of its fixed point's
    size was 4.5 times bound + residual from the fixed point in that
    norm, spectral_usable set (the pinned case of the returned-state
    search).  Past rtol * residual * sqrt(N) = 1 -- a cap reached with a
    reading still moving by its own size -- nothing is claimed of the
    state returned.  The residual term is the proof's (a triangle
    inequality through x) and no example has needed it: with it left
    out, the distance reached 0.997 of the allowance at worst over 5,100
    hunted examples on 21 cells (a ring holding a field measured whole,
    one read through a mapping and one through a transform; every
    acceleration, both schedules, float32 and float64; jaxlib 0.11.0).
    With a geometry edge, across a lattice plane the stencil is another
    polynomial, and the bound is to the fixed point of the polynomial the
    pass is in the returned iterate's lattice cells, which is a fixed
        point of the pass only inside those cells. Three rules in turn tried to
    certify that it is (a screen on the bound, MADD-ANO-242; a Newton-
    Kantorovich check where a plane is within twice the bound; no plane
    inside the Newton-Kantorovich ball), and each left spectral_usable on a
    bound far under the distance: 0.13 times it; 17 to 1,294 times under;
    and 34 to 1,874 times under in a cell whose polynomial has no fixed
    point (MADD-ANO-252). So in 0.4.0 a group that solves positions (its
    pass reads one from the iterate, or builds one and reads it in the same
    pass) has spectral_usable False on every step, whatever the bound reads,
    and the bound is reported uncertified; a group whose positions are all
    constants of the pass keeps this claim as any other group (MAP-049).
    rho_spectral at a position within eight float resolutions of a lattice
    plane is the float pass's cell's (MADD-ANO-239) and carries no flag
    either.
    Not behind a long row sum of a mapped edge at the float floor
    (MADD-ANO-257, open): the floor does not count the row's rounding, the
    bound read 0.68 to 0.002 of the distance behind scatter-layout rows of
    100 to 3e4 entries, 0.18 behind a dense matrix of three rows of 3000
    and 0.007 behind a gather-layout row of 1e4 on jax 0.10.2, and the
    report withdraws the flag there for every static mapping kind (a row
    over MAPPED_ROW_FLOOR_LIMIT = 10 entries, a dense matrix counted at
    its width, with the residual not above the floor times the row's
    length).  A geometry-dependent mapping's rows are decided in the step
    and are not counted (a multilinear_grid scatter read 1.3x its
    distance with 3000 markers in a cell; that group solves positions and
    has no flag in 0.4.0, and one whose positions are constants of the
    pass keeps its flags behind such rows: not measured).
  oracle: exact float64 fixed point of the evaluated map.
  tests:
    - 'tests/property/test_coupling_geometry_search.py::test_a_reported_number_of_a_group_with_a_geometry_edge_holds_against_the_reference_per_push'
    - 'tests/property/test_coupling_plane_sides.py::test_every_flagged_number_of_a_table_row_holds_against_the_reference'
    - 'tests/property/test_coupling_plane_sides.py::test_no_flag_stands_with_the_cell_polynomials_fixed_point_past_a_plane'
    - tests/core/test_coupling_error_bound.py::test_the_spectral_bound_is_never_smaller_than_the_distance_it_bounds
    - tests/core/test_coupling_error_bound.py::test_the_spectral_bound_holds_under_an_accelerator_where_the_estimate_does_not
    - tests/property/test_differential_fixed_point.py::test_a_usable_spectral_bound_is_never_below_the_true_distance
    - tests/property/test_differential_fixed_point.py::test_a_usable_spectral_bound_holds_on_a_stalled_ring
    - tests/property/test_differential_fixed_point.py::test_a_usable_spectral_bound_holds_on_a_long_gauss_seidel_chain
    - tests/property/test_coupling_error_bound.py::test_the_spectral_bound_holds_on_random_normal_contractions
    - tests/core/test_coupling_sixteen_bit_groups.py::test_a_usable_sixteen_bit_spectral_bound_is_not_below_the_true_distance
    - tests/core/test_coupling_claims_graphs.py::test_a_usable_bound_holds_on_a_stalled_subcycled_or_multirate_group
