- id: CPL-087
  area: report
  claim: >-
    rho_spectral is "the spectral radius of dF/dx at the returned state, from
    eight Arnoldi steps ...  Where spectral_usable is True it is within 5%
    of 1 - rho_spectral of the radius ...  For a group whose Jacobian has
    rank at most eight ... it is the radius of a matrix within the analysis
    dtype's rounding of the Jacobian (in the norm's weights): exact to that
    rounding for a normal Jacobian ... while a non-normal one can turn a
    rounding into more, which is measured and withdraws the flag where it
    exceeds the margin ...  An estimate
    otherwise, which spectral_usable reports: from below for a normal dF/dx
    (in the norm's weights), from either side for a non-normal one, whose
    Ritz values can lie outside the spectrum's convex hull.  For a bfloat16
    or float16 group the analysis and the value reported are float32, but
    the Jacobian-vector products are the map's own, rounded to the group's
    dtype, so the radius is exact to about one eps of that dtype times the
    Jacobian's norm ... rather than to float32.  Only under solver="ift"
    with diagnostics=True; NaN for "fori", for diagnostics=False, at
    max_iterations=1 (no fixed point was solved) and on a non-finite
    state."
  sources:
    - src/maddening/core/graph_manager.py::GraphManager.coupling_diagnostics (rho_spectral)
    - src/maddening/core/coupling/acceleration.py::arnoldi_spectral_radius
    - src/maddening/core/coupling/acceleration.py::_compressed_spectrum
  conditions: >-
    as stated, in two statements the targeted search scores separately.
    (1) What a user can check: wherever spectral_usable is True, no
    more than eight scalars cross the group's edges AND NO STATIC MAPPING
    ON AN INTERNAL EDGE HAS A ROW OVER THE GUARD'S LIMIT OF 10 ENTRIES
    (MAPPED_ROW_FLOOR_LIMIT),
    |rho_spectral - rho| <= 5% of (1 - rho_spectral) (score
    "radius_strict").  Behind longer rows rho_spectral is an estimate even
    with the flag set: behind scatter rows of 3333 entries (float32,
    "interface", Gauss-Seidel, rtol = 0.1) it read 0.9257 for an exact 0.9,
    seven times the margin, with both flags set, while spectral_error_bound
    stayed conservative (7.8x the distance; pinned as a characterisation in
    the slow lane).  Past eight scalars the Krylov space is still growing at the
    cap, the value is an estimate and the flag is False (it read 0.273 for
    0.219 on twelve non-normal float32 scalars with the flag set:
    MADD-ANO-225, resolved).  (2) For rank at most eight, rho_spectral is the
    radius of a matrix within the analysis dtype's rounding of the weighted
    Jacobian: within 1e-4 of the radius plus its movement under
    perturbations of norm 8 eps ||A|| (score "radius"; 1e-9 of the radius
    and better on the float64 pins).  The flag's margin is held by a
    certificate over the measured rounding: one more Jacobian-vector
    product (a combination of the basis against the Arnoldi relation)
    gives each row's rounding, no perturbation of that size entry by entry
    puts an eigenvalue of the compression on the circle |z| = rho + margin
    or on the circle of that radius about the dominant one
    (MADD-ANO-229).  The measured size is one product's, and a direction
    the breakdown test discarded counts for its bare norm.
    Made for fields no smaller than a hundredth of what drives them; below
    that a float32 group's radius is more often undetermined and the flag
    False. A POSITION FIELD IS SUCH A FIELD WHEREVER IT IS NEAR THE
    COORDINATE ORIGIN: under "l2" and "mixed" it is scaled by its own
    largest magnitude, which has no natural zero, so a group that solves the
    position of a marker near coordinate zero is outside this condition
    whatever its physics (one marker 5e-4 from zero is weighted by 2,008,
    and rho_spectral read 0.245 for 0.153 in float32, measured by an audit's
    reproducer, where one float32 rounding of a product moves the radius
    between 0.078 and 0.238: no test pins a number that ill-conditioned); such a group carries no flag in 0.4.0 (MAP-049), and
    convergence_norm="interface", which measures a position in lattice
    spacings, is the norm to prefer for it.  (A sub-cycled member's interpolated boundary value lost a loop
    below a field's rounding from the products: MADD-ANO-222, resolved.)
    On a backend where JAX lowers
    no non-symmetric eigenvalue problem (neither CPU nor GPU) the
    compressed radius comes from repeated squaring, which in float32 is
    not backward stable (MADD-ANO-223).
    A group with a geometry edge (experimental; MAP-036: multilinear_grid
    mappings, one rate, the l2 or the mixed norm): the Jacobian is the
    pass's with respect to the members' whole state, the positions a
    source-anchored edge reads from the iterate included; rho_spectral is
    within 1e-5 of the radius of the float64 reference's dense Jacobian
    on float32 draws where the Jacobian without its position columns has
    a radius 12% and 14% off, and both statements above are scored
    against that reference.  Not claimed (MADD-ANO-239, open): a pass
    whose Jacobian one rounding of the iterate in the group's dtype, or
    of a value a Gauss-Seidel pass has just computed, moves by more than
    the flag's margin.  Measured where a float32 Gauss-Seidel member
    multiplies two other members' fields held in units 1e3 or more
    apart: rho_spectral is then the radius of the Jacobian the float32
    pass has (0.324 where exact arithmetic gives 0.0238), the flag stays
    set, and spectral_error_bound held in every measured case.  The
    nonlinear search holds such a cell's units within a decade for the
    two radius scores and pins the case as a strict xfail.
    Statement (2) asks more of the pass than the flag's margin does: it
    is of a pass whose Jacobian such a rounding leaves standing to its
    1e-4.  A float32 Gauss-Seidel member with a quadratic term or a
    product, of curvature 100 over the size of the field it reads, has a
    slope one rounding of a same-pass value moves by 2.4e-5, and
    the float32 pass's Jacobian then has a radius up to 5e-4 of itself
    from the one exact arithmetic gives at the returned state (5e-5 at a
    curvature of 10, 5e-6 at 1; no larger at a change of units of six
    decades than at one, with and without a mapping; 7e-7 under
    saturating gains; 5e-5 under Jacobi through a
    mapping).  rho_spectral is the float32 pass's to 2e-8 there.
    Measured on a mapped ring of three whose members square what they
    read: 0.404214 for 0.404298, 1.53 of statement (2)'s allowance and
    0.3% of the flag's margin, so statement (1) held (the same on the
    release branch before this ring's mapping was read at its source);
    2.3 allowances on a ring with no mapping.  The nonlinear search
    draws the "radius" score at a curvature within 10 on such a cell
    and holds the measured draw as a test.
    Under convergence_norm="interface" "the returned state" is the iterate
    the loop accepted, of which the state returned is one plain pass on in
    the fields the norm does not measure whole (CPL-191).
    With a geometry edge, rho_spectral is the radius in the lattice cells
    the returned iterate's positions are in: the pass's Jacobian is another
        in the next cell (0.28 at the iterate against 0.97 at a fixed point 2e-4
    of a spacing past a plane, measured). So where the group solves
    positions rho_spectral carries no flag in 0.4.0 (MAP-049, MADD-ANO-252);
    where every position is a constant of the pass no plane can come between
    the iterate and the fixed point.
  oracle: eigenvalues of the matrix; NaN where documented.
  tests:
    - 'tests/property/test_coupling_geometry_search.py::test_the_reported_radius_has_the_geometry_term_in_it'
    - 'tests/property/test_coupling_geometry_search.py::test_a_reported_number_of_a_group_with_a_geometry_edge_holds_against_the_reference_per_push'
    - tests/core/test_coupling_error_bound.py::test_arnoldi_recovers_the_spectral_radius_of_a_resolved_spectrum
    - tests/core/test_coupling_error_bound.py::test_arnoldi_leaves_a_residual_where_the_space_is_too_small
    - tests/core/test_coupling_error_bound.py::test_a_non_normal_spectrum_larger_than_the_space_can_read_above_its_radius
    - tests/core/test_coupling_error_bound.py::test_the_spectral_keys_read_nan_and_false_where_nothing_was_computed
    - tests/core/test_coupling_error_bound.py::test_on_a_nonlinear_map_the_spectrum_is_taken_at_the_returned_iterate
    - tests/core/test_coupling_non_finite_state.py::test_a_non_finite_field_no_edge_reads_is_still_a_non_finite_state
    - tests/core/test_coupling_sixteen_bit_groups.py::test_the_spectral_slots_are_kept_in_the_analysis_dtype
    - tests/property/test_coupling_targeted_search.py::test_a_settled_spectral_radius_is_the_radius_per_push
    - tests/property/test_coupling_targeted_search.py::test_a_defect_the_search_reached_stays_fixed
    - tests/core/test_coupling_spectral_estimate_rounding.py::test_a_settled_radius_is_within_the_margin_and_the_determined_ones_settle
    - tests/core/test_coupling_spectral_estimate_rounding.py::test_a_direction_far_above_rounding_is_kept_in_float64
    - tests/core/test_coupling_spectral_estimate_rounding.py::test_the_compressed_radius_is_the_eigenvalues_not_the_squaring
    - tests/property/test_coupling_nonlinear_search.py::test_the_radius_score_is_drawn_at_a_curve_a_float32_sweep_resolves
    - tests/property/test_coupling_nonlinear_search.py::test_a_radius_settled_in_a_float32_sweep_is_the_radius_of_the_pass_s_own_jacobian
  status: verified
  notes: >-
    16bit domain failing on d2429a6: the spectral slots were stored in the
    group's dtype, so a bfloat16 group's rho_spectral read to 2**-8
    (0.361328125 for 0.3618774). Fixed: the five spectral slots are seeded
    and written in _analysis_dtype. The radius itself comes from the map's
    Jacobian-vector products rounded to the group's dtype, so the docstring
    now says a 16-bit group's radius is exact to about one eps of its dtype
    times the Jacobian's norm (0.0036 measured at radius 0.90), and the
    battery's 16bit cell holds it to that.
  domains:
