- id: CPL-040
  area: norms
  claim: >-
    coupling_residual_l2 is the "L2 norm of the relative state change between
    iterations.  Each field's change is divided by the field's own magnitude
    before the norm is taken"; coupling_residual_mixed is the RMS of
    |new_i - old_i| / (rtol * ref_field) over every float field above the
    dead band, ref_field = max|v| over the field, "converged when the result
    is <= 1.0".
  sources:
    - src/maddening/core/coupling/acceleration.py:237 (coupling_residual_l2)
    - src/maddening/core/coupling/acceleration.py:289 (coupling_residual_mixed)
    - src/maddening/core/coupling/acceleration.py:41 (_field_reference)
  conditions: float fields; integer, boolean and key leaves are skipped.
  oracle: closed form.
  tests:
    - tests/core/test_coupling_convergence.py::TestResidualNorms::test_l2_known_value
    - tests/core/test_coupling_convergence.py::TestResidualNorms::test_mixed_norm_known_value
    - tests/core/test_coupling_convergence.py::TestResidualNorms::test_mixed_with_arrays
    - tests/core/test_coupling_norms_skip_non_floating_fields.py::test_an_old_iterate_without_its_non_floating_fields_measures_the_same
  status: verified

- id: CPL-041
  area: norms
  claim: >-
    coupling_residual_interface: "Computes the difference in interface values
    (edge source fields) between two successive iterations.  Only the fields
    that appear on intra-group edges are compared", scaled as the mixed norm,
    with the edge's transform applied to both iterates.
  sources:
    - src/maddening/core/coupling/acceleration.py:358 (coupling_residual_interface)
  conditions: 'convergence_norm="interface"; state edges (a flux edge is refused at compile: CPL-075).'
  oracle: closed form over the transformed edge values.
