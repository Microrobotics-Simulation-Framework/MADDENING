    (precision_limited) while a node in the group has not declared
    update_evaluations()."
  sources:
    - src/maddening/core/graph_manager.py::GraphManager.coupling_diagnostics (spectral_usable)
    - src/maddening/core/coupling/acceleration.py::spectral_rate_settled
    - src/maddening/core/coupling/acceleration.py::_compressed_spectrum
    - docs/developer_guide/coupling_algorithm_guide.md#a-stalled-float32-iterate-reads-convergedtrue
  conditions: >-
    as stated, and only where the counted floor is honest: every node
    declares update_evaluations() truthfully and none cancels inside itself,
    neither of which anything outside the node can check.  Measured on 154
    configurations of the 0.4.0 floor study (float32 and float64, CPU): a
    2000-sub-step node declaring one evaluation read 0.26-0.60x the true
    distance with the flag set, and internal cancellation 0.02-0.65x.  Nor
    does the count see a same-pass read that differences entries of one
    source field (a mapping row [1, -1] on a field at 1000 with a
    difference of order one): a Gauss-Seidel group stalled behind it read
    0.054x with the flag set, 2.6e-4x at 1e5 (MADD-ANO-212, open).  Under
    convergence_norm="interface" the floor's unit is the delivered
    value's own magnitude, so a group whose norm reads such a difference
    stalls under its bound under Jacobi too: 0.25x with the flag set at a
    field 100 times the difference, 0.031x at 1000 (MADD-ANO-247, open).  In
    the other direction mixed-sign chains read up to 1e7x and sub-cycled
    groups 1e3-1e5x (valid, too loose to read).  A measured, opt-in
    diagnostics="rounding" level is planned for 0.5.0.
    One more case withdraws the flag and keeps the numbers (MADD-ANO-257,
    open): an internal edge with a static mapping of any kind (a dense
    matrix, a sparse mapping in the gather or the scatter layout, a
    registered kind's own static class) whose longest row is over
    MAPPED_ROW_FLOOR_LIMIT = 10 entries, where the residual is not above
    the float floor times that row's length.  A row is the entries one
    delivered value adds up whatever the weights are: a sparse layout's
    valid slots, a dense matrix's width.  A flag kept behind such a row
    read at least 0.9925 of the distance on the measured pairs (two
    evaluations a pass), and 0.982 on a group of ONE member with an edge
    to itself (one evaluation a pass; a report just above the threshold,
    a uniform field, gain 0.999, 1000 entries a row, "interface"; 14 of
    176 kept flags under 0.9925: pinned in the slow lane).  THE ROW RULE
    COVERS THE ROUNDING OF A ROW'S LENGTH, NOT CANCELLATION WITHIN IT: a
    field whose terms cancel in a row loses the cancellation's factor
    whatever the row's length (MADD-ANO-247's mechanism, and 212's,
    through the field's signs): with a cancellation sum|t| / |sum t| of
    25 a row of 10 entries, within the limit, read 1.26 of the distance
    in float32 and 0.85 at the float64 floor WITH THE FLAG SET (pinned as
    a strict xfail).  A geometry-dependent mapping's rows are not counted.
    NOT COUNTED BY THE ROW GUARD (MADD-ANO-257's): a sum written inside an
    edge TRANSFORM (transform=lambda v: zeros(n).at[cells].add(...)).  The
    guard reads the static mappings on internal edges; a transform is
    arithmetic it cannot see, like a node's own.  With 300, 3000 and 30000
    float32 terms added into one entry, members that declare one evaluation
    and the residual at its float floor, spectral_usable was True beside a
    bound 0.28, 0.034 and 0.0025 to 0.0038 of the distance; with ordinary
    members at rtol = 1e-4, 0.2 and 0.096 with precision_limited False
    (MADD-ANO-260, open).  The same operator declared as a static sparse
    mapping has both flags withdrawn and a bound 1.16 to 27 times the
    distance.  Outside this row, pinned as it stands in
    tests/core/test_what_the_float_floor_does_not_count_on_an_edge.py.
  oracle: the flag against each condition.
  tests:
    - tests/core/test_coupling_report_flags_read_their_conditions.py::test_spectral_usable_is_false_where_the_krylov_space_did_not_settle
