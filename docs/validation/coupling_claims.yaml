- id: CPL-047
  area: criterion
  claim: >-
    error_amplification estimates 1 / (1 - rho) with rho = max(r_k / r_{k-1},
    sqrt(r_k / r_{k-2})), and "Returns 0.0 -- an impossible amplification,
    since a valid one is always >= 1 -- when the estimate must be rejected: a
    non-decreasing residual (rho >= 1 ...), a zero or non-finite predecessor,
    or a non-finite current residual"; prev2 defaults to prev.
  sources:
    - src/maddening/core/coupling/acceleration.py:411 (error_amplification)
    - src/maddening/core/graph_manager.py::GraphManager.coupling_diagnostics (amplification)
  conditions: >-
    any residual triple. Not claimed for 16-bit floats.
  oracle: closed form at every rejection edge.
  tests:
    - tests/core/test_coupling_claims_helpers.py::test_error_amplification_follows_its_formula_at_every_edge
    - tests/core/test_coupling_error_bound.py::test_the_bound_recovers_the_contraction_rate_of_a_known_fixed_point
    - tests/core/test_coupling_error_bound.py::test_an_alternating_sequence_is_not_flattered_by_its_good_half
    - tests/core/test_coupling_error_bound.py::test_a_growing_residual_is_rejected_rather_than_extrapolated
  status: verified
  domains:
    f32: tests/core/test_coupling_claims_helpers.py::test_error_amplification_follows_its_formula_at_every_edge
    f64: tests/core/test_coupling_criterion_helpers_in_float64.py::test_error_amplification_follows_its_formula_in_float64
    mixed_dtype: tests/core/test_coupling_criterion_helpers_in_float64.py::test_error_amplification_follows_its_formula_on_float32_residuals_under_x64
    16bit: narrowed
    jit: tests/core/test_coupling_error_bound.py::test_the_bound_recovers_the_contraction_rate_of_a_known_fixed_point
    grad: n/a
    vmap: n/a
    multi_rate: n/a
    sub_cycled: n/a
    predictors_warm_starts: n/a
    adaptive: n/a
    checkpoint_restart: n/a
    sharded: n/a

