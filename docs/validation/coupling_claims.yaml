# Coupling claims inventory.
#
# Every documented statement about coupling that a user could rely on, with
# the exact domain it was stated for, how its truth is known, and a pytest
# node id that fails if it stops being true.  An audit attacks this list;
# a new claim in a docstring, a guide or the release notes gets a row here
# in the same change (docs/developer_guide/testing_standards.md, "The
# claims inventories").  tests/compliance/test_claims_inventories.py
# checks every row: its fields, that each cited test is collected and runs
# on every push (or is slow-marked and names a per-push witness), that a
# `failing` row cites a strict xfail and that a `verified` row cites none.
#
# Scope: "coupling" is what the coupling audits cover --
#   * coupling groups and their solvers (ift, fori), schedules (Gauss-Seidel,
#     Jacobi), accelerations, predictors and warm starts;
#   * sub-cycling, multi-rate groups, waveform sweeps and the adaptive
#     steppers on coupled graphs;
#   * coupling_diagnostics(), coupling_report() / print_coupling_report()
#     and strict_convergence;
#   * the precision floor and every reported bound and *_usable flag;
#   * IFT gradients;
#   * profile_graph's coupling statistics and sysid.windowed_loss's
#     convergence mask.
# Out of scope, with their own audit areas: interface mappings
# (coupling/mapping.py, mapping_spec.py, interface_mapping.py) and the
# edge-construction conveniences in coupling/helpers.py.
#
# Top level: schema_version (1), domain_set (numeric), prefixes (the id prefixes this file owns,
# here CPL; no other inventory may use them) and claims.
#
# Row fields:
#   id          CPL-NNN, unique.
#   area        a grouping label, free text.
#   claim       the documented wording (quoted where it is quoted).
#   sources     file:line or file#section; the first is where it is stated.
#   conditions  the domain the documentation states, or "unstated" parts.
#   oracle      how the truth is known.
#   tests       pytest node ids (without parameters, or with them).
#   status      verified | failing | untested | ambiguous
#   proposed_wording  required for ambiguous: the precise statement the
#                     tests support.
#   finding     required for failing: what breaks, the reproducer and a
#               file:line guess.  Every failing row cites a strict xfail.
#   reason      required for untested: why no test can fail.
#   notes       optional.
#   domains     the domain matrix (top-level domain_set: numeric): for each of
#               f32, f64, mixed_dtype, 16bit, jit, grad, vmap, multi_rate,
#               sub_cycled, predictors_warm_starts, adaptive,
#               checkpoint_restart and sharded, the test (or tests) that
#               exercise the claim in that domain, `narrowed` (the
#               conditions' trailing "Not claimed for ..." clause excludes
#               it) or `n/a` (the claim cannot apply there).  Definitions
#               and rules: testing_standards.md, "The domain matrix".
#
# Line numbers are those of the tree the row was last verified on
# (release/0.4.0 at 7b2f7d9 for the first edition); the section name beside
# each makes it findable when they move.

schema_version: 1

prefixes: [CPL]

domain_set: numeric

claims:

