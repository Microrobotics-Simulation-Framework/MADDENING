    - tests/core/test_coupling_ift_gradient_in_any_units.py::test_the_adjoint_above_the_dense_fallback_is_the_same_at_every_scale
    - tests/property/test_differential_ift_derivatives.py::test_the_ift_derivatives_agree_with_dense_and_fori_at_every_scale
  status: verified
  notes: >-
    Failing until 0.4.0's round-4 fix (MADD-ANO-113, since 0.3.0): atol was
    1e-8 + rtol * max|b|, so a cotangent below about 1e-8 met the GMRES
    test at x = 0 and the gradient came back exactly zero, reported
    successful.  The solve now runs on b rescaled by an exact power of two
    with a purely relative tolerance; the differential oracle compares jacfwd
    and grad against dense and fori from 2**-100 to 2**60.

