    solver="ift": "a jax.lax.while_loop that exits as soon as the group's
    convergence norm meets its threshold, and differentiates via the implicit
    function theorem at the fixed point -- a custom_jvp rule, so jax.jvp /
    jacfwd and jax.grad / jacrev both work through the step.  Every
    acceleration, iteration_mode, convergence_norm and diagnostics setting
    is supported."
