    grad: tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_a_recomputed_field_carries_the_fixed_points_derivative
    vmap: narrowed
    multi_rate: narrowed
    sub_cycled: tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_a_sub_cycled_member_is_returned_by_the_same_rule
    predictors_warm_starts: narrowed
    adaptive: narrowed
    checkpoint_restart: narrowed
    sharded: narrowed

- id: CPL-192
  area: norms
  claim: >-
    A coupling group that reports converged=True under
    convergence_norm="interface" is within K tolerances of its fixed point:
    "the distance to the fixed point in the compact readings, in the norm's
    own weights, is at most K tolerances, with K = ||D (I - A)^-1 (I - L)
    D^-1||_2 of the loop on its compact readings (A the pass's stationary
    map, L its same-pass part, D dividing each reading by its own
    magnitude) ...  K is about 1 / (1 - gain) for a normal loop and does not
    see N", the size of a field a mapped edge delivers onto.
  sources:
    - docs/developer_guide/coupling_algorithm_guide.md#spectral_error_bound-the-spectrum-measured
    - src/maddening/core/coupling/_interface_plan.py::_norm_side
    - src/maddening/core/coupling/acceleration.py::coupling_residual_interface
    - benchmarks/results/interface_norm_dilution/RESULT.md
  conditions: >-
    The transfer between the two sizes must be on the edge: a member handed
    the whole large field through a plain edge, which samples it inside its
    own update, is read at the large field's entries, and the small field of
    such a pair was 4.6 (N = 300), 27 to 74 (3e3), 56 to 104 (3e4) and 179
    (3e5) tolerances off at converged=True, against 1.8 to 6.2 with a gather
    mapping on the edge.  With a dead band (atol > 0) the reading of an edge
    read at its source is kept wherever the source field or what the edge
    delivers is above atol (CPL-041).  WITH atol > 0 THE K TOLERANCES ARE
    CLAIMED FOR NO GROUP; with atol = 0 for every group below.  With a band
    declared, under either schedule and on any member count, a change that
    has to cross a dropped field is not seen until it reaches a kept one,
    and a converged group was 4.5e5 to 7.4e5 (a Jacobi pair), 4.6e3 to
    1.8e4 (a Gauss-Seidel ring of three swept against its data flow, pinned
    in tests/core/test_the_dead_band_of_a_ring_of_three.py) and 4.3e3 to
    1.6e5 (Gauss-Seidel pairs whose loop passes its lagged read twice, and
    one member with two edges to itself, under "interface" as under the
    other norms, pinned in
    tests/core/test_the_dead_band_of_a_pair_and_of_one_member.py)
    tolerances off: outside this claim (CPL-011, MADD-ANO-254, open).
    an affine pass (linear nodes, linear static mappings, affine edge
    transforms; for a mapping that reads a moving geometry the claim is
    MAP-050's: the verdict is a local statement, which holds to first
    order where the pass keeps the rate its last passes showed all the
    way to its fixed point. An iterate thrown across a lattice plane into
    a cell where the pass contracts at 0.999 read converged=True 250
    tolerances from a fixed point in the cell it came from, K = 0.95
    there; and inside ONE cell of three axes, where the kernel is
    multilinear of degree three in the positions, a pass that creeps at
    0.9999 read converged=True 14,000 tolerances from its only fixed
    point with no plane crossed), above the
    residual's float floor; float32
    and float64;
    pairs whose two mapped internal edges gather, scatter, or one of each,
    5 to 60 values against 1e2 to 1e5 (a million in the slow lane), and
    relays of size ratio 1/300 to 300, a tie, and a hub whose one field a
    gather edge and a scatter edge both read; the dense kind and the sparse
    kind in either layout; Gauss-Seidel and Jacobi; no acceleration, Aitken,
    fixed relaxation, IQN-ILS and IQN-IMVJ (the IQN rows up to 1e4
    entries); loop gains 0.05 to 0.95 of either sign.  K is computed from
    the loop's own operator, not chosen: the identity CPL-088's bound rests
    on, applied to a residual at its threshold (the estimate a verdict
    compares is never below the residual: CPL-048).  K is the constant of
    the iterate the loop accepted, which the report is of.  The state a
    solve returns is that iterate with the fields the norm does not measure
    whole one plain pass on (CPL-191; a field read at its source is
    measured whole and kept), and the tests hold the state returned to
    K' = ||D [(I - A)^-1 (I - L) - P] D^-1||_2, P selecting the readings of
    a recomputed source (Reference.K_returned; K' = K where both edges
    scatter), and the report to the reference's own loop.  Measured before the
    rule of CPL-188, with a scatter read as delivered: 23 to 459 tolerances
    at 1e3 to 1e6 target entries, growing as the square root of the count;
    with it 3.3 to 3.6 at every size.  Outside float32 and float64 at one
    rate the claim is held on pairs of three values against thirty-six (to
    20 against 2000 in the slow lane), plain and under each stock
    acceleration: a float32 member beside a float64 one, a vmap of the
    step, a multi-rate graph, a sub-cycled group, a predictor (and
    IQN-IMVJ's Jacobian carried from step to step), a checkpoint restart,
    run_adaptive, and a member sharded over four devices (the dense kind).
    Not claimed for float16 or bfloat16: at a tolerance those dtypes
    resolve the residual's float floor is 0.2 and 1.6 tolerances, so a
    converged verdict there is not above the floor, which the claim
    presupposes; their cells stop at a cap of two passes (CPL-188).
  oracle: >-
    the exact float64 fixed point of the compact system and K from the
    loop's operator (tests/property/interface_side_graphs.py::Reference;
    tests/property/coupled_topologies.py::LinearModel.interface_claim).
  tests:
