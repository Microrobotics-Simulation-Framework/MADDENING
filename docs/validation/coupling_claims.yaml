- id: CPL-180
  area: invariance
  claim: >-
    A group is keyed by "its sorted node names joined with "+"" and nothing
    else about a node's name reaches the solve: renaming every node (a
    random permutation of names, including ones where the sorted order
    differs from the schedule) gives bit-identical states, verdicts and
    reports, up to the name keys.
  sources:
    - docs/developer_guide/testing_standards.md#the-claims-inventories
    - src/maddening/core/graph_manager.py:928 (_refuse_colliding_group_keys)
  conditions: both solvers, both schedules, every acceleration and norm, diagnostics on.
  oracle: bit-identity against the run under the original names.
  tests:
    - tests/property/test_coupling_invariances.py::test_renaming_every_node_changes_nothing_but_the_keys
    - tests/property/test_coupling_invariances.py::test_renaming_is_invariant_on_generated_graphs
  status: verified

- id: CPL-181
  area: invariance
  claim: >-
    The order of add_edge calls, and of add_node calls for every node outside
    a group -- a node downstream of the group included -- does not reach the
    result: the same graph built in another order gives bit-identical
    states, verdicts and reports.
  sources:
    - docs/developer_guide/testing_standards.md#the-claims-inventories
    - docs/developer_guide/coupling_algorithm_guide.md#what-the-way-a-graph-is-built-can-change
  conditions: >-
    both solvers, both schedules, every acceleration and norm; the group's
    members keep their relative order (a Gauss-Seidel sweep follows it by
    design: CPL-077); no input fed by three or more additive edges (their
    sum follows the build order, documented); no group that is a strict
    subset of a feedback loop through outside nodes -- there the loop is
    closed by an edge read from the previous step, which follows the
    build order, and compile() warns naming it.  An outside node added
    between two members is scheduled after the group and reads it this
    step (a group is one block in the schedule; MADD-ANO-144).
  oracle: bit-identity against the original build order.
  tests:
    - tests/property/test_coupling_invariances.py::test_the_build_order_changes_nothing
    - tests/property/test_coupling_invariances.py::test_the_build_order_is_invariant_on_generated_graphs
    - tests/core/test_coupling_block_schedule.py::test_an_outside_node_added_between_the_members_reads_the_group_this_step
    - tests/core/test_coupling_block_schedule.py::test_a_group_inside_a_larger_loop_warns_naming_the_edge_read_late
    - tests/core/test_coupling_block_schedule.py::test_two_groups_on_one_loop_each_warn
  status: verified

- id: CPL-182
  area: invariance
  claim: >-
    "The step builder therefore passes a group's internal edges in an
    order fixed by the group itself ... So the norm depends neither on the
    order of the add_edge calls nor on the nodes' names."
  sources:
    - src/maddening/core/coupling/acceleration.py:354 (coupling_residual_interface, Notes)
    - src/maddening/core/graph_manager.py (_interface_edge_order)
    - docs/developer_guide/coupling_algorithm_guide.md#what-the-way-a-graph-is-built-can-change
  conditions: convergence_norm="interface", any acceleration and solver; two edges with the same endpoints keep their relative order.
  oracle: states and reports against the same graph with its edges added in reverse, and with its nodes renamed, bit for bit.
  tests:
    - tests/property/test_coupling_invariances.py::test_the_interface_residual_does_not_depend_on_the_edge_order
    - tests/property/test_coupling_invariances.py::test_the_build_order_changes_nothing
  status: verified
  notes: >-
    Failing until 0.4.0's claims fix: the norm summed in insertion order, and a
    reversed build moved the residual in its last bits (228.80760 against
    228.80762).  Fixed by the group's sweep order rather
    than the edges' names, which would have made the renaming invariance
    (CPL-180) fail under this norm instead.

- id: CPL-183
  area: invariance
  claim: >-
    An identity relay inserted on an internal edge does not move the
    fixed point: the coupled system is the same system with one more copy
    of a field, so the other nodes' states change only by rounding (within
    the derived bound stated in the test) and the verdicts not at all away
    from the threshold.
  sources:
    - docs/developer_guide/testing_standards.md#the-claims-inventories
    - src/maddening/core/coupling/group.py:8 (module docstring)
    - docs/developer_guide/coupling_algorithm_guide.md#the-finding-that-matters-most
  conditions: >-
    Gauss-Seidel with the relay added straight after its source and a
    constant iterator ("none", "fixed"): the other nodes' iterates are
    bit-identical pass for pass.  Otherwise (Jacobi, Aitken, IQN): both run
    to float32 stationarity and each lands within amp * floor of the exact
    float64 fixed point; a convergent group converges with and without the
    relay, a divergent one with neither.  The verdict statement is drawn
    for Aitken under Gauss-Seidel only: under Jacobi its single factor,
    re-derived from residuals that count the relayed field twice, can
    stagnate (capped at 400 passes at rate 0.9 where the relay-free group
    stopped at 278 through the raw-residual fallback) -- the documented
    failure of Aitken's single-mode assumption on a Jacobi spectrum, not
    rounding.
  oracle: bit-identity; the exact float64 fixed point and the operator norm of (I - M)^-1.
  tests:
    - tests/property/test_coupling_invariances.py::test_an_identity_relay_moves_no_bit_under_a_gauss_seidel_constant_iterator
    - tests/property/test_coupling_invariances.py::test_an_identity_relay_moves_the_fixed_point_only_by_rounding
    - tests/property/test_coupling_invariances.py::test_an_identity_relay_keeps_the_verdict
  status: verified
