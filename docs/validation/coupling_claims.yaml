- id: CPL-010
  area: configuration
  claim: >-
    "Aitken and IQN do not depend on units ... Each now works on the vectors
    rescaled by one exact power of two, which leaves every configuration at
    ordinary scales bit-identical (125 dumped) and makes a group at any
    power-of-two scale reproduce the unscaled run bit for bit -- which the
    new units oracle in the coupling differential harness now checks for
    every acceleration, norm and solver."
  sources:
    - docs/release_notes/v0.4.0.md#the-coupling-runtime-round-3-confirmation-audit
    - src/maddening/core/_pow2_frame.py (pow2_frame)
    - src/maddening/core/coupling/acceleration.py:1702 (aitken_relaxation)
  conditions: >-
    "any power-of-two scale", every acceleration, norm and solver; the
    harness checks 2**-53 to 2**66 only.  Below about 2**-115 the node
    arithmetic of the fixture itself underflows (products of O(1e-3) gains
    and O(1e-35) states), so a scale must keep the map's own operands
    normal.
  oracle: bit-identity of passes, verdict, residual and state / s against the unscaled run.
  tests:
    - tests/property/test_differential_coupling_units.py::test_a_coupled_group_takes_the_same_passes_at_every_scale
