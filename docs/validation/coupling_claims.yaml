- id: CPL-195
  area: report
  claim: >-
    coupling_diagnostics() says why a usable flag is False in a code as
    well as in words (experimental).  Every entry has "reason_codes", a
    dict with one list of codes (the string constants of
    maddening.core.coupling.reason_codes) for each of spectral_usable,
    gradient_bound_usable and precision_limited, and
    "residual_precision_floor", the float floor precision_limited was taken
    with.  A usable flag that is False has at least one code and the entry
    a not_usable_reason; a flag that is True has none, and with both True
    there is no reason.  Every cause that holds is listed, in a fixed
    order; gradient_bound_usable's list holds spectral_usable's codes and
    then its own.  precision_limited has a code exactly where its floor was
    not measured (residual_precision_floor is then NaN and the flag reads
    False without saying anything of rounding).  The codes are host
    bookkeeping on what the step stored and what compile() recorded: no
    flag and no number of the entry is read from them.
  sources:
    - src/maddening/core/coupling/reason_codes.py::ALL
    - src/maddening/core/graph_manager.py::GraphManager.coupling_diagnostics
    - src/maddening/core/coupling/_group_layout.py::_flag_causes
    - src/maddening/core/coupling/_group_layout.py::_geometry_flag_causes
    - src/maddening/core/coupling/_group_layout.py::_causes_sentence
    - docs/developer_guide/coupling_algorithm_guide.md#the-reason-codes-of-a-report
  conditions: >-
    Every entry coupling_diagnostics() returns: solver="ift" and "fori",
    with and without diagnostics, a budget of one pass, both schedules,
    every acceleration, the three norms; float32, float64 under x64,
    float32 members under x64, 16-bit floats; a jitted step; each member of
    a vmap of the step (the codes come from that member's slots); a
    multi-rate graph; a sub-cycled group; predictors and warm starts;
    run_adaptive; a checkpoint, loaded (the codes are derived from the
    slots it holds; one saved after a state write lists
    written_before_save beside the group's own causes); a sharded member.
    Groups with a geometry-dependent mapping and with a static mapping of a
    long row list their rules' codes (MAP-036, MADD-ANO-257): an entry
    whose numbers a geometry rule withholds lists that rule's code alone,
    and where two of the three geometry rules hold, the first of kind,
    norm and sub-cycling, as its sentence does.  The lists are plain
    strings: equal after a JSON round trip (the standard codec and
    maddening.serialization.json_codec).  A group that has not stepped has
    no entry, and so no codes.  coupling_report()'s table does not print
