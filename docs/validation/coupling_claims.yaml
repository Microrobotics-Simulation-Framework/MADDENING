- id: CPL-055
  area: criterion
  claim: >-
    ratio_usable is "whether the contraction ratio was usable this step, and
    nothing more": True means "rho < 1, the predecessor residual was
    non-zero, and every residual in the ratio was finite"; "False on a
    non-monotone (non-normal) sequence, on a zero or non-finite predecessor,
    and at max_iterations=1"; "False does not mean the sequence stopped
    contracting" -- a rate near 1 reads rho >= 1 from noise and the raw
    residual test decides.
