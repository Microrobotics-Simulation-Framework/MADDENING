    - tests/core/test_coupling_sixteen_bit_norms_in_float32.py::test_the_sixteen_bit_floor_is_four_eps_over_rtol
    - tests/core/test_coupling_sixteen_bit_norms_in_float32.py::test_the_sixteen_bit_floor_counts_more_than_65504_entries
    - tests/property/test_coupling_targeted_search.py::test_the_floor_covers_what_the_reported_residual_misses_per_push
    - tests/core/test_the_interface_norm_reads_a_mapped_edge_on_its_compact_side.py::test_the_float_floor_counts_a_narrowing_transform_whichever_side_is_read
    - tests/core/test_the_interface_norm_reads_a_mapped_edge_on_its_compact_side.py::test_the_dead_band_is_asked_of_the_side_that_is_read
    - tests/core/test_coupling_floor_at_the_groups_coarsest_dtype.py::test_a_float64_field_downstream_of_a_float32_member_is_floored_at_float32
    - 'tests/core/test_coupling_floor_at_the_groups_coarsest_dtype.py::test_a_set_flag_stands_on_a_bound_at_or_above_the_distance_in_a_group_of_two_dtypes'
    - tests/core/test_the_float_floor_keeps_a_position_at_its_own_dtype.py::test_the_position_fields_are_the_ones_an_internal_edge_anchors_its_geometry_at
