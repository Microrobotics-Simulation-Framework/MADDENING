    - tests/core/test_coupling_non_finite_state.py::test_a_reference_beyond_the_dtype_range_contributes_inf
    - tests/core/test_coupling_non_finite_state.py::test_every_norm_reads_a_non_finite_field_as_inf
    - tests/core/test_coupling_claims_helpers.py::test_only_the_l2_norm_fails_a_field_near_overflow
  status: verified

- id: CPL-044
  area: norms
  claim: >-
    The underflow ends: a field above the dead band whose scale rtol * ref is
