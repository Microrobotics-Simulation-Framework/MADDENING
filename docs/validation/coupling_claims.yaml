    - tests/property/test_differential_ift_derivatives.py::test_the_ift_derivatives_agree_with_dense_and_fori_at_every_scale
  status: verified
  notes: >-
    16bit domain failing on d2429a6: jax.grad and jax.jvp through a bfloat16
    or float16 group raised NotImplementedError (lineax's QR TypeError on
    jax 0.11.2), the IFT rule's linear solve running in the group's dtype
    (MADD-ANO-161). Fixed: the solve runs in float32 on the group's own
    operator and is cast back.
    Failing until 0.4.0's round-4 fix (MADD-ANO-113, since 0.3.0): atol was
    1e-8 + rtol * max|b|, so a cotangent below about 1e-8 met the GMRES
