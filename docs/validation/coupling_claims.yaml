- id: CPL-001
  area: configuration
  claim: >-
    A Literal-typed CouplingGroup field holding a value outside its permitted
    set raises ValueError at construction, naming the accepted options
    ("Without this check a typo like acceleration="aitkin" silently sets the
    field to that string").
  sources:
    - src/maddening/core/coupling/group.py:371 (CouplingGroup.__post_init__)
  conditions: every Literal field (solver, acceleration, convergence_norm, iteration_mode, boundary_interpolation, predictor, linear_solver); the empty string included.
  oracle: exception type and message.
  tests:
    - tests/core/test_coupling_group_validation.py::test_typo_raises
    - tests/core/test_coupling_group_validation.py::test_typo_error_includes_valid_options
    - tests/core/test_coupling_group_validation.py::test_empty_string_rejected
    - tests/core/test_coupling_group_validation.py::test_acceleration_valid
  status: verified

