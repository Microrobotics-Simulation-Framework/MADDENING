- id: CPL-093
  area: report
  claim: >-
    gradient_relative_error_bound is "a bound on the relative error of the
    IFT gradient that comes from the forward stopping at the returned
    iterate ... Read it as |g_k - g*| <= bound * |g_k| for the gradient with
    respect to one scalar constant"; measured never below the true error at
    caps 3-8 on concave, convex and affine maps, 1.19-1.70x on a spring pair,
    25x on a hidden slow mode.
  sources:
    - src/maddening/core/graph_manager.py:8023 (coupling_diagnostics, gradient_relative_error_bound)
