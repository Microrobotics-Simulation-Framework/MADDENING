    - tests/core/test_an_edge_from_a_node_to_itself.py::test_validate_tells_an_edge_from_a_nodes_own_flux_outside_a_group_that_it_cannot_be_read
    - tests/compliance/test_validate_lines_in_the_guides.py::test_the_page_shows_each_line_validate_gives_for_the_graph_it_describes
    - tests/api/test_graph_endpoint_validation.py::test_validate_reports_an_edge_from_a_node_to_itself_and_the_graph_still_compiles_and_steps
    - tests/core/test_coupling.py::TestCouplingValidation::test_cycle_covered_by_group_names_the_groups_iteration_mode
    - tests/verification/hypothesis/test_hypothesis_graph.py::TestSelfEdgeHandling::test_self_edge_ball_position_to_table
    - tests/verification/hypothesis/test_hypothesis_graph.py::TestSelfEdgeHandling::test_self_edge_spring_position_to_anchor
    - tests/core/test_schedule.py::TestIdentifyBackEdges::test_self_loop_is_back_edge
    - tests/core/test_interface_plan.py::test_which_inputs_are_coupled_and_who_reads_whom
  status: verified
  notes: >-
    Nothing documented was false before this row, and nothing said it: the
    inspection guide's "iterated inside a coupling group or is a back edge
    that reads the previous step's value" held, and a self-edge is the edge
    whose half changes when a group is put around its node (0.99 against
    0.990099 for one rod, found while writing a worked example, 2026-10-08).
    The tests stopped below the compiled graph, and one accepted "a refusal
    or any finite state".  Decided: the behaviour stays, with no warning,
    because a group around the node is how the term is made implicit; it is
    stated in add_edge, add_coupling_group, CouplingGroup and two guides.
    validate() named every loop of two or more nodes ("cycle detected",
