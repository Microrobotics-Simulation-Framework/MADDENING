    normal.
  oracle: bit-identity of passes, verdict, residual and state / s against the unscaled run.
  tests:
    - tests/property/test_differential_coupling_units.py::test_a_coupled_group_takes_the_same_passes_at_every_scale
    - tests/core/test_coupling_accelerators_are_units_invariant.py::test_aitken_omega_is_the_same_at_every_scale
    - tests/core/test_coupling_claims_graphs.py::test_a_group_at_2_to_the_minus_110_takes_the_unscaled_passes
    - tests/core/test_coupling_non_finite_state.py::test_an_accelerated_verdict_does_not_change_below_the_change_underflow
    - tests/core/test_coupling_non_finite_state.py::test_a_tiny_field_beside_a_normal_one_relaxes_like_its_control
  status: verified
  notes: >-
    Failing until 0.4.0's round-4 fix (MADD-ANO-115): at 2**-110 Aitken took
    42 passes where the unscaled run took 45, and "fixed" and IQN-IMVJ
    returned a different state, because the accelerators subtracted the
    iterates before any rescaling and a subnormal difference flushed.  The
    accelerators now work in a power-of-two frame fixed for the solve and
    form each relaxed entry in its own frame.  The test below runs every
    acceleration at 2**-14 and 2**-24 of a 1e-30 control (states to 6e-37)
    on both solvers, and a tiny field beside a normal one.

