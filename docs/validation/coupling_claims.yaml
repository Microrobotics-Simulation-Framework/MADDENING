- id: CPL-140
  area: ift gradients
  claim: >-
    "x_star differentiates via the implicit function theorem:
    dx*/d(consts) = (I - dF/dx)^{-1} dF/d(consts) evaluated at the fixed
    point"; the adjoint is the sensitivity of the fixed point, not of the
    truncated iterate, and differs from a finite difference of the forward
    by about the residual times cond(I - dF/dx).
  sources:
    - src/maddening/core/coupling/_ift.py::_ift_solve_impl
    - src/maddening/core/coupling/_ift.py::_ift_solve_impl
  conditions: solver="ift", a converged forward.
  oracle: the analytic gradient of linear groups; finite differences of the converged fixed point.
  tests:
    - tests/core/test_coupling_solver_equivalence.py::test_the_ift_adjoint_is_the_sensitivity_of_the_fixed_point
    - tests/core/test_coupling_solver_equivalence.py::test_the_ift_adjoint_disagrees_with_its_forward_by_about_the_residual
    - tests/core/test_coupling_ift_lineax.py::test_default_adjoint_solve_returns_the_analytic_gradient_when_stiff
    - tests/core/test_imvj_gradient_matches_finite_differences.py::test_the_gradient_through_a_multiphysics_imvj_group_matches_finite_differences
  status: verified
  notes: >-
    16bit domain failing on d2429a6: jax.grad and jax.jvp through a bfloat16
    or float16 group raised NotImplementedError (lineax's QR TypeError on
    jax 0.11.2), the IFT rule's linear solve running in the group's dtype
    (MADD-ANO-161). Fixed: the solve runs in float32 on the group's own
    operator and is cast back. adaptive domain failing on d2429a6: jax.grad
    through run_adaptive_scan read NaN (0.0 on 3fe7f275) where the
    step-doubling estimates agreed exactly -- the controller's error norm, a
    square root, had an infinite derivative there (MADD-ANO-160). Fixed with
    a double where in adaptive._tree_error_norm.
