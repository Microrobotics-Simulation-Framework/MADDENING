- id: CPL-041
  area: norms
  claim: >-
    coupling_residual_interface: "Computes the difference in interface values
    between two successive iterations: for each intra-group edge, the value
    the edge delivers -- its source field through the edge's interface
    mapping and then its transform, exactly as the step hands it to the
    target -- or, for an edge whose mapping delivers more entries than its
    source field holds, the source field itself, before the mapping and the
    transform ...  Only the fields that appear on intra-group edges are
    compared", scaled as the mixed norm.  The mapping weights of an edge read
    as delivered are the ones the step ran with (params["mappings"], a
    per-step override included).
  sources:
    - src/maddening/core/coupling/acceleration.py::coupling_residual_interface
    - src/maddening/core/coupling/acceleration.py::_interface_readings
    - src/maddening/core/coupling/_interface_plan.py::_norm_side
    - src/maddening/core/edge.py::_delivered
    - src/maddening/core/coupling/group.py::CouplingGroup (convergence_norm)
  conditions: >-
    The dead band is asked of the value read; for an edge read at its source
    it is asked of the source field AND of what the edge delivers (its mapping
    with the step's weights, then its transform): the reading leaves the norm
    only where both are at or below atol, since such an edge has two
    quantities and atol is in a quantity's own units.  Asked of the source
    alone, three forces of 1e-8 handed on as 17 to 520 by a transform were
    dropped at atol = 1e-6 and a Jacobi pair accepted after one pass 34% to
    74% from its fixed point.  The reading, its scale and its float floor stay
    the source field's; a source field at exactly zero stays out; nothing is
    built for a group with atol == 0; a group with atol > 0 and such an edge
    records its floor in the step (the band depends on the step's weights).
    Positions read in a mapping kind's length scale are always read.  A
    change that has to cross a dropped field is not seen until it reaches a
    kept one: with atol > 0 the distance to the fixed point is claimed for
    no group, whatever its member count and schedule (CPL-011,
    MADD-ANO-254).
    convergence_norm="interface"; state edges (a flux edge is refused at
    compile: CPL-075), with or without an interface mapping and a transform;
    an edge whose source field is not floating, or whose reading has no
    entries, is not read.  The dead band and the unevaluable-field rule are
    applied to the value that is read: the delivered one, or the source
    field of an edge read at its source (CPL-188 states which).  The domain
    cells run a pair with one mapped and one plain internal edge, the
    mapping a tie (read as delivered), its weights passed for the step; the
    source-side reading has the cells of CPL-188.
    The residual a step reports is of the iterate its loop accepted: where
    a field is read only through a mapping (one read as delivered) or a
    transform the step returns it one plain pass on (CPL-191), and the
    residual of the state returned is another number; the domain cells read
    the accepted iterate with the return rule switched off.
    The three rules together: a pair with an edge read at its source and a
    field with no entries on the member it reads (unread; read by a plain
    or a transformed edge; or behind a mapping of none onto more entries,
    which is read at its source and so is not read) returns and reports
    what the pair without the field does, to the bit, on jax 0.10.2,
    0.11.0 and 0.11.2.
  oracle: closed form over the edge values that are read, in float64.
  tests:
    - 'tests/core/test_the_dead_band_of_an_edge_read_at_its_source.py::test_a_banded_group_whose_only_mapped_edge_is_read_at_its_source_records_its_floor'
    - 'tests/core/test_the_dead_band_of_an_edge_read_at_its_source.py::test_the_spectrums_weights_keep_the_reading_the_residual_keeps'
    - 'tests/core/test_the_dead_band_of_an_edge_read_at_its_source.py::test_a_small_force_handed_on_in_other_units_is_held_to_the_criterion'
    - 'tests/core/test_the_dead_band_of_an_edge_read_at_its_source.py::test_a_source_reading_leaves_the_norm_only_where_field_and_delivered_are_both_inside'
    - tests/core/test_coupling_claims_helpers.py::test_the_interface_norm_measures_the_transformed_edge_values
    - tests/core/test_phases_5_7_8.py::TestInterfaceResidual::test_interface_residual_detects_difference
    - tests/core/test_coupling_interface_reading_is_what_the_edge_delivers.py::test_the_norm_of_a_mapped_edge_is_the_norm_of_what_it_delivers
    - tests/core/test_coupling_interface_reading_is_what_the_edge_delivers.py::test_the_weights_read_are_the_ones_passed_not_the_mapping_objects_own
    - tests/core/test_coupling_interface_reading_is_what_the_edge_delivers.py::test_the_dead_band_is_the_delivered_values
    - tests/core/test_coupling_interface_reading_is_what_the_edge_delivers.py::test_a_delivered_value_that_is_not_finite_fails_the_criterion
    - tests/core/test_coupling_interface_reading_is_what_the_edge_delivers.py::test_an_integer_source_and_an_empty_delivery_carry_no_norm
    - tests/core/test_coupling_diagnostics_with_an_empty_field.py::test_a_group_reports_what_its_twin_without_the_field_does
    - tests/core/test_coupling_empty_field_beside_an_edge_read_at_its_source.py::test_a_group_with_an_edge_read_at_its_source_reports_what_its_twin_without_the_field_does
    - tests/core/test_coupling_interface_reading_is_what_the_edge_delivers.py::test_one_pass_reports_the_change_of_what_its_edges_delivered
    - tests/core/test_coupling_interface_reading_is_what_the_edge_delivers.py::test_a_group_iterates_until_what_its_mapped_edge_delivers_has_stopped_moving
    - tests/core/test_coupling_mapped_edges_in_every_domain.py::test_the_interface_norm_measures_what_mapped_edges_deliver
    - tests/property/test_differential_coupling_topologies.py::test_the_interface_norm_on_a_mapped_ring_reproduces_the_monolithic_reference
    - tests/core/test_the_interface_norm_reads_a_mapped_edge_on_its_compact_side.py::test_the_residual_reads_each_static_mapped_edge_on_its_compact_side
    - tests/core/test_the_interface_norm_reads_a_mapped_edge_on_its_compact_side.py::test_the_pool_counts_the_entries_of_the_side_that_is_read
  status: verified
  notes: >-
    Until MADD-ANO-195 was fixed the norm applied an edge's transform
    and left its mapping out: a mapped edge was measured on its source
    field (a 9% change of what a selecting mapping delivered read 0.0071 of
    the tolerance), and the row excluded mapped edges and seven domains.
    Every reading now goes through the step's edge rule, and the cells
    below hold a mapped and a plain edge in every domain.
  domains:
