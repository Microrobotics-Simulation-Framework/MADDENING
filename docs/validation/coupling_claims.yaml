- id: CPL-093
  area: report
  claim: >-
    gradient_relative_error_bound is "a bound on the relative error of the
    IFT gradient that comes from the forward stopping at the returned
    iterate ... Read it as |g_k - g*| <= bound * |g_k| for the gradient with
    respect to one scalar constant"; measured never below the true error at
    caps 3-8 on concave, convex and affine maps, 1.19-1.70x on a spring pair,
    26x on a hidden slow mode.
  sources:
    - src/maddening/core/graph_manager.py::GraphManager.coupling_diagnostics (gradient_relative_error_bound)
    - docs/developer_guide/coupling_algorithm_guide.md#gradient_relative_error_bound-the-gradient-not-the-solve
  conditions: >-
    solver="ift", diagnostics=True; gradient_bound_usable, which certifies
    the Newton-Kantorovich check h < 1/2 with h the larger of beta L
    ||delta|| and the affine-covariant ||(I - J)^{-1} (J(x_k + delta) -
    J(x_k))|| on the Jacobian's row space, and the Newton step's
    second-order miss carried at the rate each
    probe's own secant shows -- so the map changing no faster between x_k
    and x* than across that step (MADD-ANO-188); leading-order in
    the distance; one probe per scalar entry of every floating constant of
    at most 64 entries (GRADIENT_PROBE_ENTRY_LIMIT); a larger constant is
    probed along one |c|-weighted fixed-seed direction and named by
    coupling_report(), and for it the bound covers that directional
    derivative only.  The resolvent is applied exactly to each probe's
    secant (MADD-ANO-142; per-entry probes MADD-ANO-143).  Its norms are
    the state's fields: under convergence_norm="interface" with an edge
    transform or a mapping, the raw source fields, before either (for an
    edge the norm reads at its source, CPL-188, that is the reading
    itself).  The part of
    the distance that is the pass's rounding has no direction and is
    multiplied by the operator norm of the right-hand side's change over
    the directions the Jacobian reads (it took one stand-in direction and
    read 5.1e-6 for a true 3.0e-5 at the float floor: MADD-ANO-226,
    resolved); where the pass has no reverse mode and more than 64 state
    entries that norm is unavailable and the bound is inf unless the
    right-hand side does not depend on the state.  A constant the pass
    resolves: moving it by its own magnitude moves one pass from x_k by
    more than the residual's float floor, in the bound's norm, and its
    tangent is not exactly zero.  A constant below that (the centre or the
    curve of a nonlinearity evaluated on its centre: the fixed point does
    not respond to it, and its gradient at x_k is rounding; and a gain or
    forcing so weak that its whole value moves the pass by less than the
    floor) is not in the bound, which says nothing of it; it read 1.09 for
    a relative error of 1.134 with those probes in it (MADD-ANO-234,
    resolved).
    A GROUP THAT SOLVES POSITIONS (a geometry edge read from the iterate, or
    from the state the same pass has built; MAP-049, MADD-ANO-252): the
    Newton-Kantorovich check takes the Jacobian at the iterate and at the
    Newton point and cannot see a lattice plane beyond both (the bound read
    15x to 70,000x under the error with the flag set), and the rule that
    then asked for no plane inside the Newton-Kantorovich ball kept the
    spectral flag in a cell whose polynomial has no fixed point. So in 0.4.0
    gradient_bound_usable, as spectral_usable (CPL-088), is False on every
    step for such a group, whatever the bound reads, and the bound is
    reported uncertified. Where every position is a constant of the pass
    this claim holds as for any other group, and a False flag carries its
    causes, a bound that was not computed (NaN) told from one that did not
    certify (inf).
    A group with a geometry edge (experimental; MAP-036: multilinear_grid
    mappings, one rate, the l2 or the mixed norm): the constants probed
    include the positions a target-anchored edge reads from a member's
    pre-step state, and the bound is held against the float64 reference's
    implicit derivative for every constant of the members the pass
    resolves.  The gradient bounded is the one the group computes, in
    its own dtype: a constant whose tangent the group's float32 pass
    rounds to exactly zero is outside the row, whatever a float64 twin's
    response to it (the nonlinear search scores a centre or a curve
    only where the float32 pass resolves it and the twin agrees).
    Under convergence_norm="interface" the bound is on the gradient of the
    state returned as it is on the accepted iterate's.  A field returned
    recomputed (CPL-191) is one plain pass at that iterate, and the
    derivative of the pass at an iterate whose own derivative is the
    implicit rule's (g = (I - J)^{-1} dF, the pass linearised there) is
    J g + dF = g again: every returned field, recomputed or kept, carries
    the derivative the bound is on.  Held in forward mode over every
    weight of every mapping at a cap of four passes, under both
    schedules, against the float64 closed form at the accepted iterate
    (to 1e-9), and the bound then against the library's own derivative of
    the state returned (0.006 to 6.7 from the fixed point's, under bounds
    of 0.007 to 14.6; float64, linear members, jaxlib 0.11.0).
    IN A BATCH (jax.vmap of the step): a member's verdict, pass count and
    flags equal the member's alone, and its state to a few roundings.  The
    bound is computed by the batched program and is good to its own float
    resolution: it agreed with the member's alone to 4e-6 on plain edges
    under either schedule and to 2.5e-7 on a mapped edge under Gauss-Seidel;
    on a Jacobi group with a mapped edge the two were 0.03% to 0.8% apart
    above the float floor and up to a factor of two apart where the report
    is at its float floor (precision_limited).  The member's number does not
    depend on the other members, their order or their count (a batch of one
    gives it).  Each member's bound is claimed, in a batch as alone, on
    plain edges (held against the closed-form error under both schedules,
    1.1 to 3.2 times it); behind a mapped edge under Jacobi at the float
    floor the batched number was not compared with a true error and is
    outside this row.
  oracle: the fixed point's gradient from the float64 solve or from tight ift and fori arms that agree.
  tests:
    - 'tests/property/test_coupling_geometry_search.py::test_a_reported_number_of_a_group_with_a_geometry_edge_holds_against_the_reference_per_push'
    - 'tests/property/test_coupling_plane_sides.py::test_every_flagged_number_of_a_table_row_holds_against_the_reference'
    - tests/core/test_coupling_gradient_error_bound.py::test_the_gradient_bound_holds_across_an_early_exit_sweep
    - tests/core/test_coupling_gradient_error_bound.py::test_a_parameter_that_sits_at_zero_is_still_probed_at_one_cap
    - tests/core/test_coupling_gradient_error_bound.py::test_an_affine_map_with_a_multiplicative_parameter_is_not_exempt_at_one_cap
    - tests/core/test_coupling_gradient_error_bound.py::test_the_gradient_bound_takes_its_distance_from_the_spectral_bound_against_the_exact_gradient
    - tests/core/test_coupling_precision_floor.py::test_a_stalled_nonlinear_iterate_does_not_read_its_gradient_as_exact
    - tests/core/test_coupling_gradient_bound_through_a_vmapped_step.py::test_the_gradient_bound_holds_for_each_member_of_a_vmapped_batch
    - tests/core/test_coupling_gradient_bound_applies_the_full_resolvent.py::test_a_usable_gradient_bound_covers_every_gain_of_a_rank_one_ring
    - tests/core/test_coupling_gradient_bound_applies_the_full_resolvent.py::test_each_entry_of_an_array_gain_is_its_own_probe
    - tests/core/test_coupling_gradient_bound_applies_the_full_resolvent.py::test_a_constant_above_the_entry_limit_is_probed_whole_and_named
    - tests/property/test_differential_gradient_bound.py::test_a_usable_gradient_bound_covers_every_scalar_constant_at_an_early_exit
    - tests/property/test_differential_gradient_bound.py::test_a_usable_gradient_bound_covers_every_scalar_constant_at_every_cap
    - tests/property/test_differential_coupling_interactions.py::test_a_usable_gradient_bound_bounds_the_error_in_every_row
    - tests/core/test_coupling_gradient_bound_far_from_the_fixed_point.py::test_a_usable_gradient_bound_holds_on_the_audit_pair_at_every_cap
    - tests/core/test_coupling_gradient_bound_far_from_the_fixed_point.py::test_far_from_its_fixed_point_the_gradient_bound_holds_or_is_withdrawn
    - tests/property/test_coupling_targeted_search.py::test_a_usable_gradient_bound_is_never_below_the_error_per_push
    - tests/property/test_coupling_nonlinear_search.py::test_a_usable_gradient_bound_is_never_below_the_error_on_the_nonlinear_cell_per_push
    - tests/property/test_coupling_nonlinear_search.py::test_a_usable_gradient_bound_covers_a_nonlinearity_s_own_constants_per_push
    - tests/property/test_coupling_nonlinear_search.py::test_a_constant_the_pass_does_not_resolve_is_not_in_the_gradient_bound
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_at_an_early_exit_every_returned_field_carries_the_accepted_iterates_implicit_derivative
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_the_returned_gradient_is_the_accepted_iterates_in_every_case_and_schedule
  status: verified
  notes: >-
    16bit domain failing on d2429a6: jax.grad and jax.jvp through a bfloat16
    or float16 group raised NotImplementedError (lineax's QR TypeError on
    jax 0.11.2), the IFT rule's linear solve running in the group's dtype
    (MADD-ANO-161). Fixed: the solve runs in float32 on the group's own
    operator and is cast back. adaptive domain failing on d2429a6: jax.grad
    through run_adaptive_scan read NaN (0.0 on 3fe7f275) where the
    step-doubling estimates agreed exactly -- the controller's error norm, a
    square root, had an infinite derivative there (MADD-ANO-160). Fixed with
    a double where in adaptive._tree_error_norm.
