- id: CPL-196
  area: report
  claim: >-
    What the spectral estimate's eight Krylov steps resolve is a rank, and
    the report says which side of it a group is on.  A pass that depends on
    the previous one through at most seven independent scalars (eight where
    they are the whole state) is resolved: under Gauss-Seidel that is what
    the loop closes through, so a pair whose loop closes through 3, 6 or 7
    scalars has spectral_usable True and the pass's radius in
    rho_spectral, in either sweep order, with a second member of up to 3000
    entries; and with members that declare a parameter
    gradient_bound_usable follows it.  A member of 8 or 13 scalars beside a
    larger one is not resolved, nor is a pair under Jacobi whose two
    directions add up past the limit.  Where the estimate did not settle,
    reason_codes lists interface_too_wide exactly where compile()'s
    structural count of the pass is past what the steps span (expected:
    nothing is wrong), and spectral_self_check_failed where the steps span
    the pass (a worry); never interface_too_wide for a pass counted within
    the steps.
  sources:
    - src/maddening/core/coupling/_group_layout.py::_pass_width
    - src/maddening/core/coupling/_group_layout.py::_unsettled_cause
    - src/maddening/core/coupling/reason_codes.py::INTERFACE_TOO_WIDE
    - src/maddening/core/coupling/reason_codes.py::SPECTRAL_SELF_CHECK_FAILED
    - docs/developer_guide/coupling_algorithm_guide.md#spectral_error_bound-the-spectrum-measured
    - docs/user_guide/inspection.md
  conditions: >-
    solver="ift", diagnostics=True; linear relays at a tolerance above the
    float floor (the mixed norm, rtol=1e-4), each declaring one evaluation;
    Gauss-Seidel and Jacobi; no acceleration.  The count is structural and
    an upper bound on the rank: the entries of the fields read from the
    previous pass (every internal edge under Jacobi and in a group that
    sub-steps a member; under Gauss-Seidel the edges whose source is swept
    at or after their target), or of the members that read them, or of the
    whole state, whichever is smallest.  A member that uses only a
    combination of what it reads, and a mapping that delivers fewer
    entries than its source holds, make the pass narrower than counted:
    such a group reads interface_too_wide where rounding may have had its
    part, which the report cannot tell (the step stores one number for an
    estimate that did not settle).  A group with a boundary-flux edge
    between members is counted at its whole state.  Not claimed for
    float64, mixed dtypes, 16-bit floats, vmap, multi-rate or sub-cycled
    graphs, predictors, run_adaptive, checkpoints or sharded graphs.
  oracle: >-
    The loop's matrix: the spectral radius of the product of the two
    relays' matrices in float64, and its rank (the smaller member's
    entries); the structural count against the entries each pair is built
    with.
  tests:
    - tests/core/test_coupling_report_reason_codes.py::test_an_estimate_that_did_not_settle_is_too_wide_only_where_the_pass_is
    - tests/core/test_coupling_report_reason_codes.py::test_the_width_of_a_pass_is_what_it_reads_from_the_previous_one
    - tests/core/test_coupling_report_reason_codes.py::test_a_loop_closing_through_a_few_scalars_is_resolved_whatever_is_on_the_other_side
    - tests/core/test_coupling_report_reason_codes.py::test_a_wider_loop_is_not_and_its_report_says_that_is_expected
    - tests/core/test_coupling_report_reason_codes.py::test_members_that_declare_no_parameter_keep_the_spectral_flag_and_say_why_the_gradient_s_is_down
    - tests/core/test_coupling_report_reason_codes.py::test_a_whole_state_of_eight_entries_is_within_the_steps_under_jacobi
