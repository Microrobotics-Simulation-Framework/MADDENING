- id: CPL-008
  area: configuration
  claim: >-
    tolerance: "Since 0.4.0 the L2 norm divides each field's change by that
    field's largest magnitude (the larger of its two iterates' max|v|), so
    this is a relative tolerance: it equals the pre-0.4.0 absolute
    threshold exactly when every field's largest magnitude is 1.  It is one
    threshold for the whole group, not one per field: the norm is the
    root-sum-square, over every entry of every floating field of every
    member, of that entry's change divided by its field's largest
    magnitude.  A field of n entries each moving by tolerance * max|v|
    therefore reads tolerance * sqrt(n), and so do n one-entry fields each
    moving by that much of their own magnitude."
  sources:
    - src/maddening/core/coupling/group.py:69 (CouplingGroup, tolerance)
    - src/maddening/core/coupling/acceleration.py:237 (coupling_residual_l2)
  conditions: convergence_norm="l2".
  oracle: closed-form norm value at unit and non-unit magnitude.
  tests:
    - tests/core/test_coupling_convergence.py::TestResidualNorms::test_l2_known_value
    - tests/core/test_coupling_claims_helpers.py::test_the_l2_tolerance_is_absolute_only_at_unit_magnitude
    - tests/core/test_coupling_claims_helpers.py::test_the_l2_tolerance_is_one_threshold_for_the_whole_group
  status: verified
  notes: >-
    Ambiguous until 0.4.0's claims fix ("for fields of order one it is the
    absolute threshold it used to be").  Reworded.  The round-6 audit found
    "an absolute threshold of tolerance * max|v| per field" wrong: two
    fields each inside it fail the group's test, and a 100-entry field
    moving 0.5 tolerance per entry reads 5x over.  Reworded again.
  domains:
    f32: tests/core/test_coupling_claims_helpers.py::test_the_l2_tolerance_is_absolute_only_at_unit_magnitude
    f64: 'tests/core/test_coupling_claims_in_every_domain.py::test_the_claim_holds_in_float64[CPL-008]'
    mixed_dtype: 'tests/core/test_coupling_claims_in_every_domain.py::test_the_claim_holds_with_a_float32_member_under_x64[CPL-008]'
