- id: CPL-062
  area: loop
  claim: >-
    "The guard adds at most one pass to Aitken's own exit -- the pass before
    the loop is the streak's first member -- so it sets no floor of four.
    It is not a bound on Aitken against acceleration="none", which follows
    different iterates and can stop sooner or later."
  sources:
    - docs/developer_guide/coupling_algorithm_guide.md#the-finding-that-matters-most
    - src/maddening/core/coupling/_fixed_point.py::_TWO_PASS_EXIT
  conditions: >-
    acceleration="aitken", solver="ift" (the fori path latches by the same
    rule). Not claimed for 16-bit floats, run_adaptive or sharded graphs.
  oracle: the same group compiled with _TWO_PASS_EXIT emptied, one step from the same state.
  tests:
    - tests/core/test_coupling_claims_graphs.py::test_the_two_pass_guard_adds_at_most_one_pass_to_aitkens_exit
    - tests/core/test_coupling_convergence_reporting.py::test_the_aitken_guard_is_answerable_at_every_cap
    - tests/core/test_coupling_accelerations_in_every_domain.py::test_the_guard_adds_at_most_one_pass_to_aitkens_exit
  status: failing
  finding: >-
    The guard can hold Aitken two passes past its own exit, not at most one.
    It holds the pass to its error estimate and the predecessor to its raw
    residual (_fixed_point_while's _met), and an Aitken estimate can rise
    back above the threshold on the pass after Aitken's own exit without any
    dip in the residuals.  Three independent modes, x_a <- g_a x_b + c,
    x_b <- s x_a entry by entry with g_a = (-0.02, 0.92, 0.53),
    s = (-1, -1, 1), c = (1.82, 1.27, 1.02), Gauss-Seidel, tolerance=1e-4,
    float32: without the guard Aitken stops at pass 9 (estimate 6.9e-5);
    pass 8's raw residual is 9.2e-4, pass 10's estimate is 1.9e-4 (its raw
    residual 4.6e-5), and the guard stops at pass 11.  The state returned is converged
    and nearer the fixed point; what fails is the documented cost.
    Reproducer: tests/core/test_coupling_accelerations_in_every_domain.py::test_the_guard_adds_at_most_one_pass_to_aitkens_exit[f32]
    (src/maddening/core/coupling/_fixed_point.py::_fixed_point_while._met).  MADD-ANO-170; the
    guide's sentence is to be reworded, or the guard's rule changed, in 0.5.0.
  notes: >-
    Ambiguous until 0.4.0's claims fix ("Budget one pass over the unaccelerated
    exit, not a floor of four").  Reworded.  The f32 test above holds on its six
    triangle draws; three-mode pairs reach two extra passes on two draws in four.
  domains:
    f32: 'tests/core/test_coupling_accelerations_in_every_domain.py::test_the_guard_adds_at_most_one_pass_to_aitkens_exit[f32]'
    f64: 'tests/core/test_coupling_accelerations_in_every_domain.py::test_the_guard_adds_at_most_one_pass_to_aitkens_exit[f64]'
    mixed_dtype: 'tests/core/test_coupling_accelerations_in_every_domain.py::test_the_guard_adds_at_most_one_pass_to_aitkens_exit[mixed_dtype]'
    16bit: narrowed
    jit: tests/core/test_coupling_claims_graphs.py::test_the_two_pass_guard_adds_at_most_one_pass_to_aitkens_exit
    grad: n/a
    vmap: 'tests/core/test_coupling_accelerations_in_every_domain.py::test_the_guard_adds_at_most_one_pass_to_aitkens_exit[vmap]'
    multi_rate: 'tests/core/test_coupling_accelerations_in_every_domain.py::test_the_guard_adds_at_most_one_pass_to_aitkens_exit[multi_rate]'
    sub_cycled: 'tests/core/test_coupling_accelerations_in_every_domain.py::test_the_guard_adds_at_most_one_pass_to_aitkens_exit[sub_cycled]'
    predictors_warm_starts: 'tests/core/test_coupling_accelerations_in_every_domain.py::test_the_guard_adds_at_most_one_pass_to_aitkens_exit[predictors_warm_starts]'
    adaptive: narrowed
    checkpoint_restart: 'tests/core/test_coupling_accelerations_in_every_domain.py::test_the_guard_adds_at_most_one_pass_to_aitkens_exit[checkpoint_restart]'
