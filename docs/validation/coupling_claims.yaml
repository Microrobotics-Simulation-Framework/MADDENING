- id: CPL-042
  area: norms
  claim: >-
    The 0.4.0 mixed scale replaces the elementwise atol + rtol * |v_i|
    scale: "For a scalar field (or an entry at its field's largest
    magnitude) well above atol / rtol the two formulas agree to within
    1 + atol/(rtol*|v|).  An entry smaller than its field's largest is
    measured against the field's scale, so the new norm can be smaller than
    the old elementwise one by up to max|v| / |v_i|."
  sources:
    - src/maddening/core/coupling/acceleration.py:300 (coupling_residual_mixed)
  conditions: convergence_norm "mixed" or "interface".
  oracle: the old elementwise formula evaluated beside the new one.
  tests:
    - tests/core/test_coupling_claims_helpers.py::test_the_old_and_new_mixed_scales_agree_only_at_the_fields_largest_entry
  status: verified
  notes: Ambiguous until 0.4.0's claims fix (stated for every field).  Reworded.

- id: CPL-043
  area: norms
  claim: >-
    "A field the criterion cannot be evaluated on fails it; it does not leave
    it": a non-finite reference, or a scale whose reciprocal is not a normal
    number of the field's dtype, makes every entry inf and the field active,
    so every norm is inf and converged is False -- "a float32 field within a
    factor of four of overflow can never read as converged".
  sources:
    - src/maddening/core/coupling/acceleration.py:88 (_scaled_change)
    - docs/validation/known_anomalies.yaml (MADD-ANO-019)
  conditions: >-
    the non-finite rule under every norm; the overflow rule is "only
    reachable under the L2 norm's rtol=1.0" -- the mixed and interface
    scales rtol * max|v| stay normal far above it.
  oracle: closed form; a constant field (an exact fixed point) near overflow.
  tests:
