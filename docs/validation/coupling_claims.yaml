    - tests/core/test_an_edge_from_a_node_to_itself.py::test_a_predictor_only_moves_where_the_iteration_starts
    - tests/core/test_an_edge_from_a_node_to_itself.py::test_on_a_multi_rate_graph_each_node_reads_its_own_value_at_its_own_rate
    - tests/core/test_an_edge_from_a_node_to_itself.py::test_a_sub_cycled_member_reads_its_own_value_at_the_end_of_the_groups_step
    - tests/core/test_an_edge_from_a_node_to_itself.py::test_run_adaptive_takes_each_of_its_steps_by_the_same_rule
