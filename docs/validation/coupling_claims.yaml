- id: CPL-078
  area: loop
  claim: >-
    "jacobi with acceleration="none" or "fixed" if the answer must not
    depend on how the graph was built": "Jacobi's returned states under
    "none" and "fixed" do not depend on the order the members were added in
    -- to the bit unless a residual lands within an ulp of the threshold,
    since the norm sums the members in the schedule's order.  Under
    "aitken" and the IQN pair they agree to float32 round-off and not to the
    bit ..., and the spectral keys and gradient_relative_error_bound follow
    the build order too."
  sources:
    - docs/developer_guide/coupling_algorithm_guide.md#start-here
    - docs/developer_guide/coupling_algorithm_guide.md#what-the-way-a-graph-is-built-can-change
  conditions: >-
    iteration_mode="jacobi"; the members' build order varied, everything
    else fixed. In float64, 16-bit floats, vmap, multi-rate graphs,
    sub-cycled groups, with a predictor and after a checkpoint restart the
    constant-iterator statement is held: the states bit for bit, the
    verdicts equal, the residual to round-off. Not claimed for mixed dtypes,
    run_adaptive or sharded graphs.
  oracle: >-
    bit-identity of the states (constant iterators); for the accelerators,
    the forward error of each node's sum over the same four passes,
    amplified by 1 / (1 - rho), with Gauss-Seidel (which does follow the
    order) as the counterfactual that must fall outside it.
  tests:
    - tests/core/test_coupling_fixture_invariants.py::test_jacobi_on_a_ring_is_order_independent
    - tests/core/test_coupling_claims_graphs.py::test_jacobi_states_do_not_depend_on_the_build_order_under_a_constant_iterator
    - tests/core/test_coupling_claims_graphs.py::test_jacobi_states_agree_to_round_off_under_aitken_and_iqn_whatever_the_build_order
    - tests/core/test_coupling_claims_graphs.py::test_the_gradient_bound_holds_in_every_build_order
  status: verified
  notes: >-
    Ambiguous until 0.4.0's claims fix ("Jacobi is bit-identical under rotation
    and reversal", conditions unstated).  Reworded.  The
    gradient bound's dependence on the build order (83.5 to 99.5 over the
    six orders of one group) was judged a documented approximation -- one
    fixed-seed random probe per field-valued constant, drawn in the order
    the map reads its constants -- on the condition that it stays valid in
    every order: over 17 configurations (four accelerations, three norms,
    two caps, three draws) and all six orders it was usable and 6.9-434x
    the largest true relative error of the tangent with respect to any
    scalar constant (linear_solver="dense" reference, fixed point at 3000
    passes).  Stated in the guide and the coupling_diagnostics docstring.
  domains:
