- id: CPL-183
  area: invariance
  claim: >-
    An identity relay inserted on an internal edge does not move the
    fixed point: the coupled system is the same system with one more copy
    of a field, so the other nodes' states change only by rounding (within
    the derived bound stated in the test) and the verdicts not at all away
    from the threshold.
  sources:
    - docs/developer_guide/testing_standards.md#the-claims-inventories
    - src/maddening/core/coupling/group.py:8 (module docstring)
    - docs/developer_guide/coupling_algorithm_guide.md#the-finding-that-matters-most
  conditions: >-
    Gauss-Seidel with the relay added straight after its source and a
    constant iterator ("none", "fixed"): the other nodes' iterates are
    bit-identical pass for pass.  Otherwise (Jacobi, Aitken, IQN): both run
    to float32 stationarity and each lands within amp * floor of the exact
    float64 fixed point; a convergent group converges with and without the
    relay, a divergent one with neither.  The verdict statement is drawn for
    Aitken under Gauss-Seidel only: under Jacobi its single factor,
    re-derived from residuals that count the relayed field twice, can
    stagnate (capped at 400 passes at rate 0.9 where the relay-free group
    stopped at 278 through the raw-residual fallback) -- the documented
    failure of Aitken's single-mode assumption on a Jacobi spectrum, not
    rounding. In float64, sub-cycled groups and with a predictor both
    statements are held (the second against the monolithic reference's exact
    solve, under IQN-ILS and Jacobi); in 16-bit floats, vmap, multi-rate
    graphs and after a checkpoint restart, the first. A checkpoint restart
    runs on the structures without their typed PRNG key leaves, which
    save_state cannot write (MADD-ANO-171). Not claimed for mixed dtypes,
    run_adaptive or sharded graphs.
  oracle: bit-identity; the exact float64 fixed point and the operator norm of (I - M)^-1.
  tests:
    - tests/property/test_coupling_invariances.py::test_an_identity_relay_moves_no_bit_under_a_gauss_seidel_constant_iterator
    - tests/property/test_coupling_invariances.py::test_an_identity_relay_moves_the_fixed_point_only_by_rounding
