# The precision floor
# ---------------------------------------------------------------------------

- id: CPL-100
  area: precision floor
  claim: >-
    The floor is "PRECISION_FLOOR_ULPS = 4 units of eps * max|field| in every
    entry the norm reads, per evaluation, in the norm's units -- 4 m eps
    sqrt(n) under "l2" over its n entries, 4 m eps / rtol under "mixed" and
    "interface" ... every entry at the eps of the coarsest floating dtype
    among the group's fields"; 0.0 when the norm reads no active field;
    traceable.
  sources:
    - docs/developer_guide/coupling_algorithm_guide.md#a-stalled-float32-iterate-reads-convergedtrue
    - src/maddening/core/coupling/acceleration.py:1033 (residual_precision_floor)
    - src/maddening/core/coupling/acceleration.py::_group_coarsest_eps
  conditions: >-
    every norm; mixed dtypes; computed in at least float32 whatever the
    fields' dtypes (MADD-ANO-186).  The eps of every value entry is that of the coarsest floating dtype
    among the fields of the group's members that hold entries AND what
    every internal edge of the group delivers after its mapping and its
    transform (a transform that narrows, lambda v: v.astype(float32)
    between float64 members, is counted under all three norms and both
    schedules; before it was, such a pair stalled with residual 0.0 and
    read its bound at 5e-8 to 1e-7 of the distance with both flags set);
    a non-floating delivery and one with no entries do not enter.  NOT
    COUNTED, and outside this claim: a narrowing INSIDE a member's update
    (a cast down and back), which nothing outside the node can see, and an
    internal edge whose source is not a state field (a boundary flux; a
    narrowing transform on such an edge left spectral_usable True beside a
    bound 5.6e-8 to 7.5e-8 of the distance, MADD-ANO-259, open, pinned as
    it stands in
    tests/core/test_what_the_float_floor_does_not_count_on_an_edge.py):
    a field computed from a coarser member's
    output carries its rounding, and with each field at its own eps a
    float64 field of n values downstream of one float32 value diluted the
    floor by sqrt(1 + n) and the bound read 0.92x (n = 1e3) and 0.21x
    (n = 2e4) the distance with the flags set, under every norm (0.37x and
    0.36x for a float16 and a bfloat16 value beside 2e4 float32 ones).
    A position is exempt and keeps its own dtype's eps: a geometry field
    an internal edge anchors a geometry-dependent mapping at (the l2 and
    the mixed norm), a position part read in kernel lengths (the interface
    norm), and the rounding eps r of the positions a value was
    delivered through (r as below); a stored float64 position has float64 resolution,
    and counted at a float32 member's eps float64 positions tens of
    spacings from zero read precision_limited=True on a floor of hundreds
    of tolerances with the iterate within a thousandth of one of its fixed
    point.  The corner this leaves: a float64 position that a member sets
    within the pass purely from float32 data is counted finer than it is;
    on a pair of three such markers stalled at the float32 floor the bound
    held by 575x and more (a characterisation of one pair, pinned in the
    slow lane; the pair solves positions, so in 0.4.0 its report carries
    no flag, MADD-ANO-252).  A geometry field anchored only by an
    edge from outside the group takes the coarsest eps.
    The rule assumes any field of the group may be downstream of its
    coarsest member, that a node's own arithmetic is no coarser than the
    fields it reads and writes, and that an input from outside the group
    is a constant of the solve; it only raises a floor, and a group of one
    dtype has the floor it had, to the bit.  `residual_precision_floor`
    called under "interface" with no member named keeps each reading at
    the coarser of its own dtype's eps and its source field's, and no
    finer than the coarsest floating dtype the edges it was handed deliver
    through a mapping or a transform.  Under
    "interface" the entries are what that norm reads on each internal edge
    (CPL-188): what the edge delivers (its mapping, with the weights passed
    as `mappings`, then its transform), never finer than its source field
    (MADD-ANO-211), or the source field itself, with the dead band asked
    of it, where a static mapping delivers more entries than the source
    holds.  The unit of a
    delivered entry is its own field's largest magnitude: a value an edge
    delivers as a difference of entries of one field rounds at the
    entries' magnitude, and the exact residual of a stalled pair read 5.7
    and 45 floors above a reported 0.0 at fields 100 and 1000 times the
    difference, under either schedule (MADD-ANO-247, open; pinned as a
    strict xfail).  A value delivered through a multilinear_grid mapping
    (experimental; MAP-050) also counts the rounding of the positions it
    depends on, eps r with r the larger of a position's distance from the
    coordinates' zero and of its lattice coordinate (its distance from
    the grid's first point, which the kernel forms in the positions'
    dtype), in grid spacings and over the coordinates the kernel reads;
    counted from zero alone, float32 markers near zero on a grid whose
    first point is 8000 spacings away read a floor of 0.26 to 0.50 with
    the state 2 to 20 tolerances off (MAP-050).  The report of such a
    group under the interface norm counts that floor with the pass's
    structural evaluation count, with diagnostics on or off (MAP-048).
    The count assumes a field that varies across a cell by about the size of the
    value delivered: a gather that samples a field near its zero is the
    same anomaly entered through the positions (the exact residual of the
    returned float32 state 6.3 and 22.5 tolerances beside 0.35 and 0.49
    reported and a floor of 0.78, 100 spacings from zero; pinned as a
    strict xfail with its controls).
    A group with a geometry edge (experimental; MAP-036: multilinear_grid
    mappings, one rate, the l2 or the mixed norm): the floor is the
    members' state's, each position field at its own dtype's eps, with
    the measured gain of a read through the gather or the scatter in the
    evaluation count.  That gain is taken against the positions' own
    magnitude, so under these two norms the count a step measures with
    diagnostics=True grows with the positions' distance from the
    coordinates' zero (2, 15, 147, 468 and 3269 at 0, 100, 1e3, 5e3 and
    2e4 spacings on one pair): float64 positions beside float32 values
    read a floor of 0.091 ("mixed") and 0.64 ("l2") tolerances without
    diagnostics and 0.71 to 1140 and 4.9 to 7980 with them, with
    precision_limited True on groups 0.25 to 0.64 tolerances from their
    fixed point; it is also what covers float32 positions there (2.5 to
    74 tolerances off at 2e4 spacings), and on the 60 rows measured no
    bound is below the distance.  Not changed in 0.4.0 (the interface
    norm's report, which already counts a position in spacings, does not
    take that count: MAP-048).  The exact residual of the returned float32 state is
    held to the reported one plus the floor against the float64 reference
    on the draws of the geometry search, whose fields are of one sign
    scale across a cell.  A gather that samples a field changing sign
    across a lattice cell under Gauss-Seidel is outside it: the sample is
    a difference of two entries of one field, the gain measured along
    the source's own state does not see its cancellation, and the bound
    read 0.14x the true distance with the flag set at an amplitude of
    3000 on the audited graph, and 0.57x at 1000 on the search's pair
    (MADD-ANO-212, open; the second is pinned as a strict xfail in the
    slow lane).  Jacobi holds there.
    The floor counts evaluations and not a mapped edge's own row sum
    (MADD-ANO-257, open): behind a row of more than ten entries it can be
    too small in every static mapping kind, by the row's (k - 1) / 2 eps
    at most, and the report withdraws spectral_usable there for every
    such kind.
  oracle: closed form.
  tests:
    - 'tests/property/test_coupling_geometry_search.py::test_a_reported_number_of_a_group_with_a_geometry_edge_holds_against_the_reference_per_push'
    - tests/core/test_coupling_interface_reading_is_what_the_edge_delivers.py::test_the_floor_of_a_mapped_edge_counts_what_it_delivers
    - tests/core/test_coupling_interface_reading_is_what_the_edge_delivers.py::test_a_delivered_value_is_no_finer_than_the_field_it_was_computed_from
