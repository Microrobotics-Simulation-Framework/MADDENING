    42 passes where the unscaled run took 45, and "fixed" and IQN-IMVJ
    returned a different state, because the accelerators subtracted the
    iterates before any rescaling and a subnormal difference flushed.  The
    accelerators now work in a power-of-two frame fixed for the solve and
