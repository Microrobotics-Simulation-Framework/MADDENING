- id: CPL-140
  area: ift gradients
  claim: >-
    "x_star differentiates via the implicit function theorem:
    dx*/d(consts) = (I - dF/dx)^{-1} dF/d(consts) evaluated at the fixed
    point"; the adjoint is the sensitivity of the fixed point, not of the
    truncated iterate, and differs from a finite difference of the forward
    by about the residual times cond(I - dF/dx).
  sources:
    - src/maddening/core/graph_manager.py:1738 (_ift_solve_impl)
    - src/maddening/core/graph_manager.py:1763 (_ift_solve_impl)
  conditions: solver="ift", a converged forward.
  oracle: the analytic gradient of linear groups; finite differences of the converged fixed point.
  tests:
