- id: CPL-191
  area: criterion
  claim: >-
    Under convergence_norm="interface" a solve returns a field the norm
    measures whole -- "the source field of an internal edge that delivers
    it as it is, with no mapping and no transform" -- as the accepted
    iterate holds it, bit for bit, and every other floating field of every
    member as "one plain pass of the group's own schedule computes [it] at
    the accepted iterate", whatever the schedule, the acceleration, the
    solver and the verdict.  The report (iterations, residual, converged,
    the bounds) is of the accepted iterate, and no iterate, residual or
    pass count moves.  The state returned is not an iterate of the loop:
    its readings differ from the accepted iterate's only on the edges whose
    source field was recomputed, there by that edge's own term of the
    reported residual, so they are within the reported residual of the
    accepted iterate's, in the residual's own weights.
  sources:
    - src/maddening/core/coupling/group.py::CouplingGroup (convergence_norm)
    - src/maddening/core/coupling/_group_layout.py::_fields_the_interface_norm_misses
    - src/maddening/core/coupling/_coupled_block.py::_run_coupled_block_impl (_with_nonfloat_fields_at)
  conditions: >-
    Three costs.  (1) Where a recomputed field is read (through a mapping
    or a transform) the report is not of the state returned: that state's
    own residual was measured up to 4.5 times the reported one, and above
    the threshold beside converged=True in 1 of 48 converged float32 draws;
    the spectral bound holds of the state returned, in the norm taken at
    it, as (bound + residual) / (1 - rtol * residual * sqrt(N)), N the
    entries the norm pools (CPL-088), and the gradient bound as it is
    (CPL-093).
    (2) A recomputed field is sometimes further from the fixed point than
    the value the accepted iterate held: 27 of 375 recomputed fields by
    more than 1.25 times (289 converged float32 draws of linear relay
    groups, jaxlib 0.11.0), one of them ending above a tolerance (1.06 to
    2.07), never by more than about one tolerance in a converged solve,
    and about three times as often where the plain pass expands (15 of 87
    fields at a gain of 1.5 under an acceleration; 12 of 228 in
    contractive loops).  (3) An identity-mapped group recomputes its field
    too and equals its unmapped twin within the residual, not to the bit
    (to the bit under "l2" and "mixed").  One more evaluation of the pass
    per solve where a field is recomputed; none in a group whose every
    floating field is measured whole, whose compiled step is the one it
    was.  A static mapping onto more entries than its source holds is read
    at its source (CPL-188): its source field is measured whole and kept,
    and a pair whose two mapped edges both expand recomputes nothing (held
    on compiled pairs of each kind against the reference's own loop, and
    by the three-step relay twin).  A diverged (non-finite) accepted iterate is returned as the loop
    left it; a recomputed field that is not finite makes the residual inf
    and strict_convergence raise.  max_iterations=1 returns its single pass
    as it is.  Tested on groups whose members are linear in what they
    read: both schedules, both solvers, every acceleration, converged and
    at a cap; float32 and float64; jvp and grad of a recomputed field
    through the jitted step; three steps; a sub-cycled member (the
    composition, against the library's own pass).  Not claimed for mixed
    dtypes, 16-bit floats, vmap, multi-rate graphs, predictors and warm
    starts, run_adaptive, a checkpoint restart or sharded graphs.
  oracle: >-
    the accepted iterate, read from the same library with the return rule
    switched off; a float64 closed form of one pass at it, of the interface
    norm and of the fixed point; on the exact model, x + P (F(x) - x) and
    the identity y - Phi(y) = -[(I - L) - (I - M) P] (F(x) - x).
  tests:
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_the_solve_returns_the_accepted_iterate_with_its_unmeasured_fields_from_one_pass
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_the_return_rule_holds_under_every_schedule_solver_acceleration_and_verdict
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_the_rule_costs_one_evaluation_of_the_pass_and_only_where_it_recomputes
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_a_cap_of_one_returns_its_one_pass_as_it_is
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_a_recomputed_field_that_is_not_finite_is_in_the_verdict
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_strict_convergence_names_a_recomputed_field_that_is_not_finite
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_a_one_way_group_under_jacobi_returns_its_target_at_the_source_it_returns
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_the_part_of_a_field_its_edge_does_not_deliver_is_not_left_a_pass_behind
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_every_step_of_a_trajectory_ends_at_its_own_fixed_point
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_a_field_one_edge_delivers_whole_is_not_named_for_another_that_maps_it
    - tests/property/test_converged_groups_are_at_their_fixed_point.py::test_on_the_exact_model_the_returned_state_reads_within_the_residual_of_its_iterate
    - tests/property/test_converged_groups_are_at_their_fixed_point.py::test_the_library_returns_the_models_state_for_the_iterate_it_accepted_per_push
    - tests/property/test_converged_groups_are_at_their_fixed_point.py::test_a_converged_group_is_at_its_fixed_point_per_push
    - tests/property/test_converged_groups_are_at_their_fixed_point.py::test_a_converged_group_is_at_its_fixed_point
    - tests/core/test_coupling_diagnostics_leave_the_state_alone.py::test_diagnostics_leave_the_returned_state_bit_identical
    - tests/core/test_coupling_fixture_invariants.py::test_every_configuration_reaches_the_same_fixed_point
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_the_set_is_the_same_from_the_groups_plan_as_from_its_bare_edges
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_the_set_follows_the_plans_answer_on_which_edge_reads_its_source_as_it_is
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_which_fields_are_floating_is_decided_on_the_state_handed_not_on_the_plans
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_at_an_early_exit_every_returned_field_carries_the_accepted_iterates_implicit_derivative
    - tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_under_the_unrolled_solver_a_returned_field_has_the_derivative_of_its_value
    - tests/property/test_coupling_targeted_search.py::test_the_state_returned_under_the_interface_norm_holds_to_its_report_per_push
    - tests/property/test_coupling_targeted_search.py::test_a_recomputed_reading_near_zero_needs_the_drift_of_its_own_magnitude
  status: verified
  notes: >-
    Until 0.4.0 the solve returned the accepted iterate as it was, and the
    norm answered only for what it measured: a one-way pair under Jacobi
    returned its target computed from the pre-step source, converged=True,
    iterations=1, residual 0 (MADD-ANO-240), the part of a field a mapping
    does not deliver was a pass behind or a blend of passes
    (MADD-ANO-241), both 0.1.0 to 0.3.1, and the ten iqn-* / interface
    rows of the coupling sweep disagreed with plain iteration by up to
    2.25 in a field no edge reads (recorded under MADD-ANO-005; CPL-174).
    Recomputing every floating field (the measured ones too) was measured
    and not taken: it changes the one kind of group that was never wrong
    and loses by the plain gain where the pass expands.  Keeping the
    accepted value in the members a Gauss-Seidel sweep feeds forward with
    no acceleration would save the pass there (the ten fields on which the
    two differed were within 0.65 tolerance either way): a possible later
    optimisation, not taken for the sake of one rule.  The set is defined
    in one function and must follow the norm's reading rule: a later stage
    that reads a static mapping on its compact side makes that source
    field measured whole.
  domains:
    f32: tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_the_solve_returns_the_accepted_iterate_with_its_unmeasured_fields_from_one_pass
    f64: tests/core/test_coupling_interface_norm_answers_for_the_state_it_returns.py::test_the_return_rule_holds_in_float64
