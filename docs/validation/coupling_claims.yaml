- id: CPL-193
  area: edges
  claim: >-
    An edge's "source and target may be the same node, and where the node
    is decides which of its own values such an edge reads.  Outside a
    coupling group it is a back edge: the node reads its state of the
    previous step, so the term the edge carries is explicit (dx/dt = -k x
    through the edge steps as x (1 - k dt)).  With the node in a coupling
    group (... a group of that one node is enough) the edge is iterated
    with the group and at convergence the node reads its new value, so the
    term is implicit (x / (1 + k dt)).  Nothing else decides it.
    validate() says which in an INFO: line for the edge and format_graph()
    beside the edge; compile() raises no warning for it."
  sources:
    - src/maddening/core/graph_manager.py::GraphManager.add_edge
    - src/maddening/core/graph_manager.py::GraphManager.validate
    - src/maddening/core/_graph_specs.py::_self_edge_message
    - src/maddening/core/graph_manager.py::GraphManager.add_coupling_group
    - src/maddening/core/coupling/group.py::CouplingGroup (nodes)
    - docs/user_guide/quickstart.md#an-edge-from-a-node-to-itself
    - docs/developer_guide/coupling_algorithm_guide.md#an-edge-from-a-node-to-itself
  conditions: >-
    The edge's source is a state field, and the term it carries is linear
    in the value read: dx/dt = -k x alone, and beside a neighbour joined by
    no edge, one edge either way or both, with the neighbour in no group,
    its own or the node's, in either build order (40 graphs); an additive
    edge to itself beside another edge into the same input, in either
    order.  Groups of the node alone and of two nodes; Gauss-Seidel and
    Jacobi, solver ift and fori, every acceleration, the l2, mixed and
    interface norms, a quadratic predictor; float32 and float64; one step
    and three by run_scan; jax.grad in the start value and in the rate; a
    multi-rate graph (rate divider 2, in no group and in a group of
    itself); run_adaptive, each step it tries.  "At convergence" is part
    of the claim: max_iterations=1 returns the explicit value, a cap of n
    returns the first n corrections of 1 - k dt + (k dt)^2 - ..., and the
    plain iteration converges only for |k dt| < 1 (aitken and iqn-ils
    reach 1 / (1 + k dt) at k dt = 1.5; a cap that was reached is in the
    diagnostics or raised by strict_convergence, as for any group).  A
    sub-cycled member reads the group's iterate at every sub-step, so its
    term is implicit over the group's step and not its own sub-step, under
    each boundary_interpolation (MADD-ANO-027).  An edge from the node's
    own boundary flux is iterated inside a group; outside one it cannot be
    read (CPL-186, MADD-ANO-157), and validate()'s line for it says that
    and not that it reads the previous step.  auto_couple() groups loops
    of two or more nodes and leaves the edge explicit.  validate() gives
    one INFO: line for each edge from a node to itself, in the order the
    edges were added and after its lines for loops of two or more nodes:
    the edge, the node and add_edge's sentence for where the node is, with
    the group's members when it is in one; an edge whose source field does
    not exist has its ERROR and no such line.  The line for an edge
    outside a group is also logged at INFO, as a staggered loop's is.  A
    graph whose only lines are these compiles and steps with warnings
    turned into errors, and POST /graph/validate returns the lines as they
    are.  The line validate() gives a loop of two or more nodes that a
    coupling group iterates names that group's iteration_mode (it named
    Gauss-Seidel for a Jacobi group in every release to 0.3.1).  Not
    tested: an interface
    mapping or a geometry on the edge, waveform_iterations above one, a
    term nonlinear in the value read.  Not claimed for mixed dtypes,
    16-bit floats, vmap, a checkpoint restart or sharded graphs.
  oracle: >-
    float64 closed forms: x (1 - k dt) and x / (1 + k dt), their powers
    over several steps and their derivatives in x and in the rate; the
    partial sums of the series at a cap; for the two-node graphs the
    linear system the documented rule gives (an edge is read at the new
    level when its two ends are members of one group or its source runs
    earlier in the step, at the previous step's otherwise), with the
    self-edge's level decided by its node's group alone; on two shipped
    nodes, the bounce and the stretch each reading implies.
  tests:
