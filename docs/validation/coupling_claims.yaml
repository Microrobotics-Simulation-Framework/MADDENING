- id: CPL-188
  area: norms
  claim: >-
    convergence_norm="interface" reads a mapped internal edge on its compact
    side: "an internal edge whose static mapping delivers more entries than
    its source field holds ... is read at its source value: the field
    itself, before the mapping and so before the transform ...  A mapping
    onto fewer entries (a gather), a tie (as many entries delivered as read)
    and an edge with no mapping are read as delivered.  The side is decided
    in one place, from the two sizes the mapping declares ..., and the
    residual, the float floor and its eps, the spectral analysis and its
    weights, the bounds and the report all read through it."  Where an edge
    is read as delivered through a mapping, the value "depends on the mapping
    weights the step ran with (params["mappings"], which a caller may
    override for one step): the step measures that group's floor itself and
    the report reads it, so a params override, or an edit of the weights
    since, does not move it either."
  sources:
    - docs/developer_guide/coupling_algorithm_guide.md#spectral_error_bound-the-spectrum-measured
    - src/maddening/core/coupling/_interface_plan.py::_norm_side
    - src/maddening/core/coupling/_interface_plan.py::InterfaceEdge.reading
    - src/maddening/core/coupling/acceleration.py::_interface_readings
    - src/maddening/core/graph_manager.py::GraphManager.coupling_diagnostics (spectral_error_bound)
    - src/maddening/core/coupling/_group_layout.py::_reads_mapping_weights
    - docs/developer_guide/coupling_algorithm_guide.md#a-stalled-float32-iterate-reads-convergedtrue
  conditions: >-
    With atol > 0 the dead band of an edge read at its source is asked of the
    source field and of what the edge delivers (CPL-041); the group then
    records its floor in the step.
    convergence_norm="interface"; static mappings: the dense kind, the
    sparse kind in its padded-gather and in its scatter layout, and a
    mapping class of the caller's own, the side taken from n_source and
    n_target (or field_shapes()) and never from the shape of the weights; a
    geometry-dependent mapping inside the group is read by the same rule
    with its positions where it is a multilinear_grid (MAP-050) and
    refused at compile otherwise (MAP-033).  Exercised edge by edge, on
    every one of those forms:
    expanding, reducing and tied, with and without an edge transform, in
    float32 and float64 (the residual to the bit against a plain edge over
    the prescribed reading; the floor's dead band on the cells where the
    other side gives another number; the floor's eps at the coarsest dtype
    the pass goes through, a narrowing transform's included, whichever side
    is read, CPL-100).  Exercised on
    compiled pairs against the exact reference of each rule (residual, pass
    count and verdict of the plain iteration): the dense kind and both
    sparse layouts, gather, scatter and both, a tie, an offset transform,
    Gauss-Seidel and Jacobi, float32 and float64; a hub whose one field a
    gather edge and a scatter edge both read; Aitken, fixed relaxation,
    IQN-ILS and IQN-IMVJ only through the converged distance (CPL-192).
    The source field of an edge read at its source is measured whole, so
    the state a solve returns keeps it as the accepted iterate holds it
    (the return rule, CPL-191).
    Only a group with an edge read through its mapping, whose source field
    is floating, owns the `_meta` slot coupling_<key>_reading_floor (the
    floor per evaluation, NaN until a step has written it, restarted with
    the group's other report slots); a group whose mapped edges are all
    read at their source has no slot, and its floor, as every other
    group's, is taken from the returned state alone, which the graph keeps
    across a later state write (CPL-189).  A state whose slot was never
    written (a checkpoint from before the slot existed) is read with the
    graph's own weights; a checkpoint that carries the slot of a group that
    does not own it (a development tree before this rule wrote one for
    every mapped group) loads with a RuntimeWarning naming the slot, which
    is dropped.  The source-side reading is exercised in every domain
    below, on pairs of three values against thirty-six (6 against 600 and
    20 against 2000 in the slow lane): two ways with the small field on
    either member (so on the member a domain sub-steps, shards or holds in
    float64 beside a float32 one), both edges expanding, both reducing,
    the mapping forms and both schedules rotated over them.  Each against
    the exact reference of the compact rule (residual, verdict, pass
    count, the fields read at their source), against its marker-side twin
    (state, report and _meta: to the bit wherever the two steps are one
    program, to float32 rounding in the mixed-dtype domain), and for the
    slot's owner and its number.  In bfloat16 and float16 at a cap of two
    passes: the residual of the iterate the loop holds, and the twin.
    Under vmap each member of the batch against its own unbatched solve;
    on a multi-rate graph the base step on which the group does not fire
    leaves report, slot and members as they were; a sub-cycled pair is the
    pair at one rate to the bit (memoryless members: the reading is taken
    once per pass, the fast member's field after its sub-steps); under a
    predictor the pass count is that of the guess; after a checkpoint
    restart the report, the slot or its absence and the next step are the
    uninterrupted run's.  Under run_adaptive without the pass count (the
    reported solve is its last half step's), and the residual restated on
    a graph stepped with the return rule switched off: the state returned
    is the accepted iterate with the gather's source one plain pass on
    (CPL-191) and does not determine it.  In the mixed-dtype domain the
    twin's plain edge casts, so the twin recomputes the small field the
    pair keeps: the pair's is compared with the iterate the twin accepted,
    to the same bound.  With a sharded member: two
    ways through the dense kind.  The tie's cells are kept beside them.
  oracle: >-
    the residual of a plain edge over the prescribed reading, to the bit;
    the float64 reference of either rule on the compact system
    (tests/property/interface_side_graphs.py), under which the other rule
    must fail; residual_precision_floor of the returned state under the
    step's weights; the documented bound formula on the reported slots.
  tests:
    - tests/core/test_coupling_interface_reading_is_what_the_edge_delivers.py::test_the_reports_floor_is_taken_with_the_weights_the_step_ran_with
    - tests/core/test_coupling_interface_reading_is_what_the_edge_delivers.py::test_the_recorded_floor_times_the_count_is_the_floor_the_report_adds
    - tests/core/test_coupling_interface_reading_is_what_the_edge_delivers.py::test_only_a_group_whose_norm_reads_a_mapped_edge_records_its_floor
    - tests/core/test_coupling_interface_reading_is_what_the_edge_delivers.py::test_a_replaced_group_does_not_inherit_the_recorded_floor
