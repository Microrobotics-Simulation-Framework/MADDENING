  - anomaly_id: "MADD-ANO-019"
    title: "A coupling iteration that diverged to a non-finite state was reported residual=0.0, converged=True"
    description: >
      Every 0.4.0 convergence norm (`l2`, `mixed`, `interface`) divides a
      field's change by the field's own magnitude (`_field_reference`,
      `max |v|` over both iterates) and drops a field whose magnitude does
      not exceed the dead band `atol` (`_scaled_change` in
      `core/coupling/acceleration.py`).  A field with a `NaN` or `inf`
      entry has a non-finite reference, and `NaN > atol` is False, so the
      dead band marked it *inactive*: it contributed exactly zero to the
      norm rather than a non-finite value.  A group whose only moving
      field had just diverged therefore measured `residual=0.0`, met every
      criterion, and returned the destroyed state as converged.
      Measured at 0.4.0.dev0 (this machine, jaxlib 0.11.0, CPU, float32)
      on a two-node relay with cycle eigenvalues `(-0.95, 0.3)` under
      `acceleration="fixed", relaxation=1.5` (relaxed operator eigenvalue
      -1.925: the iterate doubles every pass and leaves float32 range after
      about 136), `max_iterations=400`, `diagnostics=True`, a fresh graph
      per measurement, driven through `gm.step()`.  All six solver x norm
      combinations reported `residual=0.0, converged=True`.  `mixed` and
      `interface`, both solvers: 139 iterations, returned state `NaN`.
      `l2`, both solvers: 136 iterations, returned state *finite* at
      `-1.2185e38` (the fixed point is 0.51), and `ratio_usable=True` as
      well.  `strict_convergence=True` did not raise on any norm.
      `run_scan(3)` on a fresh graph reported `iterations=1, residual=0.0,
      converged=True` on every step after the first.
      The `l2` rows are a second mechanism, one pass before the first.
      Under the L2 norm the scale is the bare reference (`rtol=1.0`), and
      at `1.22e38` its float32 reciprocal is subnormal (`8.2e-39`, below
      `1.18e-38`).  XLA's CPU backend lowers the broadcast divide
      `|dx| / scale` to a multiply by that reciprocal and flushes it to
      zero, so a field that had moved by 1.95 times its own magnitude
      read as a change of exactly `0.0` (`jnp.asarray([2.38e38, 0.]) /
      jnp.float32(1.22e38)` is `[0., 0.]` while the scalar quotient is
      `1.95`).  The norm reported `0.0` on a finite state and the loop
      returned it.
      Neither mechanism exists before 0.4.0.  At v0.3.1 the L2 norm was
      the unscaled `||dx||` and the mixed norm's scale was `atol + rtol
      * max(|v|)` with no dead band; the same reproducer against an
      extracted v0.3.1 tree reports `residual=nan` at the cap on all six
      combinations, and v0.3.1's `coupling_diagnostics()` has no
      `converged` key to mislead.  The defect was introduced by 0.4.0's
      move to a reference-scaled criterion with an exclusion dead band
      (MADD-ANO-005's resolution) and resolved within the same release.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `major` because it is a silent wrong answer on a documented
      public path: `converged=True` and `residual=0.0` are the two numbers
      `coupling_diagnostics()` documents as the evidence that a coupled
      step is trustworthy, and both were produced on a state the
      iteration had just destroyed.  `strict_convergence=True`, the
      documented guard for training and calibration runs, passed the
      same state through, so the one setting a careful user would reach
      for did not help.  Under the L2 norm the returned state was finite,
      so nothing downstream would raise on it either; a `NaN` propagates
      and is eventually noticed, but `-1.2e38` in a field whose fixed
      point is `0.51` is a plausible-looking number in the wrong units.
      Not `critical`: the trigger is an iteration that diverges, which is
      a misconfiguration (over-relaxation past the spectral limit here)
      rather than a state a well-posed group reaches, the `mixed` and
      `interface` returns are `NaN` and so are not silent for long, and
      the fix is a two-line rule in one helper.
      Graded `context_dependent` rather than `safety_relevant` because
      MADDENING is a general simulation library and the defect needs a
      diverging coupled iteration to bite, which is a property of the
      user's group configuration.  What raises it above
      `not_safety_relevant` is the shape: a divergence is exactly the
      event a convergence flag exists to report, and the flag reported
      its opposite with the most confident value it has.  A caller whose
      analysis depends on `converged=True` meaning what the docstring
      says could not establish from anything the library returned that a
      diverged step had happened.
    affected_components:
      - "maddening.core.coupling.acceleration._scaled_change"
      - "maddening.core.coupling.acceleration.coupling_residual_l2"
      - "maddening.core.coupling.acceleration.coupling_residual_mixed"
      - "maddening.core.coupling.acceleration.coupling_residual_interface"
      - "maddening.core.graph_manager.GraphManager.coupling_diagnostics"
    affected_versions: "none"
    workaround: >
      None needed from 0.4.0.  On a 0.4.0.dev0 build before the fix:
      check the returned state for finiteness yourself
      (`jnp.isfinite(gm.get_node_state(n)[f]).all()` for every coupled
      field) after each step, treating `converged=True` with
      `residual=0.0` on the first pass as suspect rather than as proof;
      under the L2 norm additionally check that no coupled field exceeds
      about `1e37` in float32.  Keeping `relaxation` at or below the
      group's spectral limit (`relaxation < 2 / (1 - lambda_min)` for
      the most negative cycle eigenvalue) avoids the divergence that
      triggers it, but does not make the flag honest about one that
      happens for another reason.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Resolved in `_scaled_change`, the one helper all three norms and
      both solvers are built on: a field whose reference is non-finite,
      or whose scale's reciprocal is not a normal number of the field's
      dtype (`scale * finfo.tiny > 1`), is *active* and contributes
      `inf` to every entry.  The norm is then `inf`, `converged` is
      False, `error_amplification` rejects the ratio (`ratio_usable`
      False, `error_estimate` inf), and `strict_convergence` raises with
      a new first check whose message names the non-finite state; the
      pre-existing `without converging` check is made exclusive of it so
      exactly one message fires.  Measured after the fix on the same
      reproducer: all six combinations run to the cap (`iterations=400`)
      and report `residual=inf, converged=False, ratio_usable=False` on a
      `NaN` state; `strict_convergence=True` raises on every norm;
      `run_scan(3)` reports the same verdict.  Finite in-range fields
      take the selected branch of a `where`, so their values, gradients
      and iteration counts are unchanged: the 27 existing coupling and
      graph-manager test modules, the 438 recorded coupling verdicts and
      the `expensive-pair` fixture baseline pass without modification,
      and a field that is exactly zero still leaves the dead band as
      before.
      What remains, and why it is a boundary rather than an instance.
      (1) The range rule is deliberately conservative: a float32 field
      whose magnitude is within a factor of about four of overflow
      (above `8.5e37`) can never read as converged, even if it is
      constant.  No simulation state lives there on purpose, and the
      alternative -- depending on how each backend lowers a divide --
      is what produced the defect.  In float64 the threshold is
      `4.5e307`.  (2) `strict_convergence` is documented as read only
      under `solver="ift"`; under `"fori"` it is inert and warns, as
      before, so a `fori` group reports the divergence through
      `coupling_diagnostics()` only.  (3) The IFT spectral diagnostics'
      per-field weights (`_norm_weights`) still give a non-finite field
      weight zero; the spectral keys are already `NaN` and
      `spectral_usable=False` on such a step, and they describe a
      Jacobian at a state that no longer exists.  (4) The dead band's
      semantics for finite fields are exactly as MADD-ANO-005 left them:
      a field inside `atol` is at zero and leaves the norm; the caller
      still owns that number.  No tagged release carried the defect: it
      was introduced and resolved between 0.3.1 and 0.4.0.
    verification:
      - "tests/core/test_coupling_non_finite_state.py::test_a_non_finite_state_never_reads_as_converged"
      - "tests/core/test_coupling_non_finite_state.py::test_strict_convergence_names_the_non_finite_state"
      - "tests/core/test_coupling_non_finite_state.py::test_run_scan_after_divergence_reports_the_same_verdict"
      - "tests/core/test_coupling_non_finite_state.py::test_a_non_finite_field_is_active_and_contributes_inf"
      - "tests/core/test_coupling_non_finite_state.py::test_a_reference_beyond_the_dtype_range_contributes_inf"
      - "tests/core/test_coupling_non_finite_state.py::test_the_dead_band_still_drops_a_field_that_is_exactly_zero"
      - "tests/core/test_coupling_non_finite_state.py::test_a_finite_field_is_bit_identical_through_the_guard"
      - "tests/core/test_coupling_non_finite_state.py::test_every_norm_reads_a_non_finite_field_as_inf"
    github_issue: null

  - anomaly_id: "MADD-ANO-020"
    title: "LBMNode's Zou-He pressure boundary imposed rho_p + S_K instead of the prescribed density"
    description: >
      `LBMNode` takes `inlet_pressure` and `outlet_pressure` as Zou-He
      pressure (density) boundary conditions on its inlet and outlet faces,
      and `_zou_he_pressure_face` documented that "the prescribed density is
      satisfied".  It was not.  The closure computed the face-normal
      velocity as `u_n = sigma * (1 - (S_T + S_K) / rho_p)`, where Zou and
      He's closure is `sigma * (1 - (S_T + 2 S_K) / rho_p)` (`S_T`: the
      tangential and rest populations; `S_K`: the populations streamed out
      of the interior through the face, which enter the density once and
      the reflected normal momentum once more).  With the factor missing,
      the rebuilt face density is exactly `rho_p + S_K`.  The closure also
      had no transverse-momentum correction, so the face's tangential
      velocity was not the zero a pressure face imposes.
      Measured at 0.4.0.dev0 (this machine, jaxlib 0.11.0, CPU, float32):
      one application from a unit-density rest state imposed p = 0.36 as
      0.4156 (+15.4%) and p = 0.30 as 0.3556 (+18.5%), on both lattices
      (D2Q9, D3Q19) and both faces, the face density matching
      `rho_p + S_K` to four figures.  Through `LBMNode.update` on
      unwalled 16x6 (D2Q9) and 10x4x4 (D3Q19) domains the two faces, asked
      for 0.36 and 0.30, both read 0.4014 after 400 steps: the imposed
      pressure difference was gone.  On the 64x16 walled channel of the
      in-tree Poiseuille test (p_in = 1.01/3, p_out = 1/3, 2000 steps) the face pressures were
      0.40295 and 0.40106 against 0.33667 and 0.33333 imposed -- a drop of
      0.0019 against 0.0033 -- and the centreline velocity was 0.48x the
      Hagen-Poiseuille value for the imposed drop.  On a steady tau = 1
      channel ladder the carried drop was 0.80 (H = 8) and 0.65 (H = 16) of
      the imposed one, getting worse under refinement.
      `compute_boundary_fluxes()["outlet_pressure_avg"]`, the value a
      coupled node reads, reported the same wrong face pressure (0.3556
      for 0.30 after one step), and the sharded `update_padded` calls the
      same closure.  Nothing warned.  The in-tree test that went through
      the pressure boundary (`TestLBMPoiseuille2D`) divided each velocity
      profile by its own maximum before comparing, so it could see the
      shape of the flow and nothing about its magnitude, and every LBM
      verification benchmark (MADD-VER-003, MADD-VER-007) was body-force
      driven.
      Present since the node was added (commit 98e284b, first tagged in
      v0.1.0).  The same reproducer run against `git archive` extractions of
      v0.1.0 and v0.3.1, on the same machine and jaxlib, prints the same
      numbers to every digit shown: 0.4156 and 0.3556 after one step on
      both lattices, 0.4014 on both faces after 400 steps, and the 0.48
      centreline ratio.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `major` because it is a silent wrong answer on a documented
      public path.  The pressure inputs are two of `LBMNode`'s four
      boundary inputs, and a flow driven by them had the wrong pressure at
      the faces, the wrong pressure drop and the wrong flow rate, by tens of
      percent, with nothing raised or warned.  The flow still looked right
      -- parabolic, in the right direction, finite -- which is the dangerous
      shape for a numerical error.  The coupling output inherited the
      error, so a node driven by `outlet_pressure_avg` (a lumped downstream
      model's backpressure, say) was fed the same wrong number.
      Not `critical`, and the case for `critical` is recorded so it can be
      weighed.  For: every pressure-driven use in every release was
      affected, not a corner case or a misconfiguration.  Against: the error
      showed in the node's own output from the first step to anyone who
      compared the face `pressure` with the input (15% apart); `LBMNode` is
      `experimental`, and its recorded verification was body-force driven,
      which the defect does not touch; and it was a wrong physical answer
      in one node, not a crash, a corruption of other state or a security
      exposure.  At the resolution the error is removed rather than
      bounded.
      Graded `context_dependent` rather than `safety_relevant` because
      MADDENING is a general simulation library: the defect matters exactly
      as much as a user's analysis relies on pressure-driven `LBMNode`
      magnitudes (flow rate, pressure drop, wall shear) or on the reported
      outlet pressure, which is a property of that analysis.  What raises
      it above `not_safety_relevant` is that the wrong magnitude was
      plausible and unflagged.
    affected_components:
      - "maddening.nodes.lbm._zou_he_pressure_face"
      - "maddening.nodes.lbm.LBMNode.update"
      - "maddening.nodes.lbm.LBMNode.update_padded"
      - "maddening.nodes.lbm.LBMNode.compute_boundary_fluxes"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      None needed from 0.4.0.  Before 0.4.0 there is no input-side
      correction, because the error depends on the populations at the face
      (`rho_p + S_K`) and so on the flow.  Drive the flow with an equivalent
      `body_force` (`F = dp / L` per unit volume on a periodic domain), which
      does not pass through the pressure boundary; or read the face
      `pressure` back after each step and treat the difference from the
      input as the error it is.  Re-run any pressure-driven `LBMNode`
      result from an earlier release; body-force-driven results are not
      affected.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Resolved in `_zou_he_pressure_face`, which both `update` and
      `update_padded` call.  The closure is derived per face from the
      density and normal-momentum moments, `u_n = sigma * (1 - (S_T + 2 S_K)
      / rho_p)`, and each incoming population is the non-equilibrium
      bounce-back of its opposite plus a transverse-momentum correction
      (Zou and He 1997 for D2Q9; Hecht and Harting 2010 for D3Q19), so the
      face carries exactly the prescribed density and zero tangential
      velocity.  The four lattice identities it rests on are checked by
      `_zou_he_face_closure` at trace time, and a velocity set that fails
      one is refused rather than run.  Measured after the fix on the same
      reproducer: 0.3600 and 0.3000 after one step and after 400, on both
      lattices; the 64x16 channel's face pressures equal the imposed ones;
      `outlet_pressure_avg` returns the imposed outlet pressure.
      MADD-VER-016 now drives the node by pressure alone: the face-to-face
      drop matches to float32 rounding, the mid-channel gradient is dp/L to
      0.91% (H = 8) and 0.18% (H = 16), the profile matches the equivalent
      body-force flow to 0.21%, and the centreline velocity's first-order
      extrapolation from H = 8, 16 is Hagen-Poiseuille to 1e-4 (1.0001;
      0.396 before the fix).
      What remains, and why it is not this defect.  (1) Results change for
      every pressure-driven caller: that is the fix.  (2) At finite
      resolution a pressure-driven channel is still faster than
      Hagen-Poiseuille for the nominal width (+20.7% at H = 8, +10.4% at
      16): the node's bounce-back walls, which collide as well as reflect,
      put the hydrodynamic wall about 0.1 lattice units from the wall node
      rather than mid-link.  That is the walls' documented first order, the
      same under body-force driving, and is now stated in the node's
      limitations and algorithm guide.  (3) A pressure face reflects
      acoustic waves, so a pressure-driven flow settles more slowly than
      its viscous time.  (4) `update_padded` is correct only while the
      inlet/outlet axis is not sharded, as before.  Separately, in the same
      change, `outlet_pressure_avg` averages over the runtime wall mask
      that `update` applies rather than the constructor's.
    verification:
      - "tests/verification/test_lbm_pressure_poiseuille.py::test_pressure_driven_poiseuille_converges_to_hagen_poiseuille"
