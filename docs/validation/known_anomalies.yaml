  - anomaly_id: "MADD-ANO-074"
    title: "The adaptive steppers' error norm read integer and boolean state leaves: a bool raised, a uint32 wrapped and a counter moved the step sequence"
    description: >
      `run_adaptive` and `run_adaptive_scan` estimate the local error by
      step doubling, as the RMS over every element of
      `|fine - coarse| / (atol + rtol max(|fine|, |coarse|))`, and
      `_tree_error_norm` took it over every leaf of the user state.  A
      `bool` cannot be subtracted, so a graph holding one raised
      `TypeError` in both steppers.  A `uint32` difference wraps modulo
      2**32, so an unread tag read as an error of order one: on a single
      explicit-Euler node with a linear-congruential tag,
      `run_adaptive(2.0, dt_initial=0.25, atol=rtol=1e-4, dt_min=1e-3)`
      accepted 2001 steps at `dt_min`, each with its "hit dt_min" warning,
      where the same node without the tag took 60, and
      `run_adaptive_scan(2.0, max_steps=300)` stopped at t = 0.296 with no
      warning.  An `int32` counter is `k + 2` after the two half steps and
      `k + 1` after the full step by construction, so it added a term and
      an element to the RMS: 50 accepted steps instead of 60 on that node,
      and the state moved with them.  Measured at v0.1.0, v0.2.0, v0.2.1,
      v0.3.0 and v0.3.1 (`git archive` of each tag, CPU, jaxlib 0.11.0) and
      on the 0.4.0 development tree, where the coupling differential
      harness found it on a two-node pair (199,981 rejections in 199,991
      attempts with a tag; 77 accepted steps becoming 65 with a counter).
      Resolved in 0.4.0: the norm reads floating (and complex) leaves only;
      an integer, boolean or PRNG-key leaf adds neither a term nor an
      element, so a graph steps exactly as it would without it, and an
      all-floating state is measured exactly as before.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silently wrong for the integer forms: a counter changed the accepted
      steps and so the trajectory, and a tag made run_adaptive_scan stop at
      a fraction of t_end reporting only a smaller final_t.  Graded `major`
      (a silent wrong result is never `minor`); the bool form was loud.
      Not `critical`: run_adaptive warned on every step it accepted at
      dt_min, and final_t told a reader of run_adaptive_scan where it
      stopped.  `context_dependent` because whether the step sequence
      matters depends on the program.
    affected_components:
      - "maddening.core.graph_manager.GraphManager.run_adaptive"
      - "maddening.core.graph_manager.GraphManager.run_adaptive_scan"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: keep integer, boolean and PRNG-key fields out of graphs
      stepped adaptively (carry a counter as a float field), or step them
      at a fixed dt.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.  A floating field that is the same in both estimates
      still counts as an element of the RMS, the convention adaptive ODE
      solvers use, so an unread float field still dilutes the norm.
    verification:
      - "tests/property/test_differential_schedules.py::test_a_non_float_leaf_nothing_reads_does_not_change_the_adaptive_steps"
      - "tests/property/test_differential_schedules.py::test_adaptive_stepping_runs_a_graph_with_a_boolean_leaf"
      - "tests/core/test_adaptive_error_norm_reads_floating_leaves_only.py::test_a_non_floating_leaf_adds_neither_a_term_nor_an_element"
    github_issue: null

  - anomaly_id: "MADD-ANO-075"
    title: "Opening a USD stage imported the Python module the stage named for a node, so load_graph_from_usd ran a stage author's code"
    description: >
      From v0.1.0 to v0.3.1 `load_graph_from_usd` resolved each node's class
      from the stage's own `maddening:nodeType` string.  A class not
      registered with `register_node_class` -- anything but the built-ins
      the loader registered itself -- was resolved with
      `importlib.import_module` on the string's module part and then
      instantiated.  So opening a `.usda` ran the import-time code of
      whatever module the stage named, before anything checked what came
      back, and with `sys.path[0]` the running script's directory a stage
      shipped beside a `.py` file was code execution in the reader's
      process.  `GraphManager.from_dict` has always required an explicit
      node registry; the USD reader did not, and nothing in the
      documentation called a stage untrusted.  Reproduced at v0.1.0,
      v0.2.0, v0.2.1, v0.3.0 and v0.3.1 (`git archive` of each tag, CPU,
      jaxlib 0.11.0): a stage naming a module on `sys.path` that writes a
      marker file when imported got the module imported and instantiated,
      and the load failed only afterwards, because the stand-in class is
      not a node.  Found by the params-io audit of 2026-09-19 and described
      in the CHANGELOG and release notes at the time, but not registered
      until the round-3 confirmation audit.
      Resolved in 0.4.0 (10420bc, 2026-09-19): the loader instantiates only
      the built-ins, classes registered with `register_node_class`, and
      classes passed in the new `node_registry=` argument (keyed by
      qualified or by bare class name, as `from_dict`'s registry is).
      Anything else is a `KeyError` naming the class and the three ways to
      allow it.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `major` under the 0.4.0 severity definition
      (`AnomalySeverity`), on the ground MADD-ANO-055 is: an API that
      executes what it is handed while presenting itself as safe for data
      -- a scene-description file, which is what a reader opens from
      someone else -- ran the code of whoever wrote the stage.  Not
      `critical`, because no surface the library opens (no listening
      socket, no HTTP route) loads a USD stage; a program had to call the
      loader on the file itself.  Graded `context_dependent`: whether an
      untrusted party can supply the stage is a property of the program,
      and where one could, the consequence was code execution in the
      simulation's process.
    affected_components:
      - "maddening.usd.serialization.load_graph_from_usd"
      - "maddening.usd.serialization._resolve_node_class"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: open only stages you or a party you trust wrote.
      Otherwise check every `maddening:nodeType` attribute in the stage
      against the classes you expect before loading it, and register those
      classes with `register_node_class` first, since a registered class is
      not imported.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      `allow_import=True` restores the import, for the call that passes it
      only (the imported class is not registered for later loads), and a
      program that passes it must give the loader only stages it trusts.
      A class the caller does allow is instantiated with the stage's own
      parameters, as `from_dict` instantiates one with a config's: the
      loader decides which classes may be built, not what an allowed class
      does with its arguments.
    verification:
      - "tests/usd/test_usd_node_class_trust.py::test_opening_a_stage_does_not_import_the_module_it_names"
      - "tests/usd/test_usd_node_class_trust.py::test_the_refusal_says_exactly_what_to_pass"
    github_issue: null

  - anomaly_id: "MADD-ANO-076"
    title: "The HTTP API checked no Origin, so a web page in the user's browser could drive a loopback-bound server and read its state stream"
    description: >
      From v0.1.0 to v0.3.1 `SimulationServer` sent no CORS headers and
      checked no `Origin`.  A browser sends a cross-origin *simple* request
      -- a `POST` with no body or a `text/plain` one -- without a
      preflight, so any page the user had open could reach every route of a
      server on 127.0.0.1 that takes no body: `/sim/reset`, `/sim/start`,
      `/sim/stop`, `/sim/step`, `/graph/compile`, and `/checkpoint/save` and
      `/checkpoint/load`, whose `?path=` took any server path at those tags
      (MADD-ANO-052).  The page could not read the HTTP replies, but a
      WebSocket handshake is exempt from the same-origin policy, so it could
      open `/ws/state` and read the full simulation state.  Binding to
      loopback, which is MADD-ANO-051's workaround for those versions, did
      not help: the requests come from the user's own browser, so their
      peer is 127.0.0.1.  Checked at each tag, v0.1.0, v0.2.0, v0.2.1,
      v0.3.0 and v0.3.1, on 2026-10-02 (CPU, jaxlib 0.11.0; a FastAPI
      `TestClient` with no credential, an empty `HOME`, and no cloud route
      called): a `text/plain` `POST /sim/reset` carrying `Origin:
      https://evil.example` answered 200, `POST /checkpoint/save` with that
      origin answered 200 and wrote the file, and a `/ws/state` handshake
      with that origin was accepted; at v0.1.0 and v0.3.1 `/sim/step`,
      `/graph/compile` and `/checkpoint/load` answered the same request
      with 200 too.  Found by the second security round of
      the 0.4.0 audit and described in the CHANGELOG, but not registered
      until the round-3 confirmation audit.
      First fixed in 0.4.0 (afddbf8, 2026-09-20): a state-changing
      request or a WebSocket handshake whose `Origin` names neither the
      server itself (its authority compared with the `Host` header) nor an
      origin passed in `SimulationServer(allowed_origins=)` is refused with
      403, failing closed on `null`, on an unparseable origin and on a
      userinfo-prefixed one.  A request with no `Origin` (curl, a script)
      and a cross-origin `GET`, whose reply a page cannot read, are served
      as before.
      That left DNS rebinding.  A page served from
      `http://attacker.example:8000`, whose name the attacker then
      re-points at 127.0.0.1, sends a `Host` and an `Origin` that both name
      its own domain, so it passed the comparison.  On the 0.4.0 tree
      (CPU, `TestClient`, a loopback bind with no token), with `Host` and
      `Origin` both naming `attacker.example:8000`, `POST /sim/reset` and
      `POST /checkpoint/save` answered 200 (the file was written under
      `checkpoint_root`), `GET /graph` answered 200, and a `/ws/state`
      handshake was accepted.  Resolved in 0.4.0 by a `Host` allowlist.
      Where no token is demanded and the peer is a TCP address, a request
      or WebSocket handshake whose `Host` is not `localhost`, a
      `127.0.0.0/8` or `::1` literal (any port), or a name in
      `SimulationServer(allowed_hosts=)` is refused with 403 or a 1008
      close.  That covers every route, `GET` and `/healthz` included, and
      `POST /cloud/launch`.
    severity: "critical"
    safety_relevance: "safety_relevant"
    safety_relevance_rationale: >
      Graded `critical` under the 0.4.0 severity definition
      (`AnomalySeverity`): unauthorised access through HTTP routes the
      library opens -- the author of any web page the user visited changing
      the simulation, writing and loading checkpoints and reading the state
      -- on a surface that the shipped configurations exposed to other
      hosts.  At the tags the cloud container and the server examples bound
      `0.0.0.0` (MADD-ANO-051), and on a loopback bind the browser carried
      other hosts' requests to the port itself.  The definition's note that
      a loopback default is not an exposure to other hosts rests on only
      local users reaching a loopback socket, which is exactly what this
      defect made false.  The rebinding form reached the shipped default
      configuration of the 0.4.0 tree, a loopback bind with no token, until
      the `Host` allowlist.
      Graded `safety_relevant` on the ground MADD-ANO-051 is: the writes
      change what the simulation computes with nothing in the reply or the
      state to show it, a checkpoint loaded into the graph or overwritten on
      disk restores silently, and the state stream discloses everything, on
      a surface the library itself publishes.
    affected_components:
      - "maddening.api.server.SimulationServer.create_app"
      - "maddening.api.server.origin_is_same_site"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: do not leave the API running while a browser on the same
      machine has pages open that you do not trust, or put it behind a
      reverse proxy that refuses a request carrying a foreign `Origin` or a
      `Host` other than the loopback names you reach it by.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The check is skipped for a peer that is not an IP address: an
      in-process client, and a connection over a Unix socket.  A browser
      reaches the API only through a proxy there, and a same-host proxy
      that forwards remote requests to a loopback-bound API is outside the
      loopback trust model in any case (MADD-ANO-051's residual risk); such
      a proxy should check `Host` itself.  A name added with
      `allowed_hosts` is trusted on every port.  Some browsers also block
      or prompt for a public page's requests to a private address; the
      library does not rely on that.  Off loopback the bearer token is
      demanded (MADD-ANO-051), and a rebound page does not hold it.
    verification:
      - "tests/api/test_cross_origin_requests.py::test_a_cross_origin_state_change_is_refused"
      - "tests/api/test_cross_origin_requests.py::test_a_cross_origin_checkpoint_write_never_reaches_the_filesystem"
      - "tests/api/test_cross_origin_requests.py::test_a_cross_origin_page_cannot_open_the_state_stream"
      - "tests/api/test_cross_origin_requests.py::test_the_token_a_non_loopback_bind_demands_refuses_a_rebound_page"
      - "tests/api/test_cross_origin_requests.py::test_a_dns_rebound_page_is_refused_by_its_host"
      - "tests/api/test_cross_origin_requests.py::test_a_dns_rebound_page_cannot_reach_the_cloud_launch_route"
      - "tests/api/test_cross_origin_requests.py::test_a_host_that_is_not_a_loopback_name_fails_closed"
    github_issue: null

  - anomaly_id: "MADD-ANO-077"
    title: "Swapping a surrogate in with replace_node, or out with POST /surrogate/deactivate, re-added each edge without its additive flag and units: an additive coupling became an overwriting one, silently"
    description: >
      `replace_node` saves the edges touching the node it replaces, removes
      the node, adds the surrogate and re-adds the edges, and `POST
      /surrogate/deactivate` does the same in reverse.  From v0.1.0 to
      v0.3.1 both re-added each edge with its endpoints, fields and
      transform only, so `GraphManager.add_edge`'s remaining arguments fell
      back to their defaults: `additive` to False, and `source_units` and
      `target_units` to None.  Nothing raised or warned, and the route
      answered 200.  An additive edge came back overwriting: two
      `TableNode`s (positions 1.0 and 2.0) feeding one spring's
      `anchor_position` additively, one of them swapped for an equivalent
      node, stepped the spring to 2.000e-02 where the unswapped graph
      reached 4.000e-02 after one step, through `replace_node` and through
      the route alike, at v0.1.0, v0.2.0, v0.2.1, v0.3.0 and v0.3.1 (`git
      archive` of each tag, CPU, jaxlib 0.11.0; a fresh graph per run), and
      the swapped edge read `additive=False` with no units.  The units are
      declarative -- `validate()` compares them with the target's declared
      units -- so losing them silenced that check rather than changing a
      value.  During 0.4.0 development the same re-add also dropped an
      edge's interface `mapping` and its fitted mapping weights (weights
      fitted to 3x came back as the recipe's), which no release carried.
      Resolved in 0.4.0 (c211c8b, 2019d42, 2026-09-19): both sites re-add an
      edge through `EdgeSpec.add_edge_kwargs()`, which is derived from the
      dataclass's own fields and raises, naming the field, if the class
      grows one it does not cover; live mapping weights and a mapped edge's
      `ParamSpec` overrides are saved across the removal and put back.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent: the swap reported success as if it had kept the wiring, and
      the graph then computed a different coupling, with no error or
      warning.  Graded `major` under the 0.4.0 severity definition (a
      silent wrong result is never `minor`).  Not `critical`: it needs an
      edge declared `additive`, which is not the default, on a node that is
      swapped, and the restored edge showed the flag to anyone who looked.
      `context_dependent` because whether the lost summand matters is a
      property of the model.
    affected_components:
      - "maddening.surrogates.replace.replace_node"
      - "maddening.api.server.SimulationServer.create_app"
      - "maddening.core.edge.EdgeSpec.add_edge_kwargs"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: after `replace_node` or a surrogate revert, remove each
      edge touching the swapped node and add it again with its `additive`,
      `source_units` and `target_units`, then compare the graph's edges with
      those before the swap.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known for the edge fields: a field added to `EdgeSpec` without a
      rule for re-adding it raises at the next swap instead of being reset.
      A revert that cannot complete (the edge's other endpoint is gone) is
      a 500 that leaves the graph as it was.
    verification:
      - "tests/surrogates/test_replace.py::TestReplaceNodePreservesEdgeAttributes::test_additive_edge_still_adds_after_replace"
      - "tests/surrogates/test_replace.py::TestReplaceNodePreservesEdgeAttributes::test_transform_and_units_survive_replace"
      - "tests/api/test_surrogate_revert.py::test_surrogate_deactivate_restores_every_edge_attribute"
    github_issue: null

  - anomaly_id: "MADD-ANO-078"
    title: "build_model_description of a real graph declared no FMU inputs and a default step of 1e-3, whatever the graph's inputs and timestep"
    description: >
      v0.3.0 and v0.3.1 shipped `maddening.fmi.build_model_description`,
      which builds an FMI 3.0 `modelDescription.xml` from a `GraphManager`.
      It looked for the graph's external inputs in an
      `_external_input_specs` attribute and for its step in
      `_master_timestep`, and `GraphManager` defined neither (it keeps its
      external inputs in `_external_inputs`), so both reads fell back to
      their defaults.  Every description built from a real graph declared
      no `input` variable at all, and its `DefaultExperiment` declared
      `stepSize` 0.001 whatever the graph's timestep; `selected_inputs`
      could not add an input back, because it filtered the empty set.
      Nothing raised or warned.  Reproduced at v0.3.0 and v0.3.1 (`git
      archive` of each tag, CPU, jaxlib 0.11.0): a graph with the external
      input `spring.anchor_position` and node timesteps 1e-2 and 5e-2
      exported no inputs and a step of 0.001 where 0.01 is due.  No FMU
      runtime shipped in those versions read the description (the C
      wrapper arrived in 0.4.0), so what it misled was an importer or a
      packager handed the XML.  Fixed during 0.4.0 development and recorded
      in the CHANGELOG, but not registered until the round-3 confirmation
      audit.
      Resolved in 0.4.0 (2efcaea, 2026-09-16): the inputs come from the
      graph's external-input list as `<node>.<field>`, with the unit and
      description from the node's `boundary_input_spec()`, and the default
      step is the fastest node's timestep, the graph's base step.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `major` under the 0.4.0 severity definition
      (`AnomalySeverity`): the description is the value
      `build_model_description` returns, it describes the simulated system
      to whoever imports it, and it was wrong -- an interface with none of
      the graph's inputs and a step the graph does not take -- with no
      warning.  The `minor` clause for a wrong statement in declared
      metadata covers metadata beside computed values that stay right;
      here the description is the computed result.  Not `critical`: no
      shipped runtime consumed it, the outputs and parameters it declared
      were right, and the missing inputs are visible in the XML.
      `context_dependent` because the effect depends on what the importer
      does with it: a master cannot drive inputs the description lacks,
      and one that follows the default experiment steps at a fraction of
      the graph's timestep.
    affected_components:
      - "maddening.fmi.model_description.build_model_description"
    affected_versions: ">=0.3.0, <0.4.0"
    workaround: >
      On v0.3.0 and v0.3.1: pass `default_step_size=` explicitly, add the
      graph's external inputs to the returned description's variables
      yourself, and check the XML's `ModelVariables` before handing it on.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.  The default step is the graph's step, `gm.timestep`.
      That is the fastest node's timestep on a uniform-rate graph and on a
      multi-rate one whose timesteps divide each other, which is what this
      fix verified.  The fastest node's timestep is not the step when the
      timesteps do not divide or a group sub-cycles, which MADD-ANO-097
      records and fixed in the same release.  The slower nodes of a
      multi-rate graph are declared on their own clocks only when
      `multi_clock=True` is passed.
    verification:
      - "tests/fmi/test_multi_clock.py::test_external_inputs_of_a_real_graph_are_fmu_inputs"
      - "tests/fmi/test_multi_clock.py::test_default_step_size_is_the_fastest_node_timestep"
    github_issue: null

  - anomaly_id: "MADD-ANO-079"
    title: "compile() restarted a multi-rate graph's sub-step counter, so a recompile in the middle of a run re-phased the sub-steps each slower node fired on"
    description: >
      `GraphManager.compile()` carries node state and `params` across a
      rebuild.  From v0.1.0 to v0.3.1 it threw the graph's `_meta` entry
      away: the multi-rate branch replaced it with a fresh `step_count = 0`
      and the uniform-rate branch removed it.  `step_count` decides on which
      sub-steps a node with a rate divider above 1 fires, so a recompile in
      the middle of a run -- which a structural edit such as `add_edge` or
      `add_external_input` triggers on a live graph -- re-phased the
      schedule, with no warning.  A 0.01 s `TableNode` driving a 0.03 s
      `BallNode`, run four steps, given one unused external input (which
      changes no physics), recompiled and run four more, ended at velocity
      -1.1772 against -0.8829 for an uninterrupted eight-step run of the
      same graph, 33% off, at v0.1.0, v0.2.0, v0.2.1, v0.3.0 and v0.3.1
      alike (`git archive` of each tag, CPU, jaxlib 0.11.0; a fresh graph
      per run).  The same wipe dropped a coupling group's predictor history
      and IQN warm start, which changes how a group converges but not,
      beyond its tolerance, where.  Fixed during 0.4.0 development and
      recorded in the CHANGELOG, but not registered until the round-3
      confirmation audit checked it against the tags.
      Resolved in 0.4.0 (8a1a64b, 2026-09-19): `_meta` is rebuilt over the
      keys the new graph expects and the live values are carried over it --
      a key whose coupling group is gone is dropped, and a value whose shape
      no longer fits is reseeded -- and `step_count` restarts only when the
      rate dividers themselves change.  `reset_state()` remains the way to
      zero the counters.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent: a run interrupted by a recompile took a different trajectory
      from the same run uninterrupted, and nothing was raised.  Graded
      `major` under the 0.4.0 severity definition (a silent wrong result is
      never `minor`).  Not `critical`: it needs a node with a rate divider
      above 1 and a recompile between steps.  `context_dependent` because
      the size of the shift depends on the rates and the model.
    affected_components:
      - "maddening.core.graph_manager.GraphManager.compile"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: make every structural edit to a multi-rate graph before
      its first step, or rebuild the graph and replay the run from the
      start after one.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A change of the rate dividers restarts the counter, by design: the
      phase indexes the dividers, so continuing it would fire nodes on
      sub-steps chosen for the previous schedule.
    verification:
      - "tests/core/test_multirate.py::TestMultirateRecompile::test_recompile_preserves_the_sub_step_phase"
    github_issue: null

  - anomaly_id: "MADD-ANO-080"
    title: "The FMU bridge split a variable's name at its first dot to find the node, so every input of a node whose name holds a '.' was filed under a node the graph does not have"
    description: >
      `build_model_description` names an FMU input or output
      `<node>.<field>`, and a node name may contain a dot (`tank.1`,
      `hx.hot`).  During 0.4.0 development the TCP bridge recovered the
      node and field from the name with `name.partition(".")`, at the first
      dot.  For a node `rod.A`, every `fmi3Set` on its input was
      acknowledged and filed under a node `rod` that the graph does not
      have, so the importer co-simulated a model whose inputs stayed at
      their start values, with no error; a get on its output raised
      `KeyError: 'rod'`, after the run had already been wrong.  Parameters
      were unaffected, because they are split at `.params.`.  Found by the
      whole-tree audit of the release branch.  No tagged release carried
      it: v0.3.0 and v0.3.1 have no bridge and route nothing by name.
      Resolved in 0.4.0 (4d49a27, 2026-09-18): `FMIVariable` carries the
      node and field the description was built from, and the bridge's five
      routing sites ask for that pair; `node_field()` falls back to the old
      split only for a hand-built variable without one.  Two nodes whose
      variables would spell the same FMI name (node `a` with field `b.c`,
      node `a.b` with field `c`) are refused at export, naming both.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent for inputs: the importer's writes were acknowledged and never
      applied, so the co-simulation ran a model with frozen inputs.  Graded
      `major` under the 0.4.0 severity definition (a silent wrong result is
      never `minor`), and registered although no release carried it,
      because it is major.  Not `critical`: it needs a node name with a
      dot, and reading that node's output raised.  `context_dependent`
      because what frozen inputs do to a co-simulation depends on the
      model.
    affected_components:
      - "maddening.fmi.model_description.FMIVariable.node_field"
      - "maddening.fmi.tcp_bridge.FmuTcpBridge"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: export only nodes whose names hold no '.'.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      An `FMIVariable` built by hand without a node and field is still split
      at the first dot, which is correct whenever the node name holds none.
    verification:
      - "tests/fmi/test_dotted_node_names.py::test_a_node_name_containing_a_dot_routes_fmu_inputs_to_that_node"
    github_issue: null

  - anomaly_id: "MADD-ANO-081"
    title: "After a sharded static was rewritten in place, compile() traced the new step against the wrapper's cached copy of the old buffer"
    description: >
      During 0.4.0 development the sharded wrappers began to cache the
      per-device placement of their sharded `StaticArray`s on the node,
      keyed on each array's identity, so as not to copy them again on every
      `update` (81531ed).  That key cannot see a buffer rewritten in place,
      and the cache outlived `GraphManager.compile()`, which rebuilt the
      step, cleared the scan cache, re-snapshotted the static-data hashes
      and then traced the new step against the previous buffer: every later
      step was silently wrong, with no way back short of rebuilding the
      wrapper.  A one-device `ShardedStencilNode` over a 16-cell diffusion
      whose mask was zeroed in place went on diffusing after `compile()`.
      The first fix (5f6f6ff) had `compile()` call `invalidate_static_cache()`
      on each graph node, which missed a cache one level in, under
      `HybridNode(ShardedStencilNode(...))` (1fce120).  No tagged release
      carried it: at v0.2.1, v0.3.0 and v0.3.1 (`git archive` of each tag,
      CPU, jaxlib 0.11.0) the placement was redone on every trace and the
      same probe took the zeroed mask after `compile()`, and v0.1.0 and
      v0.2.0 hand a wrapped node no sharded statics.
      Resolved in 0.4.0 (1fce120, 2026-09-18):
      `SimulationNode.invalidate_static_cache` is a contract method whose
      default forwards to every node held as an attribute, guarded against
      a cycle; the sharded wrappers drop their cache and call `super()`,
      and `compile()` calls it on every node.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent: after the framework's explicit "rebuild everything" the step
      computed with a static the node no longer held, and nothing said so.
      Graded `major` under the 0.4.0 severity definition (a silent wrong
      result is never `minor`), and registered although no release carried
      it, because it is major.  Not `critical`: it needs a sharded static
      whose buffer is written in place rather than replaced.
      `context_dependent` because what a stale geometry or coefficient
      field does depends on the model.
    affected_components:
      - "maddening.core.node.SimulationNode.invalidate_static_cache"
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
      - "maddening.core.graph_manager.GraphManager.compile"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: replace a sharded static's array instead of writing into it,
      or build a new wrapper after the write.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Between compiles the cache is still keyed on identity, by design: a
      static rewritten in place and stepped with no `compile()` is served
      from the cache until `invalidate_static_cache()` is called, which is
      the documented hook for a node that rewrites a buffer in place.
    verification:
      - "tests/cloud/multigpu/test_sharded_static_cache.py::test_compile_rematerialises_a_static_rewritten_in_place"
      - "tests/cloud/multigpu/test_sharded_static_cache.py::test_compile_reaches_a_static_cache_nested_inside_another_node"
    github_issue: null

  - anomaly_id: "MADD-ANO-082"
    title: "The FMU bridge installed an importer's FMU-state archive without the value checks set applies: a parameter outside its declared bounds and non-finite state were accepted"
    description: >
      `fmi3SetFMUState` hands the bridge an archive that the importer may
      have built itself, so it is a second door into the state and
      parameter tree that `set` writes.  During 0.4.0 development the
      bridge's `_decode_state` checked the schema token, the member names
      and the shapes, then wrote every array through, while the check that
      a value is finite and fits the live dtype, and the `ParamSpec` bounds
      check, sat on the `set` path only.  The bridge that refuses `set
      mass=-1.0` against declared bounds (0.1, 10.0) accepted an archive
      setting it, together with `position = inf` (a float64 1e300 narrowed
      into a float32 field) and `velocity = NaN`, answered `ok`, and one
      step later the whole state was NaN.  Found by the params-io audit of
      2026-09-19.  No tagged release carried it: v0.3.0 and v0.3.1 have no
      bridge, and their `FmuSidecar.set_fmu_state` unpickled its input
      (MADD-ANO-055) with no `ParamSpec` to check against.
      Resolved in 0.4.0 (a46a3ee, 2026-09-19): both doors share one check
      -- finite, and representable in the live array's dtype -- over every
      restored state field, parameter and input, and the restored parameter
      tree passes the restore check `FmuSidecar.set_fmu_state` applies
      (tunability and declared bounds), all before anything is committed.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent at the write: the bridge answered `ok` to values the model
      declares invalid and computed with them.  Graded `major` under the
      0.4.0 severity definition (a silent wrong result is never `minor`):
      accepting an input the model's own declarations refuse and computing
      from it, as MADD-ANO-057 records for a sharded node.  Registered
      although no release carried it, because it is major.  Not
      `critical`: it needs an importer that hands the bridge an archive it
      did not get from the bridge, and the non-finite cases turned the
      whole state visibly NaN within a step.  `context_dependent` because
      an out-of-bounds parameter is as harmful as the model makes it.
    affected_components:
      - "maddening.fmi.tcp_bridge.FmuTcpBridge"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: restore only FMU states that the same FMU produced.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A snapshot of a diverged model, whose state holds inf or NaN, no
      longer restores; the error names the field.  A parameter instantiated
      outside its bounds restores to that value from the FMU's own
      snapshot, as `GraphManager.load_state` restores a checkpoint.
    verification:
      - "tests/fmi/test_fmu_state_archive_values.py::test_an_archive_cannot_set_a_parameter_outside_its_declared_bounds"
      - "tests/fmi/test_fmu_state_archive_values.py::test_an_archive_cannot_install_a_non_finite_state_field"
      - "tests/fmi/test_fmu_state_archive_values.py::test_an_archive_cannot_narrow_a_value_the_live_dtype_cannot_hold"
    github_issue: null

  - anomaly_id: "MADD-ANO-083"
    title: "A second FMU instance on the same bridge started from the previous instance's final state, parameters, inputs and time"
    description: >
      An FMI master that runs an FMU more than once frees the instance and
      instantiates a new one between runs (`fmi3FreeInstance`, then
      `fmi3InstantiateCoSimulation`), and FMI 3.0 starts every instance at
      the start values of its `modelDescription.xml`.  The bridge supported
      that sequence -- the C wrapper opens a new connection per instance, and
      the bridge waits out the hand-over of its single instance slot -- but
      nothing on the instantiation path reset anything.  The wrapper's
      instantiation sent only `hello`, claiming the slot reset nothing, and
      `reset` was sent only by `fmi3Reset`.  So the second instance inherited
      the first one's model state, the parameters it had tuned, its pending
      inputs and its time, and every call returned `fmi3OK`.

      Found by the 0.4.0 round-4 confirmation audit and reproduced
      2026-10-02 (CPU, jaxlib 0.11.0, FMPy 0.3.29) on the test suite's
      table/ball/spring plant.  FMPy's `simulate_fmu` was called against one
      running bridge, three times, as a notebook or a parameter study does.
      Runs 1 and 2 had identical arguments, a stiffness of 45 and a driven
      anchor.  Run 1 matched `GraphManager.run_scan`.  Run 2 started at run
      1's final spring position (1.036 instead of 0.5) and ended at 1.668
      against the graph's 1.036.  Run 3 set no start values and reported and
      computed with run 1's stiffness of 45, not the advertised 30, ending
      at 1.554 against 0.877.

      Introduced with the bridge and the C wrapper in 2efcaea, during the
      0.4.0 development line.  No tagged release contains it: v0.1.0 to
      v0.3.1 have no `src/maddening/fmi/tcp_bridge.py` and no C wrapper.

      Resolved in 0.4.0.  A connection that claims the instance slot is a
      new instance, and the bridge resets it to where a fresh one starts:
      the state the bridge was built over, every parameter at the start
      value the description advertises, every input at zero and the time at
      zero.  `fmi3Reset` goes to the same point through the same commit.
      `fmi3EnterInitializationMode` now passes its start time to the bridge
      (op `initialize`), and a step whose communication point is not the
      FMU's time is refused.  A sidecar configured with other parameters
      than its description advertises is brought into line, with a
      `UserWarning`.
    severity: "critical"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silently wrong in the most ordinary use of an exported FMU: running it
      twice.  Every second run computed from the previous run's end state
      and parameters, every call returned `fmi3OK`, and the numbers stayed
      finite and plausible.  A parameter study's runs depended on their
      order, and a run without start values used the values of whatever ran
      before it.  Graded `critical` because nothing in the importer's
      protocol could tell it apart from a correct run, and because it hit
      every master that reuses a sidecar between runs, not a corner case.
      `context_dependent` because whether a wrong co-simulation result
      matters depends on what it is used for.
    affected_components:
      - "maddening.fmi.tcp_bridge.FmuTcpBridge"
      - "maddening.fmi.package.C_SOURCE"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: build a new `FmuTcpBridge` per instance, or call `fmi3Reset`
      straight after instantiating.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The reset belongs to a connection: an in-process caller of
      `FmuTcpBridge.handle` claims no slot and keeps the state it finds, and
      a client that opens a new connection per request now starts a new
      instance each time.  The documented contract is one connection per
      instance, which is how the C wrapper works.  The state an instance
      starts from is the sidecar's state when the bridge was built, which
      outputs have no start value in the XML to check against.
    verification:
      - "tests/fmi/test_a_new_instance_starts_at_the_start_values.py::test_simulate_fmu_twice_with_the_same_arguments_gives_the_same_result"
      - "tests/fmi/test_a_new_instance_starts_at_the_start_values.py::test_a_connection_that_claims_the_slot_starts_from_the_start_values"
      - "tests/fmi/test_a_new_instance_starts_at_the_start_values.py::test_reset_and_a_new_instance_land_on_the_same_point"
      - "tests/fmi/test_a_new_instance_starts_at_the_start_values.py::test_a_refused_second_connection_resets_nothing"
      - "tests/property/test_differential_fmu.py::test_the_bridge_the_sidecar_and_the_graph_agree_on_every_sequence"
      - "tests/property/test_stateful_bridge.py::test_arbitrary_sidecar_sequences_keep_the_bridge_and_the_model_in_step"
    github_issue: null

  - anomaly_id: "MADD-ANO-084"
    title: "An external input the FMU did not export, or that an in-process caller omitted, was not zero-filled: the node took its own \"input missing\" branch"
    description: >
      `GraphManager.step` completes a partial `external_inputs` with zeros
      and refuses a name the graph does not declare (since 2428f5e, during
      the 0.4.0 development line; MADD-ANO-099 records the graph's defect
      at the tags).  The FMU paths did neither.  The bridge
      built its inputs from the model description's input variables only,
      so an input that `build_model_description(selected_inputs=...)` left
      out never reached the compiled step.  `FmuSidecar.step` called the
      compiled step directly with whatever it was given, so an input its
      caller omitted never reached it either, and a misspelt node name was
      ignored without a word.  A node whose input is missing takes its own
      fallback branch, which need not be what zero gives.

      Found by the 0.4.0 round-4 confirmation audit and reproduced
      2026-10-02 (CPU, jaxlib 0.11.0) on a `BallNode` with an external
      `table_position` and a spring with an external anchor, the FMU
      exporting only the anchor.  After 80 steps the graph's ball, bouncing
      on a table at height 0, was at +0.4635.  The bridge's and the
      sidecar's ball took the "no table" branch and was at -2.178: it fell
      through the floor, with every value finite and no warning.

      No tagged release had the divergence.  At v0.3.0 and v0.3.1 (`git
      archive` of each tag, same plant) `FmuSidecar.step` and
      `GraphManager.step`, given the same partial dict, both gave -2.178:
      the graph did not complete a partial dict either, and there was no
      bridge.  The two parted when 2428f5e taught the graph to complete
      one and the FMU paths, new or unchanged, were not taught the same.

      Resolved in 0.4.0.  `build_model_description` lists the declared
      inputs it leaves out in `ModelDescription.held_inputs`, warns naming
      them, and refuses a `selected_inputs` name the graph does not declare.
      `SidecarConfig.input_resolver` (pass `gm._resolve_external_inputs`)
      completes and checks a sidecar's inputs before every step, on both
      `step` and the bridge's path.  A bridge whose sidecar has no resolver
      installs one built from its description, covering the exported inputs
      and the held ones.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silently wrong: the FMU computed a different model from the graph it
      was exported from, with finite values and no warning, whenever an
      input was left out of the export (or omitted by an in-process caller)
      and its node's fallback differed from zero.  Graded `major` (a silent
      wrong result is never `minor`).  Not `critical`: it took a partial
      export or a partial in-process call, and a node with a non-zero
      fallback.  `context_dependent` for the reason every wrong co-simulation
      result is.
    affected_components:
      - "maddening.fmi.tcp_bridge.FmuTcpBridge"
      - "maddening.fmi.sidecar.FmuSidecar.step"
      - "maddening.fmi.model_description.build_model_description"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: export every external input, and pass a complete
      `external_inputs` to `FmuSidecar.step`.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A stand-alone `FmuSidecar` (not behind a bridge) built without
      `input_resolver` still hands its inputs to the step as given, as
      documented: the sidecar holds only the compiled step and cannot know
      the graph's declared inputs.  A hand-built `ModelDescription` that
      does not list `held_inputs` gives the bridge only its exported inputs
      to complete with.
    verification:
      - "tests/fmi/test_unexported_inputs_are_held_at_zero.py::test_the_bridge_holds_an_unexported_input_at_zero_like_the_graph"
      - "tests/fmi/test_unexported_inputs_are_held_at_zero.py::test_the_sidecar_with_the_graphs_resolver_steps_like_the_graph"
      - "tests/fmi/test_unexported_inputs_are_held_at_zero.py::test_the_sidecar_refuses_a_misspelt_input_like_the_graph"
      - "tests/fmi/test_unexported_inputs_are_held_at_zero.py::test_an_importer_driving_the_partial_fmu_reproduces_the_graph"
      - "tests/property/test_differential_fmu.py::test_the_bridge_the_sidecar_and_the_graph_agree_on_every_sequence"
    github_issue: null

  - anomaly_id: "MADD-ANO-085"
    title: "The FMU advertised min / max for its parameters but enforced them only if the sidecar had been given param_specs: a set or an archive outside them was accepted"
    description: >
      `build_model_description` writes every bounded parameter's
      `ParamSpec.bounds` into the XML as `min` / `max`, and the user guide
      promised that both doors into the parameter tree -- `set` and the
      FMU-state archive -- hold that envelope.  But the bridge enforced only
      the specs its sidecar had been built with, and
      `SidecarConfig.param_specs` defaults to `None`.  The bridge applied the
      description's fixed parameters to the sidecar "however it was
      configured", and did nothing equivalent for the bounds published in
      the same description.

      Found by the 0.4.0 round-4 confirmation audit and reproduced
      2026-10-02 (CPU, jaxlib 0.11.0) on the table/ball/spring plant, with
      the sidecar built without `param_specs`.  The XML said
      `ball.params.elasticity` had `min="0.0" max="1.0"`.  A `set` of 1.5
      answered `{"ok": true}` and read back 1.5.  An FMU-state archive
      carrying -3.0 answered `{"ok": true}` and read back -3.0.  Built with
      `param_specs`, the same `set` was refused.

      Introduced during the 0.4.0 development line with the FMU's parameter
      variables and the bridge.  No tagged release contains it: v0.3.0 and
      v0.3.1 export no parameter variables and no `min` / `max`, and have no
      bridge.

      Resolved in 0.4.0.  The bridge adds a bounds-only `ParamSpec`, built
      from its description's `min` / `max`, for every exported parameter
      its sidecar has no spec for.  `set`, `set_state` and the sidecar's own
      `set_params` then refuse a value outside the advertised envelope.  A
      spec the sidecar was given is kept (it is the graph's own declaration,
      the open bound of a `log` leaf for one), and the caller's tree is
      copied, never written into.  An FMU instantiated with a parameter
      outside its bounds still restores its own snapshot.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent at the write: the bridge answered `ok` to values outside the
      envelope its own XML advertises, and computed with them.  Graded
      `major` under the 0.4.0 severity definition (a silent wrong result is
      never `minor`).  It is the same class as MADD-ANO-082 (accepting an
      input the model's own declarations refuse, and computing from it), and
      the same door, reached here through `set` as well.  Not `critical`: it
      needs a sidecar built without `param_specs`, and the value reads back
      as written, so an importer that checks it can see it.
      `context_dependent` because an out-of-bounds parameter is as harmful as
      the model makes it.
    affected_components:
      - "maddening.fmi.tcp_bridge.FmuTcpBridge"
      - "maddening.fmi.sidecar.SidecarConfig"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: build the sidecar with `param_specs=gm.param_specs()`.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A stand-alone `FmuSidecar` (not behind a bridge) built without
      `param_specs` enforces no bounds, as documented: it has no description
      to read them from.  The bounds the bridge adds are the advertised,
      inclusive ones; a `log` / `logit` leaf's open bound is advertised as
      the nearest float inside it, so the envelope is the same.
    verification:
      - "tests/fmi/test_advertised_bounds.py::test_the_bridge_enforces_the_advertised_bounds_without_param_specs"
      - "tests/fmi/test_advertised_bounds.py::test_the_sidecars_own_specs_are_kept_and_not_written_into"
      - "tests/fmi/test_advertised_bounds.py::test_an_fmu_started_outside_its_advertised_bounds_restores_its_own_snapshot"
  - anomaly_id: "MADD-ANO-086"
    title: "A REST request could make the server allocate without bound: before 0.4.0 POST /graph/nodes built any size, and 0.4.0's size checks ran only after the node was built"
    description: >
      From v0.1.0 to v0.3.1 `POST /graph/nodes` called the node's
      constructor with whatever params the request carried and added the
      node to the graph, with no bound on any size.  Checked at each tag,
      v0.1.0, v0.2.0, v0.2.1, v0.3.0 and v0.3.1, on 2026-10-02 (`git
      archive` of each, CPU, jaxlib 0.11.0, FastAPI `TestClient`): a D3Q19
      `LBMNode` with `grid_shape` [100, 100, 100] answered 201, its
      25-million-element state resident (+174 to +179 MB of RSS).  Nothing
      bounded the product, so a request could name more memory than any
      host has.  `GraphManager.from_dict` and `load_graph_from_usd` built
      every node a config or a stage named in the same way.

      0.4.0 bounded the request (each integer at 10^7, the request at 10^6
      values, a new node's state at 2*10^7 elements), but every size check
      ran on the built node: `POST /graph/nodes` measured the state it had
      just allocated, and `PUT /graph/params` checked a write by calling
      the node's constructor with the new value.  The abstract pre-check
      could not see a size the constructor derives (`LBMNode` sizes its
      state from `self._grid_shape`).  Measured on the 0.4.0 development
      tree (d44d3bb, CPU, jaxlib 0.11.0): a D3Q19 `LBMNode` of 140^3 cells
      took +1.1 GB before the state cap refused it, and a D2Q9 `PUT
      grid_shape` of 16000^2 took +247 MB.  On the new `WaveletAdaptiveNode`,
      `n_levels` of 22, 24 and 26 took +56, +396 and +655 MB before their
      400.  `PUT {"n_levels": 10000000}` was never refused: the constructor
      built its level labels as a Python list of `n_coarse * 2**n_levels`
      entries before any check.  One such request grew a process to
      57.7 GB, and the kernel's global OOM killer then took down the
      machine.

      Resolved in 0.4.0.  `HeatNode`, `LBMNode`, `LBMPipeNode` and
      `WaveletAdaptiveNode` estimate, from their constructor arguments
      alone, the state they build (exactly) and the memory their
      constructor takes (`_allocation_estimate`, read by the private
      `maddening.core._size_estimate`).  `POST /graph/nodes` and `PUT
      /graph/params` check every constructor call they would make against
      `MAX_NODE_STATE_ELEMENTS` and a new `MAX_NODE_BUILD_BYTES` (2 GiB)
      first.  `GraphManager.from_dict` and `load_graph_from_usd` raise
      `ValueError` for a node that would not fit in the machine's memory.
      `WaveletAdaptiveNode` refuses a basis it cannot build before it
      builds any of it, and builds the labels with `np.repeat` behind a
      bit-length guard.

      Those bounds were per request, and the round-5 REST audit measured
      what they left on the development tree: nothing bounded the whole
      graph (eight `HeatNode`s of 5 million cells were each accepted, every
      one resident), nor a request body (every element cap ran on the
      parsed request, and a 76 MB body of numbers took 2 to 3 GB to
      refuse), nor how many builds ran at once (six concurrent half-cap
      builds peaked at 2.4 times one).  Resolved in 0.4.0 too:
      `MAX_GRAPH_STATE_ELEMENTS` (10^8, five nodes at the per-node cap)
      bounds the whole graph's state, checked before the node is built
      where its class can say what it would build; a request body over
      `MAX_REQUEST_BODY_BYTES` (32 MiB, the largest body the element caps
      admit) is a 413 before it is parsed; `PUT /graph/state` counts each
      field's values against the live field before converting them; and
      nodes are built one at a time, under the server's graph lock
      (MADD-ANO-106).
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A crash, never a wrong result, so not `critical`; graded `major`
      because its reach is the host, not the feature.  The kernel's OOM
      killer picks the largest process, which need not be the server: on
      the machine where this was found it ended every other job, and the
      machine went down.  Up to v0.3.1 the API was unauthenticated and the
      cloud container bound it to `0.0.0.0` (MADD-ANO-051), so anyone who
      could route to port 8000 could do it.  Since 0.4.0 it takes a local
      user on a loopback bind, or a token holder.  `context_dependent`:
      what else the host runs is the deployment's, not the library's.
    affected_components:
      - "maddening.api.server.SimulationServer.create_app"
      - "maddening.core.graph_manager.GraphManager.from_dict"
      - "maddening.nodes.adaptive.wavelet.WaveletAdaptiveNode"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: keep the API on loopback and let only trusted callers
      reach it (MADD-ANO-051's workaround), and load configs and USD stages
      only from trusted sources.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A node class without an estimate (a user's own) is still measured on
      the state it built, after building it, as before.  The estimates
      bound the peak within a small factor (measured 3 to 4 times the
      state for the lattices, 48 to 76 bytes per operator entry for the
      wavelet basis), not exactly.  A body up to the limit is still parsed
      whole (about 1.3 GB at the limit); bodies are parsed one at a time,
      but a node build and a surrogate training job (MADD-ANO-092) can run
      at once.  `from_dict` and `load_graph_from_usd` refuse only what
      exceeds the machine's physical memory, so a config can still ask for
      most of it.
    verification:
      - "tests/api/test_node_size_refused_before_construction.py::test_post_refuses_an_oversized_node_before_constructing_it"
      - "tests/api/test_node_size_refused_before_construction.py::test_put_refuses_a_wavelet_level_count_before_constructing_it"
      - "tests/api/test_node_size_refused_before_construction.py::test_put_refuses_a_grid_shape_before_constructing_it"
      - "tests/api/test_node_size_refused_before_construction.py::test_put_on_a_sharded_node_asks_the_class_it_wraps"
      - "tests/api/test_node_size_refused_before_construction.py::test_from_dict_refuses_a_node_no_machine_holds_before_constructing_it"
      - "tests/api/test_node_size_refused_before_construction.py::test_the_estimate_is_the_state_the_node_builds"
      - "tests/api/test_node_size_refused_before_construction.py::test_an_impossible_basis_is_refused_at_once_not_built"
      - "tests/usd/test_usd_node_size_refused_before_construction.py::test_a_stage_naming_an_impossible_node_is_refused_unbuilt"
      - "tests/api/test_request_memory_is_bounded.py::test_a_body_over_the_limit_is_a_413_before_it_is_parsed"
      - "tests/api/test_request_memory_is_bounded.py::test_a_streamed_body_without_a_length_is_refused_as_it_passes_the_limit"
      - "tests/api/test_request_memory_is_bounded.py::test_a_declared_length_over_the_limit_is_refused_without_reading_the_body"
      - "tests/api/test_request_memory_is_bounded.py::test_a_state_field_with_the_wrong_number_of_values_is_refused_before_conversion"
      - "tests/api/test_request_memory_is_bounded.py::test_a_node_past_the_graph_wide_budget_is_refused_before_it_is_built"
      - "tests/api/test_request_memory_is_bounded.py::test_a_node_without_an_estimate_is_held_to_the_budget_on_its_built_state"
      - "tests/api/test_request_memory_is_bounded.py::test_concurrent_node_builds_run_one_at_a_time"
