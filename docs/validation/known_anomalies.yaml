  - anomaly_id: "MADD-ANO-087"
    title: "PUT /graph/params answered 200 to a value the running node could not step with, and every POST /sim/step after it was a 500"
    description: >
      From v0.1.0 to v0.3.1 `PUT /graph/params` wrote any value into
      `node.params`, and `POST /sim/step` turned only a `RuntimeError` into
      a 4xx.  Checked at each tag, v0.1.0 to v0.3.1, on 2026-10-02 (`git
      archive` of each, CPU, jaxlib 0.11.0, FastAPI `TestClient`):
      `RigidBodyNode` `constraints` of `null`, `{"w": 0}`, `{"y":
      {"finite": true}}` or `{"z": "high"}` each answered 200, and every
      `POST /sim/step` after it answered 500.  0.4.0's route asked whether
      a written value is *used*, and counted a trace that raised as "cannot
      tell", so the same four writes still answered 200 on the development
      tree (d44d3bb).  `POST /graph/nodes` refused three of them by
      dry-running the new node's update.  Resolved in 0.4.0: the route
      traces the node's hooks, on a copy and with the request's values,
      and refuses a value whose trace raises where the current values'
      trace does not.  `POST /sim/step` and `POST /sim/run` answer a graph
      that cannot step with a 400 naming the error, with nothing stepped.
    severity: "minor"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      Loud: every step after the write failed with a 500, and no value was
      computed with the bad parameter.  Writing a usable value back
      restored the graph, so the feature stayed usable.
    affected_components:
      - "maddening.api.server.SimulationServer.create_app"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: write only values the node's constructor documents,
      and after a step answers 500, write the previous value back.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The trace is abstract: a value the node's code fails on only with
      concrete numbers (a check on a computed value) is not caught before
      it is written, and its step is then a 400 naming the error, not a
      500.  A value whose trace needs concrete values is not refused.
    verification:
      - "tests/api/test_params_writes_the_step_cannot_run_with.py::test_a_constraint_the_step_cannot_run_with_is_refused_and_steps_go_on"
      - "tests/api/test_params_writes_the_step_cannot_run_with.py::test_a_sharded_body_is_asked_through_the_body_it_wraps"
      - "tests/api/test_params_writes_the_step_cannot_run_with.py::test_a_graph_configured_so_it_cannot_step_is_a_400_naming_why"
    github_issue: null

  - anomaly_id: "MADD-ANO-088"
    title: "POST /sim/stop answered \"stopped\" while the runner's thread kept stepping, and a reset after it was overwritten"
    description: >
      `RealtimeRunner` read its stop flag only between frames, `stop()`
      waited two seconds for the thread, and `SimulationServer` then
      dropped its handle and answered `{"status": "stopped"}` whatever the
      thread was doing.  `PUT /sim/stride` took any `steps_per_frame`.  So
      a frame longer than two seconds left an orphaned thread stepping the
      graph over whatever the API wrote next.  A large `steps_per_frame`
      does it, and so can one long step: the recompile a parameter write
      asks for runs on the runner's thread.  Checked at each tag, v0.1.0
      to v0.3.1, and on the 0.4.0 development tree (d44d3bb), on 2026-10-02
      (CPU, jaxlib 0.11.0, FastAPI `TestClient`, a `BallNode` at dt =
      1e-3).  With `steps_per_frame=1000000`, `POST /sim/stop` answered
      "stopped" after 2.0 s with the thread alive.  `POST /sim/reset` then
      answered position 1.0, and 0.5 s later `GET /graph/state` served
      -605639 to -679148 (-158104 on d44d3bb), with nothing running by the
      API's account.  The process aborted at exit.  Resolved in 0.4.0: the
      runner checks its stop and pause flags between every step, and
      `stop()` returns whether the thread exited.  The server answers 503
      and keeps the runner while the thread is still in a step after ten
      seconds, and never reports "stopped" before it has exited.  `/sim/step`,
      `/sim/run`, `PUT /graph/state` and `/checkpoint/load` are refused while
      a runner thread is alive (409 running, 503 stopping), and
      `steps_per_frame` and `relay_stride` are bounded at 100000.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silently wrong, so never `minor`: the reset's reply showed the reset
      state, the stop's reply said stopped, and the state the API served
      next was an orphaned thread's, with no error.  Not `critical`: it
      needs a frame or a step longer than two seconds, and the state moved
      visibly.  `context_dependent` because what reads the overwritten
      state decides what it costs.
    affected_components:
      - "maddening.viz.runner.RealtimeRunner.stop"
      - "maddening.api.server.SimulationServer.create_app"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: keep `steps_per_frame` small enough that a frame takes
      well under two seconds, and after `POST /sim/stop` check that the
      state stops changing before writing it.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      One step still runs to completion once started, so stop waits for it
      (up to ten seconds, then 503).  `PUT /graph/params` and structural
      edits still reach a running graph, as the bundled UI's sliders need;
      a structural edit while the runner runs recompiles on its thread.
    verification:
      - "tests/api/test_runner_stop_and_stride.py::test_stop_mid_frame_stops_the_thread_and_a_reset_stays_reset"
      - "tests/api/test_runner_stop_and_stride.py::test_a_stop_that_times_out_is_a_503_and_keeps_the_runner"
      - "tests/api/test_runner_stop_and_stride.py::test_while_the_runner_is_still_stopping_state_writes_are_503s"
      - "tests/api/test_runner_stop_and_stride.py::test_a_reset_whose_stop_times_out_resets_nothing"
      - "tests/api/test_runner_stop_and_stride.py::test_the_runner_stops_within_a_step_of_a_long_frame"
    github_issue: null

  - anomaly_id: "MADD-ANO-089"
    title: "A checkpoint path that resolved to the checkpoint root itself wrote, and loaded, <root>.npz in the root's parent"
    description: >
      0.4.0 confines `/checkpoint/save` and `/checkpoint/load` to
      `SimulationServer(checkpoint_root=)` (MADD-ANO-052), but the check
      accepted a target equal to the root.  `path=""`, `"."` or `"sub/.."`
      resolved to the root, `numpy.savez` appended `.npz`, and the file
      written was `<root>.npz`, in the root's parent; `/checkpoint/load`
      read it back.  A path with a NUL byte was a 500.  Measured on the
      0.4.0 development tree (2026-10-02, CPU, jaxlib 0.11.0).  No tagged
      release had a checkpoint root at all, so none carried this narrower
      form (MADD-ANO-052 is the wider one they did carry).  Resolved in
      0.4.0: the check runs on the file NumPy actually writes or reads,
      after symlinks are followed, and must be strictly inside the root.
      A NUL byte or a path the file system cannot represent is a 400.
    severity: "major"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      Unauthorised access in the registry's sense: a write outside the
      directory the operator confined the routes to.  It was one file of a
      fixed name holding the graph's own arrays, and a caller needed API
      access in the first place, which a non-loopback bind gates with the
      token.  Graded `major`, as unauthorised access a shipped default does
      not expose to other hosts.  `not_safety_relevant`: it could replace a
      file called `<root>.npz` beside the root and nothing else.
    affected_components:
      - "maddening.api.server.SimulationServer.create_app"
    affected_versions: "none"
    workaround: >
      Not needed in a release.  On 0.4.0 development builds: name
      checkpoints with a file name.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known beyond MADD-ANO-052's: any caller the API admits can
      overwrite or load any checkpoint inside the root.
    verification:
      - "tests/api/test_checkpoint_paths_stay_inside_the_root.py::test_a_path_that_is_not_a_file_inside_the_root_is_a_400"
      - "tests/api/test_checkpoint_paths_stay_inside_the_root.py::test_a_symlink_inside_the_root_does_not_lead_out_of_it"
    github_issue: null

  - anomaly_id: "MADD-ANO-090"
    title: "PUT /sim/stride echoed values it did not apply, and DELETE /graph/edges answered 200 for an edge the graph did not have"
    description: >
      Three replies that described something the server had not done.
      `PUT /sim/stride` before any runner existed echoed its
      `steps_per_frame` and dropped it, so `POST /sim/start` ran at 1;
      `relay_stride=0` was echoed as 0 and applied as 1; and `DELETE
      /graph/edges` for an edge the graph did not have answered 200.
      Checked at each tag, v0.1.0 to v0.3.1, and on the 0.4.0 development
      tree, on 2026-10-02 (CPU, jaxlib 0.11.0, FastAPI `TestClient`):
      `PUT /sim/stride?steps_per_frame=7&relay_stride=0` answered with
      both values as sent, the started runner held 1 and the relay 1, and
      the missing edge's `DELETE` answered 200.  Resolved in
      0.4.0: the stride is kept for the runner a later start creates, both
      values are bounded to 1 to 100000 (a 422 outside), the reply is what
      the runner and relay hold, and a missing edge is a 404.
    severity: "minor"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      The stride changes pacing and how often the relay publishes, never a
      computed value; the edge reply changed nothing in the graph.  Minor
      as a defect in a count of work done.
    affected_components:
      - "maddening.api.server.SimulationServer.create_app"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: set the stride after `POST /sim/start`, with
      `relay_stride` of at least 1; read `GET /graph` to see an edge
      removal.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.
    verification:
      - "tests/api/test_runner_stop_and_stride.py::test_a_stride_set_before_the_runner_exists_is_the_runners_stride"
      - "tests/api/test_runner_stop_and_stride.py::test_a_stride_outside_its_bounds_is_a_422_and_changes_nothing"
      - "tests/api/test_runner_stop_and_stride.py::test_deleting_an_edge_that_does_not_exist_is_a_404"
    github_issue: null

  - anomaly_id: "MADD-ANO-091"
    title: "A state or render WebSocket stream never noticed a client that left after the simulation stopped, so the server could not shut down; an ordinary disconnect was logged as an error"
    description: >
      `/ws/state`, `/ws/state/binary` and `/ws/render` learned that a
      client had gone only when a send failed, and they send only when the
      simulation has produced a new snapshot.  Their receive task did see
      the disconnect, and ended without telling the stream.  So a client
      that left after `POST /sim/stop` was never noticed, and neither was
      the close uvicorn sends on shutdown: the handler slept on, and SIGINT
      never completed.  A client that left while the simulation ran made
      the next send fail with uvicorn's `RuntimeError` ("Unexpected ASGI
      message 'websocket.send', after sending 'websocket.close'"), which
      every stream logged with a traceback as "WebSocket error".  Checked
      at v0.1.0, v0.2.0 and v0.3.1 (`git archive` of each) and on the 0.4.0
      development tree, on 2026-10-02 (CPU, jaxlib 0.11.0, uvicorn 0.35,
      websockets 16).  Start the simulation, open each stream, receive two
      frames, `POST /sim/stop`, close the client, send SIGINT: the server
      had not exited 10 s later, on all three streams.  Closing the client
      before the stop instead logged one traceback per stream.  Resolved in
      0.4.0: every stream ends as soon as its client leaves, the
      connection breaks or the handler is cancelled, and it waits between
      frames on that event, so shutdown takes a fraction of a second.  A
      send that fails because the client left is logged at INFO.  A
      malformed client message is ignored; it used to end the receive task
      and, with it, the stream's view of the client.
    severity: "minor"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      Loud and outside the computation: the process would not exit, and
      the log carried spurious tracebacks.  A second SIGINT makes uvicorn
      exit, so the server stayed usable.
    affected_components:
      - "maddening.api.server.SimulationServer.create_app"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: send SIGINT twice (uvicorn then exits at once), or
      close WebSocket clients while the simulation is still running.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A frame being rendered when the client leaves is finished first;
      `/ws/render` renders in an executor thread.
    verification:
      - "tests/api/test_websocket_streams_end_with_their_client.py::test_streams_whose_clients_left_let_the_server_shut_down"
      - "tests/api/test_websocket_streams_end_with_their_client.py::test_streams_with_their_clients_still_open_let_the_server_shut_down"
      - "tests/api/test_websocket_streams_end_with_their_client.py::test_what_counts_as_the_client_having_left"
    github_issue: null

  - anomaly_id: "MADD-ANO-092"
    title: "POST /sim/run and POST /surrogate/train took any size: one request could hold a worker indefinitely or name more memory than the host has"
    description: >
      From v0.1.0 to v0.3.1 `POST /sim/run?n_steps=` and the body of `POST
      /surrogate/train` (`n_epochs`, `batch_size`, `hidden_sizes`) were not
      bounded, and the API answered any caller who could reach it
      (MADD-ANO-051).  `/sim/run` steps synchronously, holding a worker
      thread until the run ends, and a training job allocates its network
      in a background thread.  Checked at each tag, v0.1.0, v0.2.0, v0.2.1,
      v0.3.0 and v0.3.1, on 2026-10-02 (`git archive` of each, CPU, jaxlib
      0.11.0, FastAPI `TestClient`, memory-capped, an empty `HOME`, no cloud
      route):
        - `POST /sim/run?n_steps=1000000000` on a `BallNode` graph was
          still running after 3 s, and would have run for hours;
        - `POST /surrogate/train` with `hidden_sizes` of [2^20, 2^20],
          `n_epochs` and `batch_size` of 10^9 answered 200 "started", and
          its job then tried to allocate 4 TiB.
      A merely large layer width, below what fails at once, is allocated
      in full.  `POST /graph/nodes`, whose sizes are the third such door,
      is MADD-ANO-086.  Resolved in 0.4.0 (f2cf733, 2026-09-19): `n_steps`
      is at most `MAX_RUN_STEPS` (100000), and the training request is
      bounded on its model: data steps, epochs, batch size, layer count and
      width.  Each limit is a 422 naming the field, published in
      `/openapi.json`.  On the 0.4.0 tree both requests above answer 422.
      Found by the round-4 confirmation audit's check of the CHANGELOG's
      Security claims; registered then.

      Each of those bounds held one number, and the round-5 REST audit
      measured what that left on the development tree.  One in-cap training
      request took 2.2 GB (a 25 000-cell rod at the defaults: 16 initial
      conditions x 200 steps of every node's history, then the dataset and
      the copies training takes of it) or 5.9 GB and an out-of-memory error
      (16 layers of 8192).  Any number of jobs ran at once, every one kept
      for the life of the process, and a job's daemon thread still inside
      XLA when the interpreter exited aborted it (a core dump; checked at
      v0.3.1 too).  And SIGINT waited for an in-flight `POST /sim/run`: a
      100 000-step run of a 256 x 256 lattice was still running 60 s after
      the signal, the run being one synchronous call (as it was at every
      tag).  Resolved in 0.4.0 too: a training job's memory is estimated
      from the graph's shapes before it starts and refused (400) over
      `MAX_SURROGATE_TRAIN_BYTES` (2 GiB); `width**2 * depth` is at most
      2^24 (422); one job runs at a time (409) and the last eight finished
      ones are kept; a job stops at its next epoch when the server shuts
      down and is joined at interpreter exit; and `POST /sim/run` steps in
      slices, stopping within one when the server shuts down (503, with the
      steps it took).
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A denial of service, never a wrong result, so not `critical`.  Graded
      `major` as MADD-ANO-086 is.  An oversized network exhausts the
      host's memory, and the OOM killer then picks the largest process,
      which need not be the server.  Every run request held one of the
      server's worker threads, so a handful of them stopped it answering.
      Up to v0.3.1 any caller who could route to the cloud container's
      port could do this (MADD-ANO-051).  `context_dependent`: what else the
      host runs is the deployment's, not the library's.
    affected_components:
      - "maddening.api.server.SimulationServer.create_app"
      - "maddening.api.server.TrainSurrogateRequest"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: keep the API on loopback and let only trusted callers
      reach it (MADD-ANO-051's workaround); for long runs, use `POST
      /sim/start` and stop it.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The training estimate counts what grows with the request (it reads
      2.08 GiB for the audited rod, which took 2.18 GiB); JAX's own fixed
      cost, a few hundred MB, comes on top.  A job's data sweep is one call
      and cannot be interrupted, so a shutdown waits for it, as bounded as
      the job is.  A node build and a training job can run at once.
    verification:
      - "tests/api/test_request_bounds.py::TestSimRunIsBounded::test_step_count_above_the_limit_is_422"
      - "tests/api/test_request_bounds.py::TestTrainSurrogateIsBounded::test_out_of_range_training_arguments_are_422"
      - "tests/api/test_request_bounds.py::TestAddNodeIsBounded::test_an_array_dimension_above_the_limit_is_rejected"
      - "tests/api/test_surrogate_jobs_are_bounded.py::test_a_job_over_the_memory_budget_is_refused_before_anything_is_built"
      - "tests/api/test_surrogate_jobs_are_bounded.py::test_the_estimate_is_the_boundary_of_the_refusal"
      - "tests/api/test_surrogate_jobs_are_bounded.py::test_width_squared_times_depth_is_bounded"
      - "tests/api/test_surrogate_jobs_are_bounded.py::test_one_job_runs_at_a_time_and_a_cancelled_one_ends_at_its_next_epoch"
      - "tests/api/test_surrogate_jobs_are_bounded.py::test_finished_jobs_kept_are_bounded"
      - "tests/api/test_sim_run_stops_when_the_server_shuts_down.py::test_a_run_stops_at_its_next_slice_when_shutdown_is_requested"
      - "tests/api/test_sim_run_stops_when_the_server_shuts_down.py::test_sigint_reaches_an_in_flight_run_before_the_servers_own_handler"
    github_issue: null

  - anomaly_id: "MADD-ANO-093"
    title: "A node.params write made after compile was dropped by every later compile: compile() kept the stale gm.params leaf over the node's new value"
    description: >
      `compile()` builds the step with `gm.params`, and since 0.4.0
      development (c8f8440, 2026-09-16, which made a recompile keep a
      calibration) it wrote every live `gm.params` leaf over the value the
      node now held.  It could not tell a calibrated leaf from one that was
      merely the previous snapshot, so a write to `node.params` after the
      first compile never reached the step, even across a recompile, with
      no warning: a `HeartPumpNode` set to 144 bpm through `node.params`,
      then `compile()` (or the graph marked dirty), went on beating at 72,
      and `gm.params` still read 72.  A shipped example
      (`vessel_flow_server`'s parameter endpoints) did exactly this and
      reported success.  Found by the examples work of 2026-10-02.  No
      tagged release carried it: v0.3.1 has no `gm.params`, and there (a
      `git archive` of the tag, CPU, jaxlib 0.11.0) the same write and
      recompile ran at 144 bpm, because the step read `self.params` when
      it was traced.
      Resolved in 0.4.0 (c183bfb, 2026-10-02): each compile takes every
      node constant from whichever of `node.params` and `gm.params` was
      written since the previous committed compile.  A calibration (only
      `gm.params` changed) still survives a recompile; a node write (only
      the node changed) is taken; both written to different values keeps
      `gm.params`' value and `compile()` warns with both values.
      That fix inferred a write from "the node's value changed", which the
      round-5 audit found two holes in: a write of the value the node
      already held (reverting a calibration written into `gm.params`) was
      dropped, and a write made before `load_state` won over the restored
      value or not depending on whether `load_state` had found the graph
      dirty (it compiles a dirty graph first, taking the write in).
      Refined in 0.4.0 (4a09c63, 2026-10-02): `node.params` is a dict that
      counts its writes, so a write is seen as a write; `load_state`
      supersedes every earlier write to a constant it restores; and every
      entry point recompiles for a write the compiled step has not taken
      (MADD-ANO-105).
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent: the write was accepted, `compile()` succeeded, and the graph
      went on computing with the old constant while the node reported the
      new one.  Graded `major` under the 0.4.0 severity definition (a
      silent wrong result is never `minor`), and registered although no
      release carried it, because it is major.  Not `critical`: the value
      `gm.params` holds, which is what the step uses, is the one inspection
      and `to_dict()` report, so a run is reproducible from its record.
      `context_dependent` because what a stale constant does depends on the
      model.
    affected_components:
      - "maddening.core.graph_manager.GraphManager.compile"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: write the value into `gm.params` instead, which the compiled
      step reads on every call.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A value mutated inside an object `node.params` holds (an element of a
      list) is not a counted write; the graph still compares values, so it
      is taken when it changes the value, but writing the same element
      back is not seen.  An FMU sidecar built before a write runs the
      compiled step it was given.
    verification:
      - "tests/core/test_node_params_write_after_compile.py::test_a_node_params_write_after_compile_takes_effect_at_the_next_compile"
      - "tests/core/test_node_params_write_after_compile.py::test_two_disagreeing_writes_since_one_compile_keep_the_live_value_and_warn"
      - "tests/core/test_node_params_write_after_compile.py::test_a_compile_that_raises_does_not_lose_the_write"
