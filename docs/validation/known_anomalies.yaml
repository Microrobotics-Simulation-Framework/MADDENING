  - anomaly_id: "MADD-ANO-096"
    title: "GraphManager.timestep was the GCD of the nodes' own timesteps, shorter than a step on a graph with a sub-cycling coupling group, so the live runner's clock and pacing and the REST and ZMQ relays' frame times ran slow"
    description: >
      A `subcycling=True` coupling group solves once per macro step, its
      largest member timestep, and sub-steps its faster members inside that
      solve, so `compile()` schedules every member at the macro timestep.
      `GraphManager.timestep` (and its alias `base_timestep`) returned the
      GCD of the nodes' own timesteps, which on such a graph is shorter
      than a step.  Its docstring says "the smallest step at which the
      compiled function advances".  Two nodes at 0.01 and 0.02 in one group
      read 0.01, while every `step()` advanced both of their clocks by 0.02.
      Everything that clocks a run with it was wrong by the same factor.
      `RealtimeRunner` added `timestep` per step to `sim_time` and paced to
      the wall clock by it, so after 0.5 s at `time_scale=100` it reported
      50.5 s while the graph's own clocks read 101 s: the run went twice as
      fast as asked and was labelled half as far along.  `StateRelay`, which
      stamps the REST server's WebSocket frames, `NetworkRelay` (the ZMQ
      `t`) and `GraphInfo.timestep` all carried the same value.  So did
      `validate()`'s multi-rate line, which called such a pair multi-rate at
      a base step of 0.01.  A graph is affected when the GCD of its
      scheduled timesteps differs from the GCD of its own: a group of 0.005
      and 0.02 beside a node at 0.03 read 0.005 for a step of 0.01, while a
      group of 0.01 and 0.02 beside a node at 0.01 read the right 0.01.
      Reproduced identically at v0.1.0, v0.2.0, v0.2.1, v0.3.0 and v0.3.1
      (`git archive` of each tag, CPU, jaxlib 0.11.0).
      The relays also read the step once, at attach time, and multiplied it
      by the step count.  The runner read it once per run.  A graph edited
      between runs, for example a node of another timestep added over the
      REST API, is recompiled by its next step and steps by the new amount.
      At v0.1.0 and v0.3.1 a relay attached to a 0.01 graph that then took 5
      steps, gained a 0.001 node and took 10 more read 0.15 s for 0.06 s.
      Found by the 0.4.0 inspection work (#184), whose `format_graph`
      reported the true step and noted the difference.
      Resolved in 0.4.0: `compile()` and `timestep` read one helper, which
      schedules each sub-cycling group's members at its largest member
      timestep and takes the GCD of the result, so the step reported is the
      one the rate dividers count in.  The runner and both relays add
      `gm.timestep` after each step, the relay gains `reset()` (which the
      server's `/sim/reset` calls), and `validate()` reads the same
      schedule.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A silent wrong result, never `minor` under the 0.4.0 severity
      definition.  The simulated time the library reported for a state, in
      the runner, in every streamed frame and in `gm.timestep` itself, was
      half (or another fraction of) the time the state had reached, and a
      caller converting steps to time with `n * gm.timestep` got the same
      error.  The states were right.  Not `critical`: it needs a
      sub-cycling group whose members' timesteps differ, and a node's own
      clock, or the group's largest timestep, shows the true value.
      `context_dependent` because whether a time label or wall-clock
      pacing feeds a decision is the program's choice.
    affected_components:
      - "maddening.core.graph_manager.GraphManager.timestep"
      - "maddening.core.graph_manager.GraphManager.base_timestep"
      - "maddening.core.graph_manager.GraphManager.validate"
      - "maddening.viz.runner.RealtimeRunner"
      - "maddening.viz.relay.StateRelay"
      - "maddening.viz.network.NetworkRelay"
      - "maddening.viz.renderer.GraphInfo"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0, on a graph with a sub-cycling coupling group: take the
      step as the GCD of the node timesteps with each such group's members
      replaced by the group's largest member timestep, and scale `sim_time`
      and every frame's time by its ratio to `gm.timestep`.  Alternatively,
      give a node its own clock and read that.  Attach a relay again after
      changing the graph's timesteps.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      `run_adaptive` notifies observers once per accepted step, and the
      relays add `gm.timestep` for each, not the accepted `dt`.  So a relay
      attached during an adaptive run counts steps of the fixed step.  This
      is unchanged and is not a sub-cycling effect; read `t_history` from
      the adaptive run's result instead.  A graph edited from another
      thread in the middle of a runner frame is clocked by the step read
      after each step, which is the step the next compile takes.
    verification:
      - "tests/core/test_graph_timestep_is_the_step_advance.py::test_every_node_advanced_n_steps_of_gm_timestep"
      - "tests/core/test_graph_timestep_is_the_step_advance.py::test_the_rate_dividers_count_in_gm_timestep"
      - "tests/core/test_graph_timestep_is_the_step_advance.py::test_validate_reports_the_schedule_compile_builds"
      - "tests/api/test_runner_and_relay_clock_the_step_advance.py::test_the_runner_and_the_relay_clock_the_real_step_advance"
      - "tests/api/test_runner_and_relay_clock_the_step_advance.py::test_the_clocks_keep_time_when_the_graph_is_edited_between_runs"
      - "tests/api/test_runner_and_relay_clock_the_step_advance.py::test_the_network_relay_stamps_each_message_with_the_real_advance"
      - "tests/api/test_runner_and_relay_clock_the_step_advance.py::test_a_server_reset_restarts_the_frames_clock"
    github_issue: null

  - anomaly_id: "MADD-ANO-097"
    title: "USD baseDt and the FMU default step read a _base_dt attribute that nothing set: USDWriter wrote 0.01 for every graph, and save_graph_to_usd gave the smallest node timestep rather than the graph's step"
    description: >
      `usd.writer.USDWriter`, `usd.serialization.save_graph_to_usd` and
      `fmi.model_description._master_timestep` all read
      `GraphManager._base_dt`, which no version of `GraphManager` ever set.
      `USDWriter` fell back to 0.01, so every stage it wrote said
      `maddening:baseDt = 0.01`: a graph stepping at 0.001 was described as
      stepping at 0.01.  The writer's own example writes the time code as
      the step index, so `baseDt` is what converts a frame back to seconds.
      `save_graph_to_usd` fell back to the smallest node timestep.  That is
      the step only when the timesteps divide each other and nothing
      sub-cycles: nodes at 0.002 and 0.003 (a step of 0.001) wrote 0.002,
      and a sub-cycling group of 0.01 and 0.02 (a step of 0.02) wrote 0.01.
      Both reproduced at v0.1.0, v0.2.0, v0.2.1, v0.3.0 and v0.3.1 (`git
      archive` of each tag, CPU, jaxlib 0.11.0).  Both writers also wrote
      `maddening:isMultirate` from the last compile, so a graph saved before
      its first compile was described as uniform-rate.
      On the FMU side, v0.3.0 and v0.3.1 declared a 0.001 step whatever the
      graph (MADD-ANO-078).  That entry's fix, during 0.4.0's development,
      made the default the smallest node timestep, which carried the same
      gap into the 0.4.0 development builds.  The `multi_clock` export
      added in the same cycle put a sub-cycled member on a clock of its own
