  - anomaly_id: "MADD-ANO-014"
    title: "Every explicit integrator converges at 1st order when a time-varying boundary input is supplied once per step, including the one named 4th-order"
    description: >
      `maddening.core.simulation.integrators` names its steppers after
      their classical orders, and `integrate_node` defaults to
      `method="rk4"`, documented as "Classical 4th-order Runge-Kutta".
      None of the four functions takes a time.  Every Runge-Kutta stage is
      therefore given the same `boundary_inputs` object the caller passed
      for the whole step, which is a zero-order hold on the input.  For an
      autonomous problem, or inputs constant over the step, that is exact
      and the classical orders are delivered.  For a genuinely
      time-varying input re-evaluated once per step -- the obvious way to
      drive a waveform through this API -- the hold contributes an
      O(dt^2) local error whatever the stages do with it, so the global
      order is 1 for all three methods.
      Measured at 0.4.0.dev0 on dx/dt = -x + u(t) with u(t) manufactured
      so that x*(t) = sin(2*pi*t) is exact, float64, over a
      10/20/40/80/160 step ladder to t = 0.75.  Observed temporal orders
      with the input frozen per step: euler 1.022, heun 1.017, rk4 1.016.
      The same ladder with the input constant instead gives 1.003, 2.005
      and 4.006, which locates the loss in the input handling and not in
      the stage arithmetic.
      A second, counter-intuitive consequence: under the frozen input rk4
      is not merely reduced to 1st order, it is also *less accurate* than
      euler at the same dt -- 7.03e-3 against 4.57e-3 relative at
      dt = 0.0047, a factor of 1.5 -- because the extra stages refine a
      term that is no longer dominant.  Choosing the higher-order method
      is not a conservative choice here.
      Related but distinct: MADD-ANO-012 records `HeartPumpNode.update`
      and its own `derivatives()` sampling the inflow waveform a timestep
      apart.  That is one node disagreeing with itself about when an input
      is read; this entry is about every stage of every method in this
      module reading it at the same time.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent, and silent in the direction that flatters the caller.
      Nothing fails, warns or looks wrong: the integration runs, the
      trajectory is smooth, and the state stays finite.  A method's name
      is the only statement of its order that most callers will read, and
      a downstream product that sized its timestep from "4th order" --
      expecting a 16x error reduction per halving and getting 2x -- would
      be running with roughly the error of a step 1000x larger than it
      budgeted for at dt = 0.005.  The relevance depends on whether the
      product drives any node with a time-varying boundary input, which
      `boundary_input_spec` shows is available on 7 of 11 nodes.
    affected_components:
      - "maddening.core.simulation.integrators.rk4_step"
      - "maddening.core.simulation.integrators.heun_step"
      - "maddening.core.simulation.integrators.integrate_node"
    affected_versions: ">=0.1.0"
    workaround: >
      Carry time as a state field with derivative 1 and read the forcing
      from it.  Each stepper builds its stage states as
      state + a_ij*dt*k_j, so such a field arrives at stage i holding
      exactly the Butcher node t + c_i*dt; the forcing is then read at the
      stage time and the full order returns -- measured 1.022 / 1.999 /
      4.002 on the same ladder.  This is exact rather than an
      interpolation and needs no API that does not already exist; the
      recipe is in the module docstring and in
      docs/algorithm_guide/solvers/explicit_integrators.md.  It requires
      calling euler_step/heun_step/rk4_step directly, because
      `integrate_node` passes `node.derivatives` through unaltered and has
      nowhere to put a stage time.  Two cheaper-looking alternatives were
      measured and do not reach 4: linear interpolation of the input
      between step endpoints caps rk4 at 2.000, and evaluating the frozen
      input at the step midpoint also caps it at 2.000.
    resolution_status: "partially_resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      What is resolved in 0.4.0 is the claim, not the behaviour: the
      docstrings and the algorithm guide now state the condition the order
      holds under, a full-order path is documented, and both regimes are
      pinned by measurement so neither can drift unnoticed.  What remains
      is that the degraded path is still the default and still silent --
      `integrate_node(node, ..., method="rk4")` with a per-step waveform
      converges at order 1 and nothing says so at runtime.  It cannot be
      detected from inside the steppers, which see an opaque dict and have
      no way to tell a constant from a sample of a waveform, so a warning
      is not available.  Adding an optional stage-time or callable-input
      argument would remove the trap at the cost of new public API on four
      functions with no in-tree callers; deferred rather than taken,
      because the measured full order is already reachable without it.
    verification:
      - "tests/verification/test_integrator_order.py"
    github_issue: null
  - anomaly_id: "MADD-ANO-016"
    title: "cloud/_skypilot.py was written against a SkyPilot API older than the supported floor"
    description: >
      From v0.1.0 to v0.3.1, `src/maddening/cloud/_skypilot.py` was
      byte-identical and written against SkyPilot's pre-0.7, pre-client-server
      API, while every release declared `skypilot>=0.11`; the 0.4.0 development
      line edited the module (the published ports, the container's credential
      environment) and kept every one of those calls until the port recorded
      below.  Every call in the
      module was therefore wrong against every version the package claims to
      support.  Verified against the installed sky 0.12.2:

        * `sky.launch(task, cluster_name=..., detach_run=True)` -- `detach_run`
          was removed with the client-server split, so the call raises
          `TypeError` before anything is provisioned;
        * `sky.launch`, `sky.status` and `sky.down` return a `RequestId`, which
          is a `str` subclass.  `sky.status(cluster_names=[name])[0]` therefore
          indexed a *character* rather than a cluster record, and
          `.get("handle", {})` on it raised
          `AttributeError: 'str' object has no attribute 'get'`.  Because a
          `RequestId` is a string, nothing failed at the indexing step: the
          error surfaced one call later, and inside a background thread;
        * `getattr(sky, config.cloud.upper(), None) or sky.GCP()` never matched
          for the two providers MADDENING's `[cloud]` extra installs -- the
          classes are `sky.RunPod` and `sky.Lambda`, not `sky.RUNPOD` -- so
          every `CloudSession` launch fell through to GCP, whatever the config
          said.  For `aws`/`gcp` the lookup hit but returned the class where
          the other branch returned an instance.

      Two `except Exception` handlers kept the breakage quiet.  `teardown_vm`
      logged `sky.down`'s failure and returned normally, which is
      indistinguishable from a successful release to every caller, so a
      `CloudSession.teardown()` reported a freed VM while the instance kept
      running and kept billing.  `monitor_preemption` polled `check_status`
      inside `except Exception: logger.debug` in a `while True` loop, so a
      status check that could never succeed produced an infinite silent loop
      and the preemption callback could never fire.

      The defect survived because there are two independent SkyPilot paths and
      only one was broken.  `CloudLauncher` -- the user-facing script/CLI path
      -- has used the client-server API since v0.1.0 across fourteen call
      sites and works: `cloud/launcher.py` is byte-identical from v0.1.0 to
      v0.3.1.  (An earlier revision said "since v0.2.0".)  `CloudSession` is the only importer of `_skypilot.py`
      (`cloud/session.py:329, 408-410`), and that path was plausibly never
      exercised against a real provider.  The test suite could not see it
      either: `tests/cloud/test_skypilot_ports.py` substituted a fake `sky`
      whose `launch(self, task, cluster_name, detach_run=True)` mirrored the
      stale signature and whose `status` returned a list of dicts, so the
      suite proved the module consistent with itself.
    severity: "major"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      No simulation result depends on this code: `_skypilot.py` provisions and
      releases cloud infrastructure and computes no physics.  A failed launch
      is loud at the call site once the API mismatch raises, and a failed
      teardown leaks an instance and its cost rather than producing a wrong
      number.  It is recorded as `major` rather than `minor` because a silent
      teardown failure is an unbounded, unattended financial exposure and
      because a launch silently redirected to a different cloud provider
      moves customer data to a jurisdiction the operator did not choose --
      neither is a safety property under IEC 62304, but both are the kind of
      defect a reviewer expects the registry to carry.
    affected_components:
      - "maddening.cloud._skypilot.launch_vm"
      - "maddening.cloud._skypilot.check_status"
      - "maddening.cloud._skypilot.teardown_vm"
      - "maddening.cloud._skypilot.monitor_preemption"
      - "maddening.cloud.session.CloudSession"
    affected_versions: ">=0.1.0"
    workaround: >
      Use `maddening.cloud.launcher.CloudLauncher`, which speaks the current
      SkyPilot API and is the path the shipped cloud examples use.  Do not
      rely on `CloudSession.teardown()` to have released anything, on any
      version: confirm with `sky status` and release by hand with
      `sky down <cluster>`.  On v0.3.1 and earlier the calls could not work
      at all; on 0.4.0 they are well formed but have never been observed
      against a live provider.  Do not rely on `PreemptionPolicy` for a spot
      instance either: on v0.3.1 and earlier the monitor could not detect a
      preemption, and on 0.4.0 it has never been seen to fire on a real one.
    resolution_status: "partially_resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      What is resolved in 0.4.0 is that the calls now match the library.  The
      four functions were ported to the client-server API following
      `cloud/launcher.py`'s existing call sites, and
      `tests/cloud/test_skypilot_api_contract.py` binds every `sky.*` call in
      the module against `inspect.signature` of the *installed* SkyPilot, so
      the next upstream API break fails in CI rather than on a provider.  The
      fake that hid the defect is rebuilt from the real signatures and held to
      them by the same test, so it cannot drift again.

      What is NOT resolved is the behaviour.  A signature-correct port is not
      a verified port: that `teardown_vm` actually releases an instance, that
      `check_status` reports what a real cluster is doing, and that
      `monitor_preemption` fires on a real spot preemption all need a live
      provider, and none of them has been observed.  The tests above establish
      only that the calls are well formed.  This entry stays
      `partially_resolved` until the Phase 4 RunPod session exercises a real
      launch, a real status poll, a real preemption and a real teardown; it
      must not be closed on a signature match.  Until then, an operator
      running `CloudSession` against a provider should confirm teardown with
      `sky status` as on earlier versions.
      The same reasoning sets `affected_versions`, which is open-ended.  An
      earlier revision closed it at 0.4.0 (">=0.1.0, <0.4.0"), which asserted
      that 0.4.0 is unaffected -- the one thing this paragraph says has not
      been established -- while the SOUP package counted the entry as
      reachable in 0.4.0.  The range closes when a live provider run does.
    verification:
      - "tests/cloud/test_skypilot_api_contract.py::TestTheModuleMatchesTheInstalledSkyPilot::test_every_call_binds_against_the_installed_signature"
      - "tests/cloud/test_skypilot_api_contract.py::TestTheModuleMatchesTheInstalledSkyPilot::test_sky_launch_no_longer_takes_detach_run"
      - "tests/cloud/test_skypilot_api_contract.py::TestEveryRequestIdIsResolved::test_no_request_returning_call_is_used_without_being_resolved"
      - "tests/cloud/test_skypilot_api_contract.py::TestTheFakeCannotDrift::test_the_fake_declares_no_parameter_the_real_sky_lacks"
      - "tests/cloud/test_skypilot_client_server_calls.py::TestTeardownVm::test_a_failing_teardown_raises_rather_than_logging_and_returning"
      - "tests/cloud/test_skypilot_client_server_calls.py::TestMonitorPreemption::test_a_permanently_raising_status_check_gives_up_loudly"
      - "tests/cloud/test_skypilot_client_server_calls.py::TestLaunchVm::test_the_cloud_the_config_names_is_the_cloud_that_is_used"
