  - anomaly_id: "MADD-ANO-039"
    title: "ShardedUnstructuredNode dropped the cells a node had past the layout's count, and gave a node no way to leave padding out of an integral"
    description: >
      Two silent miscounts on the unstructured path.  First,
      `partition_value` gathered `value[ids]` for the ids the layout owns and
      never compared `value.shape[0]` with the layout, and
      `ShardedUnstructuredNode` checked no cell count, so a node with more
      cells than its layout was accepted and the extra cells vanished.  A
      10-cell decay node on an 8-cell layout, two devices, returned 8 cells
      and an integral of 32.4 where the node's is 49.5.  Second,
      `shard_info` gave every shard `(offset, n_local_max)` -- the padded
      block length -- and nothing else, so a node on an uneven partition
      could not tell its own cells from the padding at the end of a short
      shard's block, and a node that summed its block summed the padding
      into its domain integral: a 7-cell source node on two devices (4 and 3
      cells) integrated 36.0 where the answer is 35.0, the padded slot
      having grown by `dt` a step like a cell.  Both measured on the 0.4.0
      tree before the fix (71479c7) and at v0.3.0 and v0.3.1 (`git archive`
      of each tag, same environment, the same numbers).
      `ShardedUnstructuredNode` first shipped in v0.3.0.
      Resolved in 0.4.0.  The wrapper refuses at construction a node any of
      whose per-cell state fields (every field but a domain integral) does
      not have one row per cell of the layout, naming the field and both
      counts, and `partition_value` refuses such a value for any other
      caller.  `shard_info` now also carries `"n_local"`, this shard's own
      cell count as a traced int32 scalar, so a node masks its padding with
      `jnp.arange(n_local_max) < shard_info["n_local"]`; the entry for axis
      0 is unchanged.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent: a node's cells disappeared from the sharded state with no
      error, and an integral on an uneven partition -- the normal case for a
      graph partitioner -- included padding the node had no means to
      exclude.  `major` for the first, which loses data outright.
      `context_dependent` because it needs a mismatched layout, or an
      integral on an uneven partition.
    affected_components:
      - "maddening.cloud.multigpu.sharded_unstructured.ShardedUnstructuredNode"
      - "maddening.cloud.multigpu.halo_unstructured.partition_value"
    affected_versions: ">=0.3.0, <0.4.0"
    workaround: >
      Before 0.4.0: build the layout from exactly the node's cells, and mask
      an integral with a partitioned static of ones
      (`StaticArray(np.ones(n), replication="partition", ...)`, which
      `partition_value` pads with zeros).
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The count is offered, not imposed: a node that sums its whole block
      without masking still integrates the padding.  The guide and the
      wrapper's docstring say how to mask it.
    verification:
      - "tests/cloud/multigpu/test_unstructured_layout_contract.py::test_a_node_whose_cell_count_is_not_the_layouts_is_refused_at_construction"
      - "tests/cloud/multigpu/test_unstructured_layout_contract.py::test_a_zero_d_field_that_is_not_a_domain_integral_is_refused_by_name"
      - "tests/cloud/multigpu/test_unstructured_layout_contract.py::test_partition_value_refuses_a_value_that_is_not_one_row_per_layout_cell"
      - "tests/cloud/multigpu/test_unstructured_layout_contract.py::test_shard_info_carries_each_shards_own_cell_count"
      - "tests/cloud/multigpu/test_unstructured_layout_contract.py::test_a_node_that_masks_with_the_count_integrates_only_its_cells"
    github_issue: null

  - anomaly_id: "MADD-ANO-040"
    title: "The sharded wrappers placed a domain integral carried in the state like a grid field: an integral-emitting node could not run in a graph"
    description: >
      A node that returns a domain integral carries it in its state when it
      declares the integral's initial value (which a `run_scan` carry needs)
      or when a graph feeds a step's output back (a second `step()`).  Both
      wrappers then placed the integral like a per-cell field.
      `ShardedUnstructuredNode` partitioned it with `P(mesh_axis)`: a scalar
      integral fed back was given a partition spec "too long" for it and the
      step failed, and one declared in `initial_state` failed earlier, with
      an `IndexError` from partitioning a 0-d array.  `ShardedStencilNode`
      split it along the sharded spatial axis: a scalar escaped (it has no
      such axis), but a vector integral -- a 3-component drag on two devices
      -- failed with an `IndivisibleError` from
      `device_put`, and in the 0.4.0 development tree with a false "3
      cells" refusal at construction; a per-shard (unreduced) integral,
      new in this cycle, fed back by a graph was refused as a grid "changed
      by a parameter".  Reproduced on the 0.4.0 tree before the fix
      (71479c7), and at v0.2.1, v0.3.0 and v0.3.1 (`git archive` of each
      tag, same environment) -- the unstructured cases from v0.3.0, where
      that wrapper first shipped, the stencil vector case from v0.2.1, where
      domain integrals did.  Loud, not silent: every failure is an
      exception.  (A vector integral whose length the device count divides
      was split without an error, and set the block size `shard_info`
      reports; that is MADD-ANO-056.)
      Resolved in 0.4.0: in both wrappers a domain integral carried in the
      state is placed exactly as the step returns it -- replicated once
      reduced, stacked along its unreduced mesh axes otherwise, by
      `initial_state` and on the way into the step -- and reaches
      `update_padded` unpadded.  Such a node runs three `step()`s and a
      `run_scan` under either wrapper, matching the unsharded graph.
    severity: "minor"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      Every failure raised; no wrong number was ever returned.  It blocked a
      documented configuration (an integral-emitting node inside a graph)
      rather than corrupting one.
    affected_components:
      - "maddening.cloud.multigpu.sharded_unstructured.ShardedUnstructuredNode"
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
    affected_versions: ">=0.2.1, <0.4.0"
    workaround: >
      Before 0.4.0: step the wrapper directly and drop the integral key from
      the state before each step; do not declare a vector integral in
      `initial_state` under `ShardedStencilNode`.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The fix as first merged in the 0.4.0 development tree was incomplete
      in two ways, both closed before 0.4.0: an integral that
      `state_fields()` also lists -- the default lists every
      `initial_state` key -- still failed under both wrappers (the step's
      output was classified as a grid field first), and handing the
      integral to each shard whole made `ShardedStencilNode` read it as the
      block size it reports in `shard_info`, silently, where a misplaced
      integral had mostly raised (MADD-ANO-056).  "None known", which this
      said, was written before either was found.  None known beyond them.
    verification:
      - "tests/cloud/multigpu/test_integral_listed_as_state_field.py::test_an_integral_listed_in_state_fields_is_summed_over_the_shards"
      - "tests/cloud/multigpu/test_unstructured_layout_contract.py::test_a_domain_integral_fed_back_as_state_steps_again"
      - "tests/cloud/multigpu/test_unstructured_layout_contract.py::test_a_node_declaring_its_integral_runs_in_a_graph_like_the_unsharded_node"
      - "tests/cloud/multigpu/test_unstructured_layout_contract.py::test_a_node_without_an_initial_integral_steps_in_a_graph"
      - "tests/cloud/multigpu/test_stencil_domain_integral_state.py::test_a_vector_domain_integral_in_the_state_runs_in_a_graph_like_the_unsharded_node"
      - "tests/cloud/multigpu/test_stencil_domain_integral_state.py::test_a_per_shard_domain_integral_fed_back_by_a_graph_steps_again"
      - "tests/cloud/multigpu/test_stencil_domain_integral_state.py::test_the_initial_value_of_an_integral_is_placed_as_the_step_returns_it"
    github_issue: null

  - anomaly_id: "MADD-ANO-041"
    title: "halo_exchange ignored a per-axis boundary key naming no exchanged mesh axis, and that axis took the edge fill"
    description: >
      `halo_exchange(boundary=<dict>)` looked each exchanged axis up with
      `boundary.get(mesh_axis, "edge")` and never looked at the keys, so a
      key naming no exchanged axis -- a misspelt axis name, most often --
      was ignored, and the axis it meant was filled `"edge"` in place of the
      mode asked for.  `{"device": "periodic"}` on a `"devices"` exchange of
      8 cells over 4 devices returned `[0, 0, 1, 2] ... [5, 6, 7, 7]` where
      periodic is `[7, 0, 1, 2] ... [5, 6, 7, 0]`, with no error; a misspelt
      *mode* was already refused.  `ShardedStencilNode` passes one mode
      string and was not affected.  Reproduced on the 0.4.0 tree before the
      fix (71479c7) and at v0.2.0, v0.2.1, v0.3.0 and v0.3.1 (`git archive`
      of each tag, same environment).
      Resolved in 0.4.0: a boundary dict key that names no mesh axis in
      `axes` is refused with a `ValueError` naming it and the axes the call
      exchanges.  An exchanged axis the dict leaves out still gets
      `"edge"`, as documented.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent: a misspelt axis key gave that axis the wrong halo fill with
      no error.  Graded `major`; it was `minor` until the 0.4.0 severity
      definition, because it needs a direct call of the exchange
      primitive with a per-axis dict, and the wrappers do not use one.  `context_dependent`
      because the wrong fill changes a stencil's boundary values.
    affected_components:
      - "maddening.cloud.multigpu.halo.halo_exchange"
    affected_versions: ">=0.2.0, <0.4.0"
    workaround: >
      Before 0.4.0: pass one mode string, or check each key of the dict
      against the mesh axes in `axes`.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.
    verification:
      - "tests/cloud/multigpu/test_stencil_static_halo_and_axis_map.py::test_a_boundary_dict_key_naming_no_exchanged_axis_is_refused"
      - "tests/cloud/multigpu/test_stencil_static_halo_and_axis_map.py::test_a_boundary_dict_key_naming_a_mesh_axis_this_call_does_not_exchange_is_refused"
      - "tests/cloud/multigpu/test_stencil_static_halo_and_axis_map.py::test_a_boundary_dict_of_exchanged_axes_fills_as_asked_and_defaults_to_edge"
    github_issue: null

  - anomaly_id: "MADD-ANO-042"
    title: "ShardedStencilNode accepted an empty axis_map and sharded nothing"
    description: >
      `ShardedStencilNode(node, mesh, axis_map={})` was accepted for a node
      with no sharded static, `LBMNode` among them: no spatial axis was
      sharded, so every device held and stepped the whole grid, and the
      wrapper returned the unsharded result at the cost of the wrapper.  For
      `HeatNode` the same call was refused, but by the check on its
      `grid_x` static ("declares shard_axis=0 but HeatNode shards spatial
      axes []"), which says nothing about the map.  Reproduced on the 0.4.0
      tree before the fix (71479c7) and at v0.2.0, v0.2.1, v0.3.0 and v0.3.1
      (`git archive` of each tag, same environment): an `LBMNode` wrapped
      with `{}` on four devices steps bit-identical to the unsharded node,
      its state placed `P(None, None, None)`.
      Resolved in 0.4.0: an empty `axis_map` is refused first, with a
      message saying nothing would be sharded and naming the node's halo
      axes to map, as `ShardedPointwiseNode` refuses a node it could not
      shard.
    severity: "minor"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      The numbers were right -- the unsharded node's, bit for bit.  What was
      silently lost is the sharding itself: memory and time on every device
      as if unsharded, which a user sizing a run on the wrapper would not
      expect.
    affected_components:
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
    affected_versions: ">=0.2.0, <0.4.0"
    workaround: >
      Before 0.4.0: always map at least one mesh axis to a spatial axis the
      node has a halo on.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.
    verification:
      - "tests/cloud/multigpu/test_stencil_static_halo_and_axis_map.py::test_an_empty_axis_map_is_refused_for_what_it_is"
    github_issue: null

  - anomaly_id: "MADD-ANO-043"
    title: "run_adaptive / run_adaptive_scan advanced a sub-cycled node by its rate divider times dt on every adaptive step"
    description: >
      A coupling group with `subcycling=True` over nodes of different
      timesteps is not multi-rate: `compile()` schedules every member at the
      group's macro timestep, so `run_adaptive` and `run_adaptive_scan`
      accept it.  Their step hands the coupled block one `runtime_dt`, and
      the block gave that `dt` to every node (`_get_dt`), while still
      sub-stepping the fast node `round(macro_dt / node_dt)` times per
      coupling pass.  Every sub-step was therefore the whole adaptive
      step, and the fast node advanced `divider * dt` per step while the
      rest of the graph advanced `dt`.  Measured with a node that
      integrates its own clock (`t <- t + dt`) coupled both ways to a slow
      node at 0.01 s, `run_adaptive(0.05, dt_initial=0.01, dt_max=0.01)`
      (CPU, jaxlib 0.11.0): the fast clock read 0.500 at timestep 0.001
      and 0.200 at 0.0025 while the slow clock and the accepted steps
      summed to 0.050; `run_adaptive_scan` read 0.49999967, and
      `run_scan` on the same graphs read 0.050.  Reproduced identically at
      v0.1.0 and v0.3.1 (`git archive` of each tag, same environment).  The
      multi-rate refusal beside it said "All nodes must share the same
      timestep", which is not what it enforced.
      Resolved in 0.4.0: a sub-cycled member's sub-step under a runtime
      `dt` is `dt * node_dt / macro_dt`, so its sub-steps cover `dt` at an
      integer ratio, and one adaptive step at `dt == macro_dt` is the
      compiled step to float32 rounding.  The refusal names the graph's
      rate dividers and the one way nodes of different timesteps can
      share an adaptive run.  Nothing else changes: an adaptive run of a
      group that does not sub-cycle is bit-identical to before (jaxlib
      0.10.2, 0.11.0 and 0.11.2).
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silently wrong physics on a documented configuration: the fast node
      of a sub-cycled group ran `divider` times further in time than the
      graph it is coupled to, with no error or warning, and the result is
      a plausible trajectory rather than a blow-up.  Graded `major` for
      that silence and for the size of the error (a factor of the rate
      divider in elapsed time).  `context_dependent` because it needs the
      adaptive steppers and a sub-cycled group of differing timesteps;
      `step`, `run` and `run_scan` were right, and whether a result built
      on the adaptive path matters is a property of the program using it.
    affected_components:
      - "maddening.core.graph_manager.GraphManager.run_adaptive"
      - "maddening.core.graph_manager.GraphManager.run_adaptive_scan"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: do not use the adaptive steppers on a graph with a
      sub-cycled group whose members have different timesteps; use
      `step` / `run_scan`, or give the group's members one timestep.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known from this fix.  The one related property it did not
      address was separate and pre-existing: a member whose timestep does
      not divide the macro timestep was rounded to a whole number of
      sub-steps, so it covered `divider * node_dt` per macro step rather
      than `macro_dt`, and the adaptive step kept that ratio.  That is
      MADD-ANO-046, resolved in the same release.  `compile()` now refuses
      such a group, so the configuration can reach neither the compiled
      step nor the adaptive one.
    verification:
      - "tests/core/test_adaptive_subcycled_group_dt.py::test_run_adaptive_advances_every_member_by_the_step"
      - "tests/core/test_adaptive_subcycled_group_dt.py::test_run_adaptive_scan_advances_every_member_by_the_step"
      - "tests/core/test_adaptive_subcycled_group_dt.py::test_the_adaptive_step_at_the_macro_timestep_is_the_compiled_step"
      - "tests/core/test_adaptive_subcycled_group_dt.py::test_the_multirate_refusal_says_what_it_enforces"
    github_issue: null

  - anomaly_id: "MADD-ANO-044"
    title: "On a multi-rate graph a coupling group's diagnostics, predictor history and IQN-IMVJ warm start came from solves the step discarded"
    description: >
      A coupling group with a rate divider above one solved on every base
      step, and `graph_step_multirate` kept its node states only on the
      steps it fires on (`step_count % divider == 0`), through `jnp.where`.
      The group's `_meta` slots were merged from every solve
      unconditionally, so between firings they held the solves the step
      had thrown away.  Everything that reads them inherited it:
      `coupling_diagnostics()` reported the discarded solves, the linear
      and quadratic predictors extrapolated from their states, and
      IQN-IMVJ warm-started from their secant columns.  Measured on a pair
      at 0.01 s fed the phase 0..9 of a clock at 0.001 s, whose applied
      solve (phase 0) contracts and whose discarded ones at phases 4-9 do
      not (CPU, jaxlib 0.11.0): the report read `iterations=10`,
      unconverged, on every base step between firings, beside applied
      solves that converged in 9 and then 1 passes; with
      `predictor="linear"` the state at the second firing was 8.7e12 and
      at the third 2.1e27, against a fixed point of 1.33; and one discarded
      solve changed the IQN-IMVJ warm start.  Reproduced at v0.1.0 and
      v0.3.1 (`git archive` of each tag, same environment) with the same
      predictor numbers.  In the 0.4.0 development tree the profiler's
      coupling statistics (at-cap fraction 0.9, converged fraction 0.1
      where every applied solve converged) and
      `windowed_loss(mask_unconverged=True)` (which zeroed a window whose
      one applied solve converged) read the same slots, and
      `strict_convergence=True` raised about a discarded solve on the
      first base step after a firing.
      Resolved in 0.4.0: the group's solve runs under a `lax.cond` on the
      firing predicate, so a base step that does not fire neither
      computes it nor touches the group's node states or `_meta` slots,
      which are therefore always the last applied solve's;
      `strict_convergence` checks only a step that keeps the solve (a
      batched `cond` under `vmap` runs both branches); and the profiler
      samples a multi-rate group only on the steps it fires on.  The node
      states are bit-identical to before, on jaxlib 0.10.2,
      0.11.0 and 0.11.2, wherever neither a predictor nor IQN-IMVJ was
      learning from a discarded solve, and a group at the base rate
      compiles to exactly the program it did.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      With `predictor="linear"` / `"quadratic"` or `acceleration="iqn-imvj"`
      the forward state itself was built on solves that were never
      applied: a wrong initial guess or warm start, which a solve that
      still converges corrects and one that stops at its cap does not.
      The measured case diverged, which is loud; a milder one gives a
      plausible state that is further from its fixed point than the cap
      and tolerance promise, with a report that describes a different
      solve.  Graded `major` for that.  `context_dependent` because it
      needs a multi-rate graph and a coupling group with a rate divider
      above one; without a predictor or IMVJ the node states were right
      and only the reported verdicts were wrong.
    affected_components:
      - "maddening.core.graph_manager.GraphManager.step"
      - "maddening.core.graph_manager.GraphManager.coupling_diagnostics"
      - "maddening.core.coupling.group.CouplingGroup.predictor"
      - "maddening.core.coupling.group.CouplingGroup.jacobian_reuse"
      - "maddening.core.simulation.profiler.profile_graph"
      - "maddening.sysid.windowed_loss"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: on a multi-rate graph, give a coupling group with a
      rate divider above one `predictor="none"` and an acceleration other
      than `iqn-imvj`, and read its diagnostics only on the base steps it
      fires on.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Between firings the report describes the group's most recent applied
      solve, not a step of its own.  Under `vmap` over states at different
      phases a batched `lax.cond` runs both branches and selects per
      element, and the gated strict check keeps the discarded solve from
      raising there too, which a test pins; the work is not saved in that
      case.
    verification:
      - "tests/core/test_multirate_group_meta_follows_firing.py::test_the_report_between_firings_is_the_last_applied_solve"
      - "tests/core/test_multirate_group_meta_follows_firing.py::test_strict_convergence_does_not_raise_about_a_discarded_solve"
      - "tests/core/test_multirate_group_meta_follows_firing.py::test_strict_convergence_still_raises_about_an_applied_solve"
      - "tests/core/test_multirate_group_meta_follows_firing.py::test_the_linear_predictor_learns_only_from_applied_solves"
      - "tests/core/test_multirate_group_meta_follows_firing.py::test_the_imvj_warm_start_is_carried_only_from_applied_solves"
      - "tests/core/test_multirate_group_meta_follows_firing.py::test_the_profiler_counts_each_applied_solve_once"
      - "tests/core/test_multirate_group_meta_follows_firing.py::test_the_sysid_mask_keeps_a_window_whose_applied_solve_converged"
      - "tests/core/test_multirate_group_meta_follows_firing.py::test_a_group_does_not_solve_on_a_step_it_does_not_fire_on"
      - "tests/core/test_multirate_group_meta_follows_firing.py::test_a_batched_step_keeps_each_elements_firing_rule"
    github_issue: null

  - anomaly_id: "MADD-ANO-045"
    title: "solver=\"fori\" with acceleration=\"iqn-imvj\" carried zero secant columns to the next step, so jacobian_reuse did nothing"
    description: >
      IQN-IMVJ carries the first `jacobian_reuse` secant columns of one
      step into the next.  The legacy `solver="fori"` loop runs
      `max_iterations` passes whatever happens and freezes the state once
      its criterion latches; every pass on the frozen state measures the
      same residual and the same raw output, and the IQN update shifted
      the resulting zero column into the secant matrices each time.  By the
      cap the warm-start window was all zeros, so a group that converged
      before its cap -- the normal case -- reused nothing.  `"fori"` was the
      only solver at v0.1.0 and the default through v0.3.1.  Measured on
      a scalar pair driven by a sine (CPU, jaxlib 0.11.0), at v0.1.0 and
      v0.3.1 (`git archive` of each tag): the stored warm-start window was
      all zeros after every step at `jacobian_reuse=3`.  In the 0.4.0
      development tree, where `"ift"` stops on the latching pass and keeps
      its columns, the two solvers then disagreed: on an affine three-DOF
      pair `"fori"` took 5 passes on every step with or without
      `jacobian_reuse=4` while `"ift"` took 2-3 from the second step on,
      and on a stiff spring pair they reported 3 against 4 iterations and
      states 2.3e-04 apart, against the documented solver parity.
      Resolved in 0.4.0: under `"iqn-imvj"` the `"fori"` loop appends a
      secant column only on a pass before its criterion latches, so it
      carries the latching pass's columns, as `"ift"` does.  On the affine
      pair the two solvers now report the same iterations and return the
      same state to the bit (jaxlib 0.11.0).  Every other acceleration
      and solver compiles to exactly the program it did.
    severity: "minor"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      The returned state still met the group's criterion, so it was within
      the tolerance the caller asked for; what was lost is the speed-up
      `jacobian_reuse` exists for, and the documented agreement between
      the two solvers, which differed within that tolerance.  No solve
      stopped short because of it.
