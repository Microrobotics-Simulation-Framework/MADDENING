  - anomaly_id: "MADD-ANO-112"
    title: "/ws/state encoded each frame on the event loop, once per client, for any number of clients: a large state stalled every other request"
    description: >
      The JSON state stream built each frame (`_jax_to_python` of the whole
      state, later `_json_reply`) synchronously in its async handler, on the
      event loop every other request is served from, and each client
      encoded the same snapshot again; nothing bounded the number of
      stream clients.  Checked at each tag, v0.1.0, v0.2.0, v0.2.1, v0.3.0
      and v0.3.1, on 2026-10-02 (`git archive` of each, CPU, jaxlib 0.11.0,
      FastAPI `TestClient`): the frame was encoded with an event loop
      running in the encoding thread.  On the 0.4.0 development tree the
      round-5 REST audit measured `GET /healthz` at up to 0.62 s with one
      client of a 256 x 256 lattice (15.6 MiB frames) and 2.65 s at 512 x
      512, against 5 ms without.  Resolved in 0.4.0: frames are encoded in
      a worker thread, a frame of the whole state is encoded once and sent
      to every client of it, the binary stream encodes off the loop too,
      and at most `MAX_STREAM_CONNECTIONS` (16) streams are open at once
      (1013 past it).  `/healthz` is answered on the event loop rather than
      by a worker thread.
    severity: "minor"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      A defect in performance: every frame and reply carried the right
      values, late.
    affected_components:
      - "maddening.api.server.SimulationServer.create_app"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: subscribe a stream to the fields it shows
      (`{"type": "subscribe", ...}`), use `/ws/state/binary` for large
      states, and keep the number of clients small.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Encoding a frame runs long C calls (`tolist`, `json.dumps`) that hold
      the interpreter lock, so a very large state still delays the event
      loop while it is encoded, though no longer per client: re-measured on
      the fixed tree, `GET /healthz` beside one client of the 256 x 256
      lattice took up to 0.30 s (0.62 s before).  Stream a large state with
      `/ws/state/binary`, or subscribe to the fields shown.  A client that
      subscribes to part of the state has its frames encoded for it alone.
    verification:
      - "tests/api/test_state_stream_encodes_off_the_event_loop.py::test_state_frames_are_encoded_off_the_event_loop"
      - "tests/api/test_state_stream_encodes_off_the_event_loop.py::test_a_frame_of_the_whole_state_is_encoded_once_for_every_client"
      - "tests/api/test_state_stream_encodes_off_the_event_loop.py::test_streams_past_the_cap_are_refused_with_1013"
