  - anomaly_id: "MADD-ANO-111"
    title: "The real-time runner burst through the time it had been paused: about 1.5 s simulated in the 0.4 s after a 1 s pause of a real-time run"
    description: >
      `RealtimeRunner` paced `sim_time - sim_start` against `wall -
      wall_start`, both fixed when its loop started, so time spent paused
      counted as time the simulation had fallen behind, and after `resume()`
      it stepped without sleeping until it had caught up.  Checked at each
      tag, v0.1.0, v0.2.0, v0.2.1, v0.3.0 and v0.3.1, on 2026-10-02 (`git
      archive` of each, CPU, jaxlib 0.11.0, a `BallNode` graph at
      `time_scale=1`): 1.50 s of simulated time passed in the 0.4 s after a
      1 s pause.  The same happened after any stall: a first compile, or
      (since this release's graph lock) a request holding the graph.  Found
      by the round-5 REST audit.  Resolved in 0.4.0: the runner paces from
      the resume, and a runner further behind its schedule than
      `max_catch_up` (0.25 s by default) moves its schedule to the present
      instead of stepping flat out to catch up.
    severity: "minor"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      A defect in pacing: every step computed the same values, at the wrong
      wall-clock moments.  The live view ran fast for as long as the pause
      had lasted.
    affected_components:
