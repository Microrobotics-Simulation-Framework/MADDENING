  - anomaly_id: "MADD-ANO-033"
    title: "ShardedStencilNode stepped with dt rounded to float32 under jax_enable_x64"
    description: >
      `ShardedStencilNode.update` passed `dt` into its `shard_map` as
      `jnp.asarray(dt, dtype=jnp.float32)`, whatever precision the graph
      runs in.  Under `jax_enable_x64` a float64 stencil node therefore
      stepped with `float32(dt)` when sharded -- for `dt = 0.1`, 0.1 +
      1.49e-09, 1.5e-08 relative -- and with the exact `dt` unsharded.
      `ShardedUnstructuredNode` never cast, so the two wrappers also
      disagreed with each other.  Measured on a float64 decaying diffusion
      (16 cells, `k = 1`, `D = 0.1`, periodic, two devices, CPU, jaxlib
      0.11.0): after 1000 steps of `dt = 0.1` the sharded field is 1.66e-06
      relative from the unsharded one, against a float64 epsilon of
      2.2e-16, and the gap grows with the simulated time.  Without x64 the
      state and `dt` are both float32 and nothing differs.  Reproduced at
      v0.2.0, v0.3.0 and v0.3.1 (`git archive` of each tag, same
      environment, the same 1.6568e-06); the cast dates from the wrapper's
      first commit (3601f55).
      Resolved in 0.4.0: `dt` is passed as given (`jnp.asarray(dt)`).  A
      Python float stays weakly typed, so a float32 state still steps in
      float32 and a float64 one in float64; in the measurement above the
      sharded and unsharded fields are now bit-identical.
    severity: "minor"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent, but small: a relative error of about 1.5e-08 in the time step,
      accumulating linearly (1.7e-06 relative over 1000 steps above).  It
      matters only where float64 precision was enabled for a reason -- a
      long integration, a tight comparison against an unsharded or
      reference run -- and there it quietly returned float32-grade time
      stepping.  `context_dependent` because it needs `jax_enable_x64`, a
      float64 stencil node, sharding, and a `dt` that is not exactly
      representable in float32.
    affected_components:
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
    affected_versions: ">=0.2.0, <0.4.0"
    workaround: >
      Before 0.4.0: choose a `dt` exactly representable in float32 (a
      binary fraction such as 0.125), or run the node unsharded where
      float64 time stepping matters.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.
    verification:
      - "tests/cloud/multigpu/test_sharded_stencil_node.py::test_a_float64_node_steps_with_a_float64_dt_when_sharded"
    github_issue: null

  - anomaly_id: "MADD-ANO-034"
    title: "LBMNode's wall_mask was dropped by every save/reload: the reloaded graph ran with no walls"
    description: >
      `LBMNode(wall_mask=...)` kept the mask on the node and did not record
      it in `params`.  Every path that rebuilds a node from a saved graph
      calls `cls(name=, timestep=, **params)` -- `GraphManager.from_dict` on
      a `to_dict()` config, `load_graph_from_usd` on a stage written by
      `save_graph_to_usd` -- so the rebuilt node had no walls, the
      `wall_mask` field of its state was all zero, and the reloaded graph
      ran a wall-free domain with no error or warning.  Nothing else in the
      config differed, so nothing flagged it.  A provenance record carrying
      the config had the same hole.  Measured on a 12 x 8 D2Q9 channel with
      walls on both long sides and one obstacle cell, driven by a uniform
      body force of 2e-5 for 30 steps (CPU, jaxlib 0.11.0): the original
      graph's peak speed is 4.73e-4 and the reloaded graph's 6.10e-4, and
      the two velocity fields differ by more than the original's peak
      speed, because the reloaded channel has no walls to hold the flow.
      `POST /graph/nodes` could not build a walled node at all: a JSON body
      carries the mask as nested lists, and the constructor read
      `wall_mask.shape`.  Reproduced at v0.1.0, v0.2.0, v0.2.1, v0.3.0 and
      v0.3.1 and on the audited 0.4.0 tree (`git archive` of each, one
      script: 32 wall cells before the config round trip, 0 after).
      Resolved in 0.4.0: the constructor records the mask in `params` as
      nested lists of bool, the JSON-faithful spelling `HeatNode` already
      uses for `grid_points`, and accepts any array-like.  A node built
      without a mask writes no key, so a wall-free node's config is
      unchanged.  The mask is structural: it is not a leaf of the parameter
      pytree, and `PUT /graph/params` refuses a new mask for a running node
      and writes nothing, because the step reads the mask the constructor
      built.  The same sweep over every built-in node's constructor
      arguments found one more loss, `AdaptiveNode(dtype=...)`, which no
      release carried and which is fixed in the same change.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent and total for the geometry: a reloaded walled flow runs as if
      the domain were open, and every quantity downstream of it (wall shear,
      flow rate, pressure drop) is wrong while the graph otherwise looks
      identical.  It reaches every workflow that saves a graph and runs it
      again -- a resumed or replayed study, a configuration shipped to
      another machine, a result reproduced from its provenance record.
      `context_dependent` because it needs an `LBMNode` built with a
      `wall_mask` and a save/reload between construction and use; a graph
      built and run in one process is unaffected.
    affected_components:
      - "maddening.nodes.lbm.LBMNode"
      - "maddening.core.graph_manager.GraphManager.from_dict"
      - "maddening.usd.serialization.load_graph_from_usd"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: rebuild the `LBMNode` with its `wall_mask` after loading
      the graph, and replace the loaded node with it before compiling; or
      keep the graph in the process that built it.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A config now carries the mask as nested lists of bool, about seven
      bytes per cell (some 460 kB for a 64 x 32 x 32 grid).  Large but
      faithful; nothing is dropped to keep it small.
    verification:
      - "tests/nodes/test_lbm_wall_mask_round_trip.py::test_a_config_round_trip_through_json_steps_the_same_flow"
      - "tests/nodes/test_lbm_wall_mask_round_trip.py::test_a_usd_round_trip_steps_the_same_flow"
      - "tests/nodes/test_lbm_wall_mask_round_trip.py::test_a_node_rebuilt_from_its_params_has_the_same_walls"
      - "tests/nodes/test_lbm_wall_mask_round_trip.py::test_the_fixture_can_express_a_lost_mask"
      - "tests/nodes/test_builtin_node_round_trip.py::test_a_reloaded_built_in_node_writes_builds_and_steps_as_the_original"
      - "tests/nodes/test_builtin_node_round_trip.py::test_a_usd_reloaded_built_in_node_writes_builds_and_steps_as_the_original"
      - "tests/nodes/test_builtin_node_round_trip.py::test_every_built_in_node_has_a_round_trip_case"
      - "tests/api/test_params_endpoint_constructed_values.py::test_a_new_lbm_wall_mask_is_refused_and_the_saved_graph_keeps_the_running_walls"
    github_issue: null

  - anomaly_id: "MADD-ANO-035"
    title: "ShardedUnstructuredNode reads a global-order state as partition layout on a balanced partition not in global order"
    description: >
      `ShardedUnstructuredNode` steps a state in partition layout:
      `n_devices * n_local_max` rows, shard by shard, each shard's cells in
      `local_global_ids` order.  It checks a written state only by its
      leading axis.  On a balanced partition -- every shard full, so
      `n_devices * n_local_max == n_global` -- whose cells are not in
      global order, a state written in global cell order with
      `GraphManager.set_node_state` has exactly the partition-layout shape.
      It is stored without a word and read as partition layout, so each
      cell steps from another cell's value.  On an interleaved 8-cell ring
      over 2 devices (cells 0, 2, 4, 6 on the first, 1, 3, 5, 7 on the
      second) `x = [1, ..., 8]` written in global order is read, by
      `gather_global` and by the step, as `[1, 5, 2, 6, 3, 7, 4, 8]`.  The
      docstring of `update` has said so since 0.4.0 (#151).  A partition
      with padding (unbalanced) is refused by shape, and a balanced
      partition in global order (each device a contiguous ascending block)
      reads both spellings alike, so only the balanced, reordered case is
      silent.  Present since the wrapper was introduced in 0.3.0
      (`git archive` of v0.3.0 and v0.3.1, same reproducer, same
      permutation).  The per-cell boundary input in the same situation is
      refused since 0.4.0; the state is not, because the documented
      partition-layout spelling has the same shape as the global-order one
      and a refusal would refuse it too.  Telling them apart needs an
      explicit layout on the state write, an API change scheduled for
      0.5.0.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent and total for the state it touches: every cell takes another
      cell's value, so the field that is stepped is a permutation of the
      field that was written, and nothing reports it.  Writing an initial
      condition in global cell order is the natural spelling, and a
      balanced partition is the common case whenever the cell count divides
      evenly.  `context_dependent` because it needs a `ShardedUnstructuredNode`,
      a partition whose shards are all full and whose cells are not in
      global order, and a whole state written from outside (not the one
      `initial_state()` builds, nor a checkpoint of the same graph).
    affected_components:
      - "maddening.cloud.multigpu.sharded_unstructured.ShardedUnstructuredNode"
      - "maddening.core.graph_manager.GraphManager.set_node_state"
    affected_versions: ">=0.3.0"
    workaround: >
      Either renumber the cells so that each device owns a contiguous,
      ascending block of global ids -- relabel them in the order
      `np.argsort(partition_assignment, kind="stable")`, after which global
      order and partition layout are the same array -- or convert a
      global-order state with
      `partition_value(value=state, layout=node.layout).reshape(n_devices * n_local_max, ...)`
      before writing it with `set_node_state`.
    resolution_status: "open"
    verification:
      - "tests/cloud/multigpu/test_sharded_boundary_inputs.py::test_a_global_order_state_on_a_balanced_interleaved_partition_is_read_as_partition_layout"
      - "tests/cloud/multigpu/test_sharded_boundary_inputs.py::test_a_global_order_state_on_a_balanced_partition_steps_the_cells_it_names"
      - "tests/cloud/multigpu/test_sharded_boundary_inputs.py::test_the_workaround_a_state_converted_with_partition_value_steps_the_cells_it_names"
      - "tests/cloud/multigpu/test_sharded_boundary_inputs.py::test_the_workaround_renumbered_cells_read_a_global_order_state_correctly"
    github_issue: null

  - anomaly_id: "MADD-ANO-036"
    title: "A config round trip dropped a node's sharding with no word: the reloaded graph ran unsharded"
    description: >
      The sharded wrappers' `to_dict` delegates to the wrapped node and
      appends `sharded` and the wrapper's settings -- `axis_map` and
      `boundary` for `ShardedStencilNode`, `shard_axes` for
      `ShardedPointwiseNode`, `sharding`, `n_devices` and `exchange` for
      `ShardedUnstructuredNode` -- so a config records the wrapped node's
      type.  `GraphManager.from_dict` ignored every one of those keys and
      rebuilt a plain single-device node, without a warning: a graph saved
      to run across devices reloaded to run on one.  Reproduced at v0.2.0,
      v0.3.1 and the audited 0.4.0 tree (`git archive` of each, a
      `HeatNode` behind a two-device `ShardedStencilNode`: the config
      records `sharded`, `axis_map`, `boundary`; the reload is a
      `HeatNode` and nothing is said).  The whole-tree audit had pinned it
      as a strict xfail (W7) pending a decision.
      Partially resolved in 0.4.0 by making the loss loud rather than by restoring
      the wrapper.  Restoring needs the device mesh -- and, unstructured,
      the partition layout -- which a config does not carry and the
      loading machine need not have; refusing would block the only reload
      of a graph that computes the right numbers, because a wrapper
      computes the wrapped node's model.  So `from_dict` rebuilds the node
      unsharded and emits a `UserWarning` naming the node, the wrapper,
      the settings the config recorded and the
      `maddening.surrogates.replace.replace_node(gm, name, <wrapper>(...))`
      call that wraps it again before `compile()`.
    severity: "minor"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      For every built-in node the reloaded, unsharded graph computes the
      same numbers as the sharded one (the wrappers reproduce the node or
      refuse at construction since 0.4.0), so what was lost silently was
      where the graph ran, not what it computed: a run sized for several
      devices on one, slower or out of memory.  `context_dependent`
      because a user node whose sharded step is not its unsharded one --
      a halo fill it does not declare -- would change its numbers on the
      reload, and in releases before 0.4.0 a sharded `LBMNode` was such a
      node (MADD-ANO-025).
    affected_components:
      - "maddening.core.graph_manager.GraphManager.from_dict"
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
      - "maddening.cloud.multigpu.sharded_node.ShardedPointwiseNode"
      - "maddening.cloud.multigpu.sharded_unstructured.ShardedUnstructuredNode"
    affected_versions: ">=0.2.0"
    workaround: >
      Before 0.4.0: after `from_dict`, wrap the node again and swap it in
      with `replace_node` before `compile()`, using the `axis_map` /
      `boundary` / `shard_axes` the config recorded beside the node.  From
      0.4.0 the same for a config (the warning names the call).  A USD
      stage of a sharded graph cannot be loaded at all: save the graph
      with `to_dict()` instead, or save the unsharded graph to USD and wrap
      the node after loading.
    resolution_status: "partially_resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Live in 0.4.0, which is why this entry is partially resolved rather
      than resolved: the USD half of the same round trip.  The USD writer
      records the wrapper's qualified class name and the loader calls it
      as `cls(name=..., timestep=..., **params)`, which no wrapper
      accepts, so `save_graph_to_usd` succeeds on a graph with a sharded
      node and `load_graph_from_usd` then raises `TypeError` -- loudly,
      but the stage cannot be read back.  Pinned as a strict xfail
      (test_a_usd_round_trip_reloads_a_graph_containing_a_sharded_node),
      which fails the run when the representation is decided.
      The config wrapper is still not restored, by design: a config
      describes the model, not the devices, and the reload says so.
    verification:
      - "tests/cloud/multigpu/test_property_sharded_round_trips.py::test_a_config_round_trip_of_a_sharded_node_warns_and_reloads_it_unsharded"
      - "tests/cloud/multigpu/test_property_sharded_round_trips.py::test_every_sharded_wrapper_is_named_with_its_recorded_settings"
      - "tests/cloud/multigpu/test_property_sharded_round_trips.py::test_the_pointwise_and_unstructured_wrappers_write_the_markers_the_loader_reads"
      - "tests/cloud/multigpu/test_property_sharded_round_trips.py::test_an_unsharded_config_loads_without_a_warning"
      # What stays open: the USD half, a strict xfail.
      - "tests/cloud/multigpu/test_property_sharded_round_trips.py::test_a_usd_round_trip_reloads_a_graph_containing_a_sharded_node"
    github_issue: null

  - anomaly_id: "MADD-ANO-037"
    title: "ShardedUnstructuredNode accepted a Cartesian stencil node and stepped it wrong, every cell, with no error"
    description: >
      `ShardedUnstructuredNode` hands the inner node's `update_padded` its
      fields in partition layout -- `[the shard's own cells | ghost cells]`,
      the own block padded to `n_local_max` -- and `shard_info = {0:
      (offset, n_local_max)}`.  A Cartesian stencil node (non-empty
      `halo_width()`) reads its padded fields as `[halo | interior | halo]`.
      The wrapper documented `halo_width()` as "ignored" and checked only the
      mesh size and the partitioned statics, so it accepted such a node and
      the node read its own cells as halo and its ghosts as interior.
      Measured on the built-in nodes against the unsharded node (CPU,
      jaxlib 0.11.0, float32, 10 steps, a chain partition into contiguous
      blocks): on the 0.4.0 tree before the fix (71479c7), a 16-cell
      `HeatNode` rod with both ends held was 43.1 K off on two devices and
      52.6 K on four, every cell wrong and cell 0 never updated; a 16x8 D2Q9
      `LBMNode` had a 100% velocity error on two devices; `HeatNode(17)`
      failed on its first step with a false "n_cells was changed after the
      state was built".  At v0.3.0 and v0.3.1 (`git archive` of each tag,
      same environment) the rod was 66.2 K off on two devices and 65.3 K on
      four, the 17-cell rod ran 95.3 K off, and the LBM velocity error was
      100%.  `ShardedUnstructuredNode` first shipped in v0.3.0.  During the
      0.4.0 cycle it was also recommended for exactly this: the stencil
      wrapper's divisibility refusal and the sharding-topology guide said to
      use it for a grid the device count does not divide, and the guide
      called the `update_padded` contract identical across wrappers.
      Resolved in 0.4.0: `ShardedUnstructuredNode` refuses at construction a
      node that declares a non-empty `halo_width()`, naming the halo, the
      layout it would misread, and `ShardedStencilNode` as the wrapper to
      use.  A node written for the partition layout declares an empty
      `halo_width()`; one whose `update_padded` reads both layouts can say so
      with a private, provisional `_reads_partition_layout = True`.  The
      stencil wrapper's refusal and the guide no longer point a stencil node
      at the unstructured wrapper (only a pointwise node, for which the
      advice works), and the guide describes the two layouts.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silently and grossly wrong: a documented wrapper accepted a built-in
      node, ran finite, and returned a field wrong at every cell (tens of
      kelvin on a 350 K rod, 100% on an LBM velocity) with no error or
      warning; in the 0.4.0 development tree a refusal message recommended
      the configuration.  `context_dependent` because it needs a Cartesian
      stencil node wrapped in `ShardedUnstructuredNode`; whether a result
      built on it matters is a property of the program using it.
    affected_components:
      - "maddening.cloud.multigpu.sharded_unstructured.ShardedUnstructuredNode"
    affected_versions: ">=0.3.0, <0.4.0"
    workaround: >
      Before 0.4.0: wrap a Cartesian stencil node with `ShardedStencilNode`,
      sizing each sharded axis to a multiple of its device count.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The refusal reads `halo_width()`.  A node that declares no halo but
      whose `update_padded` still assumes a Cartesian layout is not
      detected, and a node that sets the private opt-in is trusted.
    verification:
      - "tests/cloud/multigpu/test_unstructured_layout_contract.py::test_a_cartesian_stencil_node_is_refused_by_the_unstructured_wrapper"
      - "tests/cloud/multigpu/test_unstructured_layout_contract.py::test_only_an_explicit_opt_in_lets_a_node_with_a_halo_through"
      - "tests/cloud/multigpu/test_unstructured_layout_contract.py::test_the_stencil_divisibility_refusal_does_not_point_a_stencil_node_at_the_unstructured_wrapper"
      - "tests/cloud/multigpu/test_unstructured_layout_contract.py::test_the_pointwise_divisibility_refusal_gives_advice_that_works_when_followed"
    github_issue: null

  - anomaly_id: "MADD-ANO-038"
    title: "ShardedStencilNode edge-filled a sharded static's global halos under a periodic wrapper"
    description: >
      `ShardedStencilNode` halo-exchanged every `StaticArray(replication=
      "shard")` with `boundary="edge"`, whatever the wrapper's own
      `boundary`, on the stated reasoning that "statics don't evolve, so
      periodic wrap would be wrong even when state uses periodic" (the
      node contract and the static-data guide said the same).  The halo
      fill is a question about space -- which cells lie beyond the edge --
      and on a periodic grid those are the opposite edge's cells, for a
      static as much as for the state.  A periodic node that read a static
      in its halo therefore saw its own edge cell where the unsharded node
      sees the opposite one.  Measured on a 16-cell periodic diffusion whose
      coefficient is a sharded static read at the faces (CPU, jaxlib
      0.11.0, float32, 20 steps): 1.9e-2 off on a field of 0.66, every
      cell, on 1, 2 and 4 devices on the 0.4.0 tree before the fix
      (71479c7).  At v0.2.1, v0.3.0 and v0.3.1 (`git archive` of each tag,
      same environment) the same 1.9e-2 on 2 and 4 devices; one device was
      right there only because the pre-0.4.0 one-device exchange wrapped
      whatever `boundary` said (MADD-ANO-028).  Sharded statics first
      shipped in v0.2.1; v0.2.0 passed none.  No built-in node is affected:
      `HeatNode` is wrapped with `"edge"` and does not read `grid_x` on the
      sharded path, and `LBMNode` carries its wall mask in the state.
      Resolved in 0.4.0: a sharded static's global halos are filled
      periodically when the wrapper is `"periodic"`; under `"edge"` and
      `"zero"`, where there is no cell beyond the edge, they keep the edge
      fill they always had.  The periodic node above now matches the
      unsharded one to float32 rounding (6e-8) on 1, 2 and 4 devices, and an
      equivalence sweep of the built-in stencil nodes (HeatNode orders 2 and
      4, LBMNode D2Q9 with walls and an obstacle at the global edges, D3Q19;
      130 configurations) is identical before and after the change.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent and systematic -- every cell, about 3% after 20 steps in the
      measurement above -- on a public, STABLE wrapper.  Graded `major`; it
      was `minor` until the 0.4.0 severity definition, because it needs a
      custom periodic stencil node that reads a sharded static in its halo
      and no built-in node does.
      `context_dependent` because whether a result built on it matters is a
      property of the program using it.
    affected_components:
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
    affected_versions: ">=0.2.1, <0.4.0"
    workaround: >
      Before 0.4.0: re-pad the interior of `static_padded[<key>]` inside
      `update_padded` with the periodic fill the node needs, or keep the
      static replicated (`replication="replicate"`) and slice it with
      `shard_info`.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Under `"zero"` a static's global halo repeats the edge cell rather than
      holding zeros; that is the documented behaviour, and a node that needs
      another value there builds it from `shard_info`.
    verification:
      - "tests/cloud/multigpu/test_stencil_static_halo_and_axis_map.py::test_a_periodic_node_reading_a_sharded_static_in_its_halo_matches_unsharded"
      - "tests/cloud/multigpu/test_stencil_static_halo_and_axis_map.py::test_a_sharded_statics_global_edge_halo_follows_the_documented_fill"
