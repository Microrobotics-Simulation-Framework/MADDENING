  - anomaly_id: "MADD-ANO-048"
    title: "PUT /graph/params accepted values the node's own constructor refuses, so a graph saved after the write could not be loaded"
    description: >
      `to_dict()` saves each node as its class and params and `from_dict()`
      calls the class with them, so a value the constructor refuses is one
      a saved graph cannot load.  `PUT /graph/params/{node}` did not ask the
      constructor.  At v0.1.0 to v0.3.1 it asked nothing: on a multiphase
      `LBMPipeNode` (`G = -5`, `rho_liquid = 2.0`, `rho_gas = 0.2`)
      `rho_gas = 3.0` and `tau = 0.45` were each answered 200 and saved,
      and `from_dict()` raised `rho_liquid must be > rho_gas (got 2.0 <=
      3.0)` and `tau must be > 0.5` (`git archive` of v0.1.0, v0.2.0 and
      v0.3.1, CPU, jaxlib 0.11.0).  MADD-ANO-024's fix asked the
      constructor about a *structural* key only, one key at a time and
      against the constructor's own values, so on the 0.4.0 development
      tree (71479c7) a live leaf of the params pytree still skipped it:
      `rho_gas = 3.0` was answered 200, the running tracer read it (and was
      clipped to [0, 1] without a word) and the save did not load; a
      `HeatNode` (16 cells, `dt = 1`) took a `thermal_diffusivity` at
      Fourier number 0.6, above the 0.5 its constructor refuses since 0.4.0
      (MADD-ANO-009), and `from_dict()` raised "timestep 1.0 is unstable".
      Two values each acceptable alone but not together (`rho_gas = 1.5`
      with `rho_liquid = 1.0`), and a value refused only against a live
      value a fit had moved, passed as well.
      Partially resolved in 0.4.0, in the route: it builds the node from
      the params a save would carry -- the effective params, every live
      leaf included -- with every changed key of the request applied at
      once, before anything is written, and a constructor refusal is a 400
      naming the key(s) and the constructor's message, with nothing
      written.  A write that does not come through the route is not asked
      (residual_risk).
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      The loss is loud where it lands -- the saved config raises on load --
      but it lands late, after the write was confirmed, reported and
      saved, and by then the only record of the run cannot be reloaded.
      In between the running graph computes with a value its constructor
      refuses: a rod above its stability limit diverges (visibly), a pipe
      whose gas is denser than its liquid clips its phase indicator
      silently.  Graded `major` for that silent clipping, and for a running
      graph computing with a value its own constructor refuses.  It was
      `minor` until the 0.4.0 severity definition, because the failure
      announces itself at the reload.
      `context_dependent` because it needs a run-time write of a value the
      constructor validates: through the REST route before 0.4.0, and
      through `gm.params` or a fit since.
    affected_components:
      - "maddening.api.server.SimulationServer"
      - "maddening.core.graph_manager.GraphManager.to_dict"
    affected_versions: ">=0.1.0"
    workaround: >
      Before 0.4.0: keep a value written through `PUT /graph/params` within
      what the node's constructor accepts -- construct the node with it
      in-process first if unsure -- and check that a saved config reloads.
      From 0.4.0, the same for a value written into `gm.params` or moved by
      a fit: bound the parameter's `ParamSpec` inside what the constructor
      accepts (a `HeatNode`'s `thermal_diffusivity` below its Fourier
      limit, an `LBMPipeNode`'s `rho_gas` below its `rho_liquid`), and
      check that the saved config reloads before relying on it.
    resolution_status: "partially_resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Live in 0.4.0, which is why this entry is partially resolved rather
      than resolved: the check lives in the route, and a write that reaches
      the params pytree another way -- a direct `gm.params` write, and so a
      fit -- is not asked the constructor's question.  `to_dict()` saves
      such a value without a word and `from_dict()` then refuses the saved
      graph, the defect this entry records, on two built-in nodes (CPU,
      jaxlib 0.11.0, a fresh graph per case): a `HeatNode` (16 cells,
      length 1, `dt = 1`) whose `thermal_diffusivity` is written to Fourier
      number 0.6, past the 0.5 its constructor refuses ("timestep 1.0 is
      unstable"); an `LBMPipeNode` (multiphase, `rho_liquid = 2.0`) whose
      `rho_gas` is written to 3.0 ("rho_liquid must be > rho_gas"); and a
      `HeatNode` whose `length` is written to -1.0.  The running graph
      steps on, finite, for the steps tried.  A fit can reach the first two,
      since both specs are bounded below only; the negative length needs a
      direct write, its spec being log-transformed.  The route's
      constructor check itself is unchanged: it asks a node its class
      rebuilds from its params, and one that is not rebuilt that way (a
      wrapper, a node whose constructor takes other arguments) is asked
      through the node it wraps, or not at all.  MADD-ANO-002 records the
      other half of the diffusivity case, the running rod's: past the
      limit it diverges, with no warning.
      Pinned by
      test_a_gm_params_write_the_constructor_refuses_saves_a_graph_that_does_not_load,
      which fails when these writes are refused.
    verification:
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_live_leaf_above_the_fourier_limit_is_refused_and_the_graph_still_saves"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_pipe_gas_density_above_its_liquid_density_is_refused"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_two_values_each_acceptable_alone_are_refused_together"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_the_constructor_is_asked_with_the_live_values_a_save_would_carry"
      # What stays open, pinned so that closing it fails.
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_gm_params_write_the_constructor_refuses_saves_a_graph_that_does_not_load"
    github_issue: null

  - anomaly_id: "MADD-ANO-049"
    title: "A non-finite value written through PUT /graph/params was stored, then the reply failed with a 500, and every later GET /graph/params for the node failed too"
    description: >
      `PUT /graph/params/{node}` checked finiteness only for a live leaf of
      the params pytree.  A structural value holding `NaN` or an infinity
      (JSON's `NaN` / `Infinity`, or an integer literal too large to be a
      float) was written into the node's params, and the reply, which
      echoes them, failed in the JSON encoder (`allow_nan=False`): a 500
      after the write.  From then on every `GET /graph/params/{node}`
      failed the same way.  Reproduced with `grid_points = [0.1, NaN, 0.5,
      0.9]` on a 4-cell `HeatNode` through the real endpoint at v0.1.0,
      v0.2.0 and v0.3.1 (`git archive` of each tag, CPU, jaxlib 0.11.0) and
      on the 0.4.0 development tree before the fix (71479c7): 500, the NaN
      stored, and the next `GET /graph/params/rod` a 500.  `POST
      /graph/nodes` has refused a non-finite parameter since 0.4.0.
      Resolved in 0.4.0, in two steps.  The route checks every value in the
      request for finiteness before anything else, and a non-finite one is
      a 400 naming its path (`params.grid_points[1]: value must be
      finite`), with nothing written.  And every reply that echoes a node's
      params writes a non-finite value as its quoted token (`"NaN"`,
      `"Infinity"`, `"-Infinity"`; `maddening.serialization.json_codec`), as
      `GET /graph` and the state replies do, so a non-finite value that
      reaches a node's params in-process -- set on its params dict, or left
      in `gm.params` by a calibration that diverged -- is served rather
      than failing every `GET /graph/params/{node}` with a 500 (the same
      change that made the state replies encode them).
    severity: "minor"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      Loud: the write answers 500 and the node's parameter endpoint stays
      broken for the life of the process, so no wrong number is reported
      as a right one, and a NaN that reaches the physics makes the results
      NaN.  The harm is to availability and to the saved config, not to a
      result anyone could mistake for valid.
    affected_components:
      - "maddening.api.server.SimulationServer"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: never send a non-finite number to `PUT
      /graph/params`; to recover a node that took one, rebuild it (`DELETE
      /graph/nodes/{name}`, then `POST /graph/nodes`).  From 0.4.0 the
      route refuses one, and a value set non-finite in-process is served as
      its token; write a finite value back to recover the node.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Nothing refuses a non-finite value set in-process: one written into a
      node's params dict or into `gm.params` is stored, served as its
      token, and, if the physics reads it, makes the results non-finite.
      Bound a calibrated parameter so that a diverging fit cannot leave it
      there.
    verification:
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_non_finite_structural_value_is_refused_before_anything_is_written"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_non_finite_structural_value_set_in_process_reads_back_as_a_token"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_live_leaf_a_fit_drove_non_finite_reads_back_as_a_token"
      - "tests/api/test_state_replies_with_non_finite_values.py::test_a_non_finite_parameter_reads_back_as_a_token"
    github_issue: null

  - anomaly_id: "MADD-ANO-050"
    title: "Two HeatNode rods coupled end to end are unstable above Fourier number 3/8 (stencil_order=2) or 0.226 (stencil_order=4) once the exchange converges, below the limit each rod's constructor accepts"
    description: >
      Coupling two rods by making each one's end-cell temperature the
      other's Dirichlet datum (`extract_last` into `left_temperature`,
      `extract_first` into `right_temperature`) and converging the exchange
      within the step with a coupling group gives a pair that is not one
      continuous rod.  `HeatNode` imposes the datum through ghost cells (the
      rod-end fix of MADD-ANO-007).  The converged exchange makes each datum
      an implicit value, the other rod's end cell at the new time, while the
      rod interiors stay explicit.  The pair then has an interface mode that
      alternates in sign every step.  Its amplification is -1 at a Fourier
      number `Fo = dt*alpha/dx**2` below each rod's own limit and grows past
      it.  Each rod's constructor checks its own limit, for fixed data, so
      nothing refuses the pair.
      The limit depends on the stencil, because the ghost closure sets how
      much of the exchanged datum reaches the end cell:
        - `stencil_order=2`: exactly 3/8, against 1/2 for one rod.  The mirror
          ghost `2*T_b - T[0]` puts 2 of the datum into the end cell's row.
          The interface mode decays away from the interface as `(-1/3)**k`,
          so its eigenvalue is `-16/3` and `Fo = 2 / (16/3) = 3/8`;
        - `stencil_order=4`: 0.2261266 as `n_cells` grows (0.2261215 at 5
          cells, the fewest the stencil accepts), against 5/16 = 0.3125 for
          one rod.  The cubic ghost puts 16/5 of the datum into the end
          cell's row.  The interface mode is a sum of the 5-point
          recurrence's two decaying roots, and the two closure rows fix
          their product `p` as the root in (-1, 0) of the irreducible sextic
          `p**6 - 294 p**5 - 2333 p**4 + 1692 p**3 - 9 p**2 + 362 p + 5`.
          That gives an eigenvalue of -8.8446028.  Both figures were
          re-derived numerically too, by bisecting on the spectral radius of
          the pair's amplification matrix built from `_compute_laplacian`
          (5 to 256 cells per rod).
      Measured at `stencil_order=2` on the 0.4.0 development tree (CPU,
      jaxlib 0.11.0): two rods of 8 or of 20 cells, `alpha = 0.1`, length 1,
      started at 300 K and 360 K, `add_coupling_group(["a", "b"],
      max_iterations=100, tolerance=1e-9)`.  After 60 steps the largest
      departure from 330 K is 29.8 K at `Fo = 0.375`, 1.51e+06 K at 0.4 and
      3.5e+31 K at 0.45.  The part of the field that alternates in time is
      multiplied by -1.500 per step at 0.4 and -4.000 at 0.45 on both grids.
      At 0.45 the field is non-finite from step 68 (8 cells) or 67 (20
      cells).
      At `stencil_order=4` on the same construction (8 cells) the pair stays
      bounded at 0.20 and 0.22, over 2000 and 1500 steps.  It is non-finite
      from step 907 at 0.23, 258 at 0.24, 150 at 0.25, 35 at 0.30 and 21 at
      0.31.  Each of those is inside the order-4 constructor limit, and
      inside the 3/8 this entry used to quote for every stencil.  The measured growth per step is
      the predicted interface mode's: -1.107 at 0.23, -1.435 at 0.24 and
      -1.866 at 0.25.
      A chain of three or more short rods goes unstable slightly below the
      pair figure: 0.3730 (order 2) and 0.2248 (order 4) for a long chain of
      5-cell rods, and 0.3749 and 0.2261 for 8-cell rods.  From about 20
      cells per rod a chain has the pair figure.
      No error, at either order.  Since 0.4.0 `compile()` warns: it emits a
      UserWarning that names both rods, their Fourier numbers, the limit and
      this entry, when a coupling group holds two uniform rods coupled this
      way through `extract_first` / `extract_last` and either rod is past
      the pair limit of its stencil.  The same pair exchanging its data
      without a coupling group (lagged by the schedule) stays within its
      initial range at 0.45 over 200 steps, at order 2.  At v0.3.1 (`git
      archive`, same environment) the order-2 pair stays bounded at every
      Fourier number up to 0.45, with the group and without it, and the
      order-4 pair stays bounded at 0.23, 0.25 and 0.30 over 1000 steps.  The old
      closure wrote the datum into the end cell, which made the pair one
      continuous rod, so the limit arrived with the 0.4.0 rod-end fix.  The
      coupling benchmark fixtures refuse `Fo >= 3/8` for their order-2 heat
      slab pairs themselves.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent until it is not: a configuration every individual check
      accepts grows an oscillation that flips sign every step and leaves
      float range in under 70 steps at `Fo = 0.45` (order 2) and 150 at
      0.25 (order 4).  Nothing is raised before the field is visibly wrong,
      and it is wrong for many steps before it is non-finite.  The warning
      `compile()` now gives does not refuse the graph, and it sees only the
      pattern it recognises.  Graded `major` because the pattern is the
      natural way to couple two rods and the limit is not the one the node
      documents for itself.  `context_dependent` because it needs rods coupled end to end through
      their Dirichlet inputs, a converged exchange, and a Fourier number
      between the pair limit and the single-rod one.  A single rod, or a pair below the pair
      limit, is unaffected.
    affected_components:
      - "maddening.nodes.heat.HeatNode"
    affected_versions: ">=0.4.0.dev0"
    workaround: >
      Keep `Fo = dt*alpha/dx**2` below 3/8 at `stencil_order=2`, and below
      0.226 at `stencil_order=4`, on rods coupled end to end through their
      temperature inputs, whatever each rod's own constructor accepts.
      Below those figures on both rods the pair is stable, at mixed orders
      too.  A chain of three or more rods shorter than about 20 cells each
      has a slightly lower limit, down to 0.373 (order 2) and 0.2248
      (order 4) for 5-cell rods, so keep such a chain below those.
      `compile()` warns when it finds such a pair past them, but it
      judges each pair against the pair figure, so a short-rod chain
      between the chain and pair figures is not warned about, and it
      only recognises the built-in `extract_first` / `extract_last` edges
      between uniform `HeatNode`s in one coupling group.  A custom
      transform, a wrapped or non-uniform rod, or a sub-cycled pair of
      different timesteps is not judged, so check those yourself.  Or
      exchange the data without a coupling group, lagged by a step.  That
      stays bounded.  A compile-time stability check of coupled groups is
      proposed for 0.5.0.
    resolution_status: "open"
    verification:
      - "tests/nodes/test_heat_coupled_pair_fourier_limit.py::test_a_converged_end_to_end_pair_diverges_above_three_eighths"
      - "tests/nodes/test_heat_coupled_pair_fourier_limit.py::test_the_same_pair_below_three_eighths_stays_bounded"
      - "tests/nodes/test_heat_coupled_pair_fourier_limit.py::test_one_rod_with_fixed_data_is_stable_at_the_same_fourier_number"
      - "tests/nodes/test_heat_coupled_pair_fourier_limit.py::test_a_converged_order_four_pair_diverges_below_its_constructor_limit"
      - "tests/nodes/test_heat_coupled_pair_fourier_limit.py::test_the_same_order_four_pair_below_its_limit_stays_bounded"
      - "tests/nodes/test_heat_coupled_pair_fourier_limit.py::test_the_recorded_pair_limit_sits_under_the_pair_operator_limit"
      # The warning (not a fix: the entry stays open).
      - "tests/nodes/test_heat_coupled_pair_fourier_limit.py::test_compile_warns_about_a_pair_past_its_limit"
      - "tests/nodes/test_heat_coupled_pair_fourier_limit.py::test_no_warning_for_a_pair_below_its_limit"
    github_issue: null

  - anomaly_id: "MADD-ANO-051"
    title: "The HTTP API served every route, POST /cloud/launch included, to any caller with no credential, and the shipped container bound it to 0.0.0.0"
    description: >
      From v0.1.0 to v0.3.1 `SimulationServer` had no authentication of any
      kind.  Every route answered whoever could reach the port: the graph
      and state writes (`POST /graph/nodes`, `POST /graph/edges`,
      `PUT /graph/state/{node}`, `PUT /graph/params/{node}`), simulation
      control, `/checkpoint/save` and `/checkpoint/load` (MADD-ANO-052), the
      `/ws/state` WebSockets, and `POST /cloud/launch`, `GET /cloud/status`
      and `POST /cloud/teardown`, which provision and release paid cloud
      GPU instances with the credentials of the host the server runs on.

      The shipped defaults put it on a network interface.  The cloud
      container (`docker/Dockerfile.cloud`) set `MADDENING_HOST=0.0.0.0`,
      `maddening.cloud.entrypoint` fell back to `0.0.0.0` when the variable
      was unset, and `cloud/_skypilot.py`'s `launch_vm` published port 8000
      on the VM with a hard-coded `-p 8000:8000`, whatever
      `JobConfig.ports` said.  So every `CloudSession` launch served the
      whole API on the VM's public interface.

      Checked at each tag, v0.1.0, v0.2.0, v0.2.1, v0.3.0 and v0.3.1, on
      2026-09-25 (CPU, jaxlib 0.11.0), with a FastAPI `TestClient` and no
      credential: `POST /cloud/launch` answered 200, which that route
      returns only once `CloudSession.launch` has started its provisioning
      thread (the probe exited at once, before the thread reached a
      provider), and `POST /checkpoint/save` with a path outside the
      server's directory answered 200 and wrote the file.  All five tags
      carry the container's `0.0.0.0` default and the hard-coded publish.
      The server had no credential check to consult, so the caller's
      address did not matter.
    severity: "critical"
    safety_relevance: "safety_relevant"
    safety_relevance_rationale: >
      Graded `critical`, as the CHANGELOG labels it, because the shipped
      defaults exposed it: an anonymous caller who could route to port 8000
      of any `CloudSession` VM could rewrite the graph, its state and its
      parameters, read the full state, and provision paid instances on the
      operator's account.  Graded `safety_relevant` on the same grounds as
      MADD-ANO-015, which records the ZeroMQ half of the same exposure.  The
      writes change what the simulation computes with nothing in the reply
      or the state to show it, and the reads disclose everything a caller
      would need to aim them.  That is a loss of both integrity and
      confidentiality on a surface the library itself published, which is
      safety relevant whether or not a particular deployment was reached.
    affected_components:
      - "maddening.api.server.SimulationServer"
      - "maddening.api.server.SimulationServer.create_app"
      - "maddening.cloud.entrypoint.main"
      - "maddening.cloud._skypilot.launch_vm"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      On v0.3.1 and earlier: bind the API to 127.0.0.1 (set
      `MADDENING_HOST=127.0.0.1`, or pass `host="127.0.0.1"` to uvicorn) and
      reach it over an SSH tunnel (`ssh -L 8000:127.0.0.1:8000 <host>`).  On
      a VM started by `CloudSession`, `launch_vm` published port 8000
      whatever `JobConfig.ports` said, so close 8000 in the provider's
      firewall or security group as well.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Resolved in 0.4.0 by `maddening.api.auth.APIAuth` (PR 85, merged
      2026-09-20).  A loopback bind is served as before; any other bind, or
      a request whose peer address is a routable IP whatever the bind,
      needs `Authorization: Bearer <token>` on every HTTP route and every
      WebSocket but `/healthz` and the static `/viz/*` pages.  The token is
      `MADDENING_API_TOKEN`, or one generated at start-up and logged once
      (or written to `MADDENING_API_TOKEN_FILE`); a blank
      `MADDENING_API_TOKEN` refuses to start.  `JobConfig.ports` no longer
      defaults to `[8000]`, and `launch_vm` publishes exactly
      `JobConfig.ports` (MADD-ANO-015), so a default cloud launch no longer
      opens the port at all.
      What remains, and why each is a boundary of the fix rather than an
      instance of the defect.  (1) There is no TLS: the token crosses the
      network in cleartext on every request, so a non-loopback API belongs
      behind an SSH tunnel or a TLS-terminating proxy.  (2) A loopback bind
      is unauthenticated by design, so on a shared host any local user can
      reach it, and a reverse proxy on the same host that forwards to a
      loopback-bound API delivers remote requests from 127.0.0.1, which are
      not challenged.  (3) One token opens every route; there are no
      per-route permissions and no way to tell token holders apart.  (4) A
      generated token is readable by anyone who can read the server's log.
      (5) Unless `MADDENING_TRANSPORT_TOKEN` is set, the same string seeds
      the ZeroMQ CURVE keys (MADD-ANO-015's residual risk).
    verification:
      - "tests/api/test_bearer_auth.py::test_every_route_refuses_an_anonymous_caller"
      - "tests/api/test_bearer_auth.py::test_every_websocket_route_refuses_an_anonymous_caller"
      - "tests/api/test_bearer_auth.py::test_an_anonymous_caller_cannot_launch_cloud_instances"
      - "tests/api/test_bearer_auth.py::test_a_routable_peer_is_challenged_even_on_a_believed_loopback_bind"
    github_issue: null

  - anomaly_id: "MADD-ANO-052"
    title: "POST /checkpoint/save and /checkpoint/load took any server path from an unauthenticated caller: a file write anywhere the server could write, and a file-existence oracle"
    description: >
      From v0.1.0 to v0.3.1 the two checkpoint routes handed their `path`
      query parameter straight to `GraphManager.save_state` and
      `GraphManager.load_state`, with no root and no check.  With the API
      unauthenticated on every bind (MADD-ANO-051), any caller who could
      reach port 8000 could:
        - write a checkpoint to any path the server's user could write,
          anywhere on the file system.  `numpy.savez` appends `.npz` to a
          name without it, so the file is always an `.npz`, and an existing
          `.npz` there -- another run's checkpoint, say -- is overwritten.
          The contents are the graph's state, which the same caller could
          set through `PUT /graph/state/{node}`;
        - learn whether any path on the host exists: `load` answered a
          missing file with "Checkpoint file not found" and an existing one
          with the parser's own error (for `/etc/passwd`, numpy's "This
          file contains pickled (object) data"), and a load error echoed
          the parser's internals;
        - load any readable `.npz` on the host into the running graph.
      Checked at each tag, v0.1.0 to v0.3.1, on 2026-09-25 (CPU, jaxlib
      0.11.0), with a FastAPI `TestClient` and no credential: `POST
      /checkpoint/save?path=<a directory outside the server's>/written_by_anyone.npz`
      answered 200 and wrote the file; `path=<dir>/noext` wrote
      `noext.npz`; `load` of a missing path and of `/etc/hostname`
      answered 400 with the two different messages above.
    severity: "critical"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `critical` under the 0.4.0 severity definition
      (`AnomalySeverity`): unauthorised access -- a file write anywhere the
      server's user could write, and a file-existence oracle over the host
      -- through an HTTP route that the shipped default configuration
      exposed to other hosts, since the container bound the API to `0.0.0.0`
      with no credential (MADD-ANO-051). The write is constrained to an
      `.npz` name and to the graph's own arrays, so it cannot plant code,
      but it can overwrite any checkpoint or other `.npz` file the server's
      user can write, and the oracle maps the host's file system. It was
      graded `major` when first registered, on the ground that the API's own
      writes (MADD-ANO-051) already gave the same caller the simulation and
      this added reach into the host rather than a new way to change
      results; the definition rates each defect's own reach and consequence,
      and reach into the host from a default exposure is the critical case.
      Graded `context_dependent`: what the write can damage is whatever
      `.npz` files the server's user can write and whatever later reads
      them, which is a property of the host and not of the library.  A
      checkpoint overwritten with a state of the same graph restores
      silently into the next run that loads it; one of another graph fails
      to load, loudly.
    affected_components:
      - "maddening.api.server.SimulationServer.create_app"
      - "maddening.core.graph_manager.GraphManager.save_state"
      - "maddening.core.graph_manager.GraphManager.load_state"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      On v0.3.1 and earlier: keep the API on loopback (MADD-ANO-051's
      workaround), and run the server as a user that can write only its own
      working directory.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Resolved in 0.4.0 (6cd5cc3, 2026-09-16): a checkpoint path is relative
      to `SimulationServer(checkpoint_root=)`, default `./checkpoints` under
      the server's working directory, and must resolve under it after
      symlinks are followed; anything else is a 400 naming the root, before
      the file system is touched.  A missing file is a 404 and a load error
      no longer echoes the parser.  The routes also need the bearer token
      whenever the API is not on loopback (MADD-ANO-051).
      What remains: any caller the API admits can still overwrite or load
      any checkpoint inside the root, which is the routes' purpose.  The
      default root follows the working directory the server was started
      in, so two servers started in one directory share it.
    verification:
      - "tests/api/test_graph_endpoint_validation.py::test_checkpoint_endpoints_stay_under_the_root"
    github_issue: null

  - anomaly_id: "MADD-ANO-053"
    title: "The WebRTC signaling server validated its own token, not the client's, so it admitted and relayed every client"
    description: >
      From v0.1.0 to v0.3.1 `SelkiesSession`'s signaling handler read no
      credential from the client.  It looked for its own token as a
      substring of the request's query string, and when that was absent it
      called `validate_session_token(self._session_id, token, self._secret)`
      with `token` bound to the *server's own* token, generated at `start()`
      from the same session id and secret.  That check is true by
      construction, so `ws.close(1008, "Invalid token")` could never run,
      and any client that connected was admitted and had its messages
      handed to the session's input handler (the callback
      `set_input_handler` installs for keyboard, mouse and gamepad events
      from the viewer).  The handler lived in
      `cloud/selkies_session.py` (lines 231-238 at v0.3.1) and is the same
      at every tag from v0.1.0; the server bound `0.0.0.0:8443`.

      On the shipped cloud path the reach was narrower than the API's: the
      container started a `SelkiesSession` when GStreamer was available and
      the Dockerfile exposes 8443, but `launch_vm` did not publish 8443, so
      the socket was reachable from the VM itself and from containers on
      its Docker network rather than from the internet.  A program that ran
      `SelkiesSession` directly on a host, or published 8443, served it to
      the network.  The container's entry point also built the session
      with no secret, so it invented a random one per process and no
      legitimate client could have computed a valid token; the broken check
      is why that went unnoticed.
    severity: "critical"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `critical`, as the CHANGELOG labels it: the package's only
      authentication check at the time rejected nothing, on a socket bound
      to every interface, and it did so silently -- an operator who set a
      secret had no sign that it protected nothing.
      Graded `context_dependent` rather than `safety_relevant` because what
      an admitted client could reach is decided by the program, not the
      library.  The handler relays a client's messages only to an input
      handler the program installs; nothing in the library installs one,
      so with none installed an intruder could connect and do nothing
      else.  A program that routes viewer input into its simulation (a
      mouse drag that moves a body, say) handed that control to anyone who
      could reach the port.  On the shipped container path the port was
      not published off the VM.
    affected_components:
      - "maddening.cloud.selkies_session.SelkiesSession"
      - "maddening.cloud.selkies_session._make_signaling_handler"
      - "maddening.cloud._auth.validate_session_token"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      On v0.3.1 and earlier: do not publish or expose port 8443; reach the
      signaling server through an SSH tunnel from the viewer's machine, and
      do not install an input handler that drives the simulation on a
      session other hosts can reach.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Resolved in 0.4.0 (2897b4b, 2026-09-19).  The handler, now built by
      `_make_signaling_handler`, parses the token the client presented --
      `Authorization: Bearer <token>` or `?token=<token>` -- and validates
      that one against the session id and secret in constant time; absent,
      malformed, duplicated, wrong, and issued for another session or
      secret are all closed with 1008 before a message is read.  The
      container reads the secret from `MADDENING_STREAM_SECRET`; without it
      the session logs that every client will be rejected.
      What remains.  (1) There is no TLS on the signaling socket, so the
      token crosses the network in cleartext, and a `?token=` in the URL can
      reach a proxy's access log.  (2) The token is an HMAC of the session
      id with no expiry, so whoever observes it can reuse it for the rest of
      the session.  (3) The default bind is still `0.0.0.0` (the session
      normally runs in a container, where loopback is unreachable); pass
      `bind_host="127.0.0.1"` behind a tunnel.
    verification:
      - "tests/cloud/test_signaling_auth.py::TestSignalingClientAuthentication::test_no_token_is_rejected"
      - "tests/cloud/test_signaling_auth.py::TestSignalingClientAuthentication::test_wrong_token_is_rejected"
      - "tests/cloud/test_signaling_auth.py::TestSignalingClientAuthentication::test_token_for_another_session_is_rejected"
      - "tests/cloud/test_signaling_auth.py::TestSignalingClientAuthentication::test_token_from_another_secret_is_rejected"
      - "tests/cloud/test_signaling_auth.py::TestSignalingClientAuthentication::test_empty_token_parameter_is_rejected"
    github_issue: null

  - anomaly_id: "MADD-ANO-054"
    title: "The FMU TCP bridge unpickled the state blob an importer hands to fmi3SetFMUState: remote code execution for anyone who could reach its port"
    description: >
      `FmuTcpBridge.handle`'s `set_state` op ran
      `pickle.loads(base64.b64decode(req["state"]))` on the blob an importer
      passes to `fmi3SetFMUState`.  Unpickling executes whatever the bytes
      name, so anyone who could send a frame to the bridge ran code in the
      simulation's process, as its user.  The bridge authenticates nobody
      (MADD-ANO-023) and needs no `hello` first, so on its default bind --
      loopback, an ephemeral port -- that was any local process of any
      user, and on a non-loopback `host` anyone on the network.  The port
      was not the only way in: the C wrapper's `fmi3DeserializeFMUState`
      copied the importer's serialized bytes verbatim and
      `fmi3SetFMUState` sent them to the bridge as that blob, so a crafted
      serialized state stored with an importer's saved session would have
      run when the session was restored.

      Introduced with the bridge in 2efcaea and fixed in 0bd041e, both on
      2026-09-16, during the 0.4.0 development line.  No tagged release
      contains it: v0.1.0 to v0.3.1 have no `src/maddening/fmi/tcp_bridge.py`.
      It is recorded under the registry's rule for defects no release
      carried: a critical or major one found during the cycle gets an
      entry.  The in-process pickle entry points that v0.3.0 and v0.3.1 did
      ship, which no shipped transport reached, are MADD-ANO-055.
    severity: "critical"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `critical`, as the CHANGELOG labels it: arbitrary code
      execution, from one unauthenticated frame, in the process that holds
      the model.  Nothing a caller could do to a running simulation is out
      of reach of that, including results that stay plausible.
      Graded `context_dependent`, as MADD-ANO-023 is for the same socket,
      because who can reach the port is a property of the deployment: the
      default bind is loopback, so on a single-user host, or in a container
      whose network namespace nothing else shares, there was no other
      caller.  What keeps it well above `not_safety_relevant` is that the
      consequence has no ceiling where the port is reachable.  It is
      recorded although no release carried it, because a critical defect
      found in the cycle is part of the evidence of how the release was
      verified.
    affected_components:
      - "maddening.fmi.tcp_bridge.FmuTcpBridge"
      - "maddening.fmi.tcp_bridge.FmuTcpBridge.handle"
    affected_versions: "none"
    workaround: >
      None needed from 0.4.0.  On a 0.4.0.dev0 build between 2efcaea and
      0bd041e: keep the bridge on its loopback default on a single-user host
      or in its own network namespace, and restore no FMU state blob that
      did not come from the same session.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Resolved in 0bd041e (2026-09-16).  The FMU-state blob is an `npz` of
      plain arrays read with `allow_pickle=False`, carrying the schema
      token, time, inputs, states and parameters; on `set_state` the archive
      directory is checked before `np.load` runs (every member one the
      model expects, with per-member and total declared-size caps), then
      the token, the key set and every shape, before anything is written.
      A pickle payload is refused as "not a valid archive" without being
      executed; so is an `npz` whose member holds a pickled object.
      What remains is outside this entry: the bridge still authenticates no
      caller, so anyone who reaches the port can read, write, step and hold
      the model through the documented ops (MADD-ANO-023, open), and
      `FmuSidecar.handle` still speaks a pickled protocol for trusted
      in-process clients, off unless `SidecarConfig(allow_pickle_rpc=True)`
      turns it on (MADD-ANO-055).
    verification:
      - "tests/fmi/test_bridge_security_and_stepping.py::test_set_state_never_unpickles"
    github_issue: null

  - anomaly_id: "MADD-ANO-055"
    title: "deserialize_fmu_state and FmuSidecar.handle unpickled the bytes they were given"
    description: >
      v0.3.0 and v0.3.1 shipped two public FMI entry points that called
      `pickle.loads` on their input.  `deserialize_fmu_state` unpickled
      `FMUState.payload`, and `FMUState` is a public dataclass that can be
      built from any bytes; its own docstring describes it as the opaque
      handle an importer receives from `fmi3GetFMUState` and hands back to
      `fmi3SetFMUState`.  `FmuSidecar.handle` unpickled every request,
      which its module docstring describes as a host-to-sidecar wire
      protocol.  A program that passed either one bytes from a party it
      did not trust ran that party's code.
      No transport the library shipped reached either one: the C wrapper
      that was to carry the protocol was out of scope for v0.3.0, and the
      0.4.0 TCP bridge has its own state format (MADD-ANO-054 records the
      bridge's own unpickling).  So the exposure was a program's own use of
      the two functions, which is why this is `major` where MADD-ANO-054 is
      `critical`.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `major` under the 0.4.0 severity definition
      (`AnomalySeverity`): an API that executes what it is handed while
      presenting itself as safe for data -- a state handle and a wire
      protocol, which is what a reader passes untrusted bytes to -- runs the
      code of any party whose bytes a program passes it, and nothing in
      either function's documentation said not to. Not `critical`, because
      nothing the library shipped delivered untrusted bytes to either
      function or exposed them on a surface other hosts could reach; a
      program had to do that itself. It was graded `minor` when first
      registered, on that same ground; the definition places a bounded reach
      in `major`, not below it.
      Graded `context_dependent`: whether any untrusted party could supply
      the bytes is entirely a property of the program that called them.
      Where one could, the consequence was code execution in the
      simulation's process.
    affected_components:
      - "maddening.fmi.fmu_state.deserialize_fmu_state"
      - "maddening.fmi.fmu_state.FMUState"
      - "maddening.fmi.sidecar.FmuSidecar.handle"
    affected_versions: ">=0.3.0, <0.4.0"
    workaround: >
      On v0.3.0 and v0.3.1: pass `deserialize_fmu_state` only an `FMUState`
      that `serialize_fmu_state` produced in the same process, and
      `FmuSidecar.handle` only requests from a trusted, in-process caller.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Resolved in 0.4.0 (b8b2ced, 2026-09-19).  `FMUState`'s payload is an
      `npz` of plain arrays plus the key paths that rebuild the tree, read
      with `allow_pickle=False`, so `deserialize_fmu_state` executes
      nothing; a payload written before 0.4.0 is a pickle and is refused by
      name, with a message saying to take a fresh snapshot.
      `serialize_fmu_state` refuses a leaf that is not a plain array or a
      key that is not a string, both of which it used to pickle.
      What remains: `FmuSidecar.handle` still speaks the pickled protocol,
      now only when the sidecar is built with
      `SidecarConfig(allow_pickle_rpc=True)`; by default it refuses and
      says why.  A program that turns it on must give it only trusted,
      in-process requests.
    verification:
      - "tests/fmi/test_fmu_state.py::TestNoPickle::test_a_pickle_payload_is_refused_rather_than_unpickled"
      - "tests/fmi/test_sidecar.py::TestWireProtocol::test_the_pickled_rpc_protocol_is_refused_unless_opted_into"

  - anomaly_id: "MADD-ANO-056"
    title: "ShardedStencilNode read the block size it hands update_padded in shard_info off a domain integral carried in the state, so a sharded HeatNode carrying a vector or per-shard energy integral never closed its right rod end"
    description: >
      `ShardedStencilNode` passes `update_padded` `shard_info = {axis:
      (offset, local_extent)}`.  It read `local_extent`, inside the traced
      step, off the first local state field long enough to have the axis,
      in sorted key order, and did not skip a domain integral carried in
      the state (as every other shape reader in the wrapper does), so an
      integral whose name sorts before the grid fields set the block size,
      and `offset = axis_index * local_extent` with it.  In the 0.4.0
      development tree, where the fix of MADD-ANO-040 hands such an
      integral to each shard whole and `HeatNode` closes its rod ends
      where `shard_info` says the block holds them (the fix of
      MADD-ANO-030), a `HeatNode` subclass carrying its thermal energy as
      a 2-vector, or as a per-shard value, named to sort before
      `temperature` was told its 4-cell blocks held 2 cells (or 1); no
      block ever reached the rod's right end, which was never closed:
      70.94 K off the unsharded rod after 40 steps on 16 cells and 4
      devices, finite, with no error or warning (e888840 and db6ef8d, CPU,
      jaxlib 0.11.0, 4 virtual devices).  At v0.2.1, v0.3.0 and v0.3.1
      (`git archive` of each tag, same environment), where the integral was
      still split like a grid field, a vector integral whose length the
      device count divides set the extent the same way -- 1 for a 4-vector
      and 2 for an 8-vector on 4-cell blocks -- and the step ran; no
      built-in node read `shard_info` then, so a released version gave a
      wrong block only to a node that did.  Resolved in 0.4.0: the extent
      is fixed before tracing, from a grid field's global extent over the
      devices on its mesh axis; an integral never sets it, and a node that
      reads `shard_info` whose grid fields disagree about an axis's extent
      is refused, naming the fields.  Such a rod matches the unsharded rod.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent and plausible: a finite field tens of kelvin off, with the
      boundary condition the user supplied not applied, and nothing
      raised.  Graded `major` because the configuration is a documented
      one (an integral carried in the state, which a scan carry needs) on
      a built-in node.  `context_dependent` because it needs a node that
      reads `shard_info`, an integral in its state that is a vector or a
      per-shard value, and a name that sorts before the grid fields; a
      reduced scalar integral was never read (it has no axis).
    affected_components:
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
    affected_versions: ">=0.2.1, <0.4.0"
    workaround: >
      Before 0.4.0: keep a domain integral out of a sharded node's state,
      or give it a name that sorts after every grid field.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      `shard_info` describes one block per sharded axis.  A node whose grid
      fields are split into blocks of different sizes along one axis
      cannot be described by it, and is refused when it reads it rather
      than supported.
    verification:
      - "tests/cloud/multigpu/test_shard_info_extent.py::test_a_rod_carrying_an_integral_is_the_unsharded_rod"
      - "tests/cloud/multigpu/test_shard_info_extent.py::test_grid_fields_of_different_extents_are_refused_for_a_node_reading_shard_info"
    github_issue: null

  - anomaly_id: "MADD-ANO-057"
    title: "A sharded HeatNode or LBMNode applied, on every shard, a heat_source or body_force of a shape the unsharded node refuses"
    description: >
      `ShardedStencilNode` shards a boundary input that is grid-shaped and
      hands anything else to every shard whole, where it cannot be told
      from a local one.  `HeatNode.update_padded` broadcast any 1-D
      `heat_source` of the block's length, so on a 16-cell rod split over
      4 devices a source of 4 values was applied on every block: one
      pattern repeated along the rod, where `update` refuses 4 values for
      16 cells.  `LBMNode.update_padded` zero-padded any `body_force` that
      was neither `(D,)` nor the padded block, so a `(4, 8, 2)` force on a
      `(16, 8)` grid split over 4 devices was applied on every slab, where
      `update` refuses it.  Both are reachable through
      `GraphManager.add_external_input`.  Reproduced at v0.2.0, v0.2.1,
      v0.3.0 and v0.3.1 (`git archive` of each tag, CPU, jaxlib 0.11.0, 4
      virtual devices) and on the 0.4.0 development tree (e888840,
      db6ef8d), where a `heat_source` of the padded block's length (6 on
      that rod) was also taken, as a padded block.  Resolved in 0.4.0: the
      wrapper refuses a replicated input the node declares per cell unless
      it broadcasts to the declared shape, naming the shape it was given,
      and both nodes' `update_padded` take only the forms their `update`
      takes, translated to the block (a scalar or `(1,)` source, a `(D,)`
      or `(1,)` force, a per-cell field as the wrapper delivers it, and on
      a direct call holding the whole grid the whole-grid field).  A
      whole-grid body force on such a direct call is now padded
      periodically, as the node's halo fill is; it was zero-padded.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent, but it needs an input the unsharded node refuses: a caller
      who runs the same graph unsharded gets an error. Graded `major` under
      the 0.4.0 severity definition: a silent wrong result is never `minor`,
      and accepting an input the node's own contract refuses (the unsharded
      node's refusal is that contract) and computing a repeated pattern from
      it is one. It was graded `minor` when first registered, because the
      wrong result follows from a mis-shaped input rather than a correct
      one. `context_dependent` because a sharded-only workflow
      that passes a per-shard-length source would take the repeated
      pattern for the intended one.
    affected_components:
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
      - "maddening.nodes.heat.HeatNode"
      - "maddening.nodes.lbm.LBMNode"
    affected_versions: ">=0.2.0, <0.4.0"
    workaround: >
      Before 0.4.0: pass `heat_source` as a scalar or as one value per cell
      of the whole rod, and `body_force` as a `(D,)` vector; check a
      sharded graph's inputs against the unsharded node first.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The wrapper's check reads the node's `boundary_input_spec()`: an input
      a node does not declare, or declares with a shape that is not per
      cell, is left to the node.  A force that broadcasts along a grid axis
      (a profile such as `(8, 2)` on a `(16, 8)` grid), which `update`
      takes, is refused by the sharded `LBMNode` rather than translated.
    verification:
      - "tests/cloud/multigpu/test_sharded_input_shapes.py::test_a_heat_source_the_rod_refuses_is_refused_sharded"
      - "tests/cloud/multigpu/test_sharded_input_shapes.py::test_update_padded_refuses_an_unpadded_block_source_on_a_split_rod"
      - "tests/cloud/multigpu/test_sharded_input_shapes.py::test_a_mis_shaped_external_heat_source_is_refused_by_a_sharded_graph"
      - "tests/cloud/multigpu/test_sharded_input_shapes.py::test_a_body_force_the_node_refuses_is_refused_sharded"
      - "tests/cloud/multigpu/test_sharded_input_shapes.py::test_update_padded_refuses_an_unpadded_block_force_on_a_split_grid"
      - "tests/cloud/multigpu/test_sharded_input_shapes.py::test_update_padded_on_the_whole_grid_fills_a_per_cell_force_periodically"
    github_issue: null

  - anomaly_id: "MADD-ANO-058"
    title: "The LBM constructors accepted a non-finite viscosity or relaxation time, and LBMPipeNode a propeller disc outside the grid, each running a different model with no error"
    description: >
      `LBMNode` checked `tau = 0.5 + viscosity / cs2 > 0.5` only, so
      `viscosity=inf` gave `tau = inf`, which passes, and the node ran with
      no collision at all (`(f - f_eq) / tau` is 0); `nan` passes every
      comparison.  `LBMPipeNode` had the same gap for `tau` and
      `tau_tracer`.  `LBMPipeNode` built its actuator disc with
      `mask.at[propeller_x]`, which drops an index outside the grid
      without a word, so `propeller_x=99` on an 8-plane pipe ran with no
      propeller: `max|u|` 3.7e-9 after 10 steps, where `propeller_x=4`
      reached 5.2e-3.  The default, `propeller_x=10`, is outside every pipe
      of 10 planes or fewer, and a disc radius that takes in no cell
      centre built an empty disc the same way.  Reproduced at v0.1.0 and
      v0.3.1 (`git archive` of each tag, CPU, jaxlib 0.11.0) and on the
      0.4.0 development tree (e888840, db6ef8d): every case accepted, the
      disc empty.  Resolved in 0.4.0: `LBMNode` refuses a non-finite
      viscosity, `LBMPipeNode` a non-finite `tau` or `tau_tracer`, a
      `propeller_x` that is not an integer index in `[0, nx)` (naming the
      default when it is the one outside the grid), and a disc that covers
      no cell of the cross-section.  A disc wider than the pipe
      (`propeller_radius` above the documented 0 to 1) was accepted too, at
      v0.1.0 and v0.3.1 as on the 0.4.0 tree, and put force in wall cells:
      at 1.5 on a 12x12 cross-section, 64 of its 140 cells, and the mean
      fluid u_x after 20 steps 1.9% from the disc at 1.  It was left as
      residual risk here while the entry read resolved, until the round-3
      confirmation audit; `LBMPipeNode` now refuses a `propeller_radius`
      above 1.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent: the model that runs is not the one configured, and nothing
      says so. Graded `major` under the 0.4.0 severity definition: a silent
      wrong result is never `minor`, and on a pipe of 10 planes or fewer the
      default `propeller_x` alone reached it. It was graded `minor` when
      first registered, because each case is a configuration value outside
      what the node documents (a finite viscosity; a disc on the grid), and
      a pipe with no propeller visibly does not flow.
      `context_dependent` because a small test pipe built with the default
      `propeller_x` gives no sign that its propeller is missing.
    affected_components:
      - "maddening.nodes.lbm.LBMNode"
      - "maddening.nodes.lbm_pipe.LBMPipeNode"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: pass finite relaxation parameters, and a `propeller_x`
      inside the pipe (the default needs `nx > 10`).
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.  At `propeller_radius = 1` the disc is the pipe's whole
      cross-section and touches no wall cell.  A config saved with a radius
      above 1 by an earlier version is refused by `from_dict()`, naming the
      value.
    verification:
      - "tests/nodes/test_lbm_constructor_refusals.py::test_lbm_node_refuses_a_non_finite_viscosity"
      - "tests/nodes/test_lbm_constructor_refusals.py::test_lbm_pipe_refuses_a_non_finite_relaxation_time"
      - "tests/nodes/test_lbm_constructor_refusals.py::test_lbm_pipe_refuses_a_propeller_outside_the_grid"
      - "tests/nodes/test_lbm_constructor_refusals.py::test_the_default_propeller_position_needs_a_pipe_longer_than_ten_planes"
      - "tests/nodes/test_lbm_constructor_refusals.py::test_lbm_pipe_refuses_a_propeller_disc_that_covers_no_cell"
      - "tests/nodes/test_lbm_constructor_refusals.py::test_lbm_pipe_refuses_a_propeller_disc_wider_than_the_pipe"
      - "tests/nodes/test_lbm_constructor_refusals.py::test_a_disc_of_the_whole_pipe_covers_every_fluid_cell_and_no_wall_cell"
    github_issue: null

  - anomaly_id: "MADD-ANO-059"
    title: "Accelerating a coupling group that holds an integer, boolean or PRNG-key state leaf failed at the first step"
    description: >
      A coupling group's acceleration flattens the state fields it acts on
      into one floating vector and writes the relaxed vector back.
      `acceleration="aitken"` and `"fixed"` flattened every field of every
      node in the group, and the quasi-Newton accelerations every field
      their selection named, integer, boolean and PRNG-key leaves included.
      At v0.1.0, v0.2.0 and v0.3.1 (`git archive` of each tag, CPU, jaxlib
      0.11.0) a group of a spring and a node holding a `uint32` key and an
      `int32` counter beside its float field raised `TypeError: scan body
      function carry input and carry output must have equal types` at the
      first step under `"aitken"` and under `"fixed"`, and so did
      `"iqn-ils"` with an `accelerated_fields` naming the integer field;
      `acceleration="none"` stepped it.  During 0.4.0 development, before
      release, `unflatten_coupled_state` learned to restore each field's
      dtype and the failure turned silent: `solver="fori"` with
      `"aitken"` or `"fixed"` returned the leaves rounded through float32
      (`0xdeadbeef` as `0xdeadbf00`, `2**24 + 1` as `2**24`, a legacy PRNG
      key rewritten) and kept the rounded values, and `solver="ift"` with
      a quasi-Newton acceleration raised a broadcasting error when an
      integer field was in its selection, named or reached through a flux
      edge (whose producer's whole state stands in for the flux).
      Resolved in 0.4.0: every acceleration acts on floating fields only,
      as `solver="ift"` always iterated.  Such a leaf is computed by every
      pass and is never relaxed.  A non-floating field named in
      `accelerated_fields` is dropped from the selection, and `compile()`
      refuses a selection that names no floating field.  A group whose
      state is all floating flattens exactly as before, and its floating
      fields step bit-identically.  This entry used to add that such a
      leaf "is recomputed from the pre-step state on every pass, so its
      first-pass value is already the converged one".  That holds only for
      a leaf computed from the pre-step state alone (a step counter); a
      flag computed from a boundary input changes with the iterate, and
      `solver="ift"`, which restored every non-floating field from the
      first pass on that premise, returned it stale and froze it inside
      the loop (MADD-ANO-070).  Both solvers now return a group's
      non-floating fields as the pass computes them at the returned
      floating state.
    severity: "minor"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      Loud in every release: the step raised before returning anything, so
      no wrong value was reported as a right one.  The silent form existed
      only on the 0.4.0 development tree and never shipped.  The harm was
      that a group holding a counter, a flag or a random key could not use
      the accelerations at all.
    affected_components:
      - "maddening.core.coupling.group.CouplingGroup.acceleration"
      - "maddening.core.coupling.group.CouplingGroup.accelerated_fields"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: keep integer, boolean and PRNG-key fields out of
      accelerated coupling groups (in a node outside the group, fed by an
      edge), or use `acceleration="none"`; under a quasi-Newton
      acceleration, name only floating fields in `accelerated_fields`.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.  A field declared integer but meant to be relaxed is now
      computed by the pass at the returned floating state instead;
      relaxation of such a field was never meaningful, and the state it
      takes is the one `acceleration="none"` gives.
    verification:
      - "tests/core/test_coupling_non_float_leaves.py::test_wide_integer_leaves_survive_a_coupled_step"
      - "tests/core/test_coupling_non_float_leaves.py::test_an_integer_field_named_in_accelerated_fields_is_left_out"
      - "tests/core/test_coupling_non_float_leaves.py::test_a_flux_edge_from_a_node_with_an_integer_field_accelerates_its_floats"
      - "tests/core/test_coupling_non_float_leaves.py::test_accelerated_fields_naming_no_floating_field_is_refused_at_compile"
    github_issue: null

  - anomaly_id: "MADD-ANO-060"
    title: "A group-internal flux edge read by the interface norm, or by a sub-cycled member's linear boundary interpolation, failed with a bare KeyError"
    description: >
      A flux edge carries a value `compute_boundary_fluxes` returns, which
      is not a field of the producer's state.  Two parts of the coupling
      loop read an internal edge's value from the state:
      `convergence_norm="interface"`, which measures the change of every
      internal edge's source field between iterates, and the boundary
      interpolation of a sub-cycled member under
      `boundary_interpolation="linear"` (the default) or `"quadratic"`,
      which interpolates each internal input between the pass's incoming
      iterate and the in-pass state.  Given a flux edge, both raised
      `KeyError` naming the flux inside the traced step, with nothing
      saying which setting could not read it.  Measured at v0.1.0, v0.2.0
      and v0.3.1 (`git archive` of each tag, CPU, jaxlib 0.11.0) and on the
      0.4.0 development tree: a spring whose `spring_force` flux drives a
      follower that drives it back, `add_flux_coupling(gm, "s", "k",
      "spring_force", "x")`; `KeyError: 'spring_force'` under the interface
      norm, and with the follower sub-cycled at a tenth of the spring's
      timestep under the default interpolation.  The `"mixed"` and `"l2"`
      norms, and `"constant"` interpolation, stepped the same graphs.
      Resolved in 0.4.0: `validate()`, and so `compile()`, reports an error
      for each such edge, naming it, the flux, and the setting that works:
      `"mixed"` or `"l2"` for the norm, `"constant"` for the interpolation.
      Only a member that sub-steps interpolates, so a flux read by the
      slow member of a sub-cycled group is still accepted.
    severity: "minor"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      Loud: the step raised before returning anything, so no wrong value
      was reported.  The harm was a configuration the API accepted failing
      with an error that named a field and no cause.
    affected_components:
      - "maddening.core.coupling.acceleration.coupling_residual_interface"
      - "maddening.core.coupling.group.CouplingGroup.boundary_interpolation"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: couple through a flux edge only under the `"mixed"` or
      `"l2"` norm, and set `boundary_interpolation="constant"` on a
      sub-cycled group whose fast member reads a flux from inside it.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The configurations are refused, not made to work: the interface norm
      still has no reading of a flux, and linear interpolation of a flux
      would need the flux of the incoming iterate, which the pass does not
      compute.
    verification:
      - "tests/core/test_coupling_flux_edge_readers.py::test_the_interface_norm_on_a_flux_edge_is_refused_by_name"
      - "tests/core/test_coupling_flux_edge_readers.py::test_the_norms_the_refusal_names_step_the_same_group"
      - "tests/core/test_coupling_flux_edge_readers.py::test_a_sub_cycled_consumer_of_a_flux_edge_needs_constant_interpolation"
      - "tests/core/test_coupling_flux_edge_readers.py::test_constant_interpolation_steps_the_sub_cycled_flux_consumer"
    github_issue: null

  - anomaly_id: "MADD-ANO-061"
    title: "run_adaptive advanced its clock by dt_min when it accepted an attempt at dt_min, while the state advanced by the attempted step"
    description: >
      When an attempt's error is too large and the shrunk step would fall
      to `dt_min`, `GraphManager.run_adaptive` warns and accepts the
      attempt it has just made: the state becomes that attempt's two half
      steps, which cover the attempted step.  The attempted step can be up
      to `dt_min / min_factor` (5x `dt_min` at the default controller), but
      the stepper advanced `t`, `dt_history`, `t_history` and the
      callback's `dt` by `dt_min`.  The state then ran ahead of the time
      reported for it, and the loop, stopping on its own clock, carried the
      state past `t_end`.  Measured at v0.3.1 (`git archive`, CPU, jaxlib
      0.11.0) and on the 0.4.0 development tree: a node integrating its own
      clock beside a spring pair whose coupling diverges at `dt = 0.01`,
      `run_adaptive(0.02, dt_initial=0.01, dt_max=0.01, dt_min=0.005)` --
      the first attempt is rejected and accepted at `dt_min` -- reported
      `t_history[-1] = 0.02` beside a clock state of 0.025.  The code is the
      same at v0.1.0.  `run_adaptive_scan` accepts at `dt_min` only an
      attempt made at `dt_min`, and was not affected.
      Resolved in 0.4.0: the accepted step advances the clock, the
      histories and the callback by the step it covered.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silently wrong time accounting.  The reported time of a state is a
      value describing the simulated system, and it was wrong by up to
      `dt_min / min_factor - dt_min` per step accepted at `dt_min`.  The
      warning that step emits ("hit dt_min ... Accepting step") is about
      the step's error estimate, not the clock, and it reads as though the
      step accepted were `dt_min`, the wrong figure.  Every later `t_history`
      entry carried the offset with no warning at all, and the run stopped
      past `t_end`.  Graded `major` under the 0.4.0 severity definition: a
      silent wrong result is never `minor`.  It was graded `minor` when
      first registered, because the step that starts the offset is one the
      stepper already warns about.  Not `critical`: the stepper warns at
      the step, a node integrating its own clock shows the offset, and
      `run_adaptive_scan` avoids it.
      `context_dependent` because a run that never reaches `dt_min`, or
      sets `dt_min` far below the steps it takes, is unaffected, while a
      run whose `dt_min` is reached repeatedly reports a trajectory against
      the wrong times.
    affected_components:
      - "maddening.core.graph_manager.GraphManager.run_adaptive"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: treat a run that warned "hit dt_min" as having an
      unreliable `t_history`, or use `run_adaptive_scan`; read the time of
      the state from a node that integrates its own clock.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.  The step accepted at `dt_min` is still the attempt the
      controller rejected on its error estimate, as the warning says.
    verification:
      - "tests/core/test_adaptive_dt_min_accept_keeps_the_clock.py::test_the_clock_advances_by_the_attempt_a_dt_min_accept_keeps"
    github_issue: null

  - anomaly_id: "MADD-ANO-062"
    title: "HeatNode accepted a non-positive length or timestep, a negative diffusivity and grid_points out of order, and answered wrongly without a word"
    description: >
      Until 0.4.0 the HeatNode constructor checked none of its physical
      constants for meaning.  The node built, compiled and stepped on each
      of these with no error or warning:
        - `length <= 0`: the Laplacian reads `dx**2` and was unchanged, but
          `compute_boundary_fluxes` divides by the signed `dx`, so both
          rod-end fluxes changed sign.  On a 10-cell rod with ends held at
          250 K and 400 K, the left flux read +12.87 at `length=-1` against
          -12.87 at `length=1`;
        - `grid_points` not strictly increasing: `_laplacian_nonuniform`
          replaces a non-positive span `x[i+1] - x[i-1]` with 1.0, so two
          swapped points, or the whole grid in decreasing order, gave a
          finite and wrong Laplacian, and a repeated point divided by zero;
        - `timestep < 0` or `thermal_diffusivity < 0`: the explicit update
          ran the heat equation backwards (anti-diffusion), and the Fourier
          check added in 0.4.0 (MADD-ANO-009) was skipped for any
          non-positive constant;
        - a non-finite value of any of them.
      Found on the 0.4.0 development tree (audit of 2026-09-25, CPU, jaxlib
      0.11.0).  v0.3.1 (`git archive` of the tag, same environment) accepts
      every case too.  Its flux formula differs, but the sign flip is the
      same: -5.98 at `length=1` and +5.98 at `length=-1`, after five steps.
      Resolved in 0.4.0: the constructor raises ValueError naming the
      constant and what it would have done.  `timestep` and `length` must be
      finite and greater than 0, and `thermal_diffusivity` finite and at
      least 0; zero is a rod that does not conduct.  `grid_points` must be
      finite and strictly increasing.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `major` because every case was a silent wrong result, and a
      silent wrong result is never minor.  Most cases need input with no
      physical meaning.  The exception is grid points listed in decreasing
      order: coordinates read along a negative axis can produce it, the
      constructor's documentation never said it was not allowed, and the
      rod then gave plausible, wrong temperatures.  Anti-diffusion does
      eventually leave float range, but its finite values before that are
      wrong.  `context_dependent` because whether a wrong temperature or
      flux matters is a property of the program using it.
    affected_components:
      - "maddening.nodes.heat.HeatNode"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: pass a positive, finite `length` and `timestep`, a
      non-negative `thermal_diffusivity`, and `grid_points` in strictly
      increasing order.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The checks read the constructor's concrete numbers only.  A value
      traced through the constructor is not judged.  Neither is a `dt`
      handed to `update()`, nor a `thermal_diffusivity` or `length`
      injected through params: that is MADD-ANO-002, which stays open.
      `initial_temperature` is not checked for finiteness.
    verification:
      - "tests/nodes/test_heat_constructor_validation.py::test_a_length_that_is_not_a_finite_positive_number_is_refused"
      - "tests/nodes/test_heat_constructor_validation.py::test_a_timestep_that_is_not_a_finite_positive_number_is_refused"
      - "tests/nodes/test_heat_constructor_validation.py::test_a_diffusivity_that_is_negative_or_not_finite_is_refused"
      - "tests/nodes/test_heat_constructor_validation.py::test_grid_points_out_of_order_are_refused"
      - "tests/nodes/test_heat_constructor_validation.py::test_grid_points_that_are_not_finite_are_refused"
    github_issue: null

  - anomaly_id: "MADD-ANO-063"
    title: "A new value of a parameter from which a node derives the points of a mapped edge was taken by PUT /graph/params and gm.params, run with the old points' mapping weights, and saved as a config that does not load"
    description: >
      An interface mapping built from a `{"node": ..., "field": ...}` point
      reference reads the node's field once, when the mapping is built
      (`core/coupling/mapping_spec.py`).  A uniform `HeatNode` derives its
      `grid_x` field from `length` when it is constructed, and its own step
      reads `length` itself (`dx = length / n_cells`), so `length` is a live
      leaf of `gm.params` that every check on a write found in use.
      `PUT /graph/params/{node}` with a new `length` answered 200, and the
      same value written into `gm.params` ran: the rod stepped on the new
      length while the mapping interpolated with the weights of the old
      grid.  `to_dict()` then wrote a config that `from_dict()` refused,
      because it rebuilds the mapping from the rod's new grid and the
      recorded `sha256` of the old one does not match (`MappingRebuildError`).
      `save_state()` and `POST /checkpoint/load` carried the value the same
      way, and an exported FMU advertised `length` as a tunable parameter
      that its compiled step took into the same inconsistency.  It is the
      live-write side of MADD-ANO-022, which records the mapping keeping its
      constructor geometry when the parameter is calibrated.

      Found by the state/IO differential harness on the 0.4.0 development
      tree (b511d92, CPU, jaxlib 0.11.0): a 6-cell and a 5-cell rod joined
      by an RBF mapping on both rods' `grid_x`, `length` written from 1.0 to
      1.5, through the route and through `gm.params`.  The harness's own
      fixture built its mapping from float64 copies of the float32 grid, so
      `to_dict()` refused it before any write; with the grid taken as the
      rod holds it, the write is taken, the graph runs and saves, and the
      reload raises.  Introduced in the 0.4.0 development line with
      node-field point references (3f697d3, 2026-09-16) and live parameter
      writes.  v0.3.1 has neither a `mapping` keyword on `add_edge` nor
      `gm.params`, so no tagged release carried it.

      Resolved in 0.4.0.  A write is refused when the node rebuilt from its
      params with the new value reads a referenced field differently from
      the node rebuilt without it.  `PUT /graph/params` answers 400 naming
      the edge and the field.  A `gm.params` write is refused at the next
      `run`, `run_scan`, `check_params`, `to_dict()` and `save_state()`, as
      every other value the running graph cannot take is.  `POST
      /checkpoint/load` refuses such a checkpoint and undoes the load.  An
      exported FMU leaves the parameter out of its tunable set, naming the
      edge as the reason.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `major` because the running graph was silently wrong.  The
      route answered 200, the node computed with the new value and the
      mapped edge with the old geometry, and nothing said so until a saved
      config failed to load, which a caller who never reloads does not see.
      Graded `context_dependent` rather than `safety_relevant` because it
      needs two choices at once: a mapped edge whose point reference names
      a field the node derives from a parameter, and a write of that
      parameter while the graph runs.  Whether a program does both is a
      property of the program, and no in-tree caller does.  It is recorded
      although no release carried it, because a major defect found in the
      cycle is part of the evidence of how the release was verified.
    affected_components:
      - "maddening.api.server.SimulationServer"
      - "maddening.core.graph_manager.GraphManager"
      - "maddening.fmi.model_description.build_model_description"
    affected_versions: "none"
    workaround: >
      None needed from 0.4.0.  On an earlier 0.4.0.dev0 build: do not write
      a parameter from which a node derives the points of a mapped edge
      while the graph runs.  Rebuild the node and the mapped edge with the
      new value instead, or give the mapping explicit `inline` or `asset`
      points, which a write does not move.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Only a write is refused.  A caller's own `params=` pytree and a traced
      one (`sysid.fit`, `fit_lm`, `fim`, `run_scan(params=...)`) are not
      writes, so a calibration through the mapped edge still computes with
      the constructor's geometry.  That is MADD-ANO-022, which stays open.
      The check rebuilds the node from its params, so a node that is not
      rebuilt that way, and wraps no node that is, cannot be asked and is
      not refused.  The FMU's decision is taken once, by probing the
      parameter with the node's own value moved by half again (by half, if
      the constructor refuses that).  A node whose field moved for some
      values of a parameter and not for others could therefore be exported
      with that parameter tunable; no in-tree node does that.
    verification:
      - "tests/property/test_differential_rest_params.py::test_a_rod_length_under_a_mapping_reference_is_refused_or_runs_as_its_reload"
      - "tests/property/test_differential_param_writes.py::test_a_rod_length_under_a_mapping_reference_runs_as_its_reload"
      - "tests/property/test_differential_rest_params.py::test_the_mapped_rods_save_and_reload_before_any_write"
      - "tests/core/test_mapping_point_reference_writes.py::test_a_length_written_into_gm_params_under_a_reference_is_refused"
      - "tests/core/test_mapping_point_reference_writes.py::test_the_route_refuses_a_length_under_a_reference_and_writes_nothing"
      - "tests/core/test_mapping_point_reference_writes.py::test_the_checkpoint_route_refuses_and_undoes_a_moved_length"
      - "tests/core/test_mapping_point_reference_writes.py::test_a_sharded_rod_under_a_reference_is_refused_the_same_way"
      - "tests/core/test_mapping_point_reference_writes.py::test_an_fmu_does_not_export_a_length_a_mapping_was_built_from"
      - "tests/core/test_mapping_point_reference_writes.py::test_a_value_that_moves_no_referenced_point_set_is_still_taken"

  - anomaly_id: "MADD-ANO-064"
    title: "ShardedUnstructuredNode read a per-cell input the length of a shard's slab as every shard's own slab, where the unsharded node refuses it"
    description: >
      `ShardedUnstructuredNode` shards a boundary input whose leading axis
      is the partition layout's row count and refuses one in global cell
      order; anything else it hands to every shard whole, where
      `update_padded` cannot tell it from its own slab of `n_local_max +
      n_ghost_max` rows.  On a 4-cell ring split over 4 devices (slabs of 1
      owned and 2 ghost rows) a `source` of 3 values was read by every shard
      as its slab: from a zero state one step gave `x = [10, 10, 10, 10]`
      for a source of `[10, 20, 30]`, every cell taking the first value,
      where the unsharded node refuses 3 values for 4 cells.  Reproduced at
      v0.3.0 and v0.3.1 (`git archive` of each tag, CPU, jaxlib 0.5.3 and
      0.11.0, 4 virtual devices), where every boundary input was replicated,
      and on the 0.4.0 development tree (8788d3b), where the differential
      sharding harness found it: an input of another length failed inside
      the traced step with the node's own broadcasting error, naming slab
      shapes, and one of the slab's length ran.  `ShardedStencilNode` has
      refused the same thing since the fix of MADD-ANO-057.  Resolved in
      0.4.0: an input the node declares per cell in `boundary_input_spec()`
      (leading axis the layout's global cell count) must be in partition
      layout or broadcast to the declared shape; anything else is refused
      before tracing, naming the shape given, the declared global shape and
      the partition-layout shape to pass instead.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent, but it needs an input the unsharded node refuses: a caller who
      runs the same graph unsharded gets an error.  Graded `major`, as
      MADD-ANO-057 is, because a silent wrong result is never `minor`, and
      accepting an input the node's own contract refuses and computing from
      it is one.  `context_dependent` because a sharded-only workflow that
      builds a per-shard input would take the result for the intended one.
    affected_components:
      - "maddening.cloud.multigpu.sharded_unstructured.ShardedUnstructuredNode"
    affected_versions: ">=0.3.0, <0.4.0"
    workaround: >
      Before 0.4.0: pass a per-cell input as a scalar, or (from 0.4.0's
      partition-layout inputs on) through `partition_value`; check a sharded
      graph's inputs against the unsharded node first.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The check reads the node's `boundary_input_spec()`, as
      `ShardedStencilNode`'s does: an input a node does not declare, or
      declares with a shape that is not per cell, is left to the node.  An
      input whose leading axis happens to equal the layout's row count is
      taken as partition layout; the shape cannot say otherwise.
    verification:
      - "tests/cloud/multigpu/test_differential_sharding.py::test_a_slab_length_input_the_unsharded_node_refuses_is_refused_sharded"
      - "tests/cloud/multigpu/test_unstructured_misshapen_inputs.py::test_a_per_cell_input_of_another_length_is_refused_naming_the_global_shape"
      - "tests/cloud/multigpu/test_unstructured_misshapen_inputs.py::test_a_per_cell_vector_input_of_another_shape_is_refused"
      - "tests/cloud/multigpu/test_unstructured_misshapen_inputs.py::test_the_forms_the_unsharded_node_takes_still_run_sharded"
    github_issue: null

  - anomaly_id: "MADD-ANO-065"
    title: "ShardedUnstructuredNode.gather_global reshaped a domain integral listed in state_fields() as a per-cell field: a scalar raised, and values one per shard came back reordered"
    description: >
      `gather_global`, documented to pass domain integrals through
      unchanged, chose the fields to gather by `state_fields()` membership,
      and the default `state_fields()` lists every `initial_state` key, an
      integral included.  A listed scalar integral was reshaped to
      `(n_devices, n_local_max)` and raised `ValueError`.  An array whose
      length is the layout's row count reshaped without complaint and was
      gathered as cells: on 4 devices where device `d` owns cell `3 - d`, a
      listed integral `[1, 2, 3, 4]` came back `[4, 3, 2, 1]`, with nothing
      raised.  Reproduced at v0.3.0 and v0.3.1 (`git archive` of each tag,
      CPU, jaxlib 0.5.3 and 0.11.0) on a vector integral, and on the 0.4.0
      development tree (8788d3b) by the differential sharding harness on a
      per-shard integral (new in 0.4.0, stacked one value per shard), whose
      four totals `[4, 3, 2, 1]` came back `[1, 2, 3, 4]`.  Resolved in
      0.4.0: an integral is recognised first, as the wrapper's step
      classifies its outputs, and passed through as placed.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent in the reordering case: per-shard totals attributed to the
      wrong shards, plausible values, no error.  Graded `major` because a
      silent wrong result is never `minor`.  `context_dependent` because it
      needs an integral listed in `state_fields()` (the default) whose
      length is the layout's row count, which a per-shard integral on a
      layout of one cell per shard is; a reduced scalar raised.
    affected_components:
      - "maddening.cloud.multigpu.sharded_unstructured.ShardedUnstructuredNode.gather_global"
    affected_versions: ">=0.3.0, <0.4.0"
    workaround: >
      Before 0.4.0: read a domain integral straight from the sharded state,
      not through `gather_global`, or override `state_fields()` to leave it
      out.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.  A key that is neither an integral nor a state field is
      still passed through unchanged.
    verification:
      - "tests/cloud/multigpu/test_differential_sharding.py::test_gather_global_passes_a_listed_per_shard_integral_through_when_a_shard_holds_one_cell"
      - "tests/cloud/multigpu/test_differential_sharding.py::test_gather_global_passes_an_integral_listed_in_state_fields_through"
      - "tests/cloud/multigpu/test_unstructured_gather_global_integrals.py::test_gather_global_after_a_step_gathers_cells_and_passes_the_integral_through"
      - "tests/cloud/multigpu/test_unstructured_gather_global_integrals.py::test_gather_global_of_the_initial_state_passes_the_integral_through"
    github_issue: null

  - anomaly_id: "MADD-ANO-066"
    title: "A ShardedStencilNode nested in another stacked a per-shard domain integral's initial value twice, so step() changed the state's shape"
    description: >
      A per-shard (unreduced) domain integral is stacked along its
      unreduced mesh axes, and its initial value is placed the same way, so
      a scan carry keeps its shape.  An outer `ShardedStencilNode` read the
      initial state from the wrapper it wraps, which had already stacked
      the value, and stacked it again: `(2, 2)` on two devices where a step
      returns `(2,)`, each shard's value repeated along a second leading
      axis.  `step()` silently changed the state's shape, and `run_scan`
      raised a `TypeError` about the scan carry.  Found by the differential
      sharding harness on the 0.4.0 development tree (8788d3b, CPU, jaxlib
      0.11.0); per-shard integrals (`domain_integral_axes()`) are new in
      0.4.0, so no release carried it.  Resolved in 0.4.0: the outer
      wrapper places the initial value the node itself builds, at any depth
      of nesting.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      The state a nested sharded node started from was wrong, with no
      error, until the first step replaced it: a per-shard total read from
      it counted every shard's value twice over.  Graded `major` because a
      silent wrong result is never `minor`.  `context_dependent` because it
      needs a per-shard integral in the state under two wrappers; a scan
      refused it loudly.
    affected_components:
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
    affected_versions: "none"
    workaround: >
      Wrap the node once.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.  Only the outermost wrapper of a nested stack runs; the
      inner ones forward to the node.
    verification:
      - "tests/cloud/multigpu/test_differential_sharding.py::test_a_per_shard_integral_under_a_nested_wrapper_runs_as_unsharded"
      - "tests/cloud/multigpu/test_nested_stencil_integral_placement.py::test_the_initial_state_has_the_shapes_a_step_returns"
      - "tests/cloud/multigpu/test_nested_stencil_integral_placement.py::test_three_nested_wrappers_scan_as_one"
      - "tests/cloud/multigpu/test_nested_stencil_integral_placement.py::test_a_partial_axis_integral_under_a_nested_wrapper_starts_stacked_once"
    github_issue: null

  - anomaly_id: "MADD-ANO-067"
    title: "ShardedStencilNode summed a domain integral over a mesh axis its axis_map leaves unused, counting every block once per device along it"
    description: >
      A mesh axis that `axis_map` does not use splits nothing: the state and
      every grid-shaped input and sharded static are replicated along it,
      so every device along it holds the same block and computes the same
      partial integral.  The wrapper summed a domain integral over every
      mesh axis, so each block was counted once per device along the unused
      one.  At v0.2.1, v0.3.0 and v0.3.1 (`git archive` of each tag, CPU,
      jaxlib 0.5.3 and 0.11.0, 4 virtual devices) a 4-cell rod holding `[1,
      2, 3, 4]` on a `(2, 2)` mesh sharded over one axis reported a total of
      20.0, twice the unsharded 10.0, with no error.  On the 0.4.0
      development tree (8788d3b) JAX's varying-axes check refused that sum
      at the first step (`jax.lax.psum can only accept axis_name ...`),
      naming neither the node nor the axis, and a per-shard integral (new
      in 0.4.0) was stacked over the unused axis, its partials repeated, so
      the stacked values summed to twice the domain integral.  Resolved in
      0.4.0: an integral is neither summed nor stacked over a mesh axis the
      `axis_map` leaves unused, whether `domain_integral_axes()` names it or
      not; it is replicated along it.  `ShardedUnstructuredNode` already
      treated every mesh axis but its own that way.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent in every release that supported domain integrals: a finite
      total exactly the device count of the unused axis too large.  Graded
      `major` because a silent wrong result is never `minor`.
      `context_dependent` because it needs a mesh with an axis the wrapper
      does not shard along; a mesh whose every axis splits the grid is
      unaffected.
    affected_components:
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
    affected_versions: ">=0.2.1, <0.4.0"
    workaround: >
      Before 0.4.0: build the mesh from the axes the node is sharded along
      only, or divide the total by the device count of the unused axis.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The integral is correct on such a mesh; a node that also reads a
      sharded static there inside `run_scan` can meet MADD-ANO-068.
    verification:
      - "tests/cloud/multigpu/test_differential_sharding_builtins.py::test_a_domain_integral_on_a_mesh_axis_the_axis_map_leaves_unused_answers_as_unsharded"
      - "tests/cloud/multigpu/test_unused_mesh_axis_integrals.py::test_the_unused_axis_is_neither_reduced_nor_stacked_over"
      - "tests/cloud/multigpu/test_unused_mesh_axis_integrals.py::test_a_third_mesh_axis_left_unused_on_a_pencil"
      - "tests/cloud/multigpu/test_unused_mesh_axis_integrals.py::test_a_gradient_through_run_scan_with_an_integral_on_an_unused_axis"
    github_issue: null

  - anomaly_id: "MADD-ANO-068"
    title: "XLA miscompiles a ShardedStencilNode step inside a loop (run_scan, a coupling group's iteration) when a sharded static is replicated over a mesh axis and read in the halo beside a window at the shard's offset"
    description: >
      On jaxlib 0.10.2, 0.11.0 and 0.11.2 (CPU), a `ShardedStencilNode`
      step traced inside a loop -- `GraphManager.run_scan` and the scans
      built on it, a gradient through one included, and the iteration of a
      coupling group -- is compiled wrongly for a node that reads a sharded
      `StaticArray` in its halo and another array through a window at its
      `shard_info` offset (a slice of the window and its shifted
      neighbours), when the static is replicated over a mesh axis of two or
      more devices.  On a mesh axis the `axis_map` leaves unused, every
      cell of a 4-cell rod on a `(2, 2)` mesh came back 1e-3 to 1e-2 off
      after one step, finite and silent; on a `(2, 2)` pencil whose static
      is split along one axis only, the step failed to compile (`RET_CHECK
      failure ... Failed to translate module to LLVM IR`).  The same step
      under `jit` alone is right, and so is a mesh where the static is
      replicated over no axis of two or more devices.  Disabling XLA's
      algebraic simplifier pass makes the scan right.  The miscompile
      reproduces without MADDENING: a closed-over sharded constant,
      replicated over one mesh axis, halo-exchanged with an edge fill and
      multiplied by a smoothed window of a replicated constant at
      `axis_index * 2`, gives a different answer under `jit(scan)` than
      under `jit`.  It does not occur on jaxlib 0.5.3, the newest release
      the 0.3.x pins allowed, so it arrives with 0.4.0's jax floor (0.10).
      Found while widening the differential sharding harness to meshes
      with an unused axis (CPU, 8 virtual devices).

      Measured since: it depends on the loop, not on `scan` as such, and
      no rule about the loop holds.  The pure-JAX reproducer and the rod
      above are wrong in a loop of one iteration (`run_scan(1)`, a
      one-pass `fori_loop` or `while_loop`) and right in one of 2, 3, 5 or
      8, and right in a `while_loop` whose trip count is traced; yet with
      the same rod in a coupling group under `solver="fori"`, `step()` was
      3.4e-3 off whenever the group's loop made two or more passes and
      right with one, while the `"ift"` and sub-cycling groups were right
      on the same graph.  A window into the static itself is right: the
      2-D field of the multi-device validation goals takes its own columns
      out of its sharded static at `shard_info[1]` and is exact in
      `run_scan` on `(2, 2)`, `(2, 4)`, `(4, 2)` and `(2, 8)` pencils
      under all three of its boundary conditions.  Over the harness kernel
      -- 11 meshes (rods and slabs on a mesh with an unused axis, pencils,
      a third mesh axis), the static read in its halo or its interior, the
      table read through a halo-wide window, a block-sized window or not at
      all, face inputs windowed or not, edge and periodic fills; 192
      configurations at `run_scan(1)` -- 22 miscompiled on each of jaxlib
      0.10.2, 0.11.0 and 0.11.2, every one with the static read in its halo
      and the table through a halo-wide window, under either fill.

      Partially resolved in 0.4.0: `GraphManager` refuses the paths that
      put such a step inside a loop, with a `RuntimeError` naming the node,
      the static, the mesh axis, this entry and the workarounds.
      `run_scan`, `run_scan_with_history`, `run_sweep`, `run_adaptive_scan`
      and `sysid.windowed_loss` (and a gradient through any of them) refuse
      any such node; `step()`, `run()` and `run_adaptive` refuse it only as
      a member of a coupling group.  Which nodes read their statics that
      way is decided from the node's own `update_padded`: one trace of the
      graph step under `jax.eval_shape` (never compiled), in which the
      wrapper traces `update_padded` once more with its sharded statics and
      `shard_info` offsets as explicit inputs and walks the jaxpr.  A static
      counts when it is replicated over a mesh axis of two or more devices,
      some live use of it reads outside its interior, and a live
      `dynamic_slice`, `dynamic_update_slice`, `gather` or `scatter` takes
      an index derived from a `shard_info` offset (or `lax.axis_index`)
      into an array not derived from that static alone.  A static read only
      in its interior, one never read (`HeatNode`'s `grid_x`), a node with
      no window, a window into the static itself and a node with no sharded
      static (`LBMNode`) are not refused, and run and answer as the
      unsharded graph.  On the 192 configurations above the refusal fires
      on all 22 that miscompile and on 50 more (block-sized and face
      windows, which measured right), on each of jaxlib 0.10.2, 0.11.0 and
      0.11.2, and on none of the other 120.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent on a mesh with an unused axis: plausible values, every cell
      wrong, no error.  Graded `major` because a silent wrong result is
      never `minor`, and it stays `major` because the silent form is still
      reachable outside the paths that now refuse it (see
      `residual_risk`).  `context_dependent` because it needs that kernel
      pattern, a static replicated over a mesh axis of two or more devices,
      and a loop; no built-in node measured shows it.
    affected_components:
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
      - "maddening.core.graph_manager.GraphManager.run_scan"
      - "maddening.core.graph_manager.GraphManager.step"
    affected_versions: ">=0.4.0.dev0"
    workaround: >
      Build the mesh from the axes the node is sharded along only (the
      static is then replicated over no axis of two or more devices), or
      advance the graph with `step()` / `run()`; a member of a coupling
      group has to leave the group or the mesh has to lose the axis.  For a
      loop written outside `GraphManager` around such a node -- a
      `lax.scan` or `fori_loop` over its `update`, or over
      `GraphManager._build_step_fn()` -- check the loop against `step()`
      or the unsharded node.
    resolution_status: "partially_resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Live in 0.4.0, which is why this entry is partially resolved rather
      than resolved: the compiler defect is upstream and unfixed, and only
      the `GraphManager` entry points are guarded.  A loop a caller builds
      around a `ShardedStencilNode` -- a `lax.scan` or `fori_loop` over its
      `update`, or over the private `GraphManager._build_step_fn()` as the
      multi-device validation goals' gradient helper does -- is not asked,
      and the defect is reachable there silently.  The detection is a
      structural reading of the kernel, conservative where it does not
      recognise an operation, but blind to a shard offset that reaches the
      node other than through `shard_info` or `lax.axis_index` (computed
      on the host and closed over, say), and the trigger itself is
      characterised by measurement, not by the compiler's source: a form
      of the miscompile that needs no halo read of a sharded static beside
      an offset window into another array would not be refused, though
      none was found.  The refusal is also wider than the measured
      trigger -- block-sized windows, and loop lengths that measured right
      -- which is loud, not silent.  The pure-JAX tripwire
      (`test_the_pure_jax_reproducer_still_miscompiles_inside_a_scan`)
      fails on the first jaxlib that compiles the reproducer right, which
      is when to re-measure and lift the refusal for that version.
    verification:
