  - anomaly_id: "MADD-ANO-069"
    title: "hold_undetermined held every direction a fit's gradients had not spanned, so a short or fast-converging fit returned parameters above the loss it had reached"
    description: >
      `hold_undetermined`, on by default in `fit`, `fit_lm` and
      `fit_multiple_shooting`, exists to keep a fit out of directions the
      data cannot determine -- the spring's `(k, c, m)` common scale, along
      which Adam drifts by an amount the learning rate and the budget
      choose.  It accumulated the run's gradients and held, at their
      starting values, every direction they had not spanned.  Not spanned
      is necessary for a direction the data cannot see, because every
      gradient of a least-squares loss lies in the row space of `J`, but it
      is not sufficient: a short or fast-converging run's gradients need
      not span the directions the data does determine.  The guard then
      removed real progress and returned parameters uphill of the fit's own
      result, with no warning and nothing in the `FitResult` to say so:
        - `fit_lm` on a closed-form four-parameter bowl, every direction
          determined: the fit reached a loss of 0.0, the guard reported
          `excited_rank` 1 of 4 and returned parameters at 0.22 (masked to
          two parameters: 0.279 became 0.372);
        - `fit_lm` on a spring with `(stiffness, damping, mass,
          rest_length)` trainable, started with stiffness 1% off: 0.0
          became 1.2e-4, at `excited_rank` 2 of 4;
        - ten Adam steps of `fit` at `lr=0.01` on the bowl: `excited_rank`
          3 of 4, and the result moved off the selected iterate, from
          0.32342 to 0.32367;
        - a hold could also cross a bound: a parameter with the identity
          transform clipped at 0, held back along a flat direction, was
          clipped by `constrain` and moved a combination the data
          determined.
      Introduced in 6018ec9 for `fit` (2026-09-20) and extended to `fit_lm`
      and `fit_multiple_shooting` in 77c0b0d (2026-09-21), both during the
      0.4.0 development line.  No tagged release carried it: v0.1.0 to
      v0.3.1 have no `hold_undetermined`.  Found while making
      `fit` return its lowest-loss iterate (CPU, jaxlib 0.11.0) and pinned
      as a strict xfail until this fix.  It is recorded under the
      registry's rule for defects no release carried: a critical or major
      one found during the cycle gets an entry.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `major` because it was a silent wrong result on the default
      path of all three fitters: the returned constants were not the ones
      the fit had found, the loss they reproduce was higher than
      `best_loss` said, and no field or warning said so.  It bit well-posed
      fits, the case a caller has least reason to inspect, and `fit_lm` --
      the fitter recommended for a handful of physical constants, which
      converges in a few nearly parallel steps -- was the most exposed.
      Not `critical`: the trigger is a short or fast-converging run, the
      size of the error is bounded by how far the fit moved, and
      `hold_undetermined=False` returned the fit's own result.
      `context_dependent` because whether a calibration's constants being
      off by part of the fit's own progress matters is a property of the
      program that uses them.
    affected_components:
      - "maddening.sysid.fit"
      - "maddening.sysid.fit_lm"
      - "maddening.sysid.fit_multiple_shooting"
      - "maddening.sysid.FitResult"
    affected_versions: "none"
    workaround: >
      None needed from 0.4.0.  On a 0.4.0.dev0 build between 6018ec9 and the
      fix: pass `hold_undetermined=False`, or compare the loss of the
      returned `params` with the lowest entry of `losses` and refit
      unguarded when it is higher.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Resolved by making the gradient test one of two and adding a check.
      A direction is held only if no gradient of the run pointed along it
      *and* the objective has no curvature along it at the selected iterate:
      `JᵀJ` for `fit_lm`, read with `fim`'s own rank cutoff
      (`max(n, sqrt(m)) * eps` of its largest eigenvalue), and for `fit` and
      `fit_multiple_shooting` the loss's Hessian, through Hessian-vector
      products along the candidates and up to 8 of the most-excited
      directions, at `sqrt(eps)` of the largest singular value they show.
      Then the held point's loss, by the fitter's own compiled function,
      must not exceed the selected iterate's by more than
      `2**10 * eps * |loss|` (1.2e-4 relative in float32) plus the
      first- and second-order loss cost of perturbing every coordinate `u`
      of the held point by four roundings, `eps * max(1, |u|)` each;
      otherwise nothing is held, `params` is the selected iterate bit for
      bit, the new `FitResult.hold_declined` is True and a RuntimeWarning
      gives both losses.  After the fix all four cases above return the
      fit's own loss to rounding (the spring 1% off, a degeneracy that
      rotates in the optimiser's coordinates, is held at a cost of 4.5e-11
      on jaxlib 0.11.0 and declined at 2.0e-9 on 0.11.2, against a
      tolerance of 4.4e-10), and the spring's scale degeneracy under `log`
      transforms is still held by all three fitters, to within 1e-7 of the
      start at `lr=0.2` for 200 to 10,000 iterations.
      What remains: a hold may still raise the loss by up to that
      tolerance, which is rounding by design but is not zero.  A
      degeneracy that rotates in the optimiser's coordinates (mixed `log`
      and identity transforms on the parameters it mixes) is usually not
      held and is reported full rank, as before; when it is held, the hold
      follows the local tangent and the check bounds what that costs.
      `fit_multiple_shooting` reads the Hessian with its window states
      fixed, so a direction the window states could compensate for is left
      unheld.  A loss whose Hessian-vector product cannot be formed falls
      back to the gradient test, still under the loss check, with a
      RuntimeWarning.  Fewer gradients than trainable coordinates still
      answers `excited_rank=None`, though the curvature test could now
      answer it.
    verification:
      - "tests/core/test_sysid_hold_never_raises_the_loss.py::test_fit_lm_on_a_well_posed_bowl_returns_the_minimum_it_reached"
      - "tests/core/test_sysid_hold_never_raises_the_loss.py::test_fit_lm_on_the_spring_one_percent_off_stays_at_its_minimum"
      - "tests/core/test_sysid_hold_never_raises_the_loss.py::test_a_short_adam_run_on_the_bowl_returns_its_selected_iterate"
      - "tests/core/test_sysid_hold_never_raises_the_loss.py::test_a_hold_that_would_raise_the_loss_is_declined_and_said_so"
      - "tests/core/test_sysid_hold_never_raises_the_loss.py::test_a_hold_through_a_bound_is_declined"
      - "tests/core/test_sysid_fit_returns_lowest_loss_iterate.py::test_the_guard_does_not_raise_the_loss_of_a_well_posed_fit"
      - "tests/core/test_sysid_undetermined_directions.py::test_the_scale_is_held_at_the_budget_the_guard_was_built_for"
    github_issue: null

  - anomaly_id: "MADD-ANO-070"
    title: "solver=\"ift\" held a coupling group's non-floating fields at their first-pass values: a flag reading the iterate came back stale, and one read across an edge froze the map"
    description: >
      A node may compute an integer or boolean field from a boundary input
      -- a contact flag reading a gap -- and such a field changes with the
      coupling iterate.  During 0.4.0 development `solver="ift"` came to
      keep only floating fields in its fixed-point vector (so integer
      leaves no longer travelled through float32) and restored every other
      field from the first pass, on the premise, stated in MADD-ANO-059's
      resolution and in `_floating_accel_fields`, that such a field "is
      recomputed from the pre-step state on every pass, so its first-pass
      value is already the converged one".  That holds for a step counter
      and not for a flag.  Two silent consequences, both found by the
      coupling differential harness and measured on the development tree
      (CPU, jaxlib 0.11.0):
        - the returned flag described the first pass's input.  `a: x =
          -0.5 u - 0.1`, `b: x = u`, `b` starting at +1 and `a` holding
          `sign = u > 0`: `"ift"` returned `sign=True` beside `x = -1/15`,
          where `"fori"`, which recomputes it every pass, returned False;
        - a non-floating field carried by a group-internal edge stayed at
          its first-pass value inside the loop, so a reader that takes it
          from the iterate -- under `iteration_mode="jacobi"`, or scheduled
          before its producer -- iterated a map the graph does not define.
          `a` holding `open = u < 0.5` and `b: x = u + 0.2 open`, `b`
          starting at +1: the only consistent fixed point has the gate
          open (`x_b = 1/15`); `"ift"` under Jacobi returned `x_b = -1/15`
          with `converged=True`, the fixed point of the map with the gate
          held shut.
      `solver="fori"` with an acceleration had a milder form of the first:
      it took a group's non-floating fields from the raw pass that preceded
      the returned iterate, which under a relaxation or a quasi-Newton step
      is not that iterate's pass (an IQN group returned the stale flag on
      its first step).  v0.3.0 and v0.3.1 (`git archive` of each tag, CPU,
      jaxlib 0.11.0) return the consistent flag and fixed point on both
      reproducers under both solvers, with an `int32` flag (a `bool` field
      in a coupled group raised `TypeError` there); v0.1.0 to v0.2.1 have
      no `"ift"` solver.  No tagged release carried the defect.
      Resolved in 0.4.0: both solvers return a group's non-floating fields
      as the pass computes them at the returned floating state (one more
      evaluation of the pass, of which XLA keeps only the arithmetic those
      fields need, its floating inputs behind `stop_gradient`), and
      `"ift"` evaluates a non-floating field an internal edge carries at
      the iterate on every pass.  An all-floating group compiles to the
      program it always did.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silently wrong: a returned flag contradicted the returned state, and
      a group whose internal edge carries a flag converged, with
      converged=True, to the fixed point of a different map.  Graded
      `major` under the 0.4.0 definition (a silent wrong result is never
      `minor`).  Not `critical`: it needs a non-floating field that depends
      on the iterate, and the edge form also needs the reader to take it
      from the iterate.  `context_dependent` because whether a stale flag
      or a different branch's fixed point matters is a property of the
      model.
    affected_components:
      - "maddening.core.coupling.group.CouplingGroup.solver"
      - "maddening.core.graph_manager.GraphManager.step"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: use solver="fori" without an acceleration, or carry the flag
      as a float field.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A map that switches on a flag has a fixed point only where the flag
      is consistent; where none exists (the flag flips on every pass) the
      group reaches the cap with converged=False, as before.  Under "ift"
      an edge-carried flag is evaluated at the iterate itself rather than
      one pass behind it as under "fori", so the two solvers can take a
      different number of passes to the same fixed point.  The IFT
      derivative treats a flag as locally constant (zero derivative), as
      the unrolled fori loop does.  A group with non-floating fields pays
      one more pass per step, and one with an edge-carried one a second
      per iteration, less whatever XLA eliminates.
    verification:
      - "tests/property/test_differential_coupling_solvers.py::test_a_flag_reading_a_coupled_input_agrees_between_the_solvers"
      - "tests/core/test_coupling_nonfloat_leaves_track_the_iterate.py::test_an_iterate_dependent_flag_is_the_one_the_returned_state_computes"
      - "tests/core/test_coupling_nonfloat_leaves_track_the_iterate.py::test_a_flag_read_across_an_internal_edge_iterates_with_the_solve"
      - "tests/core/test_coupling_nonfloat_leaves_track_the_iterate.py::test_the_ift_gradient_is_the_fixed_points_with_the_leaves_present"
      - "tests/core/test_coupling_nonfloat_leaves_track_the_iterate.py::test_the_ift_gradient_through_a_flag_edge_is_the_open_branchs"
    github_issue: null

  - anomaly_id: "MADD-ANO-071"
    title: "A coupling group in which a flux producer reads a flux failed with a bare KeyError under iteration_mode=\"jacobi\""
    description: >
      A flux edge carries a value `compute_boundary_fluxes` returns, not a
      state field, and a coupling pass computes each producer's flux from
      the previous iterate before it updates anything.  The Jacobi pass
      resolved each producer's own inputs strictly and with no flux
      dictionary, so a producer whose input is a flux edge -- two slabs
      exchanging boundary fluxes, or one producer reading another's flux
      one way -- raised `KeyError` naming the flux inside the traced step.
      Measured at v0.1.0 and v0.3.1 (`git archive` of each tag, CPU,
      jaxlib 0.11.0): two relays with `q = 2 x` fluxes, `g0.q -> g1` and
      `g1.q -> g0` (or `g1.x -> g0`), raised `KeyError: 'q'` under Jacobi;
      Gauss-Seidel raised it on the mutual pair too.  During 0.4.0
      development the Gauss-Seidel pass gained a two-sweep seed (the first
      sweep tolerating a missing flux), and the Jacobi pass did not; the
      coupling differential harness found it.
      Resolved in 0.4.0: the Jacobi pass seeds producers' fluxes in two
      sweeps exactly as the Gauss-Seidel pass does, wherever a producer in
      the group reads a flux; a Jacobi group whose producers read only
      state keeps its single sweep and its program.
    severity: "minor"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      Loud: the step raised before returning anything, so no wrong value
      was reported.  The harm was a configuration the API accepted failing
      with an error that named a field and no cause.
    affected_components:
      - "maddening.core.coupling.group.CouplingGroup.iteration_mode"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: couple flux producers that read each other's fluxes
      under iteration_mode="gauss-seidel" (in 0.4.0 development builds;
      neither mode stepped the mutual pair in a tagged release), or feed a
      producer state fields rather than fluxes.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The seed is the Gauss-Seidel pass's: the second sweep reads the
      first sweep's fluxes in schedule order, so a flux that depends on
      another flux which depends on a third is seeded one sweep behind;
      exact for fluxes that depend on state only, which is every flux the
      built-in nodes compute, and the converged fixed point is the same.
    verification:
      - "tests/property/test_differential_leaves.py::test_two_flux_producers_exchanging_fluxes_step_under_jacobi"
      - "tests/core/test_coupling_jacobi_flux_seed.py::test_flux_reading_producers_step_under_jacobi_to_the_gauss_seidel_fixed_point"
      - "tests/core/test_coupling_jacobi_flux_seed.py::test_a_jacobi_pass_seeds_in_two_sweeps_only_where_a_producer_reads_a_flux"
    github_issue: null

  - anomaly_id: "MADD-ANO-072"
    title: "After jax.grad through run_scan, set_node_state wrote into the traced state and the next entry point discarded the write; reset_state raised on a predictor group"
    description: >
      `step()` / `run_scan()` assign their result into the graph, so a
      loss that calls one leaves tracers in it when `jax.grad` returns.
      Since early in 0.4.0 development every stepper puts the graph back
      to its last untraced state first (`_recover_from_escaped_tracers`,
      "called from every entry point"), and its warning names
      `set_node_state` / `reset_state` / `load_state` as the remedy.  Six
      entry points did not call it.  `set_node_state` wrote into the traced
      state and the next `step()` put the graph back over it, so the run
      continued from the state before the transform with no error: a
      spring written to 0.25 stepped on from 1.0 (silent).  `reset_state`
      sized a predictor group's history seed from the traced slot and
      raised `UnexpectedTracerError`, so the remedy failed on any group
      with `predictor` set.  `get_node_state` and
      `resolve_boundary_inputs` raised `ConcretizationTypeError`;
      `add_node` wrote into the traced state and the next step raised
      `KeyError` on the new node; `remove_node` left the removed node's
      state behind.  Measured on the 0.4.0 development tree (CPU, jaxlib
      0.11.0).  No tagged release has the recovery, or a `params` argument
      to differentiate `run_scan` through, so none carried the defect.
      Resolved in 0.4.0: all six, and `validate`, put the graph back first;
      `reset_state` does it without the warning, since it replaces the
      whole state.  Inside a transform the call does nothing, so a traced
      multi-step loop still works.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `major` for the set_node_state form: a state written after
      differentiating was silently discarded and the simulation continued
      from a different state.  The other five forms were loud.  Not
      `critical`: it needs a write between a transform and the next entry
      point, and only development builds carried it.  `context_dependent`
      because whether the discarded state matters depends on the program.
    affected_components:
      - "maddening.core.graph_manager.GraphManager.set_node_state"
      - "maddening.core.graph_manager.GraphManager.reset_state"
      - "maddening.core.graph_manager.GraphManager.get_node_state"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: call coupling_diagnostics() or step() once after
      differentiating, before writing the state.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The recovery restores the state from before the transform, as the
      steppers always did; a caller who wanted the traced final state must
      take it from the transform's output.  Code outside GraphManager that
      reads gm._state directly is not covered.
    verification:
      - "tests/property/test_differential_coupling_solvers.py::test_reset_state_after_differentiating_through_run_scan_restores_the_graph"
      - "tests/core/test_escaped_tracer_recovery_at_every_entry_point.py::test_set_node_state_after_grad_survives_the_next_step"
      - "tests/core/test_escaped_tracer_recovery_at_every_entry_point.py::test_reset_state_after_grad_resets_quietly"
      - "tests/core/test_escaped_tracer_recovery_at_every_entry_point.py::test_add_node_after_grad_keeps_the_new_node"
    github_issue: null

  - anomaly_id: "MADD-ANO-073"
    title: "Under acceleration=\"fixed\" with relaxation below 1/(1+sqrt(rho)), a coupling group stopping on its first loop pass understated its distance about 2x and reported converged"
    description: >
      0.4.0's convergence criterion compares an estimate of the distance
      to the fixed point, omega r / (1 - rho), with the threshold
      (MADD-ANO-005).  Under acceleration="fixed" omega is the relaxation,
      and the series is exact once rho is the relaxed iteration's rate
      1 - omega (1 - rho_F).  But every loop starts with one plain,
      unrelaxed pass, and the first loop pass took its ratio from that
      pass's residual, so it read the map's own rate rho_F (as
      sqrt(rho_F)) and scaled it by omega: omega r / (1 - sqrt(rho_F))
      falls short of r / (1 - rho_F) whenever omega < 1 / (1 + sqrt(rho_F)).
      Found by the coupling differential harness on the 0.4.0 development
      tree (CPU, jaxlib 0.11.0): a two-node pair at rate 0.5, relaxation
      0.3, started two thresholds from its fixed point, stopped after one
      pass with ratio_usable=True, an error_estimate of 0.72 thresholds and
      converged=True, 1.41 thresholds away, under both solvers.  The
      estimate-based criterion is new in 0.4.0; no tagged release carried
      the defect.
      Resolved in 0.4.0: on its first loop pass only, an under-relaxed
      "fixed" group translates the rate it read into the relaxed
      iteration's -- the amplification is divided by the relaxation, which
      makes the estimate r / (1 - sqrt(rho_F)), never below the distance on
      one mode -- in both solvers' loops and in the reported amplification.
      Over-relaxation and every other acceleration are untouched, and so
      is their program.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silently wrong: converged=True about twice the threshold from the
      fixed point, with ratio_usable=True, in the one regime the
      documentation called exact.  Graded `major` (a silent wrong result is
      never `minor`).  Not `critical`: only under-relaxed fixed groups that
      stop on their first loop pass, by at most the factor
      1 / (omega (1 + sqrt(rho))).  `context_dependent` for the same reason
      as MADD-ANO-005.
    affected_components:
      - "maddening.core.coupling.group.CouplingGroup.relaxation"
      - "maddening.core.graph_manager.GraphManager.coupling_diagnostics"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: allow at least a second loop pass (relaxation >= 1 /
      (1 + sqrt(rho)), or a tighter tolerance).
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The first-pass estimate reads the rate through the sqrt guard's
      single seed, so on one mode it is r / (1 - sqrt(rho)), conservative
      by 1 + sqrt(rho); a group close enough still stops there, correctly.
      Under-relaxed groups that used to stop on the first loop pass take
      more passes.  The other conditions MADD-ANO-005 lists -- a rate read
      off a mode that is not the slowest, a non-metric measure -- still
      apply.
    verification:
      - "tests/property/test_differential_fixed_point.py::test_converged_on_the_first_pass_under_under_relaxation_is_within_the_threshold"
      - "tests/core/test_coupling_first_pass_relaxed_rate.py::test_converged_is_within_the_threshold_under_under_relaxation"
      - "tests/core/test_coupling_first_pass_relaxed_rate.py::test_both_solvers_stop_on_the_same_pass_and_report_the_same_verdict"
