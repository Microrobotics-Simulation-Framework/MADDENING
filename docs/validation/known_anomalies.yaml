  - anomaly_id: "MADD-ANO-046"
    title: "A sub-cycled node whose timestep does not divide the group's macro timestep covered round(macro / node_dt) * node_dt per macro step, and nothing refused it"
    description: >
      A node in a coupling group with `subcycling=True` takes
      `round(macro_dt / node_dt)` sub-steps of its own timestep per
      coupling pass, `macro_dt` the largest timestep in the group.  Unless
      that ratio is a whole number the node covers
      `round(macro_dt / node_dt) * node_dt` per macro step instead of
      `macro_dt`, so its clock drifts from the rest of the graph by a
      fixed fraction of every step, with no error or warning.  Measured
      with a node integrating its own clock (`t <- t + dt`) coupled both
      ways to a node at 0.01 s, ten steps (CPU, jaxlib 0.11.0): the
      sub-cycled clock read 0.090 at timestep 0.003 (three sub-steps of
      0.003 per 0.01), 0.080 at 0.004 and 0.090 at 0.009 (a divider of
      one), against 0.100 for the graph; 0.0025, which divides, read
      0.100.  Reproduced identically at v0.1.0 and v0.3.1 (`git archive`
      of each tag, same environment).  `run_adaptive` kept the same ratio
      (after MADD-ANO-043's fix; before it, it also multiplied by the
      divider).
      Resolved in 0.4.0: `validate()`, and so `compile()`, reports an
      error for every sub-cycled member whose timestep does not divide
      the macro timestep to a relative `1e-9`, naming the node, both
      timesteps, what it would cover and the two nearest timesteps that
      divide.  A group whose ratios are whole compiles to exactly the
      program it did.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silently wrong physics on an accepted configuration: the sub-cycled
      node integrates less (or, at a ratio rounding up, more) time than
      the graph it is coupled to, every step, and the result is a
      plausible trajectory.  Graded `major` for that silence and because
      the error accumulates without bound.  `context_dependent` because
      it needs a sub-cycled group with a timestep that does not divide
      the largest; the common choices (halves, quarters, tenths) were
      unaffected.
    affected_components:
      - "maddening.core.graph_manager.GraphManager.compile"
      - "maddening.core.coupling.group.CouplingGroup.subcycling"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: give every member of a sub-cycled group a timestep
      that divides the group's largest timestep exactly.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A ratio within `1e-9` of a whole number is accepted and rounded, so
      such a member drifts by at most one sub-step in a billion macro
      steps.  Graphs saved with a non-dividing timestep no longer compile
      and must be edited.
    verification:
      - "tests/core/test_subcycling_ratio_refusal.py::test_a_member_whose_timestep_does_not_divide_is_refused"
      - "tests/core/test_subcycling_ratio_refusal.py::test_every_member_that_does_not_divide_is_named"
      - "tests/core/test_subcycling_ratio_refusal.py::test_a_member_that_divides_is_accepted_and_keeps_the_graphs_clock"
      - "tests/core/test_subcycling_ratio_refusal.py::test_the_tolerance_admits_float_noise_and_nothing_coarser"
    github_issue: null

  - anomaly_id: "MADD-ANO-047"
    title: "PUT /graph/params accepted a write that flipped a branch the node fixed at construction: the running graph kept the old branch, a saved graph reloaded the new one"
    description: >
      A node may decide a branch of its computation, and build what the
      branch reads, from a parameter when it is constructed.  Writing that
      parameter through `PUT /graph/params/{node}` rebuilt neither: the
      route answered 200, `GET` echoed the value and `to_dict()` saved it,
      while the running node kept stepping the branch it was built on, and
      a reload built the other one.  Two built-in nodes were affected.
      `HeatNode` chose its grid from `params["grid_points"]` on every trace
      but built the coordinates the variable-dx stencil reads once, in
      `__init__` (since 0.2.0): `grid_points` written into a uniform rod
      switched the step onto the variable-dx stencil over the stale uniform
      coordinates, so the running rod stayed uniform.  `LBMPipeNode` fixes
      its single- or multiphase branch from `G != 0` at construction
      (since 0.1.0): `G = 0` on a multiphase pipe left it multiphase, with
      no interaction force once the step read the new `G`, while the saved
      pipe reloaded single-phase.
      Reproduced through the real endpoint (`git archive` of each tag, CPU,
      jaxlib 0.11.0).  A 12-cell uniform rod (`dt = 0.05`,
      `thermal_diffusivity = 1e-3`, a sinusoidal initial profile, both ends
      given as external inputs) with a non-uniform `grid_points` written:
      200, and the running rod against its `to_dict()` / `from_dict()`
      reload differs by 147.38 K after 200 steps at v0.2.0 and v0.3.1, and
      by 166.35 K on the 0.4.0 development tree before the fix (71479c7);
      at v0.1.0, whose rod rebuilt its coordinates from the params on every
      trace, the two agree (0.0 K).  A multiphase pipe (`nx, ny, nz = 8,
      10, 10`, `G = -5`, `rho_liquid = 2.0`, `rho_gas = 0.2`,
      `fill_fraction = 0.5`) with `G = 0` written: 200, and the tracer
      differs by 0.6525 after ten steps at v0.1.0, v0.2.0 and v0.3.1, where
      the running pipe did not read `G` at all (MADD-ANO-024's form), and by
      0.6453 on 71479c7, where it read the new `G` inside the branch
      construction had fixed.  MADD-ANO-024's resolution refused a value no
      step reads; both of these are read, so both passed it.
      Partially resolved in 0.4.0, in the route and in `HeatNode`.  The route asks,
      before anything is written, whether the graph a save would reload
      runs what the running graph runs: it builds the node from the params
      a save would carry with the request applied, and where that node
      holds anything its constructor derives differently from the running
      node, traces both nodes' hooks on the same state and params and
      builds both initial states; a difference is a 400 naming the
      attributes, with nothing written.  A node that already differs from
      its own rebuild before the write (a constructor that draws random
      numbers, say) cannot have the difference blamed on the write and is
      not refused on this ground.  `HeatNode` now fixes its grid at
      construction together with the coordinates, so a written
      `grid_points` is read by nothing the running rod computes and is
      refused on that ground as well.  `G = -4.5` on a multiphase pipe, a
      new `tau`, and a new `length` on a uniform rod are still accepted, and
      the reload reproduces each.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent: the write is confirmed, reported and saved, and the running
      graph computes a different model from the one its saved config
      reloads, with no error or warning (147 K apart on a 12-cell rod,
      0.65 in a phase indicator bounded by 1).  Graded `major`, as
      MADD-ANO-024 is, for that silence and for the reload divergence.
      `context_dependent` because it needs a run-time REST write that
      changes a branch the node chose when it was built; a graph whose
      parameters are set only through the constructor is unaffected.
    affected_components:
      - "maddening.api.server.SimulationServer"
      - "maddening.nodes.heat.HeatNode"
    affected_versions: ">=0.1.0"
    workaround: >
      Before 0.4.0: change `grid_points` on a `HeatNode`, or cross `G = 0`
      on an `LBMPipeNode`, by rebuilding the node (`DELETE
      /graph/nodes/{name}`, then `POST /graph/nodes`), never through `PUT
      /graph/params`.  From 0.4.0 the route refuses such a write; a
      calibration or a `gm.params` write of an `LBMPipeNode`'s `G` must not
      cross zero either -- bound it away from zero (a `ParamSpec` with
      bounds of one sign), or rebuild the pipe with the other sign.
    resolution_status: "partially_resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Live in 0.4.0, which is why this entry is partially resolved rather
      than resolved: writes outside the route -- a direct `gm.params`
      write, a fit -- are not asked the route's question, and a built-in
      node reaches the defect that way.  `G = 0` written into `gm.params`
      of a multiphase `LBMPipeNode` (`G = -5`) is accepted and saved by
      `to_dict()`; the running pipe stays on the multiphase branch while
      the reload is single-phase, and after ten steps the two differ by
      0.842 in density and 0.645 in the tracer (a phase indicator bounded
      by 1), with no error or warning.  A fit that moves `G` through zero
      does the same.  `G` crossing zero is the only such write among the
      built-in nodes' trainable leaves.  Pinned by
      test_a_gm_params_write_of_g_through_zero_runs_another_model_than_its_reload.
      Two limits of the route's own check, recorded rather than closed.
      The comparison runs only where the rebuilt node's attributes differ
      from the running node's, and only for a node its class rebuilds from
      its params (as `from_dict()` does).  It compares one trace of the
      hooks with a zero for every declared boundary input, and the
      initial state; a constructor-derived value that only an undeclared
      input would reach is not seen.
    verification:
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_grid_written_into_a_uniform_rod_is_refused_and_the_reload_matches"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_uniform_rod_keeps_its_stencil_when_grid_points_is_written_into_its_params"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_non_uniform_rod_refuses_both_a_new_grid_and_none"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_switching_a_multiphase_pipe_to_single_phase_is_refused_and_the_reload_matches"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_single_phase_pipe_refuses_a_nonzero_interaction_strength"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_compiled_multiphase_pipe_takes_writes_within_its_branch_and_the_reload_matches"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_uniform_rod_takes_a_new_length_and_the_reload_matches"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_constructor_derived_branch_is_refused_for_any_node"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_an_array_the_constructor_derives_from_a_live_value_is_refused"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_an_initial_condition_the_constructor_copied_from_a_live_value_is_refused"
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_node_that_differs_from_its_own_rebuild_is_not_blamed_on_the_write"
      # What stays open, pinned so that closing it fails.
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_gm_params_write_of_g_through_zero_runs_another_model_than_its_reload"
