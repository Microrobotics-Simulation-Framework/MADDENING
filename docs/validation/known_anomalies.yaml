  - anomaly_id: "MADD-ANO-025"
    title: "A sharded LBMNode computed a different model from the unsharded node: pressure faces imposed at every seam of a sharded face axis, and an edge-filled global halo by default"
    description: >
      `ShardedStencilNode(LBMNode)` departed silently from the node it
      wraps in two ways.  (1) With the axis of the inlet/outlet pressure
      faces sharded, `LBMNode.update_padded` applied the Zou-He closure to
      the edge plane of every shard's slab, so each seam was forced to the
      face pressures.  The update_padded docstring and the LBM guide called
      that layout invalid, but nothing enforced it.  (2) The wrapper fills
      the halos at the edges of the global grid with its `boundary`
      argument, default `"edge"`, while `LBMNode.update` streams
      periodically (`jnp.roll`), so even the documented layout computed a
      different model unless `boundary="periodic"` was passed.
      Measured on a pressure-driven channel (16x10 D2Q9, walls at
      y = 0 and y = 9, p_in = 1.01/3, p_out = 0.99/3, 200 steps, two
      virtual devices, CPU, jaxlib 0.11.0, float32).  At v0.2.0 and v0.3.1
      (`git archive` of each tag, identical results): sharding the face
      axis gives 1.1495x the unsharded centreline velocity; sharding across
      the walls with the default fill gives 0.9973x (max|du| 2.2e-04); with
      `boundary="periodic"` it matches to 1.2e-07.  On the 0.4.0
      development tree before the fix (f3b330a), where MADD-ANO-020's face
      closure was already corrected, the same three runs give 2.0973x, with
      the densities either side of the seam forced to 0.990 and 1.010,
      then 0.9936x (max|du| 4.1e-04) and a 2.6e-07 match.  No error or
      warning in any of them.  `LBMNode.update_padded` and the
      `boundary="edge"` default both date from v0.2.0, the first release
      with `ShardedStencilNode`.
      Resolved in 0.4.0.  (1) The first sharded step that imposes a
      pressure on a face whose axis is split raises a `ValueError` naming
      the face(s), the axis, the slab size and an axis to shard instead;
      the check reads `shard_info`, so a body-force-driven node may still
      shard any axis, and a mesh axis of one device (no seam) is allowed.
      (2) `ShardedStencilNode` keeps its STABLE `boundary="edge"` default.
      A stencil node may now declare `halo_boundary()`, the fill under
      which its `update_padded` reproduces its `update`; `LBMNode` declares
      `"periodic"`, and the wrapper refuses at construction any `boundary`
      that differs from a declared fill, its own default included, with a
      message saying to pass `boundary="periodic"`.  A node that declares
      nothing is wrapped exactly as before.
    severity: "minor"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent wrong physics on a public, STABLE wrapper, graded `minor`
      because (1) was on a layout the docstring and the guide called
      invalid, and (2) is sub-percent on the default path (0.27% at the
      tags, 0.64% after MADD-ANO-020's fix), below the node's documented
      first-order wall error at practical resolutions.  The case for
      `major`: (2) was the default and nothing said sharding changed the
      model, and (1) was up to a 2x error with no signal.
      `context_dependent` because it needs a sharded LBM, and for (1) a
      pressure-driven one sharded along its flow axis; whether a result
      built on it matters is a property of the program using it.
    affected_components:
      - "maddening.nodes.lbm.LBMNode.update_padded"
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
    affected_versions: ">=0.2.0, <0.4.0"
    workaround: >
      Before 0.4.0: pass `boundary="periodic"` when wrapping an `LBMNode`,
      and shard only axes no pressure face lies on, or drive the flow with
      `body_force`.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The face-axis refusal fires at the first sharded step that imposes a
      pressure (at trace time), not at construction, because the faces act
      only when a pressure input arrives; a direct `update_padded` caller
      that passes no `shard_info` is not covered.  Wrapping an `LBMNode`
      without `boundary="periodic"` is refused at construction.  A stencil
      node that declares no `halo_boundary()` is wrapped as before, where
      the fill it is given is its boundary condition.
    verification:
      - "tests/cloud/multigpu/test_lbm_sharded_pressure_faces.py::test_sharding_the_inlet_outlet_axis_of_a_pressure_channel_is_refused"
      - "tests/cloud/multigpu/test_lbm_sharded_pressure_faces.py::test_with_periodic_halos_a_pressure_channel_sharded_across_its_walls_is_the_unsharded_node"
      - "tests/cloud/multigpu/test_lbm_sharded_pressure_faces.py::test_wrapping_an_lbm_node_with_the_default_boundary_is_refused_at_construction"
      - "tests/cloud/multigpu/test_lbm_sharded_pressure_faces.py::test_an_explicit_halo_fill_other_than_the_declared_one_is_refused"
      - "tests/cloud/multigpu/test_lbm_sharded_pressure_faces.py::test_a_node_that_declares_no_halo_boundary_is_wrapped_exactly_as_before"
    github_issue: null

  - anomaly_id: "MADD-ANO-026"
    title: "With waveform_iterations > 1, coupling_diagnostics() reported only the last sweep's pass count: an earlier sweep stopped at max_iterations read as iterations=1"
    description: >
      A coupling group with `subcycling=True`, nodes at different timesteps
      and `waveform_iterations=N > 1` runs N waveform sweeps per step.  Each
      sweep is a fixed-point solve with its own `max_iterations` budget, and
      each iterates the same one-pass map from where the sweep before it
      stopped (the second sweep's first residual is, bit for bit, the
      residual the first sweep reported).  `coupling_diagnostics()` kept
      only the last sweep's pass count as `iterations`.  The first sweep
      usually does the work and the later ones start at or near the fixed
      point, so the report under-counted the passes a step ran, and a sweep
      that exhausted `max_iterations` was invisible whenever a later one
      converged: with the first sweep at the cap and the last converging in
      one pass, the report read `iterations=1`.  The released docstrings
      described the field as "coupling iterations used"; the 0.4.0
      development docstring added that `iterations >= max_iterations` is a
      usable cap check, which with several sweeps it was not.  Readers
      of the count inherited it: `tune_coupling_params` ranks
      configurations by the summed count, so it costed a waveform group at
      the last sweep's passes, and `profile_graph`'s at-cap fraction and
      mean iterations read the same `_meta` slot.
      Reproduced at v0.1.0, v0.2.0 and v0.3.1 (`git archive` of each tag,
      CPU, jaxlib 0.11.0) on two `SpringDamperNode`s at timesteps 0.001 and
      0.01 coupled both ways, `tolerance=1e-8`, `diagnostics=True`, first
      step, with identical numbers at all three tags.  At
      `max_iterations=10`, `waveform_iterations` 1 / 2 / 3 report
      `iterations` 3 / 1 / 1.  At `max_iterations=2` they report 2 / 1 / 1,
      the first sweep having stopped at the cap in every case.  Under
      `acceleration="fixed"` with `relaxation=0.7` at `max_iterations=10`
      they report 10 / 1 / 1, the first sweep again at the cap.  The 0.4.0
      development tree before the fix (741a624) gives the same counts under
      both solvers and with every acceleration, beside `converged=True` in
      each capped case.  v0.1.0 already carries the waveform loop.
      Resolved in 0.4.0.  `iterations` is the largest sweep's count, so
      `iterations >= max_iterations` holds exactly when some sweep exhausted
      its budget.  A new key, `total_iterations`, is the sum over the sweeps,
      and equals `iterations` for a group that runs one sweep.  `residual`,
      `converged` and every other key stay the last sweep's: that sweep
      produced the returned state, and they describe it.  The returned state
      is unchanged bit for bit, and a group that runs one sweep (every group
      that does not sub-cycle, and `waveform_iterations=1`) reports
      exactly what it did before.  `tune_coupling_params` sums
      `total_iterations`.
    severity: "minor"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      No simulated value depends on it.  The returned state and every
      reported value that describes it (`residual`, the error estimate,
      `converged`, the bounds) come from the last sweep and were right.  A
      cap reached by an earlier sweep does not make the returned state less
      converged: the later sweeps continue the same iteration, and the last
      sweep's own count and verdict were the ones reported, so reading
      `iterations == max_iterations` as "the returned state may not have
      converged" gave the right answer about the state.  What was wrong is a
      count: the passes a step ran and the budget an earlier sweep ran out
      of.  A program that ranks configurations by cost
      (`tune_coupling_params`) or budgets by the at-cap fraction got a
      wrong answer silently, but not a wrong state; graded `minor` for that.
    affected_components:
      - "maddening.core.graph_manager.GraphManager.coupling_diagnostics"
      - "maddening.core.coupling.group.CouplingGroup.waveform_iterations"
      - "maddening.core.simulation.calibration.tune_coupling_params"
      - "maddening.core.simulation.profiler.profile_graph"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0 the other sweeps' counts were kept nowhere.  The first k
      sweeps of a step are the same computation whatever N is (measured
      identical on the reproducer above), so re-running a step from a saved
      state (`save_state` / `load_state`) with `waveform_iterations=k`
      reports sweep k's count; k = 1 is the sweep that usually does the
      work.  From 0.4.0 a script using `iterations` as
      a cap check needs no change, and one using it as the work done should
      read `total_iterations`.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      `converged` stays the last sweep's verdict, so
      `iterations >= max_iterations` beside `converged=True` is now a
      possible report: an earlier sweep ran out and the last converged.
      That is the conservative direction for a cap check, and the returned
      state is the converged one; read `converged` for the state and
      `iterations` for the budget.  `strict_convergence=True` under
      `solver="ift"` checks every sweep, so such a step raises there, as it
      did before.  The per-sweep counts are not reported one by one.  A
      checkpoint written before 0.4.0 carries no sum; restored into a
      waveform group, `total_iterations` reads as `iterations` until the
      next step.
    verification:
      - "tests/core/test_coupling_waveform_report.py::test_iterations_is_the_largest_sweep_and_total_iterations_the_sum"
      - "tests/core/test_coupling_waveform_report.py::test_the_cap_check_sees_a_first_sweep_that_exhausted_its_budget"
      - "tests/core/test_coupling_waveform_report.py::test_the_cap_check_stays_quiet_when_no_sweep_hits_the_cap"
      - "tests/core/test_coupling_waveform_report.py::test_both_solvers_report_the_same_counts_and_verdict"
      - "tests/core/test_coupling_waveform_report.py::test_a_group_that_runs_one_sweep_owns_no_sum_slot"
      - "tests/core/test_coupling_waveform_report.py::test_one_sweep_reports_exactly_what_it_did_before_the_fix"
      - "tests/core/test_coupling_waveform_report.py::test_the_returned_state_is_the_state_before_the_fix"
      - "tests/core/test_coupling_waveform_report.py::test_the_report_does_not_move_the_state"
      - "tests/core/test_coupling_waveform_report.py::test_the_sum_is_seeded_carried_through_a_scan_and_reset"
      - "tests/core/test_coupling_waveform_report.py::test_a_checkpoint_without_the_sum_reads_it_as_the_largest_sweep"
      - "tests/core/test_coupling_group_validation.py::test_a_group_whose_key_spells_another_groups_waveform_sum_slot_is_refused"
    github_issue: null

  - anomaly_id: "MADD-ANO-027"
    title: "Sub-cycled coupling relaxes no waveform: waveform_iterations > 1 re-solves the same fixed point, and the sub-step interpolation runs between iterates, not across the step"
    description: >
      `CouplingGroup.waveform_iterations` is documented as waveform
      relaxation for a sub-cycling group ("> 1 iterates over entire
      sub-step windows").  It is not.  Each sweep runs the group's
      fixed-point solve again, starting from the previous sweep's result
      and with a freshly started accelerator.  The one-pass map is the
      same in every sweep, because a pass reads only its incoming iterate
      and the beginning-of-step state; the second sweep's first residual
      is, bit for bit, the residual the first sweep reported.  Inside a
      pass, a sub-cycled node's boundary input is interpolated between
      the pass's incoming iterate and the in-pass state: two estimates of
      the end-of-step value, never the beginning-of-step value.  So no
      sweep sees a boundary waveform over the sub-step window, and
      `boundary_interpolation="quadratic"` is never given the third value
      it is documented to use, which makes it `"linear"`.
      The two ends differ only by the in-pass change of a source
      scheduled before the sub-cycled node, so the modes coincide under
      Jacobi, for a source scheduled after the sub-cycled node, and at
      exact stationarity, and nowhere else.
      Measured on two `SpringDamperNode`s coupled both ways (CPU, jaxlib
      0.11.0).  At timesteps 0.001 and 0.005 over 100 macro-steps with
      the fast node scheduled first, `boundary_interpolation` "constant",
      "linear" and "quadratic", each at `waveform_iterations` 1 and 3,
      return the same state to the last bit, 4.458e-02 from a
      uniform-rate reference; the numbers are identical at v0.1.0, v0.3.1
      and the 0.4.0 tree.  With the slow node scheduled first and
      `tolerance=1e-4`, "linear" and "constant" end 2.71e-05 apart
      (relative) after 100 steps -- the O(tolerance) in-pass change of a
      step that has converged without becoming stationary -- and
      "quadratic" is still "linear" to the last bit.  At timesteps 0.001
      and 0.01 with `tolerance=1e-8`: when every first sweep converges
      (`max_iterations=10`), `waveform_iterations` 1, 2 and 3 give
      bit-identical states over three steps under both solvers.  When the
      first sweep stops at the cap, the later sweeps continue the same
      iteration like extra passes: under `acceleration="fixed"`,
      `relaxation=0.7`, `max_iterations=2`, the states at
      `waveform_iterations` 2 and 3 are 1.48e-03 (relative) from the one
      at 1 after three steps, and equal to each other.  v0.1.0 already
      carries the sweep loop and the interpolation.
    severity: "minor"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      No state is wrong: every result is the converged solution of the
      sub-cycled scheme as it is implemented, which holds the other
      node's end-of-step value across the fast node's sub-steps, and it
      is the result `waveform_iterations=1` gives.  What is wrong is a
      numerical-method claim.  Waveform relaxation and higher-order
      sub-step interpolation exist to reduce the splitting error of a
      multi-rate coupling, and a program that chose them for that reason
      gets none of the reduction and no signal; the extra sweeps cost
      passes and change nothing once the first sweep converges.  Graded
      `minor` because the result is the documented single-pass result,
      and because the error against a uniform-rate reference is the same
      number as without the option, which a verification run would show.
      `context_dependent` because whether that matters depends on whether
      an accuracy argument rests on the method the parameter names.
    affected_components:
      - "maddening.core.coupling.group.CouplingGroup.waveform_iterations"
      - "maddening.core.coupling.group.CouplingGroup.boundary_interpolation"
    affected_versions: ">=0.1.0"
    workaround: >
      Use `waveform_iterations=1`: it gives the same result with fewer
      passes.  When the first sweep stops at `max_iterations`, raise
      `max_iterations` rather than adding sweeps.  To reduce multi-rate
      splitting error, reduce the slow node's timestep or couple at a
      uniform rate; the interpolation mode changes a converged step by at
      most the in-pass change the tolerance allows, and "quadratic" not
      at all.
    resolution_status: "open"
    residual_risk: >
      The parameter is documented as experimental and as the restart it
      is, in `CouplingGroup` and the coupling guide; its behaviour is
      unchanged.  Planned 0.5.0 work, not a promise of this release: real
      waveform relaxation, with the interpolation taken from the
      beginning-of-step state.  Until then `strict_convergence=True`
      under `solver="ift"` checks every sweep, so a step whose first
      sweep stops at the cap raises even when the last sweep converges.
    verification:
      - "tests/core/test_coupling_waveform_report.py::test_a_converged_first_sweep_leaves_the_later_sweeps_nothing_to_change"
      - "tests/core/test_coupling_waveform_report.py::test_a_capped_first_sweep_is_continued_by_the_later_ones"
      - "tests/core/test_coupling_waveform_report.py::test_the_interpolation_modes_coincide_when_the_source_is_scheduled_after"
      - "tests/core/test_phases_5_7_8.py::TestQuadraticInterpolation::test_quadratic_interpolation_is_linear_interpolation_today"
    github_issue: null

  - anomaly_id: "MADD-ANO-028"
    title: "A sharded stencil node on a mesh axis of one device ran with periodic global halos whatever `boundary` said"
    description: >
      `halo_exchange` fills the halos at the two edges of the global grid
      from its `boundary` mode, but applied the `"edge"` and `"zero"`
      fills only when the mesh axis had more than one device (`if boundary
      != "periodic" and p_size > 1`).  On an axis of one device the
      exchange's `ppermute` sends the shard's edge slices to itself, so
      the one shard received its own *opposite* edge in each halo: both
      global halos came out periodic, under `"edge"` and `"zero"` alike.
      `ShardedStencilNode` therefore ran a stencil node sharded on one
      device -- a laptop, a single GPU, a test on one host -- or on a 2-D
      mesh whose axis over the sharded cells has one device, on a ring,
      with no error or warning.
      Measured on `HeatNode` (64 cells, a linear initial ramp from 0 to 1,
      Fourier number 0.25, 50 steps, CPU, jaxlib 0.11.0, float32), sharded
      against the unsharded node: on one device 0.405 at
      `stencil_order=2` and 0.402 at `stencil_order=4`, under `"edge"` and
      `"zero"` alike, the end cells reading 0.468 / 0.532 against 0.063 /
      0.937 -- heat had crossed from the hot end to the cold one.  The same
      run on a (1, 2) pencil mesh with the cells on the size-1 axis gives
      the same numbers.  On two and four devices the `"edge"` run at
      `stencil_order=2` is bit-identical to the unsharded rod.  At the
      primitive, `halo_exchange` of `[1, ..., 8]` with `halo=1,
      boundary="zero"` returned `[8, 1, ..., 8, 1]` on one device against
      zeros at both ends on two.
      Reproduced at v0.2.0 and v0.3.1 (`git archive` of each tag, same
      environment): the same primitive call returns `[8, 1, ..., 8, 1]`,
      and a one-device sharded `HeatNode` rod ends at 0.468 / 0.532, the
      same ring.  The unsharded node treated its ends differently at those
      tags (MADD-ANO-007), so sharded-against-unsharded numbers there are
      not comparable with the ones above.  The guard dates from the
      primitive's first commit.
      Resolved in 0.4.0: an axis of one device takes the boundary fill on
      both sides with no exchange, since its one shard owns both global
      edges, so every mode means the same on any axis size.
      `boundary="periodic"` on any axis, and `"edge"` / `"zero"` on an axis
      of two or more devices, are bit-identical to before, forward and
      adjoint (a before/after dump: 42 such exchange configurations and 33
      sharded node runs, every one identical to the bit).  The wrapper's local padding of a halo axis `axis_map`
      leaves unsharded was already right here, and the unstructured
      exchange has no boundary modes and, on one device, no ghosts.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silently wrong physics on a documented configuration: running a
      sharded model on one device is the ordinary way to develop and test
      it, and there it computed a different model -- a periodic domain --
      from both the unsharded node and the same code on two or more
      devices, with no error or warning.  The error is neither small nor
      local: the whole field relaxes towards the ring's mean (0.40 on a
      unit range in 50 steps above).  Graded `major` for that silence and
      magnitude.  Not `critical`, because the run on several devices was
      right, and a one-device result checked against it or against the
      unsharded node disagrees grossly rather than subtly.
      `context_dependent` because it needs a non-periodic `boundary` and a
      sharded axis of one device; `boundary="periodic"`, which `LBMNode`
      requires, is unaffected, and whether a result built on it matters is
      a property of the program using it.
    affected_components:
      - "maddening.cloud.multigpu.halo.halo_exchange"
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
    affected_versions: ">=0.2.0, <0.4.0"
    workaround: >
      Before 0.4.0: run a stencil node whose boundary is not periodic
      unsharded when it is on one device, and on a pencil mesh do not map
      a non-periodic sharded axis to a mesh axis of one device.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known in the fill.  The tests hold the exchange, forward and
      adjoint, to `numpy.pad` on 1-, 2- and 4-device slabs and on 1x1,
      1x2, 2x1 and 2x2 pencils, and the wrapper to the unsharded node on
      one device and on a size-1 pencil axis.  (`HeatNode` itself no
      longer reads the global halos since MADD-ANO-030's fix, so the
      wrapper is also held to a test-only stencil that every halo slot
      reaches.)
    verification:
      - "tests/cloud/multigpu/test_halo_global_edge_fill.py::test_one_device_zero_fill_is_zero_not_the_opposite_edge"
      - "tests/cloud/multigpu/test_halo_global_edge_fill.py::test_a_slab_exchange_fills_every_halo_slot_as_numpy_pad_does"
      - "tests/cloud/multigpu/test_halo_global_edge_fill.py::test_a_pencil_exchange_fills_every_halo_slot_as_numpy_pad_does"
      - "tests/cloud/multigpu/test_halo_global_edge_fill.py::test_the_wrapper_fills_sharded_and_unsharded_halo_axes_alike"
      - "tests/cloud/multigpu/test_sharded_heat_rod_ends.py::test_a_sharded_rod_is_the_unsharded_rod_for_the_same_boundary_inputs"
    github_issue: null

  - anomaly_id: "MADD-ANO-029"
    title: "The default `\"edge\"` halo fill copied a halo two or more cells wide from the shard's first cells instead of repeating its edge cell"
    description: >
      `halo_exchange`'s `"edge"` mode, the default of both it and
      `ShardedStencilNode`, is documented as replicating the edge value
      into the halo.  At the edges of the global grid it placed the
      shard's own first `h` cells there, in order: a halo two cells wide
      read `r0, r1` in front of `r0`, and `r(n-2), r(n-1)` after
      `r(n-1)` -- neither `numpy.pad`'s `"edge"` (`r0, r0`) nor a mirror
      (`r1, r0`).  At width 1 the three coincide, so no width-1 node or
      test could see it.  The wrapper's local padding of a halo axis
      `axis_map` leaves unsharded had the same fill.  The only built-in
      node with a halo wider than one cell is `HeatNode` at
      `stencil_order=4`.  On the rod of MADD-ANO-028 (64 cells, a linear
      ramp, Fourier number 0.25, 50 steps, float32) the default-filled
      sharded rod on two and four devices ended 4.73e-03 from the
      unsharded node and 7.28e-03 from the node's own `update_padded` run
      on the whole rod padded by `numpy.pad` -- the model the
      documentation describes -- with the end cell at 0.0712 against
      0.0664 unsharded, 7% at that cell.  The halo cell next to the rod
      end holding `r1` rather than `r0` gives the end a gradient the
      `"edge"` mode is meant not to have.
      Reproduced at v0.2.0 and v0.3.1 (`git archive` of each tag, same
      environment): a width-2 `"edge"` exchange of `[1, ..., 8]` on two
      devices returns `[1, 2, 1, 2, ...]` and `[..., 7, 8, 7, 8]`, and the
      sharded 4th-order rod's end cell reads 0.0712 at both tags, as on
      the 0.4.0 tree before the fix.  The fill dates from the primitive's
      first commit.
      Resolved in 0.4.0: `"edge"` repeats the edge cell across the whole
      halo at every width (`numpy.pad` `mode="edge"`), in the exchange and
      in the wrapper's local padding, which now share one helper.  Width 1
      is bit-identical.  With the corrected fill alone the 4th-order
      sharded rod became one model on 1, 2 and 4 devices, matching the
      whole-rod `numpy.pad` run to float32 rounding (5.96e-08) but still
      2.54e-03 from `update`, because no fill can express `update`'s cubic
      end closure.  MADD-ANO-030's fix closes that: `update_padded` now
      builds the ghosts beyond each rod end itself, and the sharded rod is
      `update` to float32 rounding (<= 2.4e-07) at both orders, with and
      without boundary inputs, on 1, 2 and 4 devices.
    severity: "minor"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silently wrong physics in the default mode of a public, STABLE
      wrapper, with no error or warning.  Graded `minor` because it is
      confined to the cells within a halo width of the global ends, to
      stencils wider than one cell (in-tree, only the 4th-order
      `HeatNode`), and is sub-percent of the field's range (4.7e-03 on a
      unit range).  The case for `major`: it was the default, the
      error at the end cell was 7%, and an end temperature is what a
      coupled neighbour reads.  `context_dependent` because it needs a
      sharded stencil node with a halo at least two cells wide and a
      non-periodic `boundary`; whether a result built on it matters is a
      property of the program using it.
    affected_components:
      - "maddening.cloud.multigpu.halo.halo_exchange"
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
    affected_versions: ">=0.2.0, <0.4.0"
    workaround: >
      Before 0.4.0: for a stencil node with a halo wider than one cell,
      either run it unsharded or apply its end boundary condition inside
      `update_padded`, overwriting the global halo cells, rather than
      relying on the `"edge"` fill.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known for the built-in nodes.  The one wide-halo node,
      `HeatNode` at `stencil_order=4`, no longer reads the global halos
      (MADD-ANO-030), and the order-4 gap this entry used to record here
      (2.54e-03 against `update`) is gone.  A custom stencil node wider
      than one cell that uses the `"edge"` fill as its boundary condition
      now gets the documented replicated edge; one that was tuned to the
      old `r0, r1` fill changes.
    verification:
      - "tests/cloud/multigpu/test_halo_global_edge_fill.py::test_the_reference_pads_the_way_the_documentation_says"
      - "tests/cloud/multigpu/test_halo_global_edge_fill.py::test_a_slab_exchange_fills_every_halo_slot_as_numpy_pad_does"
