  - anomaly_id: "MADD-ANO-022"
    title: "A mapped edge whose point reference names a grid derived from a trainable parameter keeps the constructor's geometry when that parameter is calibrated"
    description: >
      An interface mapping built from a `{"node": ..., "field": ...}`
      point reference (`core/coupling/mapping_spec.py`) resolves its
      coordinates from the node's `static_data[field]` once, when the
      mapping is built, and the weights computed from them are
      snapshotted into `gm.params["mappings"]` at compile time.  If that
      static is derived from a trainable parameter, calibrating the
      parameter through `gm.params` moves the node and leaves the
      mapping's weights at the constructor's geometry.  Nothing declares
      the dependence and nothing refuses or warns.  This is a framework
      limitation of how point references meet the parameter pytree, not
      of one node.

      The in-tree case is the default, uniform `HeatNode`.  Its
      `grid_x` static is built in `__init__` from `length` and
      `n_cells`, and `length` is trainable, because the node's own step
      reads the traced `length` (`dx = length / n_cells`) and never
      `grid_x`.  So `static_data_deps` names nothing and `compile()`
      accepts the graph, which is correct for the node's own step and
      wrong for a mapping that reads `grid_x`.

      Reproduced 2026-09-24 on CPU, jax/jaxlib 0.11.0, float32, with a
      fresh graph for every measurement (`run_scan` advances the
      graph's state).  An 8-cell source `HeatNode` (alpha 0.05, dt
      1e-3), a 16-cell target rod of length 1.25, and a declarative
      mapped edge `src.temperature -> dst.heat_source` (thin-plate
      spline RBF, epsilon 2.0, linear polynomial, both point sets
      referenced as `grid_x` node fields), run for 40 steps.  The
      source is constructed at `length` 1.0 and calibrated to 1.25
      through `gm.params`.  The reference is the same graph constructed
      at 1.25.
        - Forward: the calibrated target moves by 4.2e-4 where the
          constructed one moves by 1.16e-2, and ends 1.18e-2 from it.
          The source rod itself is identical on both paths (a
          difference of exactly 0), with or without the edge, so the
          whole discrepancy is the mapping's.  The weights are
          bit-for-bit the constructor's, and the operator built at 1.25
          differs from them by up to 1.49 (max|H| is 2.29 at 1.0 and 1.21 at 1.25).
        - Gradient: d sum(target) / d length at 1.0 is -6.43e-3 by
          `jax.grad`, which matches a finite difference of the
          calibrated path (-6.42e-3), so it is exact for the model as
          wired.  A finite difference over graphs constructed at each
          length gives +2.69e-1: the gradient has the wrong sign.
        - Calibration: `fit_lm` of `length` alone from the target's
          data, generated by the graph constructed at 1.25 and started
          at 1.0, stops at 0.2201 with a loss of 1.19e-5, so the fit
          looks successful.  Through `gm.params` the windowed loss at
          the true length is 9.80e-3, not zero.  The same fit from the
          source rod's own data recovers 1.249974.
        - Silence: the graph compiles, `length` is in the default
          trainable mask, no warning is raised, and `to_dict` writes the
          node references.  Their recorded `sha256` still matches,
          because the static array itself never changed.

      Introduced in 0.4.0, and not present earlier.  Mapped edges, the
      parameter pytree and `mapping_spec.py` all first appear in the
      0.4.0 development line: v0.3.1 has neither `gm.params` nor a
      `mapping` keyword on `add_edge`, so no parameter could be
      calibrated underneath a mapping.  The fix is being scoped for
      0.5.0.  Widening the static-data declaration contract to "read by
      the step or by a mapping" would make the default `HeatNode` be
      refused again, which is why this release documents the limitation
      instead.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `major` because a user who calibrates a geometry parameter
      in a coupled graph gets a wrong number with nothing to indicate
      it.  The fitted value can be far from the truth (0.22 against
      1.25 in the reproducer), the fit reports a small loss, the
      gradient it followed has the wrong sign, and the graph compiled,
      ran and serialised without a warning.  0.4.0 ships this
      combination as a feature: declarative mapped edges built from
      node fields, and a trainable `length` on the default `HeatNode`.
      Not `critical`: nothing crashes or corrupts state, a caller who
      calibrates no parameter underneath a mapping is unaffected, and
      the documented workarounds are complete.

      Graded `context_dependent` rather than `safety_relevant` because
      it needs two user choices at once: a mapped edge whose point
      reference names a parameter-derived static, and a calibration or
      sensitivity study that moves that parameter.  Whether a program
      does both is a property of the program, and no in-tree caller
      does.  What raises it above `not_safety_relevant` is the shape.
      The node honours the calibrated value and the edge does not, so
      checking the calibrated node on its own, the natural validation,
      passes while the coupled result uses a different geometry.  A
      caller cannot establish from anything the library returns that
      the two disagree.
    affected_components:
      - "maddening.core.coupling.mapping_spec.normalise_point_reference"
      - "maddening.core.coupling.mapping_spec.make_point_resolver"
      - "maddening.core.graph_manager.GraphManager.add_edge"
      - "maddening.nodes.heat.HeatNode.static_data"
      - "maddening.nodes.heat.HeatNode.static_data_deps"
    affected_versions: ">=0.4.0.dev0"
    workaround: >
      Verified on the reproducer's graph.  (a) Declare the parameter
      non-trainable when a mapped edge references a grid it derives:
      `gm.set_param_spec("rod", "length", ParamSpec(trainable=False))`.
      The default mask then leaves it out, and `sysid.fit` refuses a
      mask that tries to widen back onto it.  (b) Give the mapping
      explicit coordinates, as an `{"asset": ...}` or `{"inline": ...}`
      point reference, so the config states that the mapping's geometry
      is fixed rather than implying that it follows the node.  This
      does not make the weights follow a calibrated parameter.  (c) If
      the geometry has to be calibrated, fit it from observations of
      the node itself rather than through the mapped edge; the same fit
      from the source rod's own data recovers the true length.  Then
      rebuild the graph at the fitted value, so the mapping is rebuilt
      from the new grid.
    resolution_status: "open"
    resolution_version: null
    residual_risk: null
    verification:
      # The acceptance criterion: changes state under either kind of fix
      # (XPASS if the mapping follows the parameter, an error if the
      # graph is refused).
      - "tests/core/test_mapping_trainable_geometry.py::test_a_calibrated_length_reaches_the_mapped_edge"
      - "tests/core/test_mapping_trainable_geometry.py::test_the_fixture_can_express_the_defect"
      - "tests/core/test_mapping_trainable_geometry.py::test_the_source_rod_itself_honours_the_calibrated_length"
      - "tests/core/test_mapping_trainable_geometry.py::test_the_calibration_barely_moves_the_mapped_target"
      - "tests/core/test_mapping_trainable_geometry.py::test_the_weights_stay_the_constructor_weights_after_calibration"
      - "tests/core/test_mapping_trainable_geometry.py::test_the_length_gradient_through_the_edge_has_the_wrong_sign"
      - "tests/core/test_mapping_trainable_geometry.py::test_the_model_cannot_fit_its_own_data_at_the_true_length"
      - "tests/core/test_mapping_trainable_geometry.py::test_a_fit_of_the_length_through_the_mapped_edge_lands_far_from_the_truth"
      - "tests/core/test_mapping_trainable_geometry.py::test_nothing_refuses_or_warns_about_the_stale_geometry"
      - "tests/core/test_mapping_trainable_geometry.py::test_the_workaround_freezing_the_length_keeps_a_fit_off_it"
    github_issue: null

  - anomaly_id: "MADD-ANO-023"
    title: "The FMU TCP bridge authenticates no caller: any process that can reach its port can read, write, step and hold the model"
    description: >
      `maddening.fmi.tcp_bridge.FmuTcpBridge` serves one `FmuSidecar` to
      the FMU C wrapper over TCP.  By default it binds
      `host="127.0.0.1"` on an ephemeral port (`port=0`), and its module
      docstring says to keep it on loopback unless the network is
      trusted.  Nothing on the socket establishes who is calling.  The
      `hello` handshake returns the model's instantiation token, but the
      token identifies the instance to the FMU (the C wrapper refuses a
      bridge whose token differs from its own modelDescription.xml).  It
      is not a credential: it is a deterministic hash of the model's
      schema, it is written in plain text into the FMU's
      modelDescription.xml, and the bridge returns it to anyone who
      sends `hello`.  No op requires it, and no op requires `hello`
      first.  The endpoint itself is in the FMU's
      `resources/endpoint.txt` or in `MADDENING_FMU_ENDPOINT`.

      Reproduced 2026-09-24 on CPU, jaxlib 0.11.0, Python 3.12, against a
      bridge on its default loopback bind serving the test suite's
      table/ball/spring graph.  The unrelated client was a separate
      interpreter started with `python -I -S` (no site-packages and no
      `PYTHONPATH`, so no MADDENING and no shared secret), given only
      the host and port, and speaking the documented framing with the
      standard library.  Its first frame was a `get`, with no `hello`:
        - `get` returned the spring's position and stiffness,
          `[0.5, 30.0]`;
        - `set` wrote a stiffness of 77.0 and got `{"ok": true}`;
        - `step` advanced the model one communication step and got
          `{"ok": true, "t": 0.01}`;
        - `hello` returned the instantiation token.
      An importer that connected afterwards read a stiffness of 77.0 and
      a time of 0.01.  The stranger's write and step carried into its
      session, because the bridge keeps the sidecar's state across
      connections and the C wrapper does not reset on instantiation.
      Separately, a client that connects first and keeps talking holds
      the bridge's single instance slot.  A later importer's `hello` is
      refused with "bridge already serves an FMU instance", after the
      two-second hand-over grace, for as long as the holder sends a
      frame within each five-minute idle window.

      So on the default bind, any local process of any user can connect
      and read or drive a running model.  An operator who passes a
      non-loopback `host` exposes the same thing to the network.  The
      constructor hands `host` to `bind()` unchanged, with no check or
      warning for a non-loopback address.

      This agrees with MADD-ANO-015.  Its residual risk already says
      that the bridge "is an unauthenticated listening socket with its
      own protocol; it is a different component, is not covered by this
      entry, and is documented as trusted-clients-only", and that its
      default is loopback on an ephemeral port.  This entry is that
      component's own record.

      Introduced with the bridge in 2efcaea, during the 0.4.0
      development line.  No tagged release contains it: v0.1.0 to
      v0.3.1 have no `src/maddening/fmi/tcp_bridge.py`.

      Planned direction, stated as a plan and not a promise: 0.5.0 is to
      label the sidecar a local development mode and refuse a
      non-loopback bind without an explicit flag.  An in-process FMU
      export, under design, would remove the socket from distributable
      FMUs altogether.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `major` for what a caller who reaches the port can do and
      what the importer then sees.  They can read the model's state and
      parameters.  They can write parameters and state and advance time,
      which changes the physics of a co-simulation that is running or
      about to run, and the importer is told nothing unless it reads the
      values back.  They can hold the one instance slot and lock the
      importer out.  The worst of these is a plausible-looking wrong
      result, not a crash.  Not `critical`: the default bind is
      loopback, so reaching the port takes either another process on
      the same host or an explicit non-loopback bind by the operator.
      No shipped default puts it on a network interface, unlike the
      wildcard binds MADD-ANO-015 records.

      Graded `context_dependent` rather than `safety_relevant` because
      whether anyone else can reach the port is a property of the
      deployment, not of the library.  On a single-user host, or in a
      container whose network namespace nothing else shares, the
      loopback bind leaves no other caller.  On a shared host, or with a
      non-loopback bind, any local user or network peer can.  What
      raises it above `not_safety_relevant` is that tampering is silent.
      A parameter written by a stranger before the importer connects
      produces a co-simulation that runs, converges and returns finite
      numbers from physics the importer never set, and nothing on the
      importer's side of the protocol distinguishes that session from
      an honest one.
    affected_components:
      - "maddening.fmi.tcp_bridge.FmuTcpBridge"
      - "maddening.fmi.tcp_bridge.FmuTcpBridge.handle"
    affected_versions: ">=0.4.0.dev0"
    workaround: >
      Keep the default loopback bind, and never pass a non-loopback
      `host` unless every host that can reach it is trusted.  Run the
      sidecar on a single-user host, or in a container with its own
      network namespace, so that no other user or process can reach its
      loopback port.  On a shared host, firewall the port, for example
      with an owner-matching nftables or iptables rule that admits only
      the importer's user to it.  An importer that must be sure of its
      starting point can call `fmi3Reset` (the bridge's `reset`, which
      restores the initial state and parameters) or restore a known
      FMU state after instantiating.  That undoes an earlier stranger's
      writes; it does not stop a later one.
    resolution_status: "open"
    resolution_version: null
    residual_risk: null
    verification:
      - "tests/fmi/test_bridge_unauthenticated_access.py::test_an_unrelated_local_process_reads_writes_and_steps_the_model_with_no_secret"
      - "tests/fmi/test_bridge_unauthenticated_access.py::test_an_unrelated_client_holding_the_slot_locks_the_importer_out"
      - "tests/fmi/test_bridge_unauthenticated_access.py::test_the_default_bind_is_loopback"
    github_issue: null

  - anomaly_id: "MADD-ANO-024"
    title: "PUT /graph/params accepted a value a node consumes at construction: reported and saved, never used by the running graph"
    description: >
      `PUT /graph/params/{node}` wrote the new value into the node's params
      dict, answered 200 and echoed it, and `GET /graph/params` served it
      from then on.  But a node that consumes a parameter when it is
      constructed -- to build a geometry mask, assemble an operator, or copy
      it into an attribute in `__init__` -- never reads that dict again, and
      nothing rebuilt what the constructor had built.  The running graph
      therefore kept computing with the old value while every surface that
      reports or saves the graph carried the new one: `to_dict()` and a
      saved config serialised it, so a reload produced results the server
      had never produced.  The recompile that the write triggered (the
      route marked the graph dirty) re-traced the step against the masks
      built from the old values, so it did not help.
      Reproduced at v0.1.0, v0.2.1 and v0.3.1 (`git archive` of each tag, CPU,
      jaxlib 0.11.0) on `LBMPipeNode(nx=8, ny=10, nz=10, pipe_radius=0.8,
      propeller_x=2, propeller_strength=0.01)` through the real endpoint,
      20 steps after the write and a recompile: `pipe_radius=0.5` answers
      200, `GET` reports 0.5, and the velocity field is bit-identical to
      the radius-0.8 graph and 5.667e-03 from a graph built at 0.5;
      `propeller_x=5`, a structural integer the constructor turns into a
      forcing mask, answers 200 and stays bit-identical to the old graph,
      2.245e-03 from one built at 5, with the same numbers at every one of
      the three tags.  On the 0.4.0 development tree before the fix
      (f3b330a) the same write reached `WaveletAdaptiveNode.mass`, which
      the node bakes into its operator: 200, `GET` 0.5, the graph not
      marked dirty, the sensor reading unchanged at 1.826243e-01 even
      after `POST /graph/compile`, and a `to_dict()` reload reading
      3.599405e-01, the value a node built at 0.5 gives.  In that tree the
      graph already refused a direct `gm.params` write to a leaf its step
      cannot read, but it compared against `node.params_pytree()`, and the
      REST route writes the node's params as well as `gm.params`, so the
      comparison could not see it.
      Resolved in 0.4.0 by refusing rather than rebuilding.  The route asks
      the graph before anything is written, and a refusal is a 400 naming
      the key and the reason, with nothing written.  Refused: a
      `static_data_deps` key; a structural value the node's own constructor
      refuses (a saved graph is loaded through it); a value that changes the
      fields, shapes or dtypes of the state `initial_state()` builds; and a
      write whose use no copy of the node can establish.  Accepted: a leaf
      the compiled step (or the node's hooks, given every declared boundary
      input) reads from the injected params, used from the next step; a
      structural value whose trace changes, written and recompiled; and,
      failing both, a value that changes what `initial_state()` returns,
      which takes effect at the next `/sim/reset`.  Everything else is
      refused.  The node's code runs on a shallow copy reading the new
      value; a wrapper that closes over the node it wraps (both sharded
      wrappers) cannot be copied, and the node it wraps -- which shares its
      params dict, and whose physics it distributes -- is asked instead.
      The first fix, as merged, left four routes open, all found and closed
      before release.  A part-full `LBMPipeNode` (`fill_fraction=0.5`) reads
      `pipe_radius` again in `initial_state()`, which passed as "takes
      effect at the next reset": `pipe_radius=0.5` on a pipe built at 0.8
      answered 200, and after `/sim/reset` the velocity was bit-identical to
      the 0.8 graph while `to_dict()` saved 0.5 and the reload ran a pipe
      5.667e-03 away; the node now declares its geometry in
      `static_data_deps`.  `HeatNode`'s `n_cells`, which changes the state's
      shape, passed the same way: unsharded, `PUT n_cells=17` answered 200
      and the next `/sim/step` a 500; sharded, the step answered 200 with
      the 16 cells stepped at `dx = L/17` and the right rod end never
      closed, 8.467e-02 from the correct step.  `stencil_order=3` passed as
      a structural value whose trace changes: the rod kept its 2nd-order
      stencil and the saved graph raised on load.  And a node no faithful
      copy could be made of -- every sharded wrapper, and a node holding a
      method bound to itself -- had its structural writes accepted unseen,
      used or not.  `POST /checkpoint/load` runs the
      same refusal after loading and undoes the load when it fires.  The
      same class was closed on the FMI surface before release, where the
      paths are new in 0.4.0 and so never shipped the defect: the model
      description exports only parameters the step reads (the rest are
      listed with the reason in `ModelDescription.fixed_parameters`), and
      the sidecar's `set_params` / `set_fmu_state` and the bridge's
      `set_state` refuse a new value for a fixed parameter.  Same class as
      MADD-ANO-004: a public write surface confirming a value the physics
      does not use.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      The result is silently wrong with no error or warning: the API
      reports and serialises a value the simulation does not use, so a
      saved config or checkpoint does not reproduce the results the server
      produced, and an operator reading the parameters back is told the
      new value is in force.  Graded `major` rather than `minor` for that
      silence and for the reload divergence (a factor of about two in the
      wavelet sensor reading above).  `context_dependent` because it needs
      two things at once: a parameter a node consumes at construction
      (geometry masks, assembled operators, `__init__` copies) and a write
      to it through the REST API at run time.  A graph whose constructed
      values are only ever set through the node constructor is unaffected.
    affected_components:
      - "maddening.api.server.SimulationServer"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      To change a parameter a node consumes at construction, rebuild the
      node: `DELETE /graph/nodes/{name}` and then `POST /graph/nodes` with
      the new value, or `remove_node` / `add_node` in Python.  Before
      0.4.0, do not treat `GET /graph/params` as what runs; it reports what
      was written.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The refusal detects "no path at all" in the node's code, as the
      graph-level check does, so a value a node consumes at construction
      and also reads again later passes unless the node declares it in
      `static_data_deps`, which is refused outright.  No built-in node is
      left in that position: every numeric, boolean and string constructor
      parameter of the built-in node classes (all but `HealthCheckNode`,
      whose one parameter is a nested dict), in fifteen configurations (a
      part-full and a multiphase pipe, both `HeatNode` stencils and its
      non-uniform grid, a walled `LBMNode` among them), was written through
      the route -- numbers and booleans changed, strings made invalid -- and
      every write the route accepted gave a graph that `to_dict()` /
      `from_dict()` reproduced (CPU, jaxlib 0.11.0), with one exception
      that is not a parameter write: an `LBMNode` built with a `wall_mask`
      does not keep the mask among its params, so its reload has no walls
      with or without a write (also at v0.3.1).  The sweep changed each
      number; it did not write one across a branch the constructor
      chooses from it, and two such writes, found by a later audit and
      closed before release, are MADD-ANO-047: `grid_points` on a uniform
      `HeatNode` and `G = 0` on a multiphase `LBMPipeNode`.  The same drive through
      `ShardedStencilNode` (`HeatNode` at both orders, `LBMNode`), against an
      unsharded node built with the new value, found no difference either.
      A user-authored node that bakes a
      parameter and reads it again, in `initial_state()` or its hooks, must
      declare it.  For a wrapper that cannot be copied, the wrapped node's
      own `update` stands in for the wrapper's distributed step.  A value
      nothing reads anywhere is refused as well: it cannot make a reload
      differ, but telling it apart would mean constructing the node again.
    verification:
      - "tests/api/test_params_endpoint_constructed_values.py::test_wavelet_mass_is_refused_and_the_saved_graph_still_matches_the_running_one"
      - "tests/api/test_params_endpoint_constructed_values.py::test_pipe_radius_is_refused_and_the_saved_graph_still_matches_the_running_one"
      - "tests/api/test_params_endpoint_constructed_values.py::test_a_structural_value_consumed_at_construction_is_refused"
      - "tests/api/test_params_endpoint_constructed_values.py::test_a_structural_value_the_node_copied_in_init_is_refused"
      - "tests/api/test_params_endpoint_constructed_values.py::test_an_initial_condition_copied_at_construction_is_refused"
      - "tests/api/test_params_endpoint_constructed_values.py::test_a_leaf_the_step_reads_is_written_and_used"
      - "tests/api/test_params_endpoint_constructed_values.py::test_a_checkpoint_carrying_another_constructed_value_is_refused_and_not_loaded"
      - "tests/api/test_params_endpoint_constructed_values.py::test_pipe_geometry_the_initial_fill_also_reads_is_refused_and_the_reload_matches"
