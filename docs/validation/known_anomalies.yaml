  - anomaly_id: "MADD-ANO-095"
    title: "After run_adaptive or run_adaptive_scan the coupling report described only the second kept half step: a first half step stopped at max_iterations was hidden, and converged read True where strict_convergence refused the step"
    description: >
      An accepted adaptive attempt keeps two solves per coupling group,
      its two half steps.  The `_meta` report slots `coupling_diagnostics()`
      reads were whatever the second half step wrote, so the report of the
      accepted step described only that solve.  On every tagged release
      the report carried `iterations` and `residual`, and both were the
      second half's: on a pair of relays (gain 0.5 each way, a cap of
      four passes, `tolerance=1e-3`) whose first half step exhausts its
      budget and whose second converges in three, `run_adaptive` reported
      `iterations=3` where `step()` from the same start reports 4 --
      measured identically on v0.1.0, v0.2.0 and v0.3.1 (`git archive` of
      each tag, CPU, jaxlib 0.11.0) -- so the documented cap check
      `iterations >= max_iterations` missed a kept solve that ran out of
      passes.  In 0.4.0's development the report gained `converged`, and
      it read `True` about that same accepted step, while
      `strict_convergence=True` -- which in 0.4.0 checks both kept half
      steps, on MADD-ANO-044's principle that strict checks the solves a
      step keeps -- raised on it: the report, the strict check and
      the docs, which promise one verdict, gave two.  Found by the
      round-3 confirmation audit of the merged 0.4.0 tree.  Resolved in
      0.4.0: the steppers fold the two kept half steps into the report
      (`_fold_kept_half_step_reports`).  `iterations` is the larger half's
      count; `total_iterations` the sum where the group owns that slot
      (`waveform_iterations > 1`); and the per-solve slots -- residual,
      amplification, the spectral triple, the gradient bound -- are taken
      together from the first half when it alone did not converge, else
      from the second, so `converged` is `False` exactly when a kept solve
      did not converge.  Only report slots move; the state is the second
      half step's, bit for bit.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A silent wrong report, never `minor` under the 0.4.0 severity
      definition: a caller checking convergence after an adaptive run --
      by the cap check on any release, by `converged` in 0.4.0's
      development -- was told a kept solve converged when it had not, and
      under `solver="ift"` the gradient through that step is then
      unreliable.  Not `critical`: the state itself is what the stepper
      computed, `strict_convergence=True` (in 0.4.0's development) raised
      on the step, and the second half step's verdict, which the report
      did carry, is about the state returned.  `context_dependent` because
      whether a coupling verdict gates anything is the program's choice.
    affected_components:
      - "maddening.core.graph_manager.GraphManager.run_adaptive"
      - "maddening.core.graph_manager.GraphManager.run_adaptive_scan"
      - "maddening.core.graph_manager.GraphManager.coupling_diagnostics"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: do not read the coupling report after an adaptive run
      as a statement about the whole accepted step; to check every kept
      solve, step the graph at the accepted dt history with `step()` and
      read the report after each step, or raise `max_iterations` until the
      report of a fixed step of the largest accepted dt is well short of
      the cap.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A group running one waveform sweep owns no slot for a sum, so after
      an adaptive run its `total_iterations` reads the larger half's count
      rather than both halves' passes; `iterations`, the cap check and
      `converged` are exact.  The report still describes only the
      accepted attempt's two kept solves, not the error estimate's full
      step or rejected attempts, which the stepper discards.
    verification:
      - "tests/core/test_adaptive_report_covers_both_kept_half_steps.py::test_a_kept_unconverged_first_half_is_reported_unconverged"
      - "tests/core/test_adaptive_report_covers_both_kept_half_steps.py::test_the_report_and_strict_convergence_give_one_verdict"
      - "tests/core/test_adaptive_report_covers_both_kept_half_steps.py::test_a_waveform_group_reports_the_sum_of_both_halves_passes"
      - "tests/core/test_strict_convergence_threshold.py::test_the_adaptive_strict_check_raises_at_twice_the_threshold"
