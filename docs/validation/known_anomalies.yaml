# The version this registry describes.  `scripts/generate_soup_tables.py
# --check` (run by tests/compliance/test_soup_evidence.py) fails if
# `maddening_version` drifts from the version in pyproject.toml, so a release
# bump has to come through here too.
#
# affected_versions -- the convention, enforced by scripts/check_anomalies.py
# (version_range_errors, which generate_soup_tables.py --check also runs):
#
#   The field is a PEP 440 version specifier set, evaluated with
#   packaging.specifiers.SpecifierSet, pre-releases admitted, against
#   `maddening_version` below -- the version of the tree this file ships in.
#
#   * ">=FIRST", or ">=FIRST, <FIX".  FIRST is the first version that carried
#     the defect, and the range must admit it.  FIX is the release that
#     carries the fix.  No other operator is accepted.
#   * A defect introduced during a development cycle starts at that cycle's
#     first development build: ">=0.4.0.dev0", never ">=0.4.0".  PEP 440
#     orders 0.4.0 after every 0.4.0 pre-release, so ">=0.4.0" excludes the
#     very builds that carry the defect, this registry's own among them.
#   * open, partially_resolved, wont_fix (and any status not listed here):
#     the defect is reachable, so the range stays open-ended and must admit
#     `maddening_version`.  A range may not say "you are not affected" where
#     the entry says you are.
#   * resolved: the range must NOT admit `maddening_version`, nor the entry's
#     `resolution_version`.  PEP 440's "<0.4.0" also excludes 0.4.0's own
#     pre-releases, so ">=0.1.0, <0.4.0" leaves out this registry's
#     0.4.0.dev0, whose tree carries the fix -- which is what it should do.
#   * "none" is the empty set, for a defect introduced and fixed within one
#     development cycle: no tagged release carried it, and neither does the
#     tree this file describes.  PEP 440 cannot spell "the 0.4.0.dev0 builds
#     before the fix", because every build of the cycle is 0.4.0.dev0, before
#     the fix and after it; the description says which builds had it.
#     (">=0.4.0.dev0, <0.4.0", which two entries used to carry for this,
#     admits no version at all -- it read as a window and was empty.)
#   * duplicate: parsed but not compared; the range lives on the other entry.
#   * FIRST, FIX and resolution_version name versions somebody could install:
#     a release (a dated "## [X.Y.Z] - YYYY-MM-DD" heading in CHANGELOG.md),
#     or this cycle's own release ("0.4.0" at 0.4.0.dev0).  FIRST may also be
#     the first development build of either (">=0.4.0.dev0").
#   * resolved: resolution_version is required, and "<FIX" is that version.
#
#   An empty or unparseable range fails the gate, as does a missing one.
schema_version: "1.0"
maddening_version: "0.4.0.dev0"
generated_date: "2026-09-24"

anomalies:
  - anomaly_id: "MADD-ANO-001"
    title: "LBM GPU segfault on CUDA 12.2 + jaxlib 0.5.1"
    description: >
      The LBMPipeNode causes a segmentation fault when running on GPU with
      CUDA 12.2 and jaxlib 0.5.1.  The segfault occurs in the XLA compiler
      during compilation of the streaming step, triggered by matmul/einsum
      operations on 3D+ arrays.  The CPU backend is unaffected.  The workaround
      is to use the CPU backend (JAX_PLATFORMS=cpu).
      Resolved in 0.4.0, by the dependency floor moving past the affected jaxlib
      rather than by any change to MADDENING's own code.  Versions 0.1.0 to
      0.3.1 carried a jax floor below 0.10, which permitted the affected
      jaxlib 0.5.1; 0.4.0's floor does not.  The old pin was held back
      deliberately, for compile-time reasons on a MIME experiment, and that
      constraint no longer applies.

      Re-verified on GPU, 2026-09-19, on the earliest supported stack available:
      jax and jaxlib 0.11.2, bundled CUDA runtime 12.9.79, driver 595.84, on an
      RTX A2000 8GB.  `LBMPipeNode` compiled and stepped with no segfault at
      6x5x5 and at 32x16x16 -- the larger grid exercising the 3D einsum named
      above -- and eleven steps left every state field finite.  GPU and CPU
      results after five steps agreed to 2.4e-07 relative, which is float32
      roundoff (eps ~ 1.19e-07), so the GPU path is correct and not merely
      non-crashing.

      Two limits on that evidence, recorded rather than glossed.  The fix cannot
      be attributed to one change: both jaxlib (0.5.1 -> 0.11.2) and the CUDA
      runtime (12.2 -> 12.9) moved between the recorded failure and this run.
      And the original configuration cannot be reconstructed under the current
      floor, so the anomaly as written is not directly falsifiable; what has been
      shown is that it does not occur on any configuration a user of 0.4.0 can
      install.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A segfault is a hard failure (crash), not a silent error — the simulation
      stops rather than producing incorrect results.  In an intraoperative
      context, an unexpected crash of the simulation engine could disrupt
      surgical workflow and require fallback to non-simulated guidance.  The
      safety relevance depends on whether the downstream product uses GPU
      execution and whether a fallback path exists.  CPU execution is unaffected.
    affected_components:
      - "maddening.nodes.lbm_pipe.LBMPipeNode"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: "Use CPU backend: set JAX_PLATFORMS=cpu environment variable"
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    verification:
      # The resolution is the dependency floor, so the evidence is the
      # pin on the floor: lowering jax/jaxlib back over 0.5.1 fails the
      # first, re-attributing or reopening the entry fails the second.
      - "tests/compliance/test_soup_evidence.py::test_the_dependency_floor_still_excludes_the_jaxlib_madd_ano_001_names"
      - "tests/compliance/test_soup_evidence.py::test_madd_ano_001_is_recorded_resolved_by_that_floor"
    github_issue: null

  - anomaly_id: "MADD-ANO-002"
    title: "HeatNode CFL stability not enforced at runtime"
    description: >
      Until 0.4.0 the HeatNode checked its explicit scheme's stability condition
      nowhere.  The condition bounds the Fourier number dt*alpha/dx^2: by 1/2 for
      the default stencil_order=2 (dt < dx^2 / (2*alpha), the only bound this
      entry used to quote) and by 5/16 for stencil_order=4, which MADD-ANO-009
      found the quoted bound did not cover.  A timestep that violates it makes the
      explicit finite-difference scheme unstable and produces silently incorrect
      results (temperature values that grow without bound), with no warning or
      error -- the simulation runs but the output is wrong.
      Narrowed but not closed at 0.4.0.  The constructor now refuses a
      configuration above its stencil's Fourier limit, naming the number: the
      20-cell rod of length 1.0 with thermal_diffusivity=0.01 at Fo = 5.0
      raises ValueError ("the Fourier number dt*alpha/dx^2 is 5, above the 0.5
      limit of the order-2 stencil").  That check is MADD-ANO-009's and it sees
      the constructor's own timestep, thermal_diffusivity and length only.
      What is still live is every route around it, re-measured on that same rod
      at 0.4.0.dev0 with a half-sine initial profile and a node constructed at a
      stable Fo = 0.4:
        - a dt handed to update() -- update(state, {}, 5.0*dx**2/alpha) gives
          max|T| = nan after 60 steps and emits no warning of any kind, with or
          without Dirichlet data;
        - a thermal_diffusivity injected through params -- update(state, {},
          dt, params={"thermal_diffusivity": 0.125}) is the same Fo = 5.0 and
          gives the same nan and the same silence.  length is trainable on the
          same terms.
      Both bypass the constructor and neither can be checked inside a traced
      step without a host callback, which is why this entry stays open.
      One route is closed: since 0.4.0 `PUT /graph/params` asks the
      constructor about every value it writes, live leaves included, with
      the params a saved graph would carry (MADD-ANO-048), so a
      `thermal_diffusivity` or `length` written through the REST API past
      the limit is a 400 and is not written.  For
      reference, the stable end of that rod decays rather than diverging: Fo =
      0.4 and Fo = 0.5 give max|T| = 0.675313 and 0.657864 after 60 steps with
      no boundary data, 0.550473 and 0.474083 under Dirichlet zeros.  (An
      earlier revision of this entry quoted 0.516 and 0.437 for those two; the
      figures reproduce under no reading and are withdrawn.)
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent production of incorrect results is the most dangerous failure mode
      for a computational tool used in safety-relevant contexts.  If a downstream
      product uses HeatNode (or a node derived from it) for thermal simulation
      in a clinical context, an unstable timestep would produce incorrect
      temperature predictions without any indication of error.  The safety
      relevance depends on whether the downstream product relies on HeatNode's
      temperature output for clinical decisions and whether external validation
      checks would catch the divergence.
    affected_components:
      - "maddening.nodes.heat.HeatNode"
    affected_versions: ">=0.1.0"
    workaround: >
      The constructor checks this for you from 0.4.0; below 0.4.0, check it
      yourself: timestep * thermal_diffusivity / dx**2 < 0.5 for
      stencil_order=2 and < 0.3125 for stencil_order=4, with
      dx = length / n_cells.  The constructor parameter is
      `thermal_diffusivity` (there is no `alpha=` keyword — passing one is a
      TypeError), and `timestep` is the value the check applies to.
      What no version checks, and what the workaround is for at 0.4.0: apply
      the same inequality to any `dt` you pass to `update()` rather than
      relying on the constructor's, and to any `thermal_diffusivity` or
      `length` a calibration or sysid run may move -- both are trainable, and
      an optimiser walking alpha upward crosses the limit with no signal.
      Bound the parameter (ParamSpec bounds on `thermal_diffusivity`) so the
      fit cannot reach an unstable configuration, and check the field for
      non-finite values after the step if it can.
    resolution_status: "open"
    verification:
      # The narrowing: the constructor's check (MADD-ANO-009's).
      - "tests/verification/test_mms_order.py::TestHeatStabilityBound::test_the_constructor_refuses_an_unstable_configuration"
      # What stays open, pinned so that a fix, or a drifted figure, fails.
      - "tests/nodes/test_heat_fourier_limit_bypass.py::test_the_constructor_does_refuse_the_same_fourier_number"
      - "tests/nodes/test_heat_fourier_limit_bypass.py::test_an_unstable_dt_passed_to_update_diverges_silently"
      - "tests/nodes/test_heat_fourier_limit_bypass.py::test_an_unstable_injected_thermal_diffusivity_diverges_silently"
      - "tests/nodes/test_heat_fourier_limit_bypass.py::test_the_stable_end_of_the_rod_decays_to_the_recorded_figures"
      # The REST route is closed (MADD-ANO-048).
      - "tests/api/test_params_endpoint_reload_agreement.py::test_a_live_leaf_above_the_fourier_limit_is_refused_and_the_graph_still_saves"
    github_issue: null

  - anomaly_id: "MADD-ANO-003"
    title: "AdaptiveNode frozen-set gradient omits a first-order term at active-set switches"
    description: >
      The frozen-active-set adjoint of AdaptiveNode differentiates the solve
      with the active set held fixed, so the returned gradient is exact within
      an active-set region but ignores the region's dependence on the
      parameters.  At the parameter values where two candidates swap rank the
      objective J_frozen has a genuine jump discontinuity (the coefficients
      and the sensor weights of the two modes differ), so the objective is not
      locally Lipschitz there and no Clarke subgradient exists -- the returned
      value is the one-sided derivative of the branch the forward pass
      selected.  The omitted contribution is first order: integrating the
      returned gradient over an interval misses the sum of the jumps crossed.
      Measured on the suite's 1-D sine toy (n_max=256, top-|b| selection,
      k=16): over theta in [0.40, 0.50] the integral of the returned gradient
      is -1.5808e-3 against a true objective change of -2.3598e-3, a 33 %
      shortfall equal to the sum of the 27 jumps crossed in that window.  The
      error decays with the active-set budget because the coefficient that
      swaps rank shrinks: on the same problem the jump contribution falls from
      2.5e-1 of |J| at k=8 to about 1e-8 at k=64 (the spike measured 4e-8).
      Nothing in the forward pass signals a crossing, and finite differences
      across one diverge as 1/h rather than disagreeing mildly.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      This is a silent first-order error in a gradient, which is the input to
      calibration (sysid.fit) and to sensitivity/uncertainty analysis rather
      than to a forward prediction: the simulated field itself is unaffected,
      and the frozen solve is exact for the active set it reports.  The risk is
      that a parameter identified against a discontinuous loss surface (264
      switches over the bound range of the toy's theta at the graph-integration
      configuration) converges to a biased value, or that an optimiser stalls,
      without any error being raised -- and a downstream product could then act
      on a mis-calibrated model.  Whether that matters depends on whether the
      downstream product calibrates through an AdaptiveNode at all, on the
      active-set budget it uses (the error is negligible in the large-budget
      regime the pattern is designed for), and on whether the calibrated
      parameters are validated against held-out measurements.  It is not
      safety relevant for forward simulation at a fixed parameter point.
    affected_components:
      - "maddening.nodes.adaptive.base.AdaptiveNode"
      - "maddening.nodes.adaptive.base.AdaptiveNode.update"
    affected_versions: ">=0.4.0.dev0"
    workaround: >
      Use the largest active-set budget the problem affords (the omitted term
      decays with it, to ~1e-8 of |J| at k=64 on the reference problem); add
      hysteresis to the selection rule (add above eps_add, remove below
      eps_remove < eps_add via the prev mask) to reduce switch chattering; and
      do not validate a gradient against a finite difference of the
      mask-recomputing objective, which is not a valid oracle across a switch.
      Check for a crossing by re-selecting the active set at both ends of a
      step and comparing the masks.
    resolution_status: "open"
    verification:
      - "tests/nodes/adaptive/test_active_set_switch.py::test_frozen_objective_jump_at_an_active_set_switch_does_not_vanish_with_the_step"
      - "tests/nodes/adaptive/test_active_set_switch.py::test_central_finite_difference_across_a_switch_diverges_as_one_over_h"
      - "tests/nodes/adaptive/test_active_set_switch.py::test_gradient_inside_an_active_set_region_matches_the_selected_branch"
      - "tests/nodes/adaptive/test_active_set_switch.py::test_integrated_gradient_plus_switch_jumps_reconstructs_the_objective_change"
      - "tests/nodes/adaptive/test_active_set_switch.py::test_the_omitted_term_decays_with_the_active_set_budget"
    github_issue: null

  - anomaly_id: "MADD-ANO-004"
    title: "The sharded wrappers ignored a REST parameter write; PUT /graph/params answered 200 without changing the physics"
    description: >
      ShardedPointwiseNode did not proxy the graph parameter contract of the
      node it wraps.  It reported accepts_params() == False while
      params_pytree() still returned the base class's leaves, its update()
      declared no params keyword, param_specs() fell back to the base-class
      default (losing the inner node's bounds and transforms), and the wrapper
      kept a private copy of self.params that nothing read.  A wrapped node was
      therefore left out of GraphManager.params entirely, and
      PUT /graph/params/{node} answered 200, echoed the new value and left the
      simulation running at the old constant: on a SpringDamperNode with
      stiffness raised from 10 to 1000 through the API, the position after five
      0.01 s steps stayed at 1.98523 (the k=10 trajectory) instead of the
      0.83880 a genuinely k=1000 graph produces.  set_param_spec on such a node
      raised "takes no params", and sysid, FMI parameter variables and
      checkpointed calibrated constants all skipped it.  An earlier revision
      said the sibling wrappers ShardedStencilNode and ShardedUnstructuredNode
      proxied the contract correctly and were not affected.  That held only
      in the 0.4.0 development tree, where both already handed the node's
      entry of GraphManager.params to an inner update_padded that takes
      params, so a REST write, which updates GraphManager.params as well as
      the wrapper's dict, reached the inner node through the injected values
      -- and for ShardedUnstructuredNode only when the inner node named
      params as a keyword: an update_padded(**kwargs) inner was not
      recognised as a params node until later in the cycle, and a write to
      it kept the old trajectory.  At every tagged release that shipped
      them, neither wrapper had that path, and both had the pointwise
      wrapper's defect exactly (measured below).
      The version range was re-derived for the 0.4.0 release, and again when
      that re-derivation turned out to have stopped one tag short.  The
      wrapper is older than its name: v0.1.0 ships it as ShardedNode, the only
      class in sharded_node.py, and v0.2.0 renames it ShardedPointwiseNode,
      keeping ShardedNode as a subclass alias through v0.2.1.
      PUT /graph/params/{node_name} exists at v0.1.0 as well.  At every tag
      the wrapper copies the inner node's params into a dict of its own at
      construction, the endpoint writes to that copy, and update() delegates
      to the inner node, which never sees the write.  Driving that mechanism
      through the real endpoint (FastAPI TestClient, PUT stiffness=1000 on a
      k=10 spring from rest) against `git archive` of each tag answers 200
      and leaves the wrapper at 0.014767 after five 0.01 s steps -- the k=10
      trajectory -- at v0.1.0 (as ShardedNode), v0.2.0, v0.2.1, v0.3.0 and
      v0.3.1, against 1.161203 for a genuinely k=1000 node; at 0.4.0 the same
      write moves the wrapper to 1.161203.  ShardedStencilNode (new at v0.2.0)
      and ShardedUnstructuredNode (new at v0.3.0) are built the same way at
      every tag -- the constructor copies the inner node's params into the
      wrapper's own, and update() delegates to the inner node -- and the same
      drive gives the same answer.  PUT thermal_diffusivity=0.015 on a
      ShardedStencilNode around a 64-cell HeatNode built at 0.01 (two
      devices, boundary="zero", recompiled after the write) answers 200 and
      leaves the sum of squared temperatures after 40 steps at 30.535059, the
      old trajectory, against 29.828928 for a node built at 0.015, at v0.2.0,
      v0.2.1, v0.3.0 and v0.3.1.  PUT rate=1.0 on a ShardedUnstructuredNode
      around an eight-cell decay node built at 0.1 answers 200 and leaves the
      sum of squares after five steps at 184.493963, the old trajectory,
      against 71.130383, at v0.3.0 and v0.3.1, whether the inner
      update_padded names params or not.  At 0.4.0 both writes reach the
      physics (29.828928 and 71.130383).  One earlier revision started the
      range at v0.2.0 because ShardedPointwiseNode cannot be imported at
      v0.1.0; the defect does not depend on the class's name.  The
      parameter-contract surfaces named above (accepts_params,
      params_pytree, param_specs, set_param_spec, GraphManager.params, sysid,
      FMI parameter variables) are 0.4.0-cycle additions, so on the tagged
      releases the defect is the REST write alone.  The 0.3.0 entry in the
      changelog is the @stability decorator, which sets stable_since and not
      affected_versions.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A public HTTP surface on a STABLE class confirmed a parameter change that
      the solver never applied, with no diagnostic anywhere: the forward
      simulation is self-consistent but describes a different model from the
      one the operator believes they configured, and a calibration run over a
      sharded pointwise node optimised a value the step ignored.  Whether that
      is safety relevant depends on whether the downstream product wraps
      nodes for multi-device execution (pointwise from 0.1.0, stencil from
      0.2.0, unstructured from 0.3.0) and whether it tunes their constants
      through the REST API at run time rather than at construction;
      a graph whose parameters are only ever set through the node constructor
      is unaffected, because the constructor value is the one the inner node
      reads.
    affected_components:
      - "maddening.cloud.multigpu.sharded_node.ShardedPointwiseNode"
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
      - "maddening.cloud.multigpu.sharded_unstructured.ShardedUnstructuredNode"
      - "maddening.api.server.SimulationServer"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      On 0.1.0 to 0.3.1, set the parameter on the inner node before wrapping
      it (ShardedPointwiseNode(SpringDamperNode(..., stiffness=1000.0), mesh);
      ShardedNode on 0.1.0; likewise ShardedStencilNode from 0.2.0 and
      ShardedUnstructuredNode from 0.3.0), or write to the inner node's params
      dict and recompile, which measured at v0.2.0 and v0.3.1 reaches the
      physics under all three wrappers -- but under ShardedStencilNode and
      ShardedUnstructuredNode only if the graph has not stepped since the
      wrapper was built: once it has, a node on the three-argument contract
      keeps the value its first step was traced with (MADD-ANO-032), so build
      a new wrapper after the write instead.  Do not rely on PUT /graph/params
      for a sharded node.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    verification:
      - "tests/cloud/multigpu/test_sharded_params.py::test_every_sharded_wrapper_proxies_the_param_contract_of_its_inner_node"
      - "tests/cloud/multigpu/test_sharded_params.py::test_a_rest_param_write_to_a_sharded_node_changes_the_trajectory"
      - "tests/cloud/multigpu/test_sharded_params.py::test_a_rest_param_write_to_a_stencil_or_unstructured_wrapper_changes_the_trajectory"
      - "tests/cloud/multigpu/test_sharded_params.py::test_a_rest_param_write_outside_a_sharded_nodes_bounds_is_refused_by_name"

  - anomaly_id: "MADD-ANO-005"
    title: "A coupling group's converged flag was a residual test, not a bound on the distance to the fixed point"
    description: >
      Until 0.4.0, CouplingGroup.tolerance was compared against the
      group's convergence norm of F(x) - x, so converged=True said the
      last two passes changed the state by less than the threshold, not
      that the state was within the threshold of the fixed point.  The
      two differ by the amplification 1/|1 - lambda| of the slowest mode
      of dF/dx, which the library neither measured nor reported.  An
      acceleration widened the gap systematically: Aitken and IQN choose
      the step that annihilates whichever modes dominate the residual,
      which is what makes them fast and which leaves the remaining error
      in exactly the mode where |1 - lambda| is smallest.  Measured on
      the coupling audit's heterogeneous fixture (a 60 000-cell heat grid
      coupled to four scalar probes, Jacobi, global L2 norm, tolerance
      1e-4): acceleration="aitken" reported converged at a state 15-31x
      its own tolerance from a separately converged reference, where
      plain Gauss-Seidel on the same fixture held a ratio of 0.32 across
      ten decades of residual.
      Four defects behind that are fixed in 0.4.0.  Aitken's first pass
      of every timestep relaxed with the clip floor 0.01 instead of the
      omega it was seeded with, and the criterion could fire on one
      sub-threshold residual, which under Aitken is frequently a
      transient dip two decades below the trend (Aitken now has to meet
      the threshold twice in a row; IQN, whose step is a least-squares
      solve rather than a clipped scalar, has not been measured dipping
      and is not charged for the second pass).  Under solver="ift" the
      flag used to describe an iterate one pass behind the state
      returned, so converged=True could name a state whose own residual
      exceeded the threshold outright -- 2.5x it on a non-normal group;
      both solvers now stop on the iterate whose residual was measured,
      so recomputing the norm on the state you were handed reproduces
      the reported number.
      The fourth is this anomaly's own subject, and it is reduced
      rather than closed: the threshold is applied to an estimate of the
      distance to the fixed point, omega * residual / (1 - rho), with
      rho = max(r_k / r_{k-1}, sqrt(r_k / r_{k-2})) read off the
      residual sequence the loop already has and omega the step scale
      the acceleration applies, and every convergence norm divides each
      field's change by that field's own magnitude so the criterion
      means the same thing in any units (atol is now a dead band -- what
      counts as zero -- rather than a floor under the scale, which made
      every criterion absolute below atol/rtol).  coupling_diagnostics()
      reports error_estimate, amplification, ratio_usable and
      gradient_error_estimate beside the residual.  During 0.4.0's
      development the last two were called bound_valid and
      gradient_error_bound -- no release carried either name -- and they
      were renamed because neither is a bound: 0.4.0 still resolves the
      development spellings with a DeprecationWarning until 0.5.0 removes
      them, and they are deliberately absent from keys(), iteration and
      len().  That estimate is not a bound; see the
      residual risk.
      A bound is reported beside it, under solver="ift" with
      diagnostics=True only: eight Arnoldi steps on dF/dx at the returned
      state, in the group's own norm, give rho_spectral (the spectral
      radius, which sees every mode and not only the one dominating the
      step) and the resolvent norm of the Krylov-compressed Jacobian, and
      spectral_error_bound is the residual times the larger of that norm
      and 1/(1 - rho_spectral).  For a linear F the error of any iterate is
      (A - I)^-1 of its residual whatever the accelerator did, so on the
      two-mode case where error_estimate reads 122x under the true
      distance the bound reads 8.05x over, 1.3x over under aitken and
      iqn-ils, and never under on 80 random normal contractions of
      dimension 2-6 with negative and near-1 eigenvalues.  It is reported,
      not applied: converged and the iteration counts are unchanged.
      spectral_usable says whether the bound is finite and the Krylov space
      had settled; fori, diagnostics=False and max_iterations=1 report NaN
      and False, never a number.  Before release a context-free audit of
      the key found it could read below the distance it bounds with
      spectral_usable=True in three ways, each fixed and pinned: a residual
      the Krylov space did not contain (a repeated eigenvalue broke the
      one-vector space down early; the space now continues from the
      residual, 0.92x -> 1.05x); a dead-banded field on the coupling loop,
      weighted zero, which cut the loop out of the spectrum (rho_spectral
      0.000 for 0.9; it now keeps its own magnitude's weight, 0.15x ->
      2.8x); and the float32 floor, below.
      Under the same gate gradient_relative_error_bound bounds the relative
      error of the IFT gradient that comes from the forward stopping at the
      returned iterate instead of the fixed point: spectral_error_bound's
      distance, times the resolvent factor that bound applies, times the
      change in the one-pass map's Jacobian-vector product per unit
      distance (a second difference along the Newton correction, one
      probe per floating constant), with gradient_bound_usable beside it.
      It held at every cap of a max_iterations sweep on a concave and a
      convex map, 1.2-2.4x the true error for the parameter whose error is
      the larger (up to 11x for the other, which reads its gap to the worst
      probe), and 83x on a hidden slow mode where error_estimate's distance
      would have made it 12x short.  It is a statement about the
      gradient, not the solve: on an affine map with additive parameters
      the IFT gradient is exact wherever the forward stops, so it reads
      0.0 while the state is 1.1e-2 from the fixed point with
      converged=True, and the returned value and gradient are then
      mutually inconsistent -- spectral_error_bound, not this key, is what
      reports the solve.  Beyond the leading-order regime a
      Newton-Kantorovich check scales it by 1/sqrt(1 - 2h) and makes it
      inf, unusable, at h >= 1/2 (at F'(x*) = 0.99 and 0.65-4.5% from the
      fixed point it had read 0.20-0.96x the true error).
      A stalled float32 iterate is the case converged cannot see, and it
      is a statement about the criterion, not only about the bound: when
      (1 - rho)|x - x*| falls below half an ulp, a pass changes nothing,
      F(x) == x bitwise, the residual is exactly 0.0, and converged --
      and strict_convergence -- report success although the state can be
      far from the fixed point.  Measured (jaxlib 0.11.0, float32, a
      fresh graph through gm.step()): a relay contracting at 0.99999,
      started 0.3% short of its fixed point, stops after one pass with
      residual=0.0 and converged=True at 38 348 ulps, a relative distance
      of 4.2e-3 against a tolerance of 1e-6, its IFT gradient 3.0e-3 off.
      The criterion is deliberately unchanged, because a precision floor
      in it would make tight float32 tolerances unreachable.  The bound
      keys are where a user sees it: spectral_error_bound adds the
      residual's float resolution before amplifying it (4 units of
      eps * max|field| per entry the norm reads, each field at its own
      dtype, per evaluation of the map a coupling pass rounds like; it
      read 0.0 on that state and now reads 9.4e-2), the gradient bound's
      distance carries the same floor, and precision_limited reports that
      the residual is at it.  A confirmation audit of the merged tree
      found the floor's premise -- that the map's evaluation error is a
      few ulps -- false for a composite map: a node integrating by
      explicit Euler in N sub-steps is 5.8 units off the exact map at
      N=20 and 29.4 at N=100, and a stalled relay built on one read the
      bound 0.07-0.96x its true distance at N=15-200 with
      spectral_usable=True, whether the node looped inside update() or
      the framework sub-cycled it.  The floor is now per evaluation,
      times the evaluations a pass rounds like: the largest sub-cycling
      divider times SimulationNode.update_evaluations(), a count a node
      declares for its own loops (4N covers the measured figures).
      Nothing outside update() can see an undeclared loop, so where the
      residual is at the floor -- where that count is the whole bound --
      a group with an undeclared node reports spectral_usable=False and
      gradient_bound_usable=False; a group whose nodes all declare keeps
      them.  The same audit found three more ways a bound read low with
      its flag set, each fixed: the gradient bound's floor, and its probe
      step, taken from the promoted dtype, so a float16 field beside a
      float32 one read 0.0 against a true 3.2% error; the spectral
      weights 1/max|field| flushed to zero above 1/tiny (8.5e37 in
      float32), which read rho_spectral 0.0 for a 0.9 map and the bound
      0.12x; and a subnormal per-pass change flushed before it was
      rescaled (MADD-ANO-019).  Planned 0.5.0 work, not a promise of this release:
      strict_convergence consulting the spectral bound when diagnostics
      are on.  The reported keys are exactly
      ['amplification', 'converged', 'error_estimate',
      'gradient_bound_usable', 'gradient_error_estimate',
      'gradient_relative_error_bound', 'iterations', 'precision_limited',
      'ratio_usable', 'residual', 'rho_spectral', 'spectral_error_bound',
      'spectral_usable', 'total_iterations'].
    severity: "minor"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      The forward state is as accurate as the criterion makes it and no
      error is raised, so the residual risk is a quiet accuracy
      shortfall rather than a crash.  It matters most for gradients:
      under solver="ift" the implicit-function-theorem derivative is
      exact only at a fixed point, and strict_convergence gates a
      training run on this same flag, so a stiff group whose slowest
      mode has lambda near 1 can hand an optimiser a gradient off by
      roughly residual * cond(I - dF/dx).  That quantity is now reported
      as gradient_error_estimate, and the flag itself accounts for the
      amplification, so the failure mode is diagnosable rather than
      silent.  What remains is the residual part below.
    affected_components:
      - "maddening.core.coupling.group.CouplingGroup.tolerance"
      - "maddening.core.coupling.group.CouplingGroup.strict_convergence"
      - "maddening.core.graph_manager.GraphManager.coupling_diagnostics"
    affected_versions: ">=0.1.0"
    workaround: >
      On 0.3.x and earlier, calibrate the criterion once per problem
      instead of trusting it: solve the same step at tolerance t and at
      t/100 and take the difference between the two answers as the error
      at t.  On 0.4.0 the flag carries the amplification itself; read
      coupling_diagnostics()['ratio_usable'] to see whether it did, and
      treat ratio_usable=False as the old behaviour.  No release before
      0.4.0 reported it under any name (0.3.x has no such key);
      'bound_valid' was its name during 0.4.0's development, and 0.4.0
      still resolves that spelling, with a DeprecationWarning, until 0.5.0
      removes it -- but it is not in keys(), so do not look for it by
      enumerating the report.
    resolution_status: "partially_resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The bound is an estimate, not a proof.  rho is measured from the
      group's own residual sequence, so it describes the mode that
      sequence reveals; a mode that has not been excited by the
      iterations taken is not in it, and a strongly non-linear F breaks
      the geometric-series argument the bound rests on.  Where the
      sequence gives no usable ratio -- rho >= 1, a zero or non-finite
      predecessor, or max_iterations=1, which measures one residual and
      so has no ratio at all -- the criterion falls back to the raw
      residual test that shipped before 0.4.0, i.e. to this anomaly
      exactly.  That fallback is reported, not silent:
      coupling_diagnostics()['ratio_usable'] is False and
      gradient_error_estimate is +inf.
      A second gap is about which state the bound is over rather than
      how tight it is, and it is not reported at all.
      convergence_norm="interface" takes the residual over the edge
      source fields only, and accelerated_fields=None auto-detects that
      same set, so an accelerated group measures exactly the fields its
      quasi-Newton step just fixed and carries the rest of the state out
      of the last raw pass.  error_estimate is then a correct bound on
      the interface and says nothing about anything else.  Measured over
      the coupling sweep's 350 rows, on an iqn-* row exiting on its
      criterion: the interface field moves by at most 1.0e-04 while
      velocity moves by up to 2.2 (median 7.1e-05, p90 0.31).  That is
      the whole of the ten-row _KNOWN_DISAGREEMENTS list in
      tests/core/test_coupling_fixture_invariants.py -- all ten are
      iqn-* under the interface norm, naming every field in
      accelerated_fields closes all ten at the same iteration count, and
      tightening atol/rtol, which those entries first prescribed, does
      not.  Under convergence_norm="l2", which is over every float
      field, the same fixtures agree to 2e-05.  Evidence:
      benchmarks/results/retire_known_disagreements/REPORT.md.
      Two further mechanisms, measured on the 0.4.0 release audit
      (benchmarks/results/audit_040_final/ERROR_BOUND_DECISION.md),
      break the estimate on a map that is linear and all of whose modes
      are excited -- the case none of the conditions above reaches, and
      the reason those conditions must not be read as an exhaustive list
      of when to distrust the number.  First, rho is read from the
      residual sequence, so it reports the mode that dominates the
      *step*, which need not be the mode that dominates the remaining
      error: on modes (0.999, 0.2) at tolerance 1e-4 the reported
      error_estimate is 9.19e-05 against a true distance of 1.12e-02 --
      122x -- with ratio_usable=True and converged=True.  This one is a
      characterised limitation of error_estimate rather than an
      unfinished fix.  Over the passes that matter the failing sequence
      and a genuine single-mode decay at 0.2 are the same sequence, with
      consecutive ratios of 0.2000 and 0.2024 -- stationary to three
      figures -- so the two-step sqrt guard, a longer window, a
      stationarity test and a multi-term fit all agree with each other
      and all read the fast mode.  No function of the residual norms
      separates the two cases; recovering the slow mode needs the
      spectrum itself, and spectral_error_bound is that measurement
      (8.05x over on the same case).  Second, the step scale is
      corrected only where it is constant: under acceleration="fixed"
      the series now accounts for relaxation, having understated by
      1/omega before that landed (0.51x at omega=1.95), but Aitken's
      clipped per-pass factor is not carried and understates by 2.04x
      where it saturates at 2.0.  The IQN quasi-Newton step is not a
      multiple of F(x) - x at all; its measured 4.5x shortfall is the
      first mechanism rather than this one, because a superlinear
      sequence reads rho -> 0.  Neither is corrected in error_estimate;
      the spectral bound needs neither, because it never used the step
      (1.3x over under both, on the two-mode case).  ratio_usable
      reports a usable *ratio*, not a valid *bound* -- which is what the
      0.4.0 rename is for.
      What the spectral bound leaves open, and why this entry stays
      partially resolved.  It exists only under solver="ift" with
      diagnostics=True; the fori path has no linearisation to take a
      spectrum of and reports NaN, and the criterion both solvers stop
      on is still error_estimate -- the bound is reported, not applied,
      because on the heterogeneous fixture above (jacobi, aitken) it is
      a rigorous but loose number: the map is far from normal there, the
      spectral-radius form alone read 32x and 42x under the true
      distance on the two steps where Aitken dipped, the resolvent term
      covers them (2.9x and 6.5x over) and reads up to 95x over
      elsewhere, and 911x on the one step the 0.4.0 criterion passes --
      correctly, that state is 0.50x the tolerance from the reference;
      the step is precision-limited, the 60 000-entry float floor being
      the bound there -- so a spectral gate would refuse a correct
      pass.  For a non-linear F it is asymptotic (Ostrowski):
      exact to float32 on a log map within tolerance of its fixed point,
      an estimate far from one, and nothing checks linearity.  It is
      taken in the group's norm at the returned state, so the dead band's
      excluded fields are outside what it bounds and the interface norm's
      bound is over the interface fields only; its float floor is a model
      of the map's rounding (PRECISION_FLOOR_ULPS, per declared
      evaluation), which a node that cancels catastrophically inside its
      own update can exceed, and so can a node that loops inside it
      without declaring so where the residual is above the floor (at the
      floor its group is not reported usable); and on a
      stalled float32 iterate it is the floor times the amplification --
      what float32 can resolve about a group that slow -- while converged
      reads True (see the description).  A group with more than eight independent
      interface scalars gets rho_spectral from below, a margin of twice
      the Arnoldi residual on it, and spectral_usable=False.  Evidence:
      the two-mode figures in this entry (8.05x over; 1.3x over under
      aitken and iqn-ils) are measured on the two-mode fixture of
      tests/core/test_coupling_error_bound.py, as re-derived on the final
      tree in commit 23d9d1e (jaxlib 0.11.0, float32).  The 2026-09-22
      section of benchmarks/results/audit_040_final/ERROR_BOUND_DECISION.md
      records the decision and the first measurement (7.95x and 1.22x),
      taken before the precision-floor and Newton-Kantorovich fixes moved
      them.
      gradient_relative_error_bound inherits all of that and adds three
      conditions of its own.  It is leading-order in the distance: the
      curvature is measured over the Newton correction and extrapolated
      linearly to spectral_error_bound's distance, and the
      Newton-Kantorovich check that scales it or declares it unusable
      estimates the Jacobian's variation along that one direction only.  It is relative to the
      norm of the tangent for one probe per floating constant, so a
      field-valued constant is probed along one random direction, and a
      scalar loss whose gradient nearly cancels across the state can carry
      a larger relative error than the tangent does.  And it is exactly as
      blind as the norm: under the interface norm, on the stiff spring pair
      with iqn-ils and explicit accelerated_fields, it reads 3.1e-7 -- the
      stiffness gradient is exact to float32 -- while the velocities, which
      the norm does not read, are 1.7% off and spectral_error_bound, taken
      over the interface, reads 9.0e-3.  Evidence: the 2026-09-23 section of
      the same memo.
    verification:
      - "tests/core/test_coupling_error_bound.py::test_converged_means_the_state_is_within_tolerance_of_the_fixed_point"
