  - anomaly_id: "MADD-ANO-029"
    title: "The default `\"edge\"` halo fill copied a halo two or more cells wide from the shard's first cells instead of repeating its edge cell"
    description: >
      `halo_exchange`'s `"edge"` mode, the default of both it and
      `ShardedStencilNode`, is documented as replicating the edge value
      into the halo.  At the edges of the global grid it placed the
      shard's own first `h` cells there, in order: a halo two cells wide
      read `r0, r1` in front of `r0`, and `r(n-2), r(n-1)` after
      `r(n-1)` -- neither `numpy.pad`'s `"edge"` (`r0, r0`) nor a mirror
      (`r1, r0`).  At width 1 the three coincide, so no width-1 node or
      test could see it.  The wrapper's local padding of a halo axis
      `axis_map` leaves unsharded had the same fill.  The only built-in
      node with a halo wider than one cell is `HeatNode` at
      `stencil_order=4`.  On the rod of MADD-ANO-028 (64 cells, a linear
      ramp, Fourier number 0.25, 50 steps, float32) the default-filled
      sharded rod on two and four devices ended 4.73e-03 from the
      unsharded node and 7.28e-03 from the node's own `update_padded` run
      on the whole rod padded by `numpy.pad` -- the model the
      documentation describes -- with the end cell at 0.0712 against
      0.0664 unsharded, 7% at that cell.  The halo cell next to the rod
      end holding `r1` rather than `r0` gives the end a gradient the
      `"edge"` mode is meant not to have.
      Reproduced at v0.2.0 and v0.3.1 (`git archive` of each tag, same
      environment): a width-2 `"edge"` exchange of `[1, ..., 8]` on two
      devices returns `[1, 2, 1, 2, ...]` and `[..., 7, 8, 7, 8]`, and the
      sharded 4th-order rod's end cell reads 0.0712 at both tags, as on
      the 0.4.0 tree before the fix.  The fill dates from the primitive's
      first commit.
      Resolved in 0.4.0: `"edge"` repeats the edge cell across the whole
      halo at every width (`numpy.pad` `mode="edge"`), in the exchange and
      in the wrapper's local padding, which now share one helper.  Width 1
      is bit-identical.  With the corrected fill alone the 4th-order
      sharded rod became one model on 1, 2 and 4 devices, matching the
      whole-rod `numpy.pad` run to float32 rounding (5.96e-08) but still
      2.54e-03 from `update`, because no fill can express `update`'s cubic
      end closure.  MADD-ANO-030's fix closes that: `update_padded` now
      builds the ghosts beyond each rod end itself, and the sharded rod is
      `update` to float32 rounding (<= 2.4e-07) at both orders, with and
      without boundary inputs, on 1, 2 and 4 devices.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silently wrong physics in the default mode of a public, STABLE
      wrapper, with no error or warning: 7% at the end cell, and an end
      temperature is what a coupled neighbour reads.  Graded `major`; it
      was `minor` until the 0.4.0 severity definition, because it is
      confined to the cells within a halo width of the global ends, to
      stencils wider than one cell (in-tree, only the 4th-order
      `HeatNode`), and is sub-percent of the field's range (4.7e-03 on a
      unit range).  `context_dependent` because it needs a
      sharded stencil node with a halo at least two cells wide and a
      non-periodic `boundary`; whether a result built on it matters is a
      property of the program using it.
    affected_components:
      - "maddening.cloud.multigpu.halo.halo_exchange"
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
    affected_versions: ">=0.2.0, <0.4.0"
    workaround: >
      Before 0.4.0: for a stencil node with a halo wider than one cell,
      either run it unsharded or apply its end boundary condition inside
      `update_padded`, overwriting the global halo cells, rather than
      relying on the `"edge"` fill.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known for the built-in nodes.  The one wide-halo node,
      `HeatNode` at `stencil_order=4`, no longer reads the global halos
      (MADD-ANO-030), and the order-4 gap this entry used to record here
      (2.54e-03 against `update`) is gone.  A custom stencil node wider
      than one cell that uses the `"edge"` fill as its boundary condition
      now gets the documented replicated edge; one that was tuned to the
      old `r0, r1` fill changes.
    verification:
      - "tests/cloud/multigpu/test_halo_global_edge_fill.py::test_the_reference_pads_the_way_the_documentation_says"
      - "tests/cloud/multigpu/test_halo_global_edge_fill.py::test_a_slab_exchange_fills_every_halo_slot_as_numpy_pad_does"
      - "tests/cloud/multigpu/test_halo_global_edge_fill.py::test_a_pencil_exchange_fills_every_halo_slot_as_numpy_pad_does"
      - "tests/cloud/multigpu/test_halo_global_edge_fill.py::test_the_wrapper_fills_sharded_and_unsharded_halo_axes_alike"
      - "tests/cloud/multigpu/test_sharded_heat_rod_ends.py::test_a_sharded_rod_is_the_unsharded_rod_for_the_same_boundary_inputs"
      - "tests/cloud/multigpu/test_run_pod_dry_run.py::test_halo_reference_encodes_the_documented_boundary_fill"
    github_issue: null

  - anomaly_id: "MADD-ANO-030"
    title: "A sharded HeatNode ignored its boundary temperature inputs: left_temperature and right_temperature never reached update_padded's rod ends"
    description: >
      `HeatNode.update` holds each rod end at `left_temperature` /
      `right_temperature` through a ghost cell, but
      `HeatNode.update_padded` -- what `ShardedStencilNode` calls -- used
      the halo cells at the global ends as the exchange delivered them and
      never read either input.  `ShardedStencilNode` proxies
      `boundary_input_spec()`, so an edge or external input into either
      field validated and compiled, and was then discarded without an
      error or warning: the sharded rod ran with whatever the `boundary`
      fill put in the halo.  The docstring's workaround, `boundary="zero"`,
      put 0 in the ghost cells, i.e. at the ghost centres half a cell
      outside the rod rather than at the rod end, and could express no
      other temperature.  At `stencil_order=4` no fill could reproduce
      `update`'s cubic end closure either, so even a rod with no inputs
      differed (MADD-ANO-029's residual, 2.54e-03).
      Measured on `HeatNode` (64 cells, a linear initial ramp from 0 to 1,
      Fourier number 0.25, 50 steps, CPU, jaxlib 0.11.0, float32) on the
      0.4.0 tree before the fix (ef0614c), sharded against the unsharded
      node given the same inputs: both ends at 0 -- 0.865 at either order
      on 1, 2 and 4 devices; ends at 0.2 and 1.3 -- 0.331 (order 2) and
      0.332 (order 4); the left end at 0.5 with a heat source -- 0.374 and
      0.373.  Two sharded rods coupled end to end through
      `left_temperature` / `right_temperature` edges ran uncoupled, and
      the regression test for that case compared means within 10%, which
      it passed with the coupling ignored.
      Reproduced at v0.2.0 and v0.3.1 (`git archive` of each tag, same
      environment): on two devices a sharded rod with both ends at 0, or
      at +5 and -5, is bit-identical to the same rod with no inputs, at
      both orders and under `"edge"` and `"zero"`.  `HeatNode.update_padded`
      first shipped in v0.2.0 (`git tag --contains` on the commit that
      added it).
      Resolved in 0.4.0.  On the block that holds a rod end --
      `shard_info` says which; without it the block is the whole rod --
      `update_padded` rebuilds the ghosts beyond that end with `update`'s
      own closure from the inputs (the end cell when absent): `2*T_b -
      T[0]` at order 2, the cubic through the rod end with the 3-point
      form at the end cell at order 4, reading the end cells through the
      halo on a shard thinner than the stencil.  The sharded rod is
      `update` for the same inputs on 1, 2, 4 and 8 devices and on a
      size-1 pencil axis: 0 at order 2, <= 2.4e-07 at order 4.  Because
      the fill at the global ends can no longer reach the answer,
      `HeatNode` declares `halo_boundary() == "edge"` and
      `ShardedStencilNode` refuses `boundary="zero"` and
      `boundary="periodic"` for it at construction, with a message saying
      that a Dirichlet T=0 end is `left_temperature=0.0` /
      `right_temperature=0.0`, exactly as unsharded.  That refusal is a
      behaviour change for anyone who wrapped a `HeatNode` with `"zero"`
      (the documented workaround) or `"periodic"`.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silently wrong physics on a documented configuration: a boundary
      input the wrapper advertised, validated and accepted was discarded,
      so a sharded rod with its ends held at a temperature computed a
      different model from the unsharded rod given the same graph, with
      no error or warning.  The error is not local: 0.87 on a unit range
      after 50 steps with both ends at 0, and a coupled pair of sharded
      rods did not couple at all.  Graded `major` for that silence and
      magnitude.  Not `critical` because `update_padded`'s docstring did
      say that non-zero Dirichlet temperatures were not supported on the
      sharded path.  `context_dependent` because it needs a sharded
      `HeatNode` with a boundary temperature input (or at
      `stencil_order=4`, any sharded rod); whether a result built on it
      matters is a property of the program using it.
    affected_components:
      - "maddening.nodes.heat.HeatNode.update_padded"
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
    affected_versions: ">=0.2.0, <0.4.0"
    workaround: >
      Before 0.4.0: run a `HeatNode` with boundary temperatures unsharded.
      From 0.4.0, a sharded `HeatNode` takes `left_temperature` /
      `right_temperature` exactly as an unsharded one; a wrapper built
      with `boundary="zero"` is refused -- drop the argument and pass
      `left_temperature=0.0` / `right_temperature=0.0` instead (in a
      graph, `gm.add_external_input(<node>, "left_temperature")` and
      `"right_temperature"`, which default to 0).
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known for `HeatNode`.  The refusal covers only nodes that
      declare `halo_boundary()`; a custom stencil node that builds its own
      end ghosts and declares nothing still takes any fill and ignores it.
      Non-uniform grids are still refused on the sharded path
      (`NotImplementedError`), as before.
    verification:
      - "tests/cloud/multigpu/test_sharded_heat_rod_ends.py::test_a_sharded_rod_is_the_unsharded_rod_for_the_same_boundary_inputs"
      - "tests/cloud/multigpu/test_sharded_heat_rod_ends.py::test_a_thin_shard_closes_its_rod_end_through_the_halo"
      - "tests/cloud/multigpu/test_sharded_heat_rod_ends.py::test_the_fill_at_the_rod_ends_never_reaches_the_answer"
      - "tests/cloud/multigpu/test_sharded_heat_rod_ends.py::test_a_fill_the_heat_rod_would_ignore_is_refused_naming_the_inputs"
      - "tests/cloud/multigpu/test_coupled_sharded.py::test_two_sharded_heats_coupled_via_edges"
      - "tests/cloud/multigpu/test_heat_sharded.py::test_sharded_close_to_unsharded"
      - "tests/cloud/multigpu/test_heat_sharded.py::test_sharded_4th_order"
      - "tests/cloud/multigpu/test_sharded_gradient.py::test_gradient_matches_the_unsharded_node"
      - "tests/cloud/multigpu/test_property_sharded_round_trips.py::test_an_edge_into_a_rod_end_temperature_reaches_the_sharded_rod"
    github_issue: null

  - anomaly_id: "MADD-ANO-031"
    title: "A HeatNode at stencil_order=4 with no boundary input is not insulated: heat crosses a rod end that has no temperature given"
    description: >
      With no `left_temperature` (or `right_temperature`), `HeatNode`
      takes the end cell as the Dirichlet datum, `T_b = T[0]`.  At
      `stencil_order=2` the ghost is then `2*T_b - T[0] = T[0]` and the
      face flux is exactly zero: the end is insulated.  At
      `stencil_order=4` the ghosts are the cubic through `(0, T[0])` and
      the three end cells (MADD-ANO-008's closure), whose slope at the rod
      end is not zero, so heat crosses an end that has no temperature
      given.  Measured on 64 cells with an `x**2` initial profile,
      Fourier number 0.25, 2000 steps, float64, CPU, jaxlib 0.11.0: the
      mean temperature falls from 0.333313 to 0.332048 at
      `stencil_order=4` and stays at 0.333313 at `stencil_order=2`; in
      float32 over 500 steps the relative change is 3.1e-03 against
      1.8e-07.  A mirror-image ghost pair (`T[1], T[0]`) would conserve it
      exactly.
      Before 0.4.0 neither order was insulated, because the end cells
      were overwritten with the datum (MADD-ANO-007, resolved in 0.4.0);
      that fix made order 2 insulated and left order 4 as described.  The
      sharded node now reproduces the unsharded one exactly
      (MADD-ANO-030), so it carries the same behaviour.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A rod end left unconnected is naturally read as insulated, and at
      `stencil_order=2` it is; at `stencil_order=4` it leaks, silently.
      Graded `major`: heat crosses an end that has no temperature given,
      and nothing says so.  It was `minor` until the 0.4.0 severity
      definition, because the drift is slow (0.38% of the mean over 2000
      steps above), confined to the ends, and absent whenever the ends
      are given a temperature, which is how the node's documented
      boundary condition is meant to be used.  `context_dependent`
      because it needs `stencil_order=4` and an end with no boundary
      input; whether a result built on it matters is a property of the
      program using it.
    affected_components:
      - "maddening.nodes.heat.HeatNode"
    affected_versions: ">=0.1.0"
    workaround: >
      For an insulated end use `stencil_order=2`, or give the end an
      explicit temperature through `left_temperature` /
      `right_temperature`.  Scheduled for 0.5.0.
    resolution_status: "open"
    verification:
      - "tests/nodes/test_heat.py::test_an_unconnected_fourth_order_end_is_insulated"
      - "tests/nodes/test_heat.py::test_an_unconnected_second_order_end_is_insulated"
    github_issue: null

  - anomaly_id: "MADD-ANO-032"
    title: "After a parameter write and compile(), the sharded wrappers kept computing with what they had built from the old value: a legacy node's constant, and ShardedStencilNode's halo width"
    description: >
      Both wrappers keep a `jax.jit(shard_map(...))` per input signature
      (the shapes and dtypes of state, boundary inputs and sharded statics,
      `static_data_hash()` and the structure of the params pytree).  A node
      on the three-argument contract reads its constants from `self.params`
      while it is traced, so each cached function holds the constant of the
      moment it was first called, and a jitted function hands back that
      trace for the same argument shapes.  Nothing dropped the cache: not
      the write, and not `GraphManager.compile()`, which calls
      `invalidate_static_cache()` on every node for exactly this purpose but
      reached only the per-device copy of the statics.  So once the graph
      had stepped, a write followed by a recompile -- what `PUT
      /graph/params` does for such a node, and the documented way to change
      a structural constant -- left the sharded step on the old value while
      the unsharded node took the new one, with no error.  A write before
      the first step was taken was unaffected (nothing was cached yet), and
      a node that takes the injected `params` is unaffected (its leaves are
      arguments of the cached function, not constants of its trace).
      Measured on a 16-cell periodic diffusion `u += dt * D * lap(u)`
      reading `D` from `self.params`, two devices, CPU, jaxlib 0.11.0: one
      step at `D = 0.1`, `D = 2.0` written into the node's params,
      `compile()`, one more step -- the sharded field is 2.98e-08 from a
      second step at the old `D` and 7.42e-02 from one at the new `D`; the
      unsharded field is exactly the new-`D` step.  Through `PUT
      /graph/params` on the 0.4.0 development tree before the fix the
      route answered 200 and the numbers were the same.  Under
      `ShardedUnstructuredNode`, an 8-cell decay `x *= (1 - w)` with `w`
      moved from 0.5 to 0.9 read `[0.25, 0.5, 0.75]` (the old `w`) where
      `[0.05, 0.1, 0.15]` was due.
      Reproduced at v0.2.0, v0.3.0 and v0.3.1 (`git archive` of each tag,
      same environment, same numbers; `ShardedUnstructuredNode` from
      v0.3.0, where it first shipped).  At those tags `PUT /graph/params`
      did not reach the wrapped node at all (MADD-ANO-004), so the route
      was not a path there; the direct write into the node's params and a
      recompile was, and it is the workaround MADD-ANO-004 records for
      those versions, which therefore held only while no step had run.
      The cache dates from the stencil wrapper's first commit (3601f55).
      `ShardedStencilNode` also fixed its halo layout at construction --
      the exchange width per axis, from `halo_width()` -- while it stripped
      the node's current `halo_width()`, so a node whose halo follows a
      parameter was mis-sliced after a write: `HeatNode`'s halo is 1 cell
      at `stencil_order=2` and 2 at 4, and a 16-cell rod on four devices
      written to order 4 and recompiled (before any step, so no stale
      trace) stepped a field 3.9e-02 from both the order-2 and the order-4
      step, at v0.2.0, v0.3.1 and in this cycle alike; through `PUT
      /graph/params` on the 0.4.0 tree before the fix it answered 200.
      Partially resolved in 0.4.0: `invalidate_static_cache()` drops the compiled
      functions and rebuilds the per-shard update on both wrappers, and the
      stencil wrapper reads its halo layout from the node each time it
      builds it, so every `compile()` traces the wrapped node afresh with
      the halo it declares.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A confirmed parameter change the sharded solver silently did not
      apply, while the same graph unsharded did: the output is
      self-consistent and describes the model before the change.  Graded
      `major`, as MADD-ANO-004 is, for that silence.  `context_dependent`
      because it needs a sharded stencil or unstructured node on the
      three-argument contract, a write to one of its constants at run time,
      and a step taken before the write; a node calibrated through the
      params pytree, and a graph whose constants are set at construction,
      are unaffected.
    affected_components:
      - "maddening.cloud.multigpu.sharded_node.ShardedStencilNode"
      - "maddening.cloud.multigpu.sharded_unstructured.ShardedUnstructuredNode"
    affected_versions: ">=0.2.0"
    workaround: >
      Before 0.4.0: set the value before wrapping the node, or build a new
      wrapper after writing it (a new wrapper has nothing cached).  A
      recompile alone does not help once the graph has stepped.
      From 0.4.0, the graph path needs nothing; when calling a wrapper's
      `update()` directly, call `invalidate_static_cache()` on it after
      writing a constant of the node it wraps.
    resolution_status: "partially_resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Live in 0.4.0, which is why this entry is partially resolved rather
      than resolved: a wrapper's `update()` called on its own, outside a
      graph, still reuses the step it traced first after a write to a
      legacy node's constant, until `invalidate_static_cache()` is called
      (every `compile()` calls it).  The unwrapped node's `update()` reads
      its params afresh on every call, so the wrapped and unwrapped node
      disagree silently on that path, under both `ShardedStencilNode` and
      `ShardedUnstructuredNode`.  A graph recompiles on every write that
      marks it dirty, so the graph path -- `step`, `run`, the scans and
      `PUT /graph/params` -- is covered.  Pinned by
      test_a_wrappers_own_update_keeps_its_compiled_step_until_the_cache_is_dropped,
