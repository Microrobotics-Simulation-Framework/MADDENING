  - anomaly_id: "MADD-ANO-098"
    title: "Two SpringDamperNodes anchored on each other in a converged coupling group gain momentum without bound when stiffness*dt > damping, far inside the single node's stability limit"
    description: >
      `SpringDamperNode` integrates by semi-implicit Euler.  Two of them
      anchored on each other (each one's `position` is the other's
      `anchor_position`, with rest lengths +L and -L, so that they form one
      spring) and converged in a coupling group are each explicit in their
      own position and implicit in the partner's.  The spring forces then do
      not cancel and the pair's momentum is not conserved.  For an equal
      pair (the same k, c and m) the velocity sum decouples exactly, and is
      multiplied by g = (m - c*dt)/(m - k*dt**2) per step.  Where the
      coupling iteration converges (k*dt**2 < m) and c*dt < m, that grows
      exactly when k*dt > c.  The relative motion is stable for any k when
      c*dt < 2*m.  So the spring itself settles while the pair drifts off
      with a speed that grows every step.  The single node's own bound,
      k*dt**2 + 2*c*dt < 4*m, does not see it.  With k = 1000, c = 2,
      m = 0.5 and dt = 0.01, the single node sits at 0.14 against 2, and
      the pair's centre-of-mass velocity grows by 1.2 per step.  Measured
      identically at v0.1.0 and v0.3.1 (`git archive` of each tag, CPU,
      jaxlib 0.11.0) and on the 0.4.0 tree, where the growth matches g to
      float32 precision either side of c = k*dt.  From rest, the rounding
      alone seeds the drift: started 2 m from its rest separation, the pair
      had moved some 20 m after 1 s, with every value finite and no
      warning.  The shipped coupled-spring examples used a pair past the
      limit until the 0.4.0 examples work (#183) raised their damping.
      Above c*dt = m the factor is negative.  The pair is then stable up
      to c*dt + k*dt**2 = 2*m, and past that its common velocity flips
      sign and grows every step, though c > k*dt: with k = 6000, c = 150,
      m = 1 and dt = 0.01 each node sits at 3.6 against its bound of 4 and
      g = -1.25, measured on the 0.4.0 tree (CPU, jaxlib 0.11.0).  Every
      equal pair past the single-node bound with k*dt**2 < m is past that
      upper figure too.  Nothing refuses either bound.  0.4.0 states both
      in the node's `NodeMeta` (limitations and a hazard hint) and derives
      them in its algorithm guide, and `compile()` warns.  It emits a
      UserWarning naming both nodes, their constants, the growth factor
      and this entry when a coupling group (`max_iterations` of 2 or more)
      holds two `SpringDamperNode`s of one timestep, each anchored on the
      other through an edge with no transform (or the built-in
      `identity`) that is neither additive nor mapped and is the anchor's
      only writer, and the converged step grows: its spectral radius,
      from the live `gm.params` values, exceeds 1 by more than one part in
      a million.  For an equal pair that is g; an unequal pair, which a
      calibration of one node leaves behind, gets the spectral radius.
      The numerics are unchanged, so this entry stays open.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A silent wrong result: a configuration that each node's own bound
      accepts, and that converges at every step, drifts away without limit
      while the spring between the two looks right.  Graded `major`.  Not
      `critical`: it needs two springs anchored on each other in a
      coupling group with stiffness*dt above damping, the drift is in plain
      view in the positions, and the stated condition avoids it.  The
      warning `compile()` now gives does not refuse the graph, and it sees
      only the pattern it recognises.  `context_dependent` because what
      the drifting positions feed is the program's choice.
    affected_components:
      - "maddening.nodes.spring.SpringDamperNode"
    affected_versions: ">=0.1.0"
    workaround: >
      Keep damping >= stiffness*dt on two springs anchored on each other in
      a coupling group: choose dt <= damping/stiffness, or raise the
      damping, but not so far that damping*dt + stiffness*dt**2 exceeds
      2*mass.  Keep stiffness*dt**2 < mass so that the coupling iteration
      converges.  For an unequal pair, check the spectral radius of the
      converged step; `compile()` does, and warns past 1.  It does not
      judge an edge through any other transform (a lambda that passes the
      value through included), a wrapped node or a subclass that overrides
      `update`, two timesteps in a sub-cycled group, stiffness*dt**2 >=
      mass (the iteration does not converge there, and
      `coupling_diagnostics()` says so), or a value supplied after
      compile, so check those yourself.  Exchanging the positions without
      a coupling group (lagged by the schedule) is a different scheme with
      its own limit; it also diverges at the constants above, and is not
      warned about.
    resolution_status: "open"
    verification:
      - "tests/nodes/test_spring_stability_limits.py::test_the_coupled_pairs_centre_of_mass_grows_by_the_stated_factor"
      - "tests/nodes/test_spring_stability_limits.py::test_the_reproducer_drifts_off_with_finite_values_and_warns_only_at_compile"
      - "tests/nodes/test_spring_stability_limits.py::test_the_relative_motion_is_stable_where_the_pair_is_not"
      - "tests/nodes/test_spring_stability_limits.py::test_the_heavily_damped_side_flips_sign_and_grows"
      - "tests/nodes/test_spring_stability_limits.py::test_the_single_node_bound_is_exact"
      - "tests/nodes/test_spring_stability_limits.py::test_the_node_metadata_states_both_bounds"
      # The warning (not a fix: the entry stays open).
      - "tests/nodes/test_spring_stability_limits.py::test_compile_warns_about_the_reproducer"
      - "tests/nodes/test_spring_stability_limits.py::test_no_warning_on_the_defaults_which_sit_on_the_limit"
      - "tests/nodes/test_spring_stability_limits.py::test_the_step_matrix_is_the_nodes_converged_step"
    github_issue: null

  - anomaly_id: "MADD-ANO-099"
    title: "GraphManager.step did not zero-fill the inputs a partial external_inputs left out, and dropped an undeclared node or field name in silence: the node took its own \"input missing\" branch"
    description: >
      `step(external_inputs=None)` fed zeros to every declared external
      input, as documented.  A dict naming only some of them did not
      complete the rest: an omitted input never reached the node, which
      fell back to whatever its `update()` does when the input is absent.
      A name the graph does not declare, such as a misspelt node or field,
      was dropped without a word, so the input it was meant to set
      took the same fallback.  On a node with two declared inputs whose
      fallbacks are 100 and 200, `step()` gave 0.  `step({})` gave 300.
      `step({"s": {"f": 1.0}})` gave 201 where zero-filling gives 1.
      `step({"s": {"force": 1.0}})` and `step({"spring": {"f": 1.0}})`
      both gave 300.  The same held for `run` and `run_scan`, at v0.1.0,
      v0.2.0, v0.2.1, v0.3.0 and v0.3.1 alike (`git archive` of each tag,
      CPU, jaxlib 0.11.0).  `BallNode` without its `table_position`, for
      instance, falls through the floor rather than bouncing at zero
      (MADD-ANO-084 measured that on the FMU paths).
      Fixed during 0.4.0 development (2428f5e, 2026-09-19) and recorded in
      the CHANGELOG, but not registered until the 0.4.0 record audit.
      Resolved in 0.4.0: `_resolve_external_inputs` stands in front of every
      entry point (`step`, `run`, `run_scan`, `run_scan_with_history`,
      `run_sweep`, `run_adaptive`, `run_adaptive_scan`).  It completes a
      partial dict with zeros and refuses an undeclared `node.field` with a
      `ValueError` naming the declared ones.  MADD-ANO-084 is the FMU paths'
      counterpart, which arose when this fix reached the graph alone.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A silent wrong result, graded `major`.  An external input the caller
      left out, or misspelt, was neither the value meant nor the zero that
      `None` gives, but the node's own fallback, and nothing said so.  Not
      `critical`: it needs a partial or misspelt dict and a node whose
      fallback differs from zero, and passing every declared input in full
      avoids it.  `context_dependent` because the size of the difference is
      whatever the node's fallback makes it.
    affected_components:
      - "maddening.core.graph_manager.GraphManager.step"
      - "maddening.core.graph_manager.GraphManager.run"
      - "maddening.core.graph_manager.GraphManager.run_scan"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: pass every declared external input on every call,
      zeros included, and check the node and field names against
      `gm._external_inputs` before stepping.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known for the graph.  A stand-alone `FmuSidecar` built without
      `input_resolver` hands its inputs to the compiled step as given (see
      MADD-ANO-084).
    verification:
      - "tests/core/test_graph_manager.py::TestExternalInputsAreCompletedAndValidated::test_an_omitted_input_is_zero_filled_like_the_none_case"
      - "tests/core/test_graph_manager.py::TestExternalInputsAreCompletedAndValidated::test_an_unknown_name_is_refused_and_the_declared_ones_named"
      - "tests/core/test_graph_manager.py::TestExternalInputsAreCompletedAndValidated::test_every_run_method_validates_the_same_way"
    github_issue: null

  - anomaly_id: "MADD-ANO-100"
    title: "The FMU bridge took any master_dt: a doStep ran h / master_dt graph steps and reported t + h, so a 0.01 s graph served with master_dt=0.005 labelled a state at 0.10 s with the time 0.05 s"
    description: >
      `FmuTcpBridge` stored the `master_dt` its caller passed and never
      compared it with the graph it served, which it is not given, or with
      the model description, which it is.  A `step` of `h` ran
      `round(h / master_dt)` graph steps and reported `t + h`.  On the
      0.4.0 development tree on 2026-10-02 (CPU, jaxlib 0.11.0), a
      uniform-rate `SpringDamperNode` graph at 0.01 s served with
      `master_dt=0.005` answered five `doStep`s of 0.01 s with t = 0.05 s
      and a position of 1.420895, which is the graph at 0.10 s; at 0.05 s it
      is 1.477806.  The same held in reverse for a multi-rate graph whose
      advertised default step was its smallest node timestep, not its step
      (MADD-ANO-097): nodes at 0.02 and 0.03 s step by 0.01 s, and a bridge
      given the advertised 0.02 s as `master_dt` ran one graph step per
      0.02 s `doStep`, so after 0.12 s of reported time the state was the
      graph's at 0.06 s.  The user guide's own example passed an undefined
      `gm_base_dt`.  No release carried it: v0.1.0 to v0.3.1 have no
      `src/maddening/fmi/tcp_bridge.py`.  Found by the round-5 FMU audit.
      Resolved in 0.4.0: `build_model_description` records the graph's step
      as `ModelDescription.graph_timestep` (`GraphManager.timestep`, which
      MADD-ANO-096 made the step a graph takes), whatever
      `default_step_size` advertises.  The bridge refuses a `master_dt` more
      than a relative 1e-9 from it, and a description whose
      `default_step_size` is not a whole number of graph steps, or more of
      them than one request may take.  A description built by hand, without
      `graph_timestep`, is held to its `default_step_size`.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A silent wrong result, graded `major`.  Every value the FMU returned
      was the graph's state at a time other than the one it reported, every
      call `fmi3OK`, and an importer coupling it to other models would
      exchange values at the wrong times.  Not `critical`: it needs a
      `master_dt` other than the graph's step, and the step was then
      undocumented rather than the default.  Registered although no release
      carried it, because it is major.  `context_dependent` because the
      size of the error is whatever the model does over the mislabelled
      interval.
    affected_components:
      - "maddening.fmi.tcp_bridge.FmuTcpBridge"
      - "maddening.fmi.model_description.ModelDescription"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: pass `master_dt=gm.timestep`.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The bridge holds no graph, so it checks `master_dt` against the step
      the description records, not against the compiled step the sidecar
      runs.  A sidecar built over a different graph from its description
      is not detected; build both from the same `GraphManager`.
    verification:
      - "tests/fmi/test_bridge_master_dt_is_the_graph_step.py::test_a_master_dt_other_than_the_graph_step_is_refused"
      - "tests/fmi/test_bridge_master_dt_is_the_graph_step.py::test_at_the_graph_step_the_fmu_is_the_graph_at_the_time_it_reports"
      - "tests/fmi/test_bridge_master_dt_is_the_graph_step.py::test_an_advertised_step_of_several_graph_steps_runs_that_many"
      - "tests/fmi/test_bridge_master_dt_is_the_graph_step.py::test_an_advertised_step_the_bridge_would_refuse_is_refused_up_front"
    github_issue: null

  - anomaly_id: "MADD-ANO-101"
    title: "A number for a Boolean FMU variable was stored by its truthiness: set gate.open = 0.5, 2.0 or -3.0 read back as true, and an FMU-state archive holding 0.25 in a Boolean field restored as true"
    description: >
      The one value check on every write path into the FMU's state and
      parameters (`set` and `set_state` on the TCP bridge,
      `FmuSidecar.set_params` and `FmuSidecar.set_fmu_state`) refused a
      boolean for a number but let any integer or float through to a
      Boolean target, and cast it with `astype(bool)`.  On the 0.4.0
      development tree on 2026-10-02 (CPU, jaxlib 0.11.0), a graph with a
      Boolean external input answered `set` of 0.5, 2.0 and -3.0 with `ok`
      and read each back as 1, and an archive whose Boolean state field
      held the float 0.25 restored with the field `True`.  Every value on
      the FMU wire is a float64, so this is the path every Boolean
      variable takes.  No release carried it: the check was added during
      0.4.0's development (v0.3.1's `set_fmu_state` checked nothing, and its
      sidecar had no `set_params`), and the TCP bridge is new in 0.4.0.
      Found by the round-5 FMU audit.  Resolved in 0.4.0: a Boolean target
      takes a boolean or exactly 0 or 1, through the same check on all four
      paths; anything else is refused naming the variable, and nothing is
      written.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A silent wrong result, graded `major`: the value stored was not the
      value given, and the reply said `ok`.  Not `critical`: it needs a
      Boolean variable and a value other than 0 or 1, which a conforming
      importer's `fmi3SetBoolean` never sends.  Registered although no
      release carried it, because it is major.  `context_dependent` because
      what a flag set the wrong way does depends on the model.
    affected_components:
      - "maddening.fmi.tcp_bridge.checked_value"
      - "maddening.fmi.sidecar.FmuSidecar.set_params"
      - "maddening.fmi.sidecar.FmuSidecar.set_fmu_state"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: send only 0 or 1 to a Boolean variable.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.
    verification:
      - "tests/fmi/test_a_boolean_takes_true_false_or_exactly_0_1.py::test_a_set_of_a_boolean_input_to_a_non_0_1_number_is_refused"
      - "tests/fmi/test_a_boolean_takes_true_false_or_exactly_0_1.py::test_an_archive_with_a_fraction_in_a_boolean_member_does_not_restore"
      - "tests/fmi/test_a_boolean_takes_true_false_or_exactly_0_1.py::test_the_sidecars_own_restore_door_refuses_it_too"
      - "tests/fmi/test_a_boolean_takes_true_false_or_exactly_0_1.py::test_set_params_holds_a_boolean_parameter_to_the_same_rule"
    github_issue: null

  - anomaly_id: "MADD-ANO-102"
    title: "The FMU's C wrapper carried every width as a double and the bridge could not tell the calls apart: fmi3SetBoolean wrote 1.0 into a Float32 parameter and fmi3GetInt32 truncated a Float32 output, both fmi3OK"
    description: >
      FMI 3.0 has a variable accessed only through the `fmi3Get` /
      `fmi3Set` function of its own type ("Getting and Setting Variable
      Values").  The C wrapper converted every width to a double and sent
      the bare number, and cast every reply back with `(CTYPE)value`.  On
      the 0.4.0 development tree on 2026-10-02 (CPU, jaxlib 0.11.0, the
      compiled wrapper driven through `ctypes` against a live bridge):
      `fmi3SetBoolean(true)` on the Float32 parameter
      `ball.params.elasticity` answered `fmi3OK` and stored 1.0, the
      coercion `FmuSidecar.set_params` refuses in process; and
      `fmi3GetInt32` on the Float32 output `spring.position`, at 0.5,
      answered `fmi3OK` with 0.  A NaN or out-of-range reply cast to an
      integer type is undefined behaviour in C.  No release carried it: the
      C wrapper is new in 0.4.0.  Found by the round-5 FMU audit.
      Resolved in 0.4.0: every get and set request names the FMI type of the
      function that made it, and the bridge refuses a variable of another
      type with nothing read or written.  A getter also refuses a reply
      value its C type cannot hold (a fraction, NaN or an out-of-range
      number for an integer type, anything but 0 or 1 for a Boolean, a
      finite number beyond `FLT_MAX` for a Float32), and the Int64 and
      UInt64 setters refuse a value a double cannot carry exactly.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A silent wrong result, graded `major`: an importer that used the
      wrong getter read a truncated value with `fmi3OK`, and one that used
      the wrong setter wrote a value the library refuses on every other
      path.  Not `critical`: it needs an importer calling a function of
      another type than the variable's, which FMI forbids and FMPy's
      `simulate_fmu` does not do.  Registered although no release carried
      it, because it is major.
    affected_components:
      - "maddening.fmi.package.C_SOURCE"
      - "maddening.fmi.tcp_bridge.FmuTcpBridge"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: access each variable through the function of its declared
      type.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A client of the bridge's JSON protocol that names no `type` is not
      type-checked; the C wrapper always names one.  The wire carries every
      value as a float64, so a value above 2^53 in magnitude cannot pass
      through it exactly: an Int64 or UInt64 set of one is refused, and a
      get of one returns the nearest double.  No node in the package holds
      a 64-bit integer that large.
    verification:
      - "tests/fmi/test_an_fmi_call_addresses_only_variables_of_its_type.py::test_a_set_of_another_type_is_refused_and_writes_nothing"
      - "tests/fmi/test_an_fmi_call_addresses_only_variables_of_its_type.py::test_a_get_of_another_type_is_refused"
      - "tests/fmi/test_c_wrapper_refuses_what_it_used_to_coerce.py::test_a_boolean_setter_cannot_write_a_float32_parameter"
      - "tests/fmi/test_c_wrapper_refuses_what_it_used_to_coerce.py::test_each_variable_is_read_only_through_the_getter_of_its_type"
      - "tests/fmi/test_c_unit.py::test_c_unit_tests"
    github_issue: null

  - anomaly_id: "MADD-ANO-103"
    title: "An FMU-state archive missing its pending-input members restored with those inputs silently at zero"
    description: >
      The bridge's `set_state` refused an archive whose state fields or
      parameters were not exactly the model's, and one without `_time`.
      The pending inputs (`i/<node>/<field>`) were optional: the restore
      started from zero inputs and filled in whichever members were there.
      The bridge's own `get_state` always writes every input, so an archive
      missing one is partial, the case the key-set rule exists to refuse.
      On the 0.4.0 development tree on 2026-10-02 (CPU, jaxlib 0.11.0), an
      archive taken with `spring.anchor_position` at 0.4 and stripped of
      that member restored with `ok`, and the input read 0.0.  No release
      carried it: the TCP bridge is new in 0.4.0.  Found by the round-5 FMU
      audit.  Resolved in 0.4.0: the inputs are held to the same key-set
      rule as the fields and parameters, from the archive's directory and
      again on decode, with the same message; a model with no inputs
      expects none, and a clock, which holds no value, has no member.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A silent wrong result, graded `major`: the restored FMU was not the
      snapshot, the reply said `ok`, and the next step ran with a zero
      input.  Not `critical`: it needs an archive that was edited or
      truncated, never one the bridge wrote.  Registered although no
      release carried it, because it is major.
    affected_components:
      - "maddening.fmi.tcp_bridge.FmuTcpBridge"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: restore only archives the bridge wrote.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.
    verification:
      - "tests/fmi/test_an_fmu_state_archive_carries_every_pending_input.py::test_an_archive_missing_an_input_member_is_refused_and_restores_nothing"
      - "tests/fmi/test_an_fmu_state_archive_carries_every_pending_input.py::test_an_archive_with_an_extra_input_member_is_refused"
    github_issue: null

  - anomaly_id: "MADD-ANO-104"
    title: "A trainable parameter one step carried past the edge of its coordinate range stayed there for the rest of the fit, and fit_lm reported converged=True away from the optimum"
    description: >
      The fitters move each trainable parameter in an optimiser coordinate,
      and `constrain` maps it back.  A `transform=None` leaf with bounds is
      its own coordinate, clipped; a `log` / `logit` leaf is clamped where
      `exp` floors or overflows and where the sigmoid meets the edge of its
      representable range.  Past a clip or a clamp the derivative is 0, and
      nothing put the coordinate back, so one step that carried it there
      left it there for good.  A spring's damping (`bounds=(0, None)`)
      started at 4 against noiseless data at 0.05 landed on 0 after one
      Levenberg-Marquardt step, and `fit_lm` reported `converged=True`
      (every later proposal changed the physical value by 0) with a
      derivative of -1.0 into the range; Adam (`fit`) and
      `fit_multiple_shooting` stayed on the bound as well.  A logit
      parameter on (0.5, 2) thrown to the sigmoid's edge sat at 1.999998,
      also `converged=True`, the truth at 1.25.  Found by the round-5
      sysid audit (2026-10-02) and, for the log / logit clamp, by the
      truth-recovery oracle written for it.  No tagged release carried it:
      the fitters are new in 0.4.0.
      Resolved in 0.4.0 (12eae80 and 9e1652d, 2026-10-02): every fitter
      projects each coordinate back onto the range where `constrain` is
      its transform after every update (`ParamSpec._optimiser_interval`);
      `fit_lm` holds a coordinate on its bound out of its coupled step
      while the gradient points out of the range, and no `converged` test
      fires while a coordinate on (or, read physically, within `step_tol`
      of) its bound could lower the loss by moving into the range.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent: the fit returned a parameter on its bound, far from the
      optimum, and said it had converged.  Graded `major` under the 0.4.0
      severity definition (a silent wrong result is never `minor`), and
      registered although no release carried it, because it is major.
      Not `critical`: the loss it returned was visibly far above its
      floor (2.6e-2 against 0 for the spring), and a calibration is
      normally checked against its data.  `context_dependent` because what
      a misidentified constant does depends on the model.
    affected_components:
      - "maddening.sysid.fit_lm"
      - "maddening.sysid.fit"
      - "maddening.sysid.fit_multiple_shooting"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: declare a bounded parameter with `transform="log"` or
      `"logit"` and start it well inside its range, or check a converged
      fit's loss against its floor.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A plateau where the model itself saturates -- a residual that stops
      depending on a parameter, to the last bit -- is a stationary point,
      and `fit_lm` may stop on one with `converged=True`; that is a
      property of the model, not of the coordinates.  Near the edge of a
      `logit` range the sigmoid is flat, so a parameter whose truth lies
      within `step_tol` of its edge may end with `converged=False`.
    verification:
      - "tests/core/test_sysid_bounded_coordinates_and_residual_scale.py::test_fit_lm_brings_a_clipped_coordinate_back_into_its_range"
      - "tests/core/test_sysid_bounded_coordinates_and_residual_scale.py::test_fit_brings_a_clipped_coordinate_back_into_its_range"
      - "tests/core/test_sysid_bounded_coordinates_and_residual_scale.py::test_fit_multiple_shooting_brings_a_clipped_coordinate_back_into_its_range"
      - "tests/core/test_sysid_bounded_coordinates_and_residual_scale.py::test_the_active_bound_is_held_out_of_the_coupled_step"
      - "tests/core/test_sysid_bounded_coordinates_and_residual_scale.py::test_a_log_and_a_logit_coordinate_are_kept_where_constrain_is_not_clamped"
      - "tests/property/test_sysid_truth_recovery.py::test_fit_lm_converged_means_the_truth"
    github_issue: null

  - anomaly_id: "MADD-ANO-105"
    title: "A node.params write with no recompile reached whichever program was traced next: gm.step kept its cached trace while run_scan at a new length, and later the sysid losses, ran the written value"
    description: >
      A node reads some constants from `self.params` when its step is
      traced -- every constant of a node on the three-argument contract,
      and a structural value (an `int`, a `bool`) of any node -- so they are
      baked into whichever program is traced next.  Nothing marked the
      graph dirty on a `node.params` write, so after one with no compile
      the entry points ran different models: `gm.step` and `gm.run` kept
      the step they had traced, while `gm.run_scan` at a length not traced
      before (and in 0.4.0 development `run_scan_with_history` and
      `sysid.windowed_loss`, which build a fresh step) traced the write
      in.  A three-argument decay node with its rate written from 1.0 to
      50.0: `gm.step` multiplied the state by 0.99, `gm.run_scan(1)` by
      0.5, and `gm.step` again by 0.99, with nothing to say so.  Measured
      at v0.1.0, v0.2.0, v0.2.1, v0.3.0 and v0.3.1 (a `git archive` of
      each tag, CPU, jaxlib 0.11.0; at v0.1.0 the probe node also defines
      the `requires_halo` that version required).  Found by the round-5
      sysid audit (2026-10-02).
      Resolved in 0.4.0 (4a09c63 and 154fb70, 2026-10-02): `node.params`
      counts its writes, and every entry point -- the run methods, the
      sysid fitters, `windowed_loss` and the profiler -- recompiles for a
      write the compiled step has not taken before it runs, so all of them
      run the written value; a write the running step already reflects
      (`PUT /graph/params` writes both the node and `gm.params`) costs no
      recompile.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent: two ways of running the same graph, one call apart, produced
      results from two different models.  Graded `major` under the 0.4.0
      severity definition (a silent wrong result is never `minor`).  Not
      `critical`: it needs a `node.params` write after compile with no
      recompile, where the released examples that changed a constant
      mid-run marked the graph dirty.  `context_dependent` because what the
      wrong model does depends on the model.
    affected_components:
      - "maddening.core.graph_manager.GraphManager"
      - "maddening.core.node.SimulationNode"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      On an affected release: call `gm.compile()` (or set `gm._dirty =
      True`) after writing `node.params`, before running the graph by any
      entry point.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A value mutated inside an object `node.params` holds is not a counted
      write, and changes no trace on its own; replace the value to write
      it.  An FMU sidecar built before a write keeps the compiled step it
      was given.
    verification:
      - "tests/property/test_differential_entry_points_after_a_node_write.py::test_every_entry_point_runs_the_written_model"
      - "tests/core/test_node_params_writes_are_observed.py::test_a_structural_write_reaches_gm_step_without_a_compile"
      - "tests/core/test_node_params_writes_are_observed.py::test_a_fitter_starts_from_the_written_value"
  - anomaly_id: "MADD-ANO-106"
    title: "Concurrent REST requests stepped the graph at once and lost steps silently: 200 concurrent POST /sim/step took about 60, every one answered 200, and the streams counted all 200"
    description: >
      FastAPI runs the server's routes on a thread pool, and nothing in
      `SimulationServer` serialised their use of the `GraphManager`.
      `GraphManager.step` reads the state, runs the compiled step (which
      releases the GIL) and stores the result, so two steps in flight read
      the same state and one result overwrote the other.  Checked at each
      tag, v0.1.0, v0.2.0, v0.2.1, v0.3.0 and v0.3.1, on 2026-10-02 (`git
      archive` of each, CPU, jaxlib 0.11.0, FastAPI `TestClient`, eight
      client threads of 25 `POST /sim/step` each against a `BallNode` graph
      whose compiled step was slowed to 2 ms): every request answered 200,
      and the final state was the serial state after 58 to 61 steps, so
      139 to 142 of the 200 were lost.  On the 0.4.0 development tree the
      round-5 REST audit measured 93 of 200 lost through uvicorn on loopback
      with the unslowed step, and 98 on a re-run.  `StateRelay` counted
      every step's notification, so the streams' `sim_time` said all 200
      had happened.  The same race let a `PUT /graph/state`, a
      `PUT /graph/params` or a `POST /checkpoint/load` land in the middle of
      a step -- the step's result then overwrote the write, or ran with half
      of a multi-key parameter write -- and the background runner's steps
      raced every route the same way.  Found by the round-5 REST audit.
      Resolved in 0.4.0: one re-entrant lock serialises every use of the
      graph.  Every route that reads or writes its state, parameters or
      structure takes it, the runner takes it for each step, a surrogate
      job for its data sweep, and `POST /sim/run` for each slice of its
      run, refusing writes (409) until it returns.  It is never held while
      waiting for the runner's thread, and the runner waits for it in
      slices that watch its stop flag.  N concurrent steps are now N steps,
      bit-identical to N serial ones, and the relay counts N.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A silent wrong result, graded `major`: the state was not the state of
      the steps every reply reported taken, and the streams' clock said they
      had been.  Not `critical`: it needs requests sent concurrently, which
      one client stepping in a loop does not do, and sending them one at a
      time avoids it.  `context_dependent` because what a run that silently
      skipped steps means depends on the model and on who reads its
      timeline.
    affected_components:
      - "maddening.api.server.SimulationServer"
      - "maddening.viz.runner.RealtimeRunner"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: send state-changing requests to one server one at a
      time (wait for each reply), and stop the runner before writing state.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A read waits for the step in flight, and every request waits at most
      30 s for the lock (then 503), so a step or compile longer than that
      makes concurrent requests fail loudly.  Code that holds the
      `GraphManager` outside the server -- a script sharing it with a
      running server -- is not serialised by the server's lock.
    verification:
      - "tests/api/test_concurrent_requests_are_serialised.py::test_concurrent_steps_are_all_taken_bit_identical_to_serial"
      - "tests/api/test_concurrent_requests_are_serialised.py::test_a_state_write_never_lands_inside_a_step"
      - "tests/api/test_concurrent_requests_are_serialised.py::test_a_params_write_never_lands_inside_a_step"
      - "tests/api/test_concurrent_requests_are_serialised.py::test_a_checkpoint_load_never_lands_inside_a_step"
      - "tests/api/test_concurrent_requests_are_serialised.py::test_a_run_refuses_writes_and_serves_reads_until_it_returns"
      - "tests/api/test_concurrent_requests_are_serialised.py::test_the_runners_steps_never_see_a_params_write_land_inside_them"
      - "tests/api/test_concurrent_requests_are_serialised.py::test_stop_is_answered_while_another_request_holds_the_graph"
      - "tests/api/test_concurrent_requests_are_serialised.py::test_stopping_the_runner_while_holding_the_graph_lock_is_refused"
    github_issue: null

  - anomaly_id: "MADD-ANO-107"
    title: "POST /surrogate/train reset the live simulation to its initial state, and its reply did not say so"
    description: >
      The training job's worker stopped the runner and called the server's
      state reset on the live graph before generating its data, and again
      after, although the data came from a batched sweep from initial
      conditions it built itself.  The reply was `{"job_id", "status":
      "started"}`.  Checked at each tag, v0.1.0, v0.2.0, v0.2.1, v0.3.0 and
      v0.3.1, on 2026-10-02 (`git archive` of each, CPU, jaxlib 0.11.0,
      FastAPI `TestClient`): a `BallNode` run for 50 steps to position
      8.749 read position 10.0, velocity 0.0 -- its initial state -- once a
      small training job was done.  The streams' clock was reset with it.
      Found by the round-5 REST audit.  Resolved in 0.4.0: the job generates
      its data with `GraphManager.run_sweep` alone, which writes nothing
      back, under the graph lock; it neither resets the graph nor stops a
      running runner.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A silent wrong result, graded `major`: every state the server reported
      after the job described a simulation restarted from its initial
      condition, which nothing in the reply or the log said.  Not
      `critical`: `GET /graph/state` showed the reset, and saving the state
      before training and restoring it after avoids it.
      `context_dependent` because what a run silently restarted means
      depends on what the run was for.
    affected_components:
      - "maddening.api.server.SimulationServer.create_app"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: save a checkpoint before `POST /surrogate/train` and load
      it once the job is done.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The data sweep holds the graph lock while it runs, so a large sweep
      delays every other request (each waits at most 30 s); the memory
      estimate bounds how large it can be.
    verification:
      - "tests/api/test_surrogate_jobs_are_bounded.py::test_training_leaves_the_live_simulation_where_it_was"
      - "tests/api/test_surrogate_jobs_are_bounded.py::test_a_running_runner_keeps_running_through_a_job"
    github_issue: null

  - anomaly_id: "MADD-ANO-108"
    title: "After POST /checkpoint/load the state streams served the state from before the load, at the old step's time, until the next step"
    description: >
      `StateRelay` publishes a snapshot, and counts the streams' clock, on
      each step it observes, and a load is not a step.  So after
      `POST /checkpoint/load` the streams (`/ws/state`, `/ws/state/binary`,
      `/ws/render`) went on serving the snapshot from before the load as
      the current state, and their `sim_time` went on counting from the
      step before it.  Checked at each tag, v0.1.0, v0.2.0, v0.2.1, v0.3.0
      and v0.3.1, on 2026-10-02 (`git archive` of each, CPU, jaxlib 0.11.0,
      FastAPI `TestClient`): a `BallNode` run to t = 1 s (position
      95.046), saved, run on to t = 2 s and loaded back answered
      `GET /graph/state` with 95.046 while `/ws/state` sent position 80.282
      at `sim_time` 2.00, and after one more step `sim_time` 2.01.  The
      checkpoint did not record the clock, so nothing could have restored
      it.  Found by the round-5 REST audit (its timestep half was
      MADD-ANO-096).  Resolved in 0.4.0: `POST /checkpoint/save` writes a
      manifest beside the checkpoint with its SHA-256 and the streams'
      clock, and `POST /checkpoint/load` publishes the loaded state at once
      and sets the clock to the manifest's -- or to zero, counted from the
      load, for a file without one or whose manifest does not hash to it,
      which the reply's `sim_time_from_checkpoint` says.  Streams now send
      every new snapshot by its sequence number, so a time repeated by a
      load is still sent.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A silent wrong result, graded `major`: the streams reported a state
      and a time the graph no longer had.  Not `critical`: `GET
      /graph/state` returned the loaded state, and one step after the load
      corrected the state (not the clock).  `context_dependent` because the
      streams are a view a user may or may not act on.
    affected_components:
      - "maddening.viz.relay.StateRelay"
      - "maddening.api.server.SimulationServer.create_app"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: take one step after a load before reading the streams,
      and read the time from your own record of the checkpoint.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      A checkpoint without this server's manifest (written by another tool,
      or a server before 0.4.0) restarts the streams' clock at zero, as the
      reply says.  `POST /sim/reset` clears the snapshot, as before: the
      streams send nothing until the next step.
    verification:
      - "tests/api/test_streams_after_a_checkpoint_load.py::test_ws_state_serves_the_loaded_state_at_the_checkpoints_time"
      - "tests/api/test_streams_after_a_checkpoint_load.py::test_ws_state_binary_serves_the_loaded_state_at_the_checkpoints_time"
      - "tests/api/test_streams_after_a_checkpoint_load.py::test_ws_render_draws_the_loaded_state_at_the_checkpoints_time"
      - "tests/api/test_streams_after_a_checkpoint_load.py::test_a_checkpoint_without_the_servers_manifest_restarts_the_clock_at_the_load"
      - "tests/api/test_streams_after_a_checkpoint_load.py::test_a_manifest_that_does_not_hash_to_its_checkpoint_is_not_believed"
    github_issue: null

  - anomaly_id: "MADD-ANO-109"
    title: "/ws/state/binary kept the frame layout of a node that had been replaced over REST: values cut off, or phantom zeros, in frames of the advertised length"
    description: >
      The server built its `BinaryStateEncoder` once and dropped it only on
      a reset.  A node replaced over REST (`DELETE /graph/nodes/a_rod`, then
      `POST /graph/nodes` with the same name and another `n_cells`) left the
      cached encoder in place, so a new client was sent a schema the graph
      no longer had, and `encode` wrote the node's new values into the old
      slot by `bytearray` slice assignment, which resizes the payload
      instead of refusing.  Checked at each tag, v0.1.0, v0.2.0, v0.2.1,
      v0.3.0 and v0.3.1, on 2026-10-02 (`git archive` of each, CPU, jaxlib
      0.11.0, FastAPI `TestClient`): a 4-cell rod replaced by a 2-cell one
      was streamed under a schema of 4 cells, and the client decoded
      [300, 300, 0, 0] from a frame of exactly the schema's `frame_bytes`,
      so nothing on the wire showed it.  Growing the rod to 6 cells dropped
      the last two values.  Found by the round-5 REST audit.  Resolved in
      0.4.0: the cached encoder is dropped when a node is added or removed
      or the graph is compiled; each stream builds its schema from the
      snapshot it encodes and sends a new one before the first frame of
      another layout; and `encode` refuses a field of another size than
      its schema's.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A silent wrong result, graded `major`: the decoded values were not the
      node's state, and the frame was the length the schema promised.  Not
      `critical`: it needs a node replaced or resized while a client
      streams, and `GET /graph/state` returned the right values.
      `context_dependent` because the stream is a view a user may or may
      not act on.
    affected_components:
      - "maddening.api.binary_encoder.BinaryStateEncoder.encode"
      - "maddening.api.server.SimulationServer.create_app"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: after replacing a node, `POST /sim/reset` (which dropped
      the cached encoder) before opening a binary stream, and reconnect any
      open one.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.
    verification:
      - "tests/api/test_binary_stream_follows_the_graph_layout.py::test_a_new_client_after_a_node_is_replaced_decodes_the_graphs_state"
      - "tests/api/test_binary_stream_follows_the_graph_layout.py::test_a_client_connected_through_a_replacement_gets_the_new_schema_first"
      - "tests/api/test_binary_stream_follows_the_graph_layout.py::test_a_snapshot_of_another_layout_gets_its_schema_first_whatever_published_it"
      - "tests/api/test_binary_stream_follows_the_graph_layout.py::test_the_cached_encoder_is_dropped_by_a_structural_change"
      - "tests/api/test_binary_stream_follows_the_graph_layout.py::test_encode_refuses_a_field_of_another_size"
    github_issue: null

  - anomaly_id: "MADD-ANO-110"
    title: "A runner whose thread had died was reported running: /sim/pause and /sim/resume answered 200, /sim/start 409 \"already started\", and /sim/reset was_running true"
    description: >
      The server kept a flag for "the runner is started" and never looked at
      the runner's thread.  When a step raised on that thread -- an edge
      whose shapes do not match, which `POST /graph/edges` accepted beside
      the running runner, is one way -- the thread died and the flag stayed
      set.  Checked at each tag, v0.1.0, v0.2.0, v0.2.1, v0.3.0 and v0.3.1,
      on 2026-10-02 (`git archive` of each, CPU, jaxlib 0.11.0, FastAPI
      `TestClient`, the runner's fourth step made to raise): with the
      thread dead, `POST /sim/pause` answered 200 "paused", `POST
      /sim/resume` 200 "resumed", and `POST /sim/reset` `was_running: true`.
      The round-5 REST audit found the rest on the 0.4.0 development tree:
      `POST /sim/start` answered 409 "Runner is already started.", the
      structural routes did not refuse while the runner ran, and the
      `ExceptionGroup` edge validation raises made `POST /sim/step` a 500.
      Resolved in 0.4.0: the runner records why its thread stopped
      (`RealtimeRunner.error`), the routes read whether it runs from the
      thread, a dead runner is replaced by `/sim/start` and reported by
      `/sim/pause`, `/sim/resume` (409, with the error) and `/sim/stop`;
      adding or removing a node or an edge is a 409 while the runner runs;
      and an `ExceptionGroup` from compiling the graph is a 400 naming each
      error on every route that steps or compiles.
    severity: "major"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      A silent wrong result in the reported status of an operation, graded
      `major` under the rule that a silent wrong result is never minor: the
      routes said a runner was paused, resumed or running when none was.
      The simulation's values were not wrong -- it stopped advancing, which
      any viewer sees, and the thread's exception was logged when it died
      -- so `not_safety_relevant`.
    affected_components:
      - "maddening.api.server.SimulationServer.create_app"
      - "maddening.viz.runner.RealtimeRunner"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: stop the runner before any structural edit, and after a
      runner traceback in the log, `POST /sim/stop` before starting again.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      None known.
    verification:
      - "tests/api/test_runner_pacing_and_status.py::test_a_runner_whose_thread_died_records_why"
      - "tests/api/test_runner_pacing_and_status.py::test_pause_and_resume_of_a_dead_runner_are_409s_saying_why"
      - "tests/api/test_runner_pacing_and_status.py::test_a_dead_runner_is_not_already_started_and_a_new_one_starts"
      - "tests/api/test_runner_pacing_and_status.py::test_a_reset_after_the_runner_died_says_it_was_not_running"
      - "tests/api/test_runner_pacing_and_status.py::test_stop_of_a_dead_runner_reports_it_stopped_and_why"
      - "tests/api/test_runner_pacing_and_status.py::test_a_structural_edit_while_the_runner_runs_is_a_409"
      - "tests/api/test_runner_pacing_and_status.py::test_an_edge_the_graph_cannot_validate_is_a_400_on_every_route_that_steps"
