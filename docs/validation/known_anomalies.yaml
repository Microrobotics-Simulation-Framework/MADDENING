  - anomaly_id: "MADD-ANO-006"
    title: "Non-finite numbers are written as non-standard JSON tokens"
    description: >
      Three serialisers hand a non-finite float to json.dumps with its
      default allow_nan=True, which writes the bare tokens NaN, Infinity
      and -Infinity: GraphManager.to_dict() (a ParamSpec with an infinite
      bound), the USD maddening:paramsJson attribute (a non-finite node
      param), and the FmuTcpBridge JSON wire (a get reply carrying a
      non-finite state value, which a diverged model produces).  Those
      tokens are not JSON.  Python reads them back, and the FMU's C
      wrapper parses them with strtod, so every round trip inside
      MADDENING is exact; any other reader of a saved config, a .usda or
      the documented sidecar protocol rejects the document.

      Two of the three sites are as old as the project: v0.1.0's USD
      writer already called json.dumps with its default allow_nan=True,
      and GraphManager.to_dict has always returned a dict whose caller
      serialises it the same way.  The third, the FMI JSON wire, arrived
      with FmuTcpBridge during the 0.4.0 cycle and was fixed before any
      release carried it.  So the range starts at 0.1.0 because the defect
      was reachable on every release from the first -- not because every
      release was affected on every surface -- and it closes at 0.4.0, the
      release that carries the fix.

      Fixed in 0.4.0.  All three surfaces write a non-finite float as the
      quoted token "NaN", "Infinity" or "-Infinity", through the shared
      maddening.serialization.json_codec.  Quoted tokens rather than a
      tagged object: a pre-0.4.0 document and a 0.4.0 one then differ by
      two characters per value so a config stays diffable, every
      container keeps the shape it had, and the FMU's C wrapper needs two
      lines rather than a JSON parser.  json_codec.dumps also passes
      allow_nan=False, so a value its walk did not reach fails at the
      call site instead of leaving an invalid document behind.  Reading
      stays lenient -- json.loads parses the bare tokens into floats
      itself and the decoder passes a float through -- so a config, stage
      or peer written before 0.4.0 still loads and nothing that was saved
      needs migrating.

      This entry's residual_risk used to say a tagged form "would also
      break the shipped C wrapper, which parses values with strtod and
      would reject a quoted token".  That was wrong about the mechanism,
      and was measured before the fix: C99 strtod parses NaN, Infinity
      and -Infinity case-insensitively, and the quote character was the
      only thing it could not step over.  parse_values now steps over it
      and requires the closing quote, so "1e5xyz" cannot pass as 1e5, and
      the bare form is still accepted.  do_set refuses a non-finite value
      before building a request, so the wrapper never writes one.
    severity: "minor"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      No value is lost or altered inside MADDENING, and the failure in
      another reader is a parse error, not a wrong number: a strict JSON
      parser refuses the document rather than mis-reading it.  The
      relevance is to a downstream product that reads a MADDENING config
      or stage with a non-Python toolchain, or that writes its own
      sidecar client, and that treats a non-finite value as data rather
      than as a fault to be handled.
    affected_components:
      - "maddening.serialization.config.to_dict"
      - "maddening.usd.serialization.save_graph_to_usd"
      - "maddening.fmi.tcp_bridge.FmuTcpBridge"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Before 0.4.0: keep parameters finite -- an infinite ParamSpec
      bound means "no bound", which is also what leaving the bound
      None means, and a
      non-finite parameter value is refused by ParamSpec.check anyway.
      A client reading the sidecar wire in another language should
      negotiate protocol 2 and read values from the binary frames, which
      carry raw float64 and represent every value exactly.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      One ambiguity is closed by construction rather than by encoding.  A
      decoder cannot tell the float NaN from a string that reads "NaN",
      and to_dict has no schema for node params to decode against, so
      encode_non_finite raises on a string leaf equal to one of the three
      tokens rather than writing a document that would read back wrong.
      Two consequences, both narrow: a graph that stored one of those
      three strings as a parameter value used to serialise and now raises
      with the path named (spell the value differently), and a pre-0.4.0
      document that carries such a string reads back as the float.  The
      second is the one migration case with no detection; it needs a
      parameter whose value is exactly "NaN", "Infinity" or "-Infinity".
    verification:
      - "tests/core/test_non_finite_json_tokens.py::test_an_infinite_param_spec_bound_serialises_as_strict_json"
      - "tests/core/test_non_finite_json_tokens.py::test_a_config_written_before_040_still_loads"
      - "tests/core/test_non_finite_json_tokens.py::test_any_tree_dumps_to_a_document_a_strict_parser_accepts"
      - "tests/core/test_non_finite_json_tokens.py::test_a_string_that_collides_with_a_token_is_refused_at_write_time"
      - "tests/usd/test_usd_params.py::test_a_non_finite_param_writes_a_stage_a_strict_reader_accepts"
      - "tests/usd/test_usd_params.py::test_a_stage_written_before_040_still_loads_its_bare_tokens"
      - "tests/fmi/test_non_finite_json_tokens.py::test_a_non_finite_get_reply_is_strict_json"
      - "tests/fmi/test_non_finite_json_tokens.py::test_the_compiled_wrapper_reads_a_diverged_get_over_json"
      - "tests/fmi/test_non_finite_json_tokens.py::test_the_binary_frames_carry_the_same_values_exactly"
    github_issue: null

  - anomaly_id: "MADD-ANO-007"
    title: "HeatNode applies its Dirichlet boundary data at the first cell centre, not at the rod ends it documents"
    description: >
      `HeatNode.boundary_input_spec` documents `left_temperature` as the
      "Dirichlet BC at left end" and `right_temperature` as the BC "at right
      end", and the class docstring says the same.  The implementation writes
      those values into the first and last *cell*, whose centres are at
      x = dx/2 and x = L - dx/2, not at x = 0 and x = L.  A caller who
      supplies T(0, t) and T(L, t), as documented, is imposing the boundary
      value half a cell away from where it belongs, which is an O(dx) error
      in the boundary data and drops the scheme from 2nd order to 1st order
      globally.
      Measured at 0.4.0.dev0 by the Method of Manufactured Solutions on a
      steady manufactured profile (float64, Fourier number 0.4, relaxed to
      steady state).  Supplying the exact solution at the first and last cell
      centre -- what the code implements -- gives observed spatial orders of
      1.847, 1.926, 1.963, 1.982 over a 10/20/40/80/160 ladder, converging on
      the declared 2.  Supplying it at the rod ends -- what the code
      documents -- gives 1.028, 1.009, 1.003, 1.001 and an error of 0.88% at
      160 cells, against 0.0065% for the same ladder under the other reading.
      The pre-existing convergence benchmark MADD-VER-002 measured the same
      first-order rate, but attributed it to the node rather than to the
      boundary convention and accepted any rate between 0.7 and 2.5.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent loss of an order of accuracy.  Nothing fails, warns or looks
      wrong: the simulation runs, the field is smooth, and the error is a
      plausible-looking fraction of a percent.  A downstream product that
      sized its grid from the documented 2nd-order convergence would be
      getting an error that falls only linearly with resolution, so a
      refinement that was expected to give a 4x accuracy gain gives 2x.  The
      relevance depends on whether the downstream product supplies boundary
      data at the rod ends (the documented reading) and on whether its
      accuracy budget was derived from the declared order.
    affected_components:
      - "maddening.nodes.heat.HeatNode.update"
      - "maddening.nodes.heat.HeatNode.boundary_input_spec"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Supply the Dirichlet data at the first and last cell centre rather than
      at the rod ends: evaluate the boundary condition at x = dx/2 and
      x = L - dx/2 with dx = length / n_cells.  For a boundary condition that
      is constant in space near the ends the difference is negligible; for one
      with a gradient it is the whole defect.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The fix changes results for every existing caller, which is why it was
      recorded as a maintainer's call rather than made in the branch that
      measured it.  Neither of the two options considered when this was filed
      was taken: the grid was not moved (every cell coordinate is unchanged)
      and the meaning of the input was not changed (it is still the rod-end
      temperature, as documented).  What changed is the enforcement.  The
      datum is now imposed through the ghost cell -- T_ghost = 2*T_b - T[0],
      the conservative cell-centred closure -- and the first and last cells
      are advanced by the scheme like any other.  Observed spatial order over
      the 10/20/40/80/160 ladder with rod-end data moves from
      1.028/1.009/1.003/1.001 to 2.022/2.006/2.001/2.000, and the error at
      160 cells from 0.88% to 0.0066%.
      What a caller sees change: `T[0]` no longer equals `left_temperature`
      exactly.  It never should have -- it is a cell centre half a cell inside
      the rod -- but code that read the boundary value back out of the state
      array will now read a slightly different number, and code that relied on
      the end cells being frozen when no boundary data was supplied will find
      them evolving under a zero-flux closure instead.  Four assertions in the
      suite encoded the old behaviour and were updated.
      Two knock-on effects were recorded rather than fixed when the datum was
      moved.  The `compute_interface_correction` hook now returns exactly what
      `update` already produced, so applying it is an identity; it is kept
      because the coupling system asks every node with interface DOFs for one.
      The second was `compute_boundary_fluxes`, which still reported the flux
      across the face between the first two cells rather than the flux at the
      rod end: a separate, smaller inconsistency of the same kind.  **That one
      is now also fixed, later in the same release.**  The reported flux is
      reconstructed at the rod end from the Dirichlet datum and the nearest
      `stencil_order` cell centres, and on `T = exp(x)`, alpha = 1, the
      reported left flux at n = 10 moves from -1.10563 (10.6% against the true
      -1.0) to -0.99869 (0.13%), and its refinement order from 1.005 to 2.005
      over 80 -> 160 and 2.002 over 160 -> 320.  In-tree ladders on the
      module's steady profile measure 1.999 at both ends for `stencil_order=2`
      and 3.993 for `stencil_order=4`, so the interface no longer caps a
      flux-coupled solve below the node's own order.
      What remains is the *different* statement, and it is not a defect: the
      reported flux is the physical rod-end flux, not bit-for-bit the
      conservative scheme's own first-cell face flux (the 1st-order
      `-alpha (T[0] - T_b) / (dx/2)`).  The two differ by
      `O(dx**stencil_order)`.  A coupled neighbour needs the physical one.
    verification:
      - "tests/verification/test_mms_order.py::test_heat_second_order_stencil_converges_at_its_declared_spatial_order"
      - "tests/verification/test_mms_order.py::TestHeatBoundaryPlacement::test_a_linear_profile_between_the_rod_ends_is_reproduced_exactly"
      - "tests/verification/test_mms_order.py::TestHeatBoundaryPlacement::test_the_boundary_cell_is_not_pinned_to_the_supplied_value"
      - "tests/verification/test_mms_order.py::TestHeatBoundaryPlacement::test_the_cell_centre_reading_of_the_boundary_data_still_costs_an_order"
      - "tests/verification/test_heat_analytical.py::test_heat_spatial_convergence"
      - "tests/verification/test_mms_order.py::TestTheReportedBoundaryFluxIsAtTheRodEnd::test_the_reported_value_is_the_rod_end_flux_and_not_the_first_face"
      - "tests/verification/test_mms_order.py::TestTheReportedBoundaryFluxIsAtTheRodEnd::test_the_flux_converges_at_the_default_stencils_order"
