  - anomaly_id: "MADD-ANO-094"
    title: "Under Gauss-Seidel the coupling bound's float floor counted the worst node's evaluations, not the chain a pass composes: a stalled 32-relay ring read its spectral bound at 0.51x the true distance with spectral_usable=True"
    description: >
      `spectral_error_bound` adds the residual's float resolution before
      amplifying it: `PRECISION_FLOOR_ULPS` units of `eps * max|field|`
      per entry per evaluation the one-pass map rounds like
      (`_group_evaluations`), which took the largest sub-cycling divider
      times `SimulationNode.update_evaluations()` over the group's nodes,
      on the argument that no node is evaluated more often than that.
      Under `iteration_mode="gauss-seidel"` that is not what bounds the
      rounding: a node reads the output of every member scheduled before
      it from the same pass, already rounded, so the pass is a composition
      and the error at the end of a chain of same-pass reads carries every
      rounding upstream of it.  Measured (jaxlib 0.11.0, CPU, float32) on a
      Gauss-Seidel ring of N scalar relays with loop gain 0.99, every node
      declaring one evaluation, started 0.1% short of its fixed point at
      `tolerance=1e-12` so only the bitwise stall stops it: the exact
      residual at the stall is 0.60, 1.18 and 2.33 per-pass floors at
      N = 16, 32 and 64, and `spectral_error_bound` read 1.44x, 0.51x and
      0.30x the true distance to the exact fixed point with
      `spectral_usable=True` and `rho_spectral` = 0.99 to float32 -- the
      case the docs call a bound (a linear map, a rank-one Jacobian the
      eight Krylov steps resolve exactly, every node declaring its count).
      `gradient_relative_error_bound`, whose distance is the same floored
      bound, read 0.50x the true relative error of the IFT gradient with
      respect to a gain at N = 32, `gradient_bound_usable=True`.  Found by
      the round-3 confirmation audit of the merged 0.4.0 tree.  Resolved
      in 0.4.0: under Gauss-Seidel the count is the longest chain of
      same-pass reads, `depth(n) = d_n e_n + max(depth(m))` over the
      members scheduled before `n` that `n` reads; under Jacobi, where
      every read is of the stored previous iterate, it is still the worst
      node's.  After the fix the same ring reads 23x and 16x over the
      true distance at N = 16 and 32, and the gradient bound 36x and 17x
      over its true error.  Only report keys move -- `spectral_error_bound`,
      `gradient_relative_error_bound` and `precision_limited` on a
      Gauss-Seidel group with a chain of two or more members -- while
      states, iteration counts and `converged` are bit-identical (125
      configurations dumped before and after).
      The round-4 audit of the merged tree found two more ways the count
      read low, both in this cycle's code and both fixed in 0.4.0.  (1)
      Gains: the chain count assumed a read passes a relative rounding on
      at most unchanged.  A squaring relay doubles it with no cancellation
      at all, so a stalled Gauss-Seidel ring of eight squares closed by an
      affine head read `spectral_error_bound` at 0.66x the true distance
      (0.20x at twelve squares) and `gradient_relative_error_bound` at
      0.91x the true error (0.018x at twelve), both flags set.  With
      `diagnostics=True` the step now measures every group-internal read's
      relative gain at the returned state -- one JVP of the reading node's
      update along the source's own state per read -- scales each member's
      own count by `max(1, sum of its reads' gains)`, because a member
      whose terms cancel amplifies its own rounding as well (this is what
      a Jacobi group's count rests on), composes same-pass reads along the
      chain weighted by their gains, never goes below the structural count,
      and writes the count to `_meta` (`coupling_<key>_pass_evaluations`)
      for the report.  Conservative by design: the eight- and twelve-square
      rings now read 56x and 184x over their true distance (1400x at
      fourteen) and their gradient bounds 50x and 430x over; a sum whose
      terms cancel is counted exactly, a product counted as a sum.  (2)
      Live graph: the
      report re-derived the count from the graph as it stood when
      `coupling_diagnostics()` was called, so rebuilding a node with
      another declared count after a step moved the bound of the step that
      had run (17x measured), and a member removed since raised `KeyError`.
      The report now reads the count the step measured, else the
      structural count and internal edges snapshotted at `compile()`, and
      a group a member of which was removed since has no entry.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A bound that reads below the quantity it bounds with its usability
      flag set is a silent wrong result, which is never `minor` under the
      0.4.0 severity definition: a caller trusting `spectral_usable` would
      accept a stalled iterate up to 3x farther from its fixed point than
      the report said, and an IFT gradient twice as wrong.  Registered
      although no release carried it, because it is major.  Not
      `critical`: it needs a long Gauss-Seidel chain (the ratio falls
      below one between 16 and 32 relays) stalled at its float floor, and
      `converged` and the iteration counts, which are what most callers
      read, were never affected.  `context_dependent` because whether a
      distance or gradient bound gates anything is the program's choice.
    affected_components:
      - "maddening.core.graph_manager.GraphManager.coupling_diagnostics"
    affected_versions: "none"
    workaround: >
      Not applicable to a tagged release.  On the affected development
      builds: read the bound of a Gauss-Seidel group whose report says
      `precision_limited=True` as valid only after multiplying it by the
      number of members in its longest chain of same-pass reads, or run
      the group under `iteration_mode="jacobi"`.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The floor remains a model of the map's rounding, not a proof of it.
      The measured gains are first-order, taken at the returned state
      along one direction per read (the source's own state), and only
      with `diagnostics=True`; without diagnostics there is no bound to
      floor, and `precision_limited` uses the structural count.  A node
      that cancels *inside* itself -- a small output computed as the
      difference of two large intermediates it computes rather than reads
      -- can exceed any fixed number of ulps of its output, and nothing
      outside the node can see that.  The measurement costs one JVP of a
      member's update per group-internal read, every step, in its own
      `lax.cond` branch.  It is valid but can be far too loose to use: it
      adds gain magnitudes, so on a mixed-sign Gauss-Seidel chain
      `c_j = 3 c_(j-1) - 2 c_(j-2) + c` of ten links (the coupling-floor
      spike, 80-digit truth) the count is 3.6e5 evaluations and
      `spectral_error_bound` reads about 109 in relative distance, 1.1e7x
      the true distance, with `spectral_usable=True` (4.8e5x at eight
      links).  Sub-cycled groups read 1.5e3x to 9.6e4x over with or
      without the weighting: the structural count takes every sub-step's
      rounding as undamped.  Two tightenings were checked and not taken.
      Composing the measured gains with their signs along the error
      direction actually propagated is a bound entry by entry only, so for
      a vector field it needs the full same-pass Jacobian; mixing signed
      scalar links with absolute ones is not a bound (a signed path can
      cancel against one whose sign was dropped); and on that chain it
      would still read about 3e4x over, because its true floor error is
      under one ulp.  Capping a link by the downstream node's declared
      evaluations where its inputs coincide would cancel a squaring
      relay's real doubling.  The count is
      one number for the whole pass, so the floor is conservative for the
      members near the start of a chain: 16x over the true distance on
      the 32-relay ring.
    verification:
      - "tests/core/test_coupling_gauss_seidel_chain_floor.py::test_both_bounds_hold_on_a_stalled_gauss_seidel_ring_of_32"
      - "tests/core/test_coupling_gauss_seidel_chain_floor.py::test_a_gauss_seidel_ring_rounds_like_its_length"
      - "tests/core/test_coupling_gauss_seidel_chain_floor.py::test_the_count_is_the_longest_chain_not_the_sum"
      - "tests/core/test_coupling_gauss_seidel_chain_floor.py::test_the_report_and_the_step_count_the_same_chain"
      - "tests/property/test_differential_fixed_point.py::test_a_usable_spectral_bound_holds_on_a_long_gauss_seidel_chain"
      - "tests/core/test_coupling_gauss_seidel_gain_weighted_floor.py::test_each_read_is_weighted_by_its_measured_gain"
      - "tests/core/test_coupling_gauss_seidel_gain_weighted_floor.py::test_the_spectral_bound_holds_on_a_stalled_squaring_chain"
      - "tests/core/test_coupling_gauss_seidel_gain_weighted_floor.py::test_the_gradient_bound_holds_on_a_stalled_squaring_chain"
      - "tests/property/test_differential_fixed_point.py::test_a_usable_spectral_bound_holds_on_a_chain_whose_gains_exceed_one"
      - "tests/property/test_differential_fixed_point.py::test_a_usable_spectral_bound_holds_on_a_signed_chain_whose_terms_cancel"
      - "tests/core/test_coupling_report_follows_the_group_that_ran.py::test_rebuilding_a_member_before_the_next_step_leaves_the_report_alone"
      - "tests/core/test_coupling_report_follows_the_group_that_ran.py::test_a_member_removed_since_the_step_takes_the_report_with_it"
