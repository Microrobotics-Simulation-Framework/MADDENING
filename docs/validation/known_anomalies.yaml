  - anomaly_id: "MADD-ANO-018"
    title: "A calibrated params value reaches update() and cannot reach derivatives(), implicit_residual() or integrate_node()"
    description: >
      0.4.0 added the graph parameter pytree: node constants become traced
      inputs, `gm.params` carries them, `maddening.sysid.fit` and its
      siblings produce them, and a node opts in with
      `update(..., *, params=None)` and the `{**self.params, **params}`
      rule.  Three of a node's entry points took the new argument and two
      did not.  `SimulationNode.compute_interface_correction`
      (`core/node.py`) takes `params` and its docstring states the
      contract -- "A node that takes `params` in `update()` must take it
      here too (same `{**self.params, **params}` rule)".
      `SimulationNode.derivatives` and `SimulationNode.implicit_residual`
      take no `params` at all, so an implementation has nothing to read
      but `self.params`, the values the node was constructed with.  Every
      in-tree `implicit_residual` builds its residual by calling
      `self.derivatives(...)`, so it inherits the limitation whole.
      This is reachable through public API, and not only by a caller
      reaching past one.  `integrate_node(node, state, boundary_inputs,
      dt, method=...)` (`core/simulation/integrators.py`) is documented,
      exported and takes no `params` either; it hands `node.derivatives`
      straight to the chosen stepper.  `implicit_euler_step`
      (`core/simulation/implicit.py`) reaches it one step further out:
      it takes a callable, but its own docstring documents that callable
      as "the node's `implicit_residual` method", and that method is the
      one with no `params`.  So the gap is not "the caller forgot to pass
      it" but "there is no argument to pass": a user who has calibrated a
      parameter has no way to make these paths use it short of
      reconstructing the node.  The bare steppers `euler_step`,
      `heun_step` and `rk4_step` are not listed below: they take an
      arbitrary derivative function and are not node-aware, so a caller
      who wants calibrated values can close over them.
      Measured at 0.4.0.dev0 on `SpringDamperNode` with constructor
      stiffness 100 against a calibrated 400, from one state
      (position 2.0, velocity 0.0, rest_length 1.0, dt 0.01):
      `update(params=fitted)` gives velocity -4.0; `update()` without
      params, `euler_step(node.derivatives, ...)`,
      `integrate_node(method="euler")` all give -1.0, and
      `implicit_euler_step` gives -0.980.  `HeatNode` with a calibrated
      `thermal_diffusivity` of 0.5 against a constructor 0.01 diverges
      the same way.  The factor between the two answers is exactly the
      factor between the two stiffnesses: the calibration is not
      attenuated, it is discarded.
      Not a regression in the older sense: before 0.4.0 there was no way
      to inject a value at all, and `update` and `derivatives` both read
      `self.params`, so the two agreed.  The divergence is the cost of
      migrating one of them.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Graded `major` rather than `minor` because the defect produces a
      wrong number on a documented public path with nothing to indicate
      it: no exception, no warning, no NaN, and a trajectory that stays
      smooth and finite.  The error is not a small bias but the whole
      calibration -- the measured answers differ by the full ratio of the
      two stiffnesses -- and the 0.4.0 release ships the machinery
      (`gm.params`, `ParamSpec`, `fit`, `fit_lm`,
      `fit_multiple_shooting`) whose entire purpose is producing the
      value that is then dropped.  Not `critical`: there is a complete
      workaround, nothing crashes or corrupts state, and the defect is
      inert for any caller who never injects params.
      Graded `context_dependent` rather than `safety_relevant` because
      MADDENING is a general simulation library and the defect needs two
      user choices at once to bite -- calibrating a parameter through
      `gm.params`, and then integrating through a `derivatives()`-based
      path instead of `update()`.  Whether a program does both is a
      property of that program and not of this library, and no in-tree
      caller does.  What raises it above `not_safety_relevant` is the
      shape rather than the frequency: the two answers come from *one
      node object*, so a user who validates a calibration through
      `update()` -- the natural way to check a fit -- and then runs
      production through `integrate_node` or an implicit solve sees the
      validation pass and the run use different physics, with the
      library reporting no disagreement at any point.  A caller whose
      analysis depends on a fitted parameter having taken effect cannot
      establish that from anything the library returns.
    affected_components:
      - "maddening.core.node.SimulationNode.derivatives"
      - "maddening.core.node.SimulationNode.implicit_residual"
      - "maddening.core.simulation.integrators.integrate_node"
      - "maddening.core.simulation.implicit.implicit_euler_step"
    affected_versions: "none"
    workaround: >
      None needed from 0.4.0: pass the node's `gm.params` entry as
      `integrate_node(node, state, boundary_inputs, dt, params=...)` or
      `implicit_euler_step(node.implicit_residual, ..., params=...)`, or
      bind it yourself with `functools.partial(node.derivatives,
      params=...)` for the bare steppers.  On a 0.4.0.dev0 build before
      the fix: drive the node through `update(..., params=...)`, which
      honoured the injected values, or reconstruct the node with the
      calibrated values as constructor arguments before integrating it,
      so `self.params` already holds them.  Both were exact rather than
      approximations: the limitation was in how the value was delivered,
      not in the arithmetic.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Resolved by threading `*, params=None` through
      `SimulationNode.derivatives` and `SimulationNode.implicit_residual`
      with the same `{**self.params, **params}` rule `update` uses;
      through every in-tree override (six: `BallNode`,
      `SpringDamperNode`, `HeatNode`, `RigidBodyNode`, `HeartPumpNode`,
      and `LBMNode`'s not-applicable stub); and through
      `integrate_node(..., params=)` and `implicit_euler_step(...,
      params=)`, which bind it onto the method with `functools.partial`
      before handing it to the stepper or the Newton loop.  Measured
      after the fix on the same spring and state:
      `integrate_node(method="euler", params=fitted)` gives -4.0, equal
      to `update(params=fitted)`; the implicit solve with `params=fitted`
      gives -3.8095, equal to a node constructed with the calibrated
      stiffness; `HeatNode` agrees the same way (8.984 on both paths);
      and with no `params` every path still gives the constructor's
      answer, unchanged.  The gradient of both solves with respect to
      the injected stiffness is finite and non-zero.
      What replaced the silence is a refusal.  A non-empty `params` for a
      node whose override has no `params` keyword is a `ValueError`
      naming the class and the method; `None` and `{}` call the old
      two-argument shape, so an override that predates the keyword keeps
      working for every caller that passes nothing.
      `SimulationNode.accepts_params(method=...)` is the probe the
      integrators use.  `verify_node`'s `params_effective` now also
      differentiates `derivatives()` and `implicit_residual()` with
      respect to the injected leaves, and separates a constant a path
      does not consume (a bouncing ball's `elasticity` has no place in
      the collision-free right-hand side) from one it consumes from
      `self.params` while ignoring the injected value, by varying the
      constructor value in place and restoring it; the second is a FAIL
      naming the method, and so is an override without the keyword.
      What remains, and why it is a boundary of the fix rather than a
      remaining instance of the defect.  (1) The bare steppers
      `euler_step`, `heun_step` and `rk4_step` take a callable and know
      nothing of params, by design, as the original entry already said;
      a caller composing a derivative function closes over the constants
      it wants.  (2) A subclass that overrides `derivatives` without the
      keyword but inherits an in-tree `implicit_residual` gets the same
      `ValueError`, naming the class and the method, when params are
      passed -- whether it calls `implicit_residual(..., params=)` itself
      or goes through `implicit_euler_step(..., params=)` -- because every
      in-tree `implicit_residual` (`HeartPumpNode`, `HeatNode`,
      `RigidBodyNode`, `SpringDamperNode`) reaches `derivatives` through
      the shared binder.  An earlier revision said such a subclass got
      Python's own `TypeError` from the forwarded keyword; that described
      the code before the binder was shared and is withdrawn, so this item
      is closed rather than a boundary.  (3)
      The `params_effective` probe cannot see a constant a path consumes
      through an attribute derived from it at construction time, because
      varying `self.params` does not move such an attribute; a leaf that
      is not a constructor entry cannot be probed and fails closed.  (4)
      `HybridNode` and the sharded wrappers do not implement
      `derivatives` and raise `NotImplementedError` from the integrators,
      as before.  No tagged release carried the defect: it was introduced
      and resolved between 0.3.1 and 0.4.0.
    verification:
      - "tests/core/test_params_reaching_solver_paths.py::test_explicit_paths_reach_the_calibrated_stiffness_exactly"
      - "tests/core/test_params_reaching_solver_paths.py::test_integrate_node_moves_by_the_whole_calibration_for_every_method"
      - "tests/core/test_params_reaching_solver_paths.py::test_the_implicit_solve_reaches_the_calibrated_stiffness"
      - "tests/core/test_params_reaching_solver_paths.py::test_the_two_paths_of_one_node_agree_on_the_same_params"
      - "tests/core/test_params_reaching_solver_paths.py::test_no_params_still_integrates_the_constructor_constants"
      - "tests/core/test_params_reaching_solver_paths.py::test_the_gradient_with_respect_to_the_injected_stiffness_reaches_both_solvers"
      - "tests/core/test_params_reaching_solver_paths.py::test_integrate_node_refuses_params_for_a_legacy_derivatives_override"
      - "tests/core/test_params_reaching_solver_paths.py::test_implicit_euler_step_refuses_params_for_a_legacy_residual_override"
      - "tests/core/test_params_reaching_solver_paths.py::test_every_in_tree_override_takes_the_params_keyword"
      - "tests/verification/test_verify_node_harness.py::test_derivatives_that_ignore_the_injected_params_are_caught"
      - "tests/verification/test_verify_node_harness.py::test_a_legacy_derivatives_signature_is_caught"
