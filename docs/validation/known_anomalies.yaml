  - anomaly_id: "MADD-ANO-007"
    title: "HeatNode applies its Dirichlet boundary data at the first cell centre, not at the rod ends it documents"
    description: >
      `HeatNode.boundary_input_spec` documents `left_temperature` as the
      "Dirichlet BC at left end" and `right_temperature` as the BC "at right
      end", and the class docstring says the same.  The implementation writes
      those values into the first and last *cell*, whose centres are at
      x = dx/2 and x = L - dx/2, not at x = 0 and x = L.  A caller who
      supplies T(0, t) and T(L, t), as documented, is imposing the boundary
      value half a cell away from where it belongs, which is an O(dx) error
      in the boundary data and drops the scheme from 2nd order to 1st order
      globally.
      Measured at 0.4.0.dev0 by the Method of Manufactured Solutions on a
      steady manufactured profile (float64, Fourier number 0.4, relaxed to
      steady state).  Supplying the exact solution at the first and last cell
      centre -- what the code implements -- gives observed spatial orders of
      1.847, 1.926, 1.963, 1.982 over a 10/20/40/80/160 ladder, converging on
      the declared 2.  Supplying it at the rod ends -- what the code
      documents -- gives 1.028, 1.009, 1.003, 1.001 and an error of 0.88% at
      160 cells, against 0.0065% for the same ladder under the other reading.
      The pre-existing convergence benchmark MADD-VER-002 measured the same
      first-order rate, but attributed it to the node rather than to the
      boundary convention and accepted any rate between 0.7 and 2.5.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent loss of an order of accuracy.  Nothing fails, warns or looks
      wrong: the simulation runs, the field is smooth, and the error is a
      plausible-looking fraction of a percent.  A downstream product that
      sized its grid from the documented 2nd-order convergence would be
      getting an error that falls only linearly with resolution, so a
      refinement that was expected to give a 4x accuracy gain gives 2x.  The
      relevance depends on whether the downstream product supplies boundary
      data at the rod ends (the documented reading) and on whether its
      accuracy budget was derived from the declared order.
    affected_components:
      - "maddening.nodes.heat.HeatNode.update"
      - "maddening.nodes.heat.HeatNode.boundary_input_spec"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Supply the Dirichlet data at the first and last cell centre rather than
      at the rod ends: evaluate the boundary condition at x = dx/2 and
      x = L - dx/2 with dx = length / n_cells.  For a boundary condition that
      is constant in space near the ends the difference is negligible; for one
      with a gradient it is the whole defect.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The fix changes results for every existing caller, which is why it was
      recorded as a maintainer's call rather than made in the branch that
      measured it.  Neither of the two options considered when this was filed
      was taken: the grid was not moved (every cell coordinate is unchanged)
      and the meaning of the input was not changed (it is still the rod-end
      temperature, as documented).  What changed is the enforcement.  The
      datum is now imposed through the ghost cell -- T_ghost = 2*T_b - T[0],
      the conservative cell-centred closure -- and the first and last cells
      are advanced by the scheme like any other.  Observed spatial order over
      the 10/20/40/80/160 ladder with rod-end data moves from
      1.028/1.009/1.003/1.001 to 2.022/2.006/2.001/2.000, and the error at
      160 cells from 0.88% to 0.0066%.
      What a caller sees change: `T[0]` no longer equals `left_temperature`
      exactly.  It never should have -- it is a cell centre half a cell inside
      the rod -- but code that read the boundary value back out of the state
      array will now read a slightly different number, and code that relied on
      the end cells being frozen when no boundary data was supplied will find
      them evolving under a zero-flux closure instead.  Four assertions in the
      suite encoded the old behaviour and were updated.
      Two knock-on effects were recorded rather than fixed when the datum was
      moved.  The `compute_interface_correction` hook now returns exactly what
      `update` already produced, so applying it is an identity; it is kept
      because the coupling system asks every node with interface DOFs for one.
      The second was `compute_boundary_fluxes`, which still reported the flux
      across the face between the first two cells rather than the flux at the
      rod end: a separate, smaller inconsistency of the same kind.  **That one
      is now also fixed, later in the same release.**  The reported flux is
      reconstructed at the rod end from the Dirichlet datum and the nearest
      `stencil_order` cell centres, and on `T = exp(x)`, alpha = 1, the
      reported left flux at n = 10 moves from -1.10563 (10.6% against the true
      -1.0) to -0.99869 (0.13%), and its refinement order from 1.005 to 2.005
      over 80 -> 160 and 2.002 over 160 -> 320.  In-tree ladders on the
      module's steady profile measure 1.999 at both ends for `stencil_order=2`
      and 3.993 for `stencil_order=4`, so the interface no longer caps a
      flux-coupled solve below the node's own order.
      What remains is the *different* statement, and it is not a defect: the
      reported flux is the physical rod-end flux, not bit-for-bit the
      conservative scheme's own first-cell face flux (the 1st-order
      `-alpha (T[0] - T_b) / (dx/2)`).  The two differ by
      `O(dx**stencil_order)`.  A coupled neighbour needs the physical one.
    verification:
      - "tests/verification/test_mms_order.py::test_heat_second_order_stencil_converges_at_its_declared_spatial_order"
      - "tests/verification/test_mms_order.py::TestHeatBoundaryPlacement::test_a_linear_profile_between_the_rod_ends_is_reproduced_exactly"
      - "tests/verification/test_mms_order.py::TestHeatBoundaryPlacement::test_the_boundary_cell_is_not_pinned_to_the_supplied_value"
      - "tests/verification/test_mms_order.py::TestHeatBoundaryPlacement::test_the_cell_centre_reading_of_the_boundary_data_still_costs_an_order"
      - "tests/verification/test_heat_analytical.py::test_heat_spatial_convergence"
      - "tests/verification/test_mms_order.py::TestTheReportedBoundaryFluxIsAtTheRodEnd::test_the_reported_value_is_the_rod_end_flux_and_not_the_first_face"
      - "tests/verification/test_mms_order.py::TestTheReportedBoundaryFluxIsAtTheRodEnd::test_the_flux_converges_at_the_default_stencils_order"
    github_issue: null

  - anomaly_id: "MADD-ANO-008"
    title: "HeatNode's 4th-order stencil converges at 1st order and is less accurate than the 2nd-order one"
    description: >
      `HeatNode(stencil_order=4)` is documented as a 4th-order central
      difference and declares `DiscretizationOrder(spatial=4.0)`.  It
      converges at order 1.
      The 5-point stencil needs the two ghost values at x = -dx and x = -2dx
      (and their mirrors).  `_compute_laplacian` builds them as
      `ghost_left_1 = T_left` and `ghost_left_2 = 2*T_left - T[1]`, which are
      the value *at* the boundary cell and a linear extrapolation to one cell
      beyond it -- both shifted one cell inwards from the positions the
      stencil reads them at.  The resulting local truncation error at the
      first interior cell is O(1/dx) rather than O(dx^4), and the global error
      is O(dx).  The two boundary cells themselves are overwritten with the
      Dirichlet data afterwards, which is why the defect is invisible there.
      Measured at 0.4.0.dev0 by the Method of Manufactured Solutions (float64,
      Fourier number 0.3, steady manufactured profile relaxed to steady
      state): observed spatial orders 0.717, 0.896, 0.954 over a 10/20/40/80
      ladder.  At 80 cells the error is 2.65e-3, against 2.56e-4 for the
      default 2nd-order stencil on the same problem -- the "4th-order" option
      is 10x *less* accurate, and the gap widens with refinement.  Replacing
      only the two ghost values with the exact solution at x = -dx and x =
      -2dx, changing nothing else, restores observed orders of 3.775, 5.021,
      4.792, which locates the defect in the ghost construction alone.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A user selects `stencil_order=4` to buy accuracy and receives less than
      the default gives, with no error, no warning and a result that looks
      converged.  As with MADD-ANO-007 the failure is silent and the output
      plausible.  The relevance depends on whether the downstream product uses
      the 4th-order option and on whether its accuracy budget was derived from
      the declared order.
    affected_components:
      - "maddening.nodes.heat.HeatNode.update"
      - "maddening.nodes.heat._laplacian_4th_order_uniform"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      Use the default `stencil_order=2`, which meets its declared 2nd order
      and is more accurate at every resolution measured.  The sharded path
      (`update_padded`, via `ShardedStencilNode`) is not affected in the
      interior: it takes real halo values from the neighbouring shard rather
      than constructing ghosts, so only the global domain boundary is at risk.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Two details of the diagnosis above did not survive being re-derived
      before the fix was written, and are corrected here because the entry is
      cited as evidence.  The grid is cell centred, so the ghosts sit at
      x = -dx/2 and x = -3dx/2, not at the x = -dx and x = -2dx this entry
      named; and the oracle experiment -- substituting the exact solution at
      the ghost positions -- restores observed orders of 3.759/3.898/3.954,
      converging cleanly on 4, not the 3.775/5.021/4.792 recorded.  Repeating
      that oracle at the positions this entry named restores nothing at all
      (0.762/0.888/0.950), which is what exposed the discrepancy.  The
      conclusion the entry drew -- that the defect is in the ghost
      construction alone -- is the part that held, and it is what the fix was
      built on.
      The fix builds both ghosts by cubic extrapolation through the rod end
      and the three nearest cell centres.  A cubic is the lowest degree that
      works: the 5-point stencil divides ghost errors by 12*dx^2, so a
      lower-degree extrapolation leaves a truncation error at the first
      interior cells that the conservative form can only partly absorb.
      Measured on three manufactured solutions, linear extrapolation caps the
      scheme at 2.00 and quadratic at 2.99; a quartic is accurate enough but
      spectrally unstable, with a Fourier bound of 0.273.  Observed orders for
      the cubic over a 10/20/40/80/160 ladder are 3.760/3.831/3.913/3.957 and
      the error at 80 cells falls from 2.65e-3 to 2.03e-7, so the 4th-order
      option is now 1260x *more* accurate than the default rather than 10x
      less.
      One caveat on that evidence, because it nearly took the fix in the wrong
      direction.  The boundary rows' leading truncation error is proportional
      to u'' at the rod end, so a manufactured solution flat there cannot
      distinguish a correct boundary closure from a wrong one.  The profile
      the MMS study used when this anomaly was filed,
      sin(2*pi*x/L) + 0.5x + 1, has u'' = 0 at both ends exactly, and on it
      linear extrapolation -- a genuinely 2nd-order closure -- measures
      4.357/4.257/4.150/4.080 and passes a band centred on 4.  The study now
      carries a quadratic term that supplies the missing curvature, and
      tests/verification/test_mms_order.py::TestTheSteadyProfileCanSeeABrokenScheme
      pins that property so the ladder cannot be disarmed again.  Every order
      quoted above is measured on the corrected profile and cross-checked on
      exp(x)*cos(3x) + 2 and 1/(1.3 + x).
      Two consequences worth recording.  Under the cubic closure the 5-point
      and 3-point forms are algebraically identical at cells 0 and n-1, so the
      2nd-order fallback that this node has always applied there now costs
      nothing; it used to cost an order.  And the closure tightens the
      stability bound -- see MADD-ANO-009.
    verification:
      - "tests/verification/test_mms_order.py::test_heat_fourth_order_stencil_converges_at_its_declared_spatial_order"
      - "tests/verification/test_mms_order.py::test_the_fourth_order_stencil_beats_the_second_order_one"
      - "tests/verification/test_mms_order.py::TestHeatStencilGhosts::test_the_laplacian_is_exact_on_a_cubic_for_the_fourth_order_stencil"
    github_issue: null

  - anomaly_id: "MADD-ANO-009"
    title: "HeatNode's documented CFL limit is the 2nd-order stencil's; the 4th-order stencil diverges below it"
    description: >
      `HeatNode.meta.limitations`, its `validated_regimes` entry for CFL and
      MADD-ANO-002 all give the stability limit as dt < dx^2 / (2*alpha), a
      Fourier number of 0.5, without qualification.  That is the bound for the
      3-point stencil.  The 5-point 4th-order stencil is stable only up to a
      Fourier number of 3/8.
      Measured before the fix, on a 20-cell rod, alpha = 1.0, length 1.0, with
      `stencil_order=4`: Fo = 0.37 converged normally and Fo = 0.40 -- inside
      the documented limit of 0.5 -- diverged to a non-finite field with no
      warning.  The failure mode is the one MADD-ANO-002 already describes;
      what this entry records is that the stated bound was wrong for one of
      the two stencils, so following the documentation was not sufficient to
      avoid it.
      Neither of those two constructions exists at 0.4.0: the constructor
      refuses both, because both are above `MAX_FOURIER_NUMBER[4]` = 5/16 =
      0.3125, each raising ValueError naming its Fourier number (0.37, 0.4)
      and the limit.  Re-running the measurement against this version
      therefore shows the refusal rather than the divergence, which is the
      fix; the figures above are a record of the defect, not a reproducer.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      The consequence is MADD-ANO-002's, and inherits its rationale: an
      unstable timestep produces incorrect results with no indication of
      error.  What this entry adds is that the documented safe region is
      itself unsafe for `stencil_order=4`, so a caller who honours the
      published limit is not protected.  Graded `major`, as MADD-ANO-002
      is: the field passes through finite wrong values before it reaches
      non-finite ones, and the library says nothing at any point.  (It was
      `minor` until the 0.4.0 severity definition, on the argument that
      non-finite values are loud in a downstream finiteness check; the
      definition counts a result as silent when the library raises and
      warns nothing, whoever else might notice.)
    affected_components:
      - "maddening.nodes.heat.HeatNode"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      No longer needed: the constructor refuses a configuration above its
      stencil's limit.  On 0.3.x and earlier, with `stencil_order=4`, keep
      timestep * thermal_diffusivity / dx**2 below 0.375 (dx = length /
      n_cells), not the documented 0.5.  The default `stencil_order=2` is
      unaffected.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Fixed as documentation *and* as a runtime check, because documentation
      alone had already been tried and had failed in exactly this way: the
      published bound was wrong, so a caller who honoured it was not
      protected, and the consequence was a silent divergence to NaN rather
      than a degraded answer.  A limit that can only be honoured by reading a
      document, where the document was wrong, is not a control.
      The number moved again during the fix.  3/8 is the bound of the bare
      5-point symbol; the cubic boundary closure that resolves MADD-ANO-008
      raises the spectral radius of the whole operator and brings the sharp
      bound down to 0.3169 at n_cells = 5, rising monotonically to 0.3249 as
      n_cells grows.  `maddening.nodes.heat.MAX_FOURIER_NUMBER` records 5/16
      = 0.3125, which is below all of them, so one number is safe at every
      resolution the node accepts.  For `stencil_order=2` the mirror closure
      is exact on the operator's eigenvectors and the bound is exactly 1/2,
      unchanged.
      What the check does not cover, and this is the whole of the residual
      risk: it sees the constructor's `timestep`, `thermal_diffusivity` and
      `length` only.  A `dt` handed to `update()`, and a `thermal_diffusivity`
      or `length` moved by a calibration run -- both are trainable -- bypass
      it entirely, and cannot be checked inside a traced step without a host
      callback.  MADD-ANO-002 stays open for that reason and is the right
      place to read about it.  Until the release-record audit of 0.4.0 the
      check was also skipped for a non-uniform grid, where `dx` is not a
      single number.  It now applies there too, as `dt * alpha / min(h_L *
      h_R) <= 1/2` (see MADD-ANO-002).
    verification:
      - "tests/verification/test_mms_order.py::TestHeatStabilityBound::test_the_fourth_order_stencil_is_stable_up_to_five_sixteenths"
      - "tests/verification/test_mms_order.py::TestHeatStabilityBound::test_the_fourth_order_limit_is_below_the_three_eighths_of_its_symbol"
      - "tests/verification/test_mms_order.py::TestHeatStabilityBound::test_the_constructor_refuses_an_unstable_configuration"
      - "tests/verification/test_mms_order.py::TestHeatStabilityBound::test_a_stable_configuration_is_accepted"
    github_issue: null

  - anomaly_id: "MADD-ANO-010"
    title: "A string spelling a non-finite token is refused by the JSON serialisers"
    description: >
      Since 0.4.0 a non-finite float is written as the quoted token
      "NaN", "Infinity" or "-Infinity" (MADD-ANO-006), and the decoder
      turns those three strings back into floats wherever it meets them,
      because GraphManager.to_dict has no schema for node params to
      decode against.  A *string* leaf that happens to spell one of the
      three is therefore ambiguous, and encode_non_finite refuses to
      write it: saving a graph with a node named "NaN", or a string
      parameter whose value is exactly "Infinity", raises ValueError
      naming the path instead of producing a document that would read
      back as a float.

      The refusal is on every surface that shares the codec:
      GraphManager.to_dict, the USD JSON attributes written by
      save_graph_to_usd, and the FMI JSON wire helpers send_message and
      encode_binary.  Since 0.4.0 it is also on GraphManager.add_node, so
      for node names the check is on the constructor rather than on each
      writer: the three surfaces used to disagree, and a .usda naming a
      node "NaN" round-tripped into a graph that to_dict would not write.
      On the wire one reply the bridge itself builds does carry free text:
      the hello reply echoes the FMU's model_name.  Until 0.4.0 an FMU
      named exactly "NaN", "Infinity" or "-Infinity" therefore made every
      connection's first reply unencodable, and the ValueError ended the
      connection's worker thread.  build_model_description now refuses
      such a model_name, and _serve_conn_inner answers *any* unencodable
      reply with a plain-ASCII error reply rather than losing the
      connection, so the protocol keeps its promise to answer every
      request.  A third-party client that puts its own strings in a binary
      header can still reach the refusal on the request side, and a
      property test drawing arbitrary headers does.

      The alternative encoding, a tagged object such as
      {"__nonfinite__": "Infinity"}, does not remove the ambiguity.  A
      user dict of exactly that shape decodes to a float in the same
      way; it just does so silently on read instead of loudly on write,
      and it costs the FMU's C wrapper a nested-object parser where the
      quoted token costs eight lines (the wrapper has no JSON parser at
      all -- it is strstr and strtod).  The loud narrow failure was
      chosen over the quiet rarer one.
    severity: "minor"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      The refusal is a fail-stop at write time that names the path to
      the offending value, so no wrong number reaches a document and
      nothing is lost silently.  On the FMI wire that holds only because
      the bridge turns an unencodable reply into an error reply naming
      the path (0.4.0): the refusal itself unwinds inside a daemon thread
      whose caller is a C wrapper on the far end of a socket, so a bare
      fail-stop there would be an EOF and a traceback on the bridge's
      stderr, not a message to anyone who can act.  What the refusal
      carries is an availability risk, not a correctness one.  It is context-dependent because the write
      it can stop is the one a diverged run most wants to make: a
      product that serialises a graph on a fault path, and whose node
      names or string parameters come from field or operator data rather
      than being fixed in code, can have that save fail at exactly the
      moment the state was worth recording.  Such a product should
      validate names and string parameters against the three tokens
      where they are accepted, not where they are saved, so the refusal
      lands on data entry rather than on the fault path.
    affected_components:
      - "maddening.serialization.json_codec.encode_non_finite"
      - "maddening.core.graph_manager.GraphManager.to_dict"
      - "maddening.core.graph_manager.GraphManager.add_node"
      - "maddening.usd.serialization.save_graph_to_usd"
      - "maddening.fmi.tcp_bridge.encode_binary"
      - "maddening.fmi.model_description.build_model_description"
    affected_versions: ">=0.4.0.dev0"
    workaround: >
      Spell the value differently.  The refusal names the path, and
      every other spelling -- "nan", "inf", "+Infinity", "NaN " -- is
      stored and read back as the string it is, because both the
      refusal and the decode are exact matches.  A node name is under
      the same rule, but from 0.4.0 it no longer needs this advice: the
      name is refused by add_node, where it is set, so the failure lands
      on data entry rather than on the save.  The same is true of an FMU
      model_name, which build_model_description refuses.  A client that
      needs to put arbitrary text on the FMI wire should send it
      base64-encoded, as set_state already does.
    resolution_status: "open"
    residual_risk: >
      Reading carries the mirror of the same ambiguity with no refusal
      available to it: a document written before 0.4.0 whose parameter
      value is the string "NaN" reads back as the float, because the
      decoder cannot tell it from the token this version writes.  That
      case belongs to MADD-ANO-006, the change that created it, and is
      recorded there; it is undetectable rather than merely unfixed.
      Refusing at write time is what keeps the set of ambiguous
      documents closed at the documents older MADDENING wrote.
    verification:
      - "tests/core/test_non_finite_json_tokens.py::test_a_string_that_collides_with_a_token_is_refused_at_write_time"
      - "tests/fmi/test_binary_frames_properties.py::test_a_header_string_spelling_a_non_finite_token_is_refused"
      - "tests/fmi/test_binary_frames_properties.py::test_a_header_string_that_only_looks_like_a_token_stays_a_string"
      - "tests/fmi/test_non_finite_json_tokens.py::test_a_model_name_spelling_a_non_finite_token_is_refused_at_build_time"
      - "tests/fmi/test_non_finite_json_tokens.py::test_a_reply_that_cannot_be_encoded_is_an_error_reply_not_a_dead_worker"
      - "tests/fmi/test_non_finite_json_tokens.py::test_the_importer_is_told_which_string_broke_the_hello"
      - "tests/core/test_non_finite_json_tokens.py::test_a_node_name_spelling_a_token_is_refused_where_names_are_accepted"
      - "tests/usd/test_usd_params.py::test_a_stage_carrying_a_token_spelled_node_name_is_refused_on_load"
      - "tests/core/test_non_finite_json_tokens.py::test_encoding_twice_is_refused_rather_than_being_idempotent"
    github_issue: null

  - anomaly_id: "MADD-ANO-015"
    title: "The ZeroMQ transports bound every interface with no authentication or encryption"
    description: >
      From v0.1.0 to v0.3.1 every ZeroMQ endpoint in MADDENING was bound
      to a wildcard address and spoke cleartext to anyone who connected.
      NetworkRelay defaulted to "tcp://*:5555" and published the full
      simulation state dict as JSON; CommandPublisher defaulted to
      "tcp://*:5556" and published external_inputs, which the paired
      CommandReceiver hands straight to GraphManager.step(external_inputs=)
      -- the documented example payload is joint torques.  Both receivers
      subscribe with SUBSCRIBE "", so any peer that could reach the port
      received everything.  Coordinator bound "tcp://0.0.0.0:{port}"
      unconditionally and acted on any well-formed JSON frame.

      The exposure was not theoretical.  cloud/_skypilot.py's launch_vm
      ran "docker run --gpus all -p 8000:8000 -p 8080:8080 -p 5555:5555
      -p 5556:5556" with those four ports hard-coded, ignoring
      JobConfig.ports entirely, so every CloudSession launch published
      the state stream and the command channel on the VM's public
      interface -- and the v0.4.0 change that emptied JobConfig.ports
      did not reach this path.  For the coordinator, cloud/group.py
      forces coordinator_port into config.ports, and the shipped
      multi-VM example passes ports=[8000, 5580, 5555, 5556] and then
      resolves the provider's public mapping for 5580, so the ROUTER
      was reachable across the internet by design.

      The coordinator case is worse than message injection.  An accepted
      "register" frame is stored verbatim and its "address" and
      "zmq_ports" fields are used by build_topology to compute the peer
      endpoint that *other* workers are told to SUB-connect to, so one
      unauthenticated frame could redirect a victim worker's data plane
      at a publisher the attacker controls, feeding fabricated tensor
      data into the coupled simulation.  Registrations also overwrite by
      subgraph_id and count toward the readiness quorum, so a spoofed
      one can make the coordinator declare READY before the real worker
      exists.

      A signed envelope would not have fixed the two PUB sockets.  A
      signature establishes who sent a frame; the exposure there is
      disclosure, and only encryption addresses that.
    severity: "critical"
    safety_relevance: "safety_relevant"
    safety_relevance_rationale: >
      The command channel is an actuation path.  CommandReceiver's output
      goes to GraphManager.step(external_inputs=) without further
      checking, and the interface is documented with joint torques, so a
      product that drives hardware from a MADDENING graph over this
      transport had an unauthenticated remote write to its control
      inputs: anyone who could reach port 5556 could command the
      mechanism, and anyone who could reach 5555 could read its full
      state to aim that command.  The coordinator path reaches the same
      place by a longer route, substituting attacker-chosen values for a
      coupled subgraph's inputs.  This is a loss of both integrity and
      confidentiality on a control surface, which is the combination
      IEC 62304 5.7 and MDCG 2019-16 treat as safety relevant regardless
      of whether a specific deployment was reached.
    affected_components:
      - "maddening.viz.network.NetworkRelay"
      - "maddening.viz.network.NetworkReceiver"
      - "maddening.viz.network.CommandPublisher"
      - "maddening.viz.network.CommandReceiver"
      - "maddening.cloud.multigpu.coordinator.Coordinator"
      - "maddening.cloud.multigpu.worker_client.WorkerClient"
      - "maddening.cloud._skypilot.launch_vm"
    affected_versions: ">=0.1.0, <0.4.0"
    workaround: >
      On v0.3.1 and earlier: never pass a wildcard address.  Construct
      NetworkRelay and CommandPublisher with "tcp://127.0.0.1:<port>"
      and reach them over an SSH tunnel
      ("ssh -L 5555:127.0.0.1:5555 <host>"), which is what the shipped
      examples' own tunnel recipe assumes.  The coordinator has no such
      option before v0.4.0 -- its bind is hard-coded -- so keep its port
      out of JobConfig.ports and out of the provider firewall, and run
      multi-job rendezvous only across a private network.  Do not rely
      on the container's port list: launch_vm published 5555 and 5556
      whatever JobConfig.ports said.
    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      The fix keys CURVE off a single shared token, so every holder can
      derive both keypairs: an authorised subscriber could also publish,
      and the transport does not distinguish among token holders.  That
      matches the trust model of the bearer token it reuses, but a
      deployment that needs mutually distrusting clients needs per-peer
      keys, which this does not provide.  There is no forward secrecy:
      a recorded session is readable if the token later leaks.  On the
      CloudSession launch path a token is always present, so a published
      ZeroMQ port starts encrypted rather than refusing to start.
      CloudSession always holds an API token: the MADDENING_API_TOKEN of
      the launching process, or one it generates (readable from
      CloudSession.api_token).  launch_vm passes it into the container
      as MADDENING_API_TOKEN, and MADDENING_TRANSPORT_TOKEN as well when
      one is configured; the values travel in SkyPilot's task
      environment, not on the docker command line.  A ZeroMQ endpoint
      that code in the container binds on a reachable address therefore
      finds a token and starts with CURVE.  Unless
      MADDENING_TRANSPORT_TOKEN is set, the CURVE keys are derived from
      MADDENING_API_TOKEN, the HTTP API's bearer credential.  There is
      no TLS, so that credential crosses the wire in cleartext on every
      API request, and anyone who observes one request can derive both
      CURVE keypairs and read the state and command streams.  This
      default applies to a generated token exactly as it does to an
      operator-chosen one.  Setting MADDENING_TRANSPORT_TOKEN to a
      different value (in the launching environment, or as
      CloudSession(transport_token=...)) is what separates the streams
      from the HTTP credential.  The refusal to start
      (TransportAuthError) still applies to a process that holds neither
      variable, such as a container started outside CloudSession with no
      token in its environment, and to a variable that is set but
      blank.  Separately, maddening.fmi.tcp_bridge is
      an unauthenticated listening socket with its own protocol; it is a
      different component, is not covered by this entry, and is
      documented as trusted-clients-only.  It is not on 5555: the
      measured constructor defaults at 0.4.0 are host="127.0.0.1",
      port=0, i.e. loopback on an ephemeral port, which is why it is a
      much narrower exposure than the ones above and why "the last
      unauthenticated listening sockets in MADDENING were the ZeroMQ
      ones" is not true.  An earlier revision of this paragraph said
      "listens on TCP 5555 by default"; that was wrong in both the port
      and the interface and is withdrawn.
    verification:
      - "tests/security/test_zmq_transport_auth.py::TestStateStreamConfidentiality::test_an_unauthenticated_subscriber_cannot_read_the_state_stream"
      - "tests/security/test_zmq_transport_auth.py::TestStateStreamConfidentiality::test_a_subscriber_with_its_own_keypair_cannot_read_the_state_stream"
      - "tests/security/test_zmq_transport_auth.py::TestCommandChannelConfidentiality::test_an_unauthenticated_subscriber_cannot_read_the_command_stream"
      - "tests/security/test_zmq_transport_auth.py::TestCoordinatorAuthentication::test_the_coordinator_ignores_an_unauthenticated_registration"
      - "tests/security/test_zmq_transport_auth.py::TestReachableAddressesFailClosed::test_a_wildcard_bind_turns_encryption_on_by_itself"
      - "tests/cloud/test_skypilot_ports.py::test_launch_vm_publishes_only_the_ports_the_job_config_asks_for"
  - anomaly_id: "MADD-ANO-011"
    title: "BallNode's declared discretisation is forward Euler; the implementation is semi-implicit Euler"
    description: >
      `BallNode.meta.discretization` reads "Forward Euler (explicit,
      1st-order)", and `meta.limitations` repeats it ("Forward Euler is only
      1st-order").  `BallNode.update` advances the velocity first and then
      advances the position with the *already-updated* velocity, which is
      semi-implicit (symplectic) Euler:

          velocity = state["velocity"] + gravity * dt
          position = state["position"] + velocity * dt

      Reproduced at 0.4.0.dev0 from rest at the origin with gravity -9.81 and
      dt = 0.1.  Forward Euler leaves the position at 0.0 after the first step
      (x1 = x0 + dt*v0); `update` returns -0.0981 = g*dt^2, and a forward-Euler
      step built from the node's own `derivatives()`
      (`maddening.core.simulation.integrators.euler_step`) returns 0.0.  The
      two documented ways to advance the same node therefore disagree at
      O(dt), with opposite signs of the leading position error (-g*T*dt/2 for
      forward Euler, +g*T*dt/2 for the scheme implemented).
      The declared order is unaffected and was verified independently: both
      schemes are 1st order, and MADD-VER-010 measures 1.002 against the
      declared 1.0.  An order study cannot see this defect, which is why it is
      pinned by a scheme-identity test rather than by a convergence ladder.
    severity: "minor"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      The scheme named in `NodeMeta.discretization` is the detailed-design
      record an IEC 62304 Clause 5.4 review reads, and it is also what a user
      derives an error budget from.  A reviewer who budgets from forward Euler
      gets the wrong sign for the position error and the wrong long-run energy
      behaviour: symplectic Euler does not drift secularly in energy the way
      `meta.limitations` says this node does, so the recorded limitation
      describes a failure mode the code does not have while leaving the one it
      does have unstated.  Nothing computed is incorrect -- the order claim
      holds -- so the relevance is to the traceability record and to anyone
      choosing between `update()` and `integrate_node(..., method="euler")`,
      which do not agree.
    affected_components:
      - "maddening.nodes.ball.BallNode.update"
      - "maddening.nodes.ball.BallNode.derivatives"
    affected_versions: ">=0.1.0"
    workaround: >
      Treat `BallNode.update` as semi-implicit Euler: the position error is
      +g*T*dt/2, not -g*T*dt/2, and the scheme is symplectic for the
      collision-free regime.  Do not mix `update()` and
      `integrate_node(node, ..., method="euler")` in one study; they are
      different schemes of the same order.
    resolution_status: "open"
    verification:
      - "tests/verification/test_mms_order_ode_nodes.py::test_ball_implements_the_scheme_its_metadata_names"
      - "tests/verification/test_mms_order_ode_nodes.py::test_ball_converges_at_its_declared_temporal_order"
    github_issue: null

  - anomaly_id: "MADD-ANO-012"
    title: "HeartPumpNode samples its cardiac inflow at the end of the step, disagreeing with its own derivatives()"
    description: >
      `HeartPumpNode.meta.discretization` reads "Forward Euler (explicit,
      1st-order)", which places every right-hand-side term at the start of the
      step.  `HeartPumpNode.update` advances the cardiac phase first and then
      evaluates the inflow waveform at the *new* phase, while the outflow term
      uses the *old* pressure:

          phase_new = fmod(phase + dt * hr / 60, 1)
          Q_heart   = _cardiac_output(phase_new, ...)      # t + dt
          Q_out     = (P_art - P_downstream) / R           # t
          P_new     = P_art + dt * (Q_heart - Q_out) / C

      The node's own `derivatives()` -- the right-hand side used by
      `maddening.core.simulation.integrators.integrate_node` and by
      `implicit_residual()` -- evaluates the same waveform at the *old* phase.
      So the node's explicit path and its derivatives()-based paths integrate
      inflow waveforms offset by one timestep.
      Reproduced at 0.4.0.dev0 with the default parameters, dt = 0.05 s,
      P = 80, phase = 0: `update` reports a flow rate of 193.4 (the waveform at
      phase = 0.06) and P1 = 85.67, while forward Euler of `derivatives()`
      starts from Q_heart = 0 at phase 0 and gives P1 = 76.0.  The offset is
      one step of systolic flow, which at the top of the validated heart-rate
      range (180 bpm) and a coarse timestep is a material fraction of systole.
      Both samplings are 1st order, so the declared order is unaffected and was
      verified independently: MADD-VER-012 measures 1.000 against the declared
      1.0.  An order study cannot see this defect.
    severity: "minor"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      The pressure waveform this node produces is its entire output, and the
      timing of systole within it is what a downstream vascular model is driven
      by.  Shifting the inflow by one timestep shifts that timing, silently and
      by an amount that grows with the timestep -- and unlike a stability
      failure there is no indication in the result, which stays smooth and
      physiologically plausible.  The relevance depends on whether the
      downstream product reads waveform timing (rather than cycle-averaged
      pressure) and on how coarse its timestep is; the node records no
      validated timestep range at all, so there is nothing bounding it.
      Compounding this, a user who switches between `update()` and
      `integrate_node()`/`implicit_residual()` -- both documented paths through
      this node -- changes the waveform they are integrating, not only the
      integration order.
    affected_components:
      - "maddening.nodes.heart_pump.HeartPumpNode.update"
      - "maddening.nodes.heart_pump.HeartPumpNode.derivatives"
      - "maddening.nodes.heart_pump._cardiac_output"
    affected_versions: ">=0.1.0"
    workaround: >
      Keep the timestep small relative to systole -- with the default
      systole_fraction of 0.35 at 72 bpm, systole lasts 0.29 s, so dt <= 1e-3 s
      keeps the offset under 0.5% of it -- and do not compare a run made with
      `update()` against one made with `integrate_node()` or the implicit
      solver, which sample the waveform one step earlier.
    resolution_status: "open"
    verification:
      - "tests/verification/test_mms_order_ode_nodes.py::test_heart_pump_implements_the_scheme_its_metadata_names"
      - "tests/verification/test_mms_order_ode_nodes.py::test_heart_pump_converges_at_its_declared_temporal_order"
    github_issue: null

  - anomaly_id: "MADD-ANO-013"
    title: "Several nodes pin a float64 quantity to float32: HeartPumpNode's backpressure, and the rigid-body and HeatNode parameter and initial_state casts"
    description: >
      `HeartPumpNode.update` and `HeartPumpNode.derivatives` both run
      `P_downstream = jnp.asarray(P_downstream, dtype=jnp.float32)` on the
      `backpressure` boundary input, unconditionally.  `backpressure` is the
      node's coupling variable -- the pressure fed back from a downstream
      domain such as an LBM outlet -- so the coupling is pinned to single
      precision whatever the caller's precision is.  No other MADDENING node
      downcasts a *boundary input* this way.  An earlier revision went on to say
      that HeatNode, LBMNode and RigidBodyNode all run in float64 under
      `jax_enable_x64`; re-measured at 0.4.0.dev0 (jaxlib 0.11.0, CPU), that
      holds only for a state the caller builds in float64, which is how the MMS
      studies drive them.  From their own `initial_state()` seeds,
      HeatNode's temperature and all four RigidBodyNode fields are float32 and
      stay float32 through `update()` -- the casts recorded below -- and LBMNode
      seeds its distribution `f` at float64 but `density`, `velocity` and
      `pressure` at float32, which its first `update()` promotes.
      Two consequences, both reproduced at 0.4.0.dev0 under
      `jax_enable_x64`.  (1) Precision: two backpressures differing by 1e-6 at
      100 units -- about 1/7 of a float32 ulp there, and 5e8 float64 ulps --
      produce bit-identical arterial pressures.  On a manufactured-solution
      ladder with the inflow waveform disabled this puts a floor under the
      study: the observed order is 1.03, 0.78, -1.18, -0.52 over a
      1000/4000/16000/64000/256000 step ladder, turning over at about 6e-6
      relative error, which the harness reports as a non-converging ladder.
      MADD-VER-012 therefore stops at 1600 steps and 1.9e-3 relative error.
      (2) Dtype: a *weakly* typed float64 pressure -- which is what
      `jnp.asarray(80.0)` produces under `jax_enable_x64`, the natural way to
      write a state by hand -- loses the promotion against the node's strong
      float32 and the whole pressure update, and the state field `update()`
      returns, becomes float32.  The returned state is then a different type
      from the one passed in, and `jax.lax.scan`/`fori_loop` rejects the carry
      with a type-mismatch error that names neither this node nor the cast.
      Widened at 0.4.0 from the HeartPump backpressure to the same cast on
      *parameters* and on `initial_state`, which the 0.4.0 numerics audit
      found in three more nodes.  `RigidBodyNode.update` and `.derivatives`
      run `jnp.asarray(p["inertia"], dtype=jnp.float32)` and the same on
      `p["gravity"]`; `RigidBody2DNode.update` does it to `p["gravity"]`;
      `HeatNode.__init__` builds `grid_x` as float32 and `HeatNode.initial_state`
      casts `T0`.  Both rigid-body nodes also build every `initial_state`
      field as float32.
      Measured at the merged tree under `jax_enable_x64`, driving each node
      from a float64 state.  `RigidBodyNode` at `inertia=1.0` and at
      `inertia=1.0 + 1e-8` returns a **bit-identical** angular velocity, so a
      parameter perturbation five orders below a float32 ulp is discarded
      exactly as the backpressure one is.  The resulting relative error is the
      float32 representation error of the parameter and nothing more: 2.98e-08
      for a 1/3 inertia, 3.67e-08 for 1.3, and 6.71e-08 on the gravity path
      measured through the node's own velocity.  It is **independent of the
      step count** -- the same 2.98e-08 at N = 1, 10, 100 and 1000 -- so it is
      a floor under the achievable accuracy rather than an accumulating drift,
      and reverse-mode gradients still flow through it (d(loss)/d(inertia) is
      finite and non-zero), so it is a precision floor and not a dead gradient.
      At the framework's float32 default every one of these casts is a no-op.
      One instance of the same pattern is **resolved**: `BallNode.derivatives`
      pinned `g` to float32 while `update` read `p["gravity"]` raw, so the node
      disagreed with itself by 4.196e-07 in the acceleration under
      `jax_enable_x64`.  `g` now follows the dtype of the velocity it is added
      to.  A knock-on of the HeatNode `grid_x` cast, recorded because it shaped
      another fix: a coordinate rounded to float32 puts ~2e-5 relative error on
      `dx`, which would have floored the new rod-end flux reconstruction from
      n = 40 up, so `compute_boundary_fluxes` reads `params["grid_points"]`
      instead.  That is a workaround at one call site and does not fix the cast.
    severity: "minor"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      The truncation is silent and sits exactly on the variable that carries
      information between coupled domains, so it limits how tightly a coupled
      pressure iteration can converge and how accurately a gradient can be
      taken through that interface -- for parameter identification against
      measured pressure, the adjoint with respect to backpressure is computed
      in single precision regardless of the precision the rest of the fit runs
      in.  At the framework's float32 default the truncation changes nothing,
      which is why the severity is minor; it matters to anyone who enables
      float64 precisely in order to get a converged or verifiable result, and
      to any future convergence evidence for this node, whose achievable
      accuracy is capped at around 1e-6 relative by the cast alone.  The dtype
      consequence is loud (an exception) rather than silent.
    affected_components:
      - "maddening.nodes.heart_pump.HeartPumpNode.update"
      - "maddening.nodes.heart_pump.HeartPumpNode.derivatives"
      - "maddening.nodes.rigid_body.RigidBodyNode.update"
      - "maddening.nodes.rigid_body.RigidBodyNode.derivatives"
      - "maddening.nodes.rigid_body.RigidBodyNode.initial_state"
      - "maddening.nodes.rigid_body_2d.RigidBody2DNode.update"
      - "maddening.nodes.rigid_body_2d.RigidBody2DNode.initial_state"
      - "maddening.nodes.heat.HeatNode.initial_state"
    affected_versions: ">=0.1.0"
    workaround: >
      Run these nodes at the framework default of float32, where every one of
      the casts is a no-op, or keep any float64 study above about 1e-5
      relative error -- and, for the parameter casts, above the ~3e-8 to
      ~7e-8 floor the float32 representation of the parameter itself puts
      there.  Pass the pressure state as a *strongly* typed array
      (`jnp.asarray(p, dtype=jnp.float64)`) to avoid the dtype demotion inside
      a scanned loop.  For a calibration or sysid run against `inertia` or
      `gravity`, do not expect a step below the float32 resolution of the
      parameter to move the answer: the gradient is finite but the forward
      difference is exactly zero there.
    resolution_status: "open"
    verification:
      - "tests/verification/test_mms_order_ode_nodes.py::test_heart_pump_resolves_a_backpressure_difference_below_float32"
      - "tests/verification/test_mms_order_ode_nodes.py::test_heart_pump_does_not_demote_the_dtype_of_the_pressure_it_is_given"
      - "tests/verification/test_mms_order_ode_nodes.py::TestBallNodeAgreesWithItselfAboutGravity::test_the_two_entry_points_return_the_same_acceleration"
      - "tests/verification/test_mms_order_ode_nodes.py::TestBallNodeAgreesWithItselfAboutGravity::test_the_acceleration_follows_the_dtype_of_the_velocity"
    github_issue: null
  - anomaly_id: "MADD-ANO-014"
    title: "Every explicit integrator converges at 1st order when a time-varying boundary input is supplied once per step, including the one named 4th-order"
    description: >
      `maddening.core.simulation.integrators` names its steppers after
      their classical orders, and `integrate_node` defaults to
      `method="rk4"`, documented as "Classical 4th-order Runge-Kutta".
      None of the four functions takes a time.  Every Runge-Kutta stage is
      therefore given the same `boundary_inputs` object the caller passed
      for the whole step, which is a zero-order hold on the input.  For an
      autonomous problem, or inputs constant over the step, that is exact
      and the classical orders are delivered.  For a genuinely
      time-varying input re-evaluated once per step -- the obvious way to
      drive a waveform through this API -- the hold contributes an
      O(dt^2) local error whatever the stages do with it, so the global
      order is 1 for all three methods.
      Measured at 0.4.0.dev0 on dx/dt = -x + u(t) with u(t) manufactured
      so that x*(t) = sin(2*pi*t) is exact, float64, over a
      10/20/40/80/160 step ladder to t = 0.75.  Observed temporal orders
      with the input frozen per step: euler 1.022, heun 1.017, rk4 1.016.
      The same ladder with the input constant instead gives 1.003, 2.005
      and 4.006, which locates the loss in the input handling and not in
      the stage arithmetic.
      A second, counter-intuitive consequence: under the frozen input rk4
      is not merely reduced to 1st order, it is also *less accurate* than
      euler at the same dt -- 7.03e-3 against 4.57e-3 relative at
      dt = 0.0047, a factor of 1.5 -- because the extra stages refine a
      term that is no longer dominant.  Choosing the higher-order method
      is not a conservative choice here.
      Related but distinct: MADD-ANO-012 records `HeartPumpNode.update`
      and its own `derivatives()` sampling the inflow waveform a timestep
      apart.  That is one node disagreeing with itself about when an input
      is read; this entry is about every stage of every method in this
      module reading it at the same time.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent, and silent in the direction that flatters the caller.
      Nothing fails, warns or looks wrong: the integration runs, the
      trajectory is smooth, and the state stays finite.  A method's name
      is the only statement of its order that most callers will read, and
      a downstream product that sized its timestep from "4th order" --
      expecting a 16x error reduction per halving and getting 2x -- would
      be running with roughly the error of a step 1000x larger than it
      budgeted for at dt = 0.005.  The relevance depends on whether the
      product drives any node with a time-varying boundary input, which
      `boundary_input_spec` shows is available on 7 of 11 nodes.
    affected_components:
      - "maddening.core.simulation.integrators.rk4_step"
      - "maddening.core.simulation.integrators.heun_step"
      - "maddening.core.simulation.integrators.integrate_node"
    affected_versions: ">=0.1.0"
    workaround: >
      Carry time as a state field with derivative 1 and read the forcing
      from it.  Each stepper builds its stage states as
      state + a_ij*dt*k_j, so such a field arrives at stage i holding
      exactly the Butcher node t + c_i*dt; the forcing is then read at the
      stage time and the full order returns -- measured 1.022 / 1.999 /
      4.002 on the same ladder.  This is exact rather than an
      interpolation and needs no API that does not already exist; the
      recipe is in the module docstring and in
      docs/algorithm_guide/solvers/explicit_integrators.md.  It requires
      calling euler_step/heun_step/rk4_step directly, because
      `integrate_node` passes `node.derivatives` through unaltered and has
      nowhere to put a stage time.  Two cheaper-looking alternatives were
      measured and do not reach 4: linear interpolation of the input
      between step endpoints caps rk4 at 2.000, and evaluating the frozen
      input at the step midpoint also caps it at 2.000.
    resolution_status: "partially_resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      What is resolved in 0.4.0 is the claim, not the behaviour: the
      docstrings and the algorithm guide now state the condition the order
      holds under, a full-order path is documented, and both regimes are
      pinned by measurement so neither can drift unnoticed.  What remains
      is that the degraded path is still the default and still silent --
      `integrate_node(node, ..., method="rk4")` with a per-step waveform
      converges at order 1 and nothing says so at runtime.  It cannot be
      detected from inside the steppers, which see an opaque dict and have
      no way to tell a constant from a sample of a waveform, so a warning
      is not available.  Adding an optional stage-time or callable-input
      argument would remove the trap at the cost of new public API on four
      functions with no in-tree callers; deferred rather than taken,
      because the measured full order is already reachable without it.
    verification:
      - "tests/verification/test_integrator_order.py"
    github_issue: null
  - anomaly_id: "MADD-ANO-016"
    title: "cloud/_skypilot.py was written against a SkyPilot API older than the supported floor"
    description: >
      From v0.1.0 to v0.3.1, `src/maddening/cloud/_skypilot.py` was
      byte-identical and written against SkyPilot's pre-0.7, pre-client-server
      API, while every release declared `skypilot>=0.11`; the 0.4.0 development
      line edited the module (the published ports, the container's credential
      environment) and kept every one of those calls until the port recorded
      below.  Every call in the
      module was therefore wrong against every version the package claims to
      support.  Verified against the installed sky 0.12.2:

        * `sky.launch(task, cluster_name=..., detach_run=True)` -- `detach_run`
          was removed with the client-server split, so the call raises
          `TypeError` before anything is provisioned;
        * `sky.launch`, `sky.status` and `sky.down` return a `RequestId`, which
          is a `str` subclass.  `sky.status(cluster_names=[name])[0]` therefore
          indexed a *character* rather than a cluster record, and
          `.get("handle", {})` on it raised
          `AttributeError: 'str' object has no attribute 'get'`.  Because a
          `RequestId` is a string, nothing failed at the indexing step: the
          error surfaced one call later, and inside a background thread;
        * `getattr(sky, config.cloud.upper(), None) or sky.GCP()` never matched
          for the two providers MADDENING's `[cloud]` extra installs -- the
          classes are `sky.RunPod` and `sky.Lambda`, not `sky.RUNPOD` -- so
          every `CloudSession` launch fell through to GCP, whatever the config
          said.  For `aws`/`gcp` the lookup hit but returned the class where
          the other branch returned an instance.

      Two `except Exception` handlers kept the breakage quiet.  `teardown_vm`
      logged `sky.down`'s failure and returned normally, which is
      indistinguishable from a successful release to every caller, so a
      `CloudSession.teardown()` reported a freed VM while the instance kept
      running and kept billing.  `monitor_preemption` polled `check_status`
      inside `except Exception: logger.debug` in a `while True` loop, so a
      status check that could never succeed produced an infinite silent loop
      and the preemption callback could never fire.

      The defect survived because there are two independent SkyPilot paths and
      only one was broken.  `CloudLauncher` -- the user-facing script/CLI path
      -- has used the client-server API since v0.1.0 across fourteen call
      sites and works: `cloud/launcher.py` is byte-identical from v0.1.0 to
      v0.3.1.  (An earlier revision said "since v0.2.0".)  `CloudSession` is the only importer of `_skypilot.py`
      (`CloudSession.teardown` imports `teardown_vm`, and
      `CloudSession._launch_worker` imports `launch_vm` and
      `monitor_preemption`; cited by symbol because the line numbers an
      earlier revision gave had already moved), and that path was plausibly never
      exercised against a real provider.  The test suite could not see it
      either: `tests/cloud/test_skypilot_ports.py` substituted a fake `sky`
      whose `launch(self, task, cluster_name, detach_run=True)` mirrored the
      stale signature and whose `status` returned a list of dicts, so the
      suite proved the module consistent with itself.
    severity: "major"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      No simulation result depends on this code: `_skypilot.py` provisions and
      releases cloud infrastructure and computes no physics.  A failed launch
      is loud at the call site once the API mismatch raises, and a failed
      teardown leaks an instance and its cost rather than producing a wrong
      number.  It is recorded as `major` rather than `minor` because a silent
      teardown failure is an unbounded, unattended financial exposure and
      because a launch silently redirected to a different cloud provider
      moves customer data to a jurisdiction the operator did not choose --
      neither is a safety property under IEC 62304, but both are the kind of
      defect a reviewer expects the registry to carry.
    affected_components:
      - "maddening.cloud._skypilot.launch_vm"
      - "maddening.cloud._skypilot.check_status"
      - "maddening.cloud._skypilot.teardown_vm"
      - "maddening.cloud._skypilot.monitor_preemption"
      - "maddening.cloud.session.CloudSession"
    affected_versions: ">=0.1.0"
    workaround: >
      Use `maddening.cloud.launcher.CloudLauncher`, which speaks the current
      SkyPilot API and is the path the shipped cloud examples use.  Do not
      rely on `CloudSession.teardown()` to have released anything, on any
      version: confirm with `sky status` and release by hand with
      `sky down <cluster>`.  On v0.3.1 and earlier the calls could not work
      at all; on 0.4.0 they are well formed but have never been observed
      against a live provider.  Do not rely on `PreemptionPolicy` for a spot
      instance either: on v0.3.1 and earlier the monitor could not detect a
      preemption, and on 0.4.0 it has never been seen to fire on a real one.
    resolution_status: "partially_resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      What is resolved in 0.4.0 is that the calls now match the library.  The
      four functions were ported to the client-server API following
      `cloud/launcher.py`'s existing call sites, and
      `tests/cloud/test_skypilot_api_contract.py` binds every `sky.*` call in
      the module against `inspect.signature` of the *installed* SkyPilot, so
      the next upstream API break fails in CI rather than on a provider.  The
      fake that hid the defect is rebuilt from the real signatures and held to
      them by the same test, so it cannot drift again.

      What is NOT resolved is the behaviour.  A signature-correct port is not
      a verified port: that `teardown_vm` actually releases an instance, that
      `check_status` reports what a real cluster is doing, and that
      `monitor_preemption` fires on a real spot preemption all need a live
      provider, and none of them has been observed.  The tests above establish
      only that the calls are well formed.  This entry stays
      `partially_resolved` until the Phase 4 RunPod session exercises a real
      launch, a real status poll, a real preemption and a real teardown; it
      must not be closed on a signature match.  Until then, an operator
      running `CloudSession` against a provider should confirm teardown with
      `sky status` as on earlier versions.
      The same reasoning sets `affected_versions`, which is open-ended.  An
      earlier revision closed it at 0.4.0 (">=0.1.0, <0.4.0"), which asserted
      that 0.4.0 is unaffected -- the one thing this paragraph says has not
      been established -- while the SOUP package counted the entry as
      reachable in 0.4.0.  The range closes when a live provider run does.
    verification:
