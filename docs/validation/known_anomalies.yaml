    resolution_status: "resolved"
    resolution_version: "0.4.0"
    residual_risk: >
      Resolved by threading `*, params=None` through
      `SimulationNode.derivatives` and `SimulationNode.implicit_residual`
      with the same `{**self.params, **params}` rule `update` uses;
      through every in-tree override (six: `BallNode`,
      `SpringDamperNode`, `HeatNode`, `RigidBodyNode`, `HeartPumpNode`,
      and `LBMNode`'s not-applicable stub); and through
      `integrate_node(..., params=)` and `implicit_euler_step(...,
      params=)`, which bind it onto the method with `functools.partial`
      before handing it to the stepper or the Newton loop.  Measured
      after the fix on the same spring and state:
      `integrate_node(method="euler", params=fitted)` gives -4.0, equal
      to `update(params=fitted)`; the implicit solve with `params=fitted`
      gives -3.8095, equal to a node constructed with the calibrated
      stiffness; `HeatNode` agrees the same way (8.984 on both paths);
      and with no `params` every path still gives the constructor's
      answer, unchanged.  The gradient of both solves with respect to
      the injected stiffness is finite and non-zero.
      What replaced the silence is a refusal.  A non-empty `params` for a
      node whose override has no `params` keyword is a `ValueError`
      naming the class and the method; `None` and `{}` call the old
      two-argument shape, so an override that predates the keyword keeps
      working for every caller that passes nothing.
      `SimulationNode.accepts_params(method=...)` is the probe the
      integrators use.  `verify_node`'s `params_effective` now also
      differentiates `derivatives()` and `implicit_residual()` with
      respect to the injected leaves, and separates a constant a path
      does not consume (a bouncing ball's `elasticity` has no place in
      the collision-free right-hand side) from one it consumes from
      `self.params` while ignoring the injected value, by varying the
      constructor value in place and restoring it; the second is a FAIL
      naming the method, and so is an override without the keyword.
      What remains, and why it is a boundary of the fix rather than a
      remaining instance of the defect.  (1) The bare steppers
      `euler_step`, `heun_step` and `rk4_step` take a callable and know
      nothing of params, by design, as the original entry already said;
      a caller composing a derivative function closes over the constants
      it wants.  (2) A subclass that overrides `derivatives` without the
      keyword but inherits an in-tree `implicit_residual` gets the same
      `ValueError`, naming the class and the method, when params are
      passed -- whether it calls `implicit_residual(..., params=)` itself
      or goes through `implicit_euler_step(..., params=)` -- because every
      in-tree `implicit_residual` (`HeartPumpNode`, `HeatNode`,
      `RigidBodyNode`, `SpringDamperNode`) reaches `derivatives` through
      the shared binder.  An earlier revision said such a subclass got
      Python's own `TypeError` from the forwarded keyword; that described
      the code before the binder was shared and is withdrawn, so this item
      is closed rather than a boundary.  (3)
      The `params_effective` probe cannot see a constant a path consumes
      through an attribute derived from it at construction time, because
      varying `self.params` does not move such an attribute; a leaf that
      is not a constructor entry cannot be probed and fails closed.  (4)
      `HybridNode` and the sharded wrappers do not implement
      `derivatives` and raise `NotImplementedError` from the integrators,
      as before.  No tagged release carried the defect: it was introduced
      and resolved between 0.3.1 and 0.4.0.
