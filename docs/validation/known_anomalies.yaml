schema_version: "1.0"
maddening_version: "0.1.0"
generated_date: "2026-03-12"

anomalies:
  - anomaly_id: "MADD-ANO-001"
    title: "LBM GPU segfault on CUDA 12.2 + jaxlib 0.5.1"
    description: >
      The LBMPipeNode causes a segmentation fault when running on GPU with
      CUDA 12.2 and jaxlib 0.5.1.  The segfault occurs in the XLA compiler
      during compilation of the streaming step, triggered by matmul/einsum
      operations on 3D+ arrays.  The CPU backend is unaffected.  The workaround
      is to use the CPU backend (JAX_PLATFORMS=cpu).
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      A segfault is a hard failure (crash), not a silent error — the simulation
      stops rather than producing incorrect results.  In an intraoperative
      context, an unexpected crash of the simulation engine could disrupt
      surgical workflow and require fallback to non-simulated guidance.  The
      safety relevance depends on whether the downstream product uses GPU
      execution and whether a fallback path exists.  CPU execution is unaffected.
    affected_components:
      - "maddening.nodes.lbm_pipe.LBMPipeNode"
    affected_versions: "0.1.0"
    workaround: "Use CPU backend: set JAX_PLATFORMS=cpu environment variable"
    resolution_status: "open"
    github_issue: null

  - anomaly_id: "MADD-ANO-002"
    title: "HeatNode CFL stability not enforced at runtime"
    description: >
      The HeatNode does not check the CFL stability condition (dt < dx^2 / (2*alpha))
      at runtime.  If the user provides a timestep that violates this condition,
      the explicit finite-difference scheme becomes unstable and produces silently
      incorrect results (temperature values that grow without bound).  There is no
      warning or error — the simulation runs but the output is wrong.
    severity: "major"
    safety_relevance: "context_dependent"
    safety_relevance_rationale: >
      Silent production of incorrect results is the most dangerous failure mode
      for a computational tool used in safety-relevant contexts.  If a downstream
      product uses HeatNode (or a node derived from it) for thermal simulation
      in a clinical context, an unstable timestep would produce incorrect
      temperature predictions without any indication of error.  The safety
      relevance depends on whether the downstream product relies on HeatNode's
      temperature output for clinical decisions and whether external validation
      checks would catch the divergence.
    affected_components:
      - "maddening.nodes.heat.HeatNode"
    affected_versions: "0.1.0"
    workaround: "Manually verify CFL condition: dt * alpha / dx^2 < 0.5"
    resolution_status: "open"
    github_issue: null

  - anomaly_id: "MADD-ANO-003"
    title: "Aitken relaxation factor escapes its clip on the fallback path"
    description: >
      In aitken_relaxation (maddening/core/coupling/acceleration.py), the
      relaxation factor is clipped to [0.01, 2.0] at line 282, but line 284
      then re-emits the caller's raw omega on the small-denominator
      fallback: new_omega = jnp.where(denom > 1e-30, new_omega, omega).
      Because the where is applied AFTER the clip, the returned factor is
      only in range if the caller's omega was already in range — the clip
      does not constrain the fallback branch at all.  The fallback is taken
      on iteration 0 (prev_residual is zero, so delta_r and denom are zero)
      and on every converged iteration (successive residuals coincide), i.e.
      on most iterations rather than in an edge case.
    severity: "minor"
    safety_relevance: "not_safety_relevant"
    safety_relevance_rationale: >
      No in-tree caller can reach an out-of-range factor.  Every Aitken loop
      seeds its carry with omega = 1.0 (graph_manager.py:191 and the
      fori_loop init_carry near :1106), and the invariant is inductive: each
      iteration returns either jnp.clip(., 0.01, 2.0) or the omega it was
      given, so an in-range input yields an in-range output forever.
      group.relaxation, the one user-settable relaxation factor, feeds
      fixed_relaxation for acceleration="fixed" and never seeds Aitken.
      The defect is therefore an UNDOCUMENTED CALLER CONTRACT — the clip
      reads as establishing an invariant it does not establish — rather
      than a reachable numerical fault.

      That qualifier is in-tree only, and MADDENING is explicitly modular:
      the coupling accelerators are public callables and third-party nodes
      and drivers are a supported use.  An EXTERNAL caller that supplies
      omega from outside the loop induction — a custom solver loop, a
      resumed checkpoint, a swept parameter — can reach an out-of-range
      relaxation factor, and for that caller the clip reads as an
      established invariant when it is not.  So this is a documented
      CALLER CONTRACT for anyone outside the in-tree induction, and only
      not_safety_relevant because in-tree callers all satisfy it.
    affected_components:
      - "maddening.core.coupling.acceleration.aitken_relaxation"
    affected_versions: "0.3.0"
    workaround: >
      None needed for in-tree use.  A caller supplying omega from outside
      the loop induction must ensure it lies in [0.01, 2.0]; alternatively
      apply the clip after the where rather than before it.
    resolution_status: "open"
    github_issue: null
