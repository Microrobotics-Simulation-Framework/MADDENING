- id: MAP-040
  area: multilinear_grid kernel
  claim: >-
    The resolution check: "A position x resolves eps |x|, so on axis a a
    point is located to eps max(|o_a|, |o_a + (n_a - 1) h_a|) / h_a cells.
    When that is 1/16 of a cell or more for the dtype the geometry field
    has, compile() refuses the graph; at 1/1024 or more, validate() reports
    a warning." An origin or spacing outside the normal range of the
    geometry's dtype is refused. "The refusal is not only compile()'s: a
    geometry compiled as float64 and later written as float32
    (set_node_state is not a recompile) changes the dtype of the program,
    which is then traced again, and the same rule is asked at that trace
    ... the kernel asks it of a direct apply call as well. (So is the
    float32-or-float64 rule, with a TypeError.)"
  sources:
    - 'docs/algorithm_guide/coupling/interface_mapping.md (Geometry-dependent mappings, multilinear_grid: gather and scatter on a uniform grid)'
    - src/maddening/core/coupling/grid_mapping.py (MultilinearGridMapping.geometry_dtype_problems)
    - src/maddening/core/_graph_specs.py (_traceable_geometry)
  conditions: >-
    a float32 geometry on a one-dimensional grid whose extent puts the
    estimate exactly at, and one point under, each of the two thresholds; a
    grid at origin 1e6 with spacing 1e-3 (located to about 119 cells); a
    grid with a subnormal or an overflowing origin or spacing for float32;
    the same grids with a float64 geometry (under x64), which resolves them.
    Host-side: decided from the grid and the field's dtype when the graph is
    validated, and again when a program is traced: the origin-1e6 grid
    compiled with a float64 geometry and handed a float32 one by
    set_node_state, on either anchor, at step, run, run_scan,
    run_scan_with_history and resolve_boundary_inputs, and the float64
    geometry written back; a float32 write on a grid float32 resolves,
    which steps; an int32, uint32, bool, float16 or bfloat16 geometry
    written after compile, in a plain graph and inside a coupling group
    (Gauss-Seidel and Jacobi, one-rate and with a sub-cycled member under
    linear interpolation); the kernel called directly.
  oracle: >-
    the ERROR: or WARNING: issue from validate() and the RuntimeError from
    compile(), naming the edge, the axis and the cells resolved; no issue
    one point under a threshold; the ValueError (resolution) or TypeError
    (dtype) of the first traced entry point after the write, naming the
    edge and the dtype.
