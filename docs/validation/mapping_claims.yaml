- id: MAP-004
  area: mapping registry
  claim: >-
    "A config, a USD stage and a checkpoint are untrusted input.  All one of
    them can say about a mapping is the name of its kind, which is looked up
    in the registry and nowhere else: nothing imports a module, follows a
    dotted path or discovers an entry point because of what a file contains
    ... A file naming a kind this process has not registered is a
    MappingRebuildError listing the registered kinds; import the module that
    registers it, then load."
  sources:
    - docs/algorithm_guide/coupling/interface_mapping.md (A file can only name a kind)
    - src/maddening/core/coupling/mapping_registry.py (module docstring)
  conditions: >-
    a config loaded in a fresh interpreter that imported nothing which
    registers a kind; kinds that are a list, a dict, a number, None, a bool,
    the empty string and a near miss; kinds spelling a module on the path, a
    dotted path, an entry-point path, a package path, the registering module
    and a stdlib callable, with installed metadata advertising the module as
    an entry point; the same on a USD stage; a checkpoint whose member names
    spell a module; the same config after the program imports the
    registering module.
