# Interface mappings: the claims inventory.
#
# Every documented statement about interface mappings that a user could rely
# on -- the registry of mapping kinds, what a mapping may put into the
# parameter tree, and the sparse mappings -- with the domain it was stated
# for, how its truth is known, and a pytest node id that fails if it stops
# being true.  An audit attacks this list; a new claim in a docstring, a
# guide, the release notes or the CHANGELOG gets a row here in the same
# change (docs/developer_guide/testing_standards.md, "The claims
# inventories").  tests/compliance/test_claims_inventories.py checks every
# row: its fields, that each cited test is collected and runs on every push
# (or is slow-marked and names a per-push witness), that a `failing` row
# cites a strict xfail and that a `verified` row cites none.
#
# Scope:
#   MAP -- src/maddening/core/coupling/mapping_registry.py (register_mapping:
#          kind names, declarations, the trust boundary of a file that names
#          a kind, what a registered factory may raise and must return;
#          MAP-001 to MAP-011, which were SYS-133 to SYS-143 of
#          sysid_fmu_claims.yaml until this file existed);
#          what a mapping's params_pytree() may contain and how its weights
#          live in gm.params["mappings"] (frozen by default, fitted on
#          opt-in, carried by a checkpoint, fixed in an FMU);
#          src/maddening/core/coupling/sparse_mapping.py (StaticSparseMapping,
#          its two layouts, the three sparse kinds and their builders, the
#          limits) and the structure digest a checkpoint carries for sparse
#          weights (src/maddening/core/simulation/checkpoint.py).
# Covered elsewhere, not repeated here: the dense factories' own numerics
# (rbf_mapping's patch test and conservation, tests/core/test_mapping.py);
# sysid, ParamSpec and the FMU export as such (sysid_fmu_claims.yaml); the
# REST routes (rest_runpod_claims.yaml); coupling groups, which leave
# interface mappings out of their inventory (coupling_claims.yaml).
#
# Top level: schema_version (1), domain_set (numeric), prefixes (the id
# prefixes this file owns; no other inventory may use them) and claims.
# Row fields and the domain matrix: as in sysid_fmu_claims.yaml, and
# testing_standards.md, "The domain matrix".

schema_version: 1

prefixes: [MAP]

domain_set: numeric

claims:

# ---------------------------------------------------------------------------
# The interface-mapping registry: register_mapping and a mapping's weights
# ---------------------------------------------------------------------------

- id: MAP-001
  area: mapping registry
  claim: >-
    "A kind name is any non-empty string but the three a config reserves for
    non-finite numbers (NaN, Infinity, -Infinity); registering a name that
    is taken -- a built-in kind, or another factory's -- is a ValueError,
    registering the same factory again with the same declaration is a no-op,
    and nothing removes a kind."
  sources:
    - docs/algorithm_guide/coupling/interface_mapping.md (Registering your own mapping kind)
    - src/maddening/core/coupling/mapping_registry.py (register_mapping, Raises)
  conditions: >-
    kind names of every Python type, the empty string, the three strings the
    serialisers reserve for non-finite numbers and names that spell a dotted
    or a file path; a second factory, the same factory, the same factory
    under another declaration; each of the four built-in kinds and each of
    the three sparse kinds the library registers for itself, in a process
    that imported the registry alone too.  A registration is host-side: no
    array, trace or graph is involved.
  oracle: the exception and its message; the registry's entry before and after.
  tests:
    - tests/core/test_mapping_registry.py::test_a_kind_name_must_be_a_non_empty_string
    - tests/core/test_mapping_registry.py::test_a_kind_name_cannot_spell_a_non_finite_json_token
    - tests/core/test_mapping_registry.py::test_any_other_non_empty_string_is_a_kind_name_and_only_a_name
    - tests/core/test_mapping_registry.py::test_registering_a_kind_twice_with_another_factory_is_an_error
    - tests/core/test_mapping_registry.py::test_registering_the_same_factory_again_is_a_no_op
    - tests/core/test_mapping_registry.py::test_registering_the_same_factory_with_another_declaration_is_an_error
    - tests/core/test_mapping_registry.py::test_a_built_in_kind_can_never_be_replaced
    - tests/core/test_mapping_registry.py::test_a_built_in_name_is_taken_before_any_registration_can_claim_it
    - tests/core/test_mapping_registry.py::test_a_sparse_kind_of_the_library_is_a_registered_kind_that_cannot_be_replaced
    - tests/core/test_mapping_registry.py::test_a_sparse_kinds_name_is_taken_before_any_registration_can_claim_it
    - tests/core/test_mapping_registry.py::test_nothing_public_removes_a_kind
