    before the checkpoint's move, so a save refused at the move answered
    "nothing was written" having written (or replaced) the manifest; and
    the details carried the checkpoint root (the refusal of a path outside
    it) and OSError texts with absolute paths.  The 200 reply's "path" is
    still the absolute path written.
  domains:
    loopback_bind: tests/api/test_checkpoint_save_is_all_or_nothing.py::test_a_save_refused_at_its_manifest_writes_no_new_checkpoint
    non_loopback_bind: 'tests/api/test_rest_claims_in_every_domain.py::test_the_claim_holds_on_a_non_loopback_bind_with_the_token[REST-102]'
    token_enforced: 'tests/api/test_rest_claims_in_every_domain.py::test_the_claim_holds_on_a_non_loopback_bind_with_the_token[REST-102]'
    no_token: tests/api/test_checkpoint_save_is_all_or_nothing.py::test_a_save_refused_at_its_manifest_writes_no_new_checkpoint
    concurrent: 'tests/api/test_rest_claims_under_concurrent_requests.py::test_the_claim_holds_under_simultaneous_requests_on_a_loopback_server[REST-102]'
    runner_active: 'tests/api/test_rest_claims_in_every_domain.py::test_the_claim_holds_while_the_runner_runs[REST-102]'
