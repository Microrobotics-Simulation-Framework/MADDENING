- id: REST-090
  area: params
  claim: >-
    "A request that is refused, or that fails unexpectedly, leaves the graph
    exactly as it was": every route that can change the graph runs in one
    transaction, and a refusal or a failure at any point of it puts back the
    state, the parameters, the nodes and their own params, the edges, the
    coupling groups, the external inputs, the compile bookkeeping and the
    streams' clock.  "An unexpected failure answers 500 with a generic
    detail" (REST-116).  For the server's audience (a trusted client on loopback, or a token-holder), no
    request the tests generate is answered 5xx; "a valid call succeeds and
    leaves the server holding exactly what an in-process GraphManager driven
    with the same operations holds"; "the graph the server reports is a
    faithful recipe".  Carve-outs, stated in the guide: POST /sim/run is one
    transaction per slice (a params write is accepted between slices), so a
    failure mid-run leaves the graph after the completed slices and reports
    steps_run; and what is outside the graph is not put back -- files under
    the checkpoint root, the runner's thread, surrogate jobs, frames already
    sent, and anything under /cloud.
  sources:
    - tests/property/test_stateful_api.py:1 (module docstring, what the surface promises)
    - CHANGELOG.md:193 (Property-test coverage for the REST surface, stateful machines)
    - src/maddening/api/README.md:284 (A request that is refused, or that fails, changes nothing)
    - src/maddening/api/README.md:132 (Who the server is for, and what it defends against)
    - src/maddening/api/server.py:2932 (_graph_transaction)
  conditions: >-
    generated sequences of graph, state, params, sim and checkpoint requests
    over a small scalar node vocabulary; short sequences per push, long ones
    in the slow lane; for "never answers 5xx" and "an invalid call changes
    nothing", also generated sequences with a rod at its Fourier limit among
    saves, loads and in-process gm.params writes, and every malformed value
    of every path parameter, query parameter, body member and proxy header of
    every documented route outside /surrogate, /ws and /cloud (read from the
    OpenAPI document), with no request tolerated: a refusal that echoes the
    text NaN, Infinity or -Infinity, or a surrogate, is the 4xx it was. For
    "leaves the graph exactly as it was", a failure injected before and after every step of each write route's body that changes the graph, publishes to the streams or writes the reply,
    in fixed requests per route and in the generated sequences, and the
    routes' own refusals, the graph compared object for object. Not
    claimed for a graph built in-process that holds a text parameter spelling
    one of those tokens (GET /graph is to_dict's refusal, MADD-ANO-010), for
    simultaneous requests, the runner
    running, an in-flight /sim/run, oversized requests, a server shutting down
    or wrapper nodes.
  oracle: an in-process GraphManager driven with the same operations; byte-identity of the state across a refused call; every container the graph holds, object for object, across a refused or failed call.
