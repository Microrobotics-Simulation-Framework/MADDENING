- id: REST-016
  area: auth
  claim: >-
    "Point MADDENING_API_TOKEN_FILE at a path on a mounted volume and the
    generated token is written there with mode 0600."
  sources:
    - src/maddening/api/README.md:55 (The token)
    - src/maddening/api/auth.py:41 (module docstring)
    - src/maddening/api/auth.py:499 (APIAuth._write_token_file)
    - docs/release_notes/v0.4.0.md:4056 (The API authenticates when it is not bound to loopback)
  conditions: >-
    a generated token on a non-loopback bind; the path absent (passes) or a
    file that already exists with another mode, e.g. 0644 (fails).
  oracle: stat.S_IMODE of the file after announce().
  tests:
    - tests/api/test_auth_and_host_rules_hold_at_their_edges.py::test_a_new_token_file_is_written_with_mode_0600
    - tests/api/test_bearer_auth.py::test_a_generated_token_can_be_written_to_a_file
    - tests/api/test_auth_and_host_rules_hold_at_their_edges.py::test_a_token_file_that_already_existed_is_left_readable_by_its_owner_only
  status: failing
  finding: >-
    os.open(path, O_WRONLY | O_CREAT | O_TRUNC, 0o600) applies the mode only
    to a file it creates: a file already at the path keeps its mode, so the
    new token lands in a world-readable file and the log says "written ...
    (mode 0600)".  Reproducer: touch t; chmod 644 t;
    MADDENING_API_TOKEN_FILE=t; APIAuth(bind_host="0.0.0.0",
    environ={}).announce() -> stat t is 0644.  Guess:
    src/maddening/api/auth.py:505 (fchmod the descriptor, or write a 0600
    temporary file and rename it over the path).

