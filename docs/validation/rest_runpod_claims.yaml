- id: REST-102
  area: checkpoint
  claim: >-
    A save: "Both are written under temporary names and moved into place
    after both exist, the checkpoint first and its manifest last: a save
    refused before that (400, "nothing was written") leaves any earlier file
    of either name as it was, and a name that is not a file is refused
    before anything is written. If only the manifest's move fails, the 400
    says the checkpoint was written without it ... No 4xx detail names the
    server's absolute paths"; a 200 reply does: /checkpoint/save's path is
    the file's absolute path on the server, as the JAX trace routes' log_dir
    is.
  sources:
    - src/maddening/api/README.md:147 (Checkpoints)
    - src/maddening/api/server.py:3467 (checkpoint_save)
  conditions: a save refused at its manifest; the checkpoint's name a directory (a save of d.npz/inner.npz); the manifest's name a directory; the manifest's own move refused; names outside the root, with a NUL, too long or a directory, on both routes; the longest name whose manifest fits (saved and loaded), a name, a directory or a manifest name over NAME_MAX (refused before any directory is made), and a save refused after its directories were made (they are removed).
  oracle: the checkpoint root's listing and bytes before and after; the detail's words and the absence of the root, the working directory and the server's paths from it.
  tests:
    - tests/api/test_checkpoint_save_is_all_or_nothing.py::test_a_save_refused_at_its_manifest_writes_no_new_checkpoint
    - tests/api/test_routes_answer_what_they_did.py::test_a_save_refused_at_its_final_move_writes_nothing
    - tests/api/test_routes_answer_what_they_did.py::test_a_save_whose_manifest_name_is_taken_by_a_directory_writes_nothing
    - tests/api/test_routes_answer_what_they_did.py::test_a_save_whose_manifest_cannot_be_moved_says_the_checkpoint_was_written
    - tests/api/test_routes_answer_what_they_did.py::test_no_checkpoint_refusal_names_an_absolute_server_path
    - tests/api/test_checkpoint_save_is_all_or_nothing.py::test_every_name_the_filesystem_holds_saves_with_its_manifest
    - tests/api/test_checkpoint_save_is_all_or_nothing.py::test_a_name_too_long_is_refused_before_any_directory_is_made
