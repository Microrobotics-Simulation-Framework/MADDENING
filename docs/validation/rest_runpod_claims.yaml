# REST API and multi-GPU session runner claims inventory.
#
# Every documented statement about the HTTP API of maddening.api and about
# benchmarks/multigpu/run_pod.py that a user (or the maintainer at a metered
# pod) could rely on, with the exact domain it was stated for, how its truth
# is known, and a pytest node id that fails if it stops being true.  An
# audit attacks this list; a new claim in a docstring, the REST guide, the
# runbook or the release notes gets a row here in the same change
# (docs/developer_guide/testing_standards.md, "The claims inventories").
# tests/compliance/test_claims_inventories.py checks every row: its fields,
# its id against this file's prefixes, that each cited test is
# collected and runs on every push (or is slow-marked and names a per-push
# witness), that a `failing` row cites a strict xfail and that a `verified`
# row cites none.
#
# Scope:
#   REST-NNN  src/maddening/api/ routes and middleware -- authentication,
#             the Host and Origin rules, body and size limits, budgets,
#             PUT/GET /graph/params, the graph structure routes, /graph/state,
#             /sim/* (step, run, reset, start/stop/pause/resume, stride,
#             profile), /checkpoint/*, the graph lock and its 409/503
#             semantics, shutdown -- and src/maddening/viz/runner.py as
#             POST /sim/start uses it.
#   RPD-NNN   benchmarks/multigpu/run_pod.py: its goals, record schema,
#             GOAL_CHECKS, --summarise verdicts and exit codes, --keep-going;
#             its runbook benchmarks/multigpu/README.md; and
#             tests/cloud/multigpu/test_run_pod_*.
# Out of scope: EXPERIMENTAL in 0.4.0 and deferred to 0.5.0 by the
# maintainer --
#   * the surrogate-training endpoints (/surrogate/*);
#   * the streaming endpoints (/ws/state, /ws/state/binary, /ws/render) and
#     the StateRelay as they use it.  A REST reply field about the streams'
#     clock (POST /checkpoint/load's sim_time) is in scope; what the streams
#     then send is not.
#   * /cloud/* is out of scope too, and never reached by a test: its
#     authentication rows cite the existing tests that stub every launcher.
#
# Sources: docstrings under src/maddening/api/, the REST guide
# src/maddening/api/README.md, docs/user_guide/parameters.md and
# quickstart.md, docs/release_notes/v0.4.0.md, CHANGELOG.md, the registry's
# REST entries (resolutions and residual risks), run_pod.py's docstrings and
# its runbook.
#
# Row fields (the schema of docs/validation/coupling_claims.yaml):
#   id          REST-NNN or RPD-NNN, unique.
#   area        a grouping label, free text.
#   claim       the documented wording (quoted where it is quoted).
#   sources     file:line or file#section; the first is where it is stated.
#   conditions  the domain the documentation states, or "unstated" parts.
#   oracle      how the truth is known.
#   tests       pytest node ids (without parameters, or with them).
#   status      verified | failing | untested | ambiguous
#   proposed_wording  required for ambiguous: the precise statement the
#                     tests support.
#   finding     required for failing: what breaks, the reproducer and a
#               file:line guess.  Every failing row cites a strict xfail.
#   reason      required for untested: why no test can fail.
#   notes       optional.
#   domains     the domain matrix (top-level domain_set: server): for each of
#               loopback_bind, non_loopback_bind, token_enforced, no_token,
#               concurrent, runner_active, sim_run_active, large_payload,
#               hostile_input, shutdown, wrapper_nodes, checkpoint_restore,
#               dry_run_cpu, relabelled_records and mixed_commits, the test
#               (or tests) that exercise the claim in that domain, `narrowed`
#               (the conditions' trailing "Not claimed for ..." clause excludes
#               it) or `n/a` (the claim cannot apply there).  Definitions and
#               rules: testing_standards.md, "The domain matrix".  Most REST
#               cells cite tests/api/test_rest_claims_in_every_domain.py and
#               tests/api/test_rest_claims_under_concurrent_requests.py, which
#               run each row's check (tests/api/rest_claims_support.py) in a
#               domain.
#
# Line numbers are those of release/0.4.0 at 6bb092d, the tree the first
# edition was verified on; the section name beside each makes it findable
# when they move.  fix/p4-13-rest was open and changing server.py and
# run_pod.py when this edition was written; the rows it affects say so.

schema_version: 1

prefixes: [REST, RPD]

domain_set: server

claims:

# ---------------------------------------------------------------------------
# Authentication: which binds and peers need the bearer token
# ---------------------------------------------------------------------------

- id: REST-001
  area: auth
  claim: >-
    "Binding 127.0.0.1 changes nothing -- no login, no header, exactly as
    before."  "Binding 127.0.0.1 (or ::1, or localhost) behaves exactly as it
    did before this module existed: no token, no header, nothing to
    configure"; the interactive docs stay on.
  sources:
    - src/maddening/api/README.md:27 (Security)
    - src/maddening/api/auth.py:10 (module docstring, The rule)
    - src/maddening/api/auth.py:114 (is_loopback)
    - docs/release_notes/v0.4.0.md:4203 (The API authenticates when it is not bound to loopback)
  conditions: >-
    bind_host any spelling of a loopback address: 127.0.0.0/8, localhost (any
    case), ::1 with or without brackets, ::ffff:127.0.0.1; request from an
    in-process or loopback peer.
  oracle: auth.enforced is False and GET /graph, /openapi.json answer 200 with no header.
  tests:
