  conditions: a generated token on a non-loopback bind; the path absent, a file already there with mode 0644, the same file held open by a reader, a symbolic link at the path, a directory the server cannot write.
  oracle: stat.S_IMODE of the file after announce(); what the earlier reader reads; the file untouched and the warning where it cannot be written.
