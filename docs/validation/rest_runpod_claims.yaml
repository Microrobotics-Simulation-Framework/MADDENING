    - tests/api/test_bearer_auth.py::test_loopback_bind_does_not_reject_a_client_that_offers_a_token
    - tests/api/test_bearer_auth.py::test_loopback_classification
  status: verified
  domains:
    loopback_bind: tests/api/test_auth_and_host_rules_hold_at_their_edges.py::test_every_loopback_spelling_of_the_bind_serves_without_a_token
    non_loopback_bind: n/a
    token_enforced: n/a
    no_token: tests/api/test_auth_and_host_rules_hold_at_their_edges.py::test_every_loopback_spelling_of_the_bind_serves_without_a_token
    concurrent: 'tests/api/test_rest_claims_under_concurrent_requests.py::test_the_claim_holds_under_simultaneous_requests_on_a_loopback_server[REST-001]'
    runner_active: 'tests/api/test_rest_claims_in_every_domain.py::test_the_claim_holds_while_the_runner_runs[REST-001]'
    sim_run_active: 'tests/api/test_rest_claims_in_every_domain.py::test_the_claim_holds_while_a_sim_run_is_in_flight[REST-001]'
    large_payload: tests/api/test_request_memory_is_bounded.py::test_a_body_over_the_limit_is_a_413_before_it_is_parsed
    hostile_input: 'tests/api/test_rest_claims_in_every_domain.py::test_the_claim_holds_on_a_loopback_bind_without_a_token[REST-001]'
    shutdown: n/a
    wrapper_nodes: n/a
    checkpoint_restore: n/a
    dry_run_cpu: n/a
    relabelled_records: n/a
    mixed_commits: n/a

