- id: RPD-039
  area: run_pod-cli
  claim: >-
    A goal run's exit status says what happened: "0 = no check failed; 1 = a
    check failed (the log names it on a CHECK FAILED line); 2 = the runner
    refused the run (an option it does not take, more devices than are
    visible, a device count or a --mesh it cannot use; the reason is the
    last line); 5 = a goal raised (its traceback, then a CRASHED line); 124
    = the time box ran out"; section 3 stops on each; --summarise's statuses
    (0, 1, 3, 4) are its own.
  sources:
    - benchmarks/multigpu/README.md:249 (2b. The goals, in this order)
    - benchmarks/multigpu/run_pod.py:3894 (exit_status)
    - benchmarks/multigpu/run_pod.py:216 (EXIT_REFUSED, EXIT_CRASHED)
  conditions: >-
    every run a dry run: a refusal (more devices than are visible), a goal
    replaced by one that raises, with and without --keep-going, a failed and
    a passing check, an option it does not take, and an installation that
    cannot import the library in a real process (a crash); every counting
    option below its least value (--cells, --n-devices, --repeats, --steps,
    --grad-steps, --cg-max-iters, --fields 0 or negative; --warmup -1), a
    --mesh that is missing, a directory, not an archive, without edges or
