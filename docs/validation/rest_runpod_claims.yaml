- id: REST-098
  area: auth
  claim: >-
    "There is still no TLS.  The token and every state snapshot cross the
    network in cleartext."
  sources:
    - src/maddening/api/README.md:79 (What the token does not do)
    - src/maddening/api/server.py:42 (module docstring, Security)
  conditions: any bind.
  oracle: the server's own bytes on its socket -- a plain HTTP status line and the state in the clear, and no TLS record answering a ClientHello.
  tests:
    - 'tests/api/test_rest_claims_at_their_domain_edges.py::test_the_server_speaks_plain_http_and_the_token_crosses_in_cleartext'
  status: verified
  notes: >-
    Untested in the first edition (a statement that a feature is absent).
    The domain matrix needed its two binds exercised, and a user does act
    on it -- TLS has to be put in front of a non-loopback bind -- so it is
    pinned: on either bind the server speaks plain HTTP on its socket and a
    TLS ClientHello gets no TLS answer.  If TLS is ever added the test
    fails, and the sentence changes with it.  REST-002 (the token is
    demanded) and REST-011 (the token never travels in a URL) are the rows
    that keep the cleartext token from being the only gate.
  domains:
    loopback_bind: 'tests/api/test_rest_claims_at_their_domain_edges.py::test_the_server_speaks_plain_http_and_the_token_crosses_in_cleartext[127.0.0.1]'
    non_loopback_bind: 'tests/api/test_rest_claims_at_their_domain_edges.py::test_the_server_speaks_plain_http_and_the_token_crosses_in_cleartext[0.0.0.0]'
    token_enforced: 'tests/api/test_rest_claims_at_their_domain_edges.py::test_the_server_speaks_plain_http_and_the_token_crosses_in_cleartext[0.0.0.0]'
    no_token: 'tests/api/test_rest_claims_at_their_domain_edges.py::test_the_server_speaks_plain_http_and_the_token_crosses_in_cleartext[127.0.0.1]'
    concurrent: n/a
    runner_active: n/a
    sim_run_active: n/a
    large_payload: n/a
    hostile_input: n/a
    shutdown: n/a
    wrapper_nodes: n/a
