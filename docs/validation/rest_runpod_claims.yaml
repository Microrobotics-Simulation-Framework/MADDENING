- id: REST-116
  area: errors
  claim: >-
    "An unexpected failure answers 500 with a generic detail": "The request
    failed unexpectedly (the server's log says how)." and, from a route
    that can change the graph, "The graph was put back exactly as it was
    before the request."  The reply is JSON, names no path, value or class
    of the server's and does not quote the error, and the failure is logged
    with its traceback.
  sources:
    - src/maddening/api/README.md:284 (A request that is refused, or that fails, changes nothing)
    - src/maddening/api/server.py:2503 (_FAILED_UNEXPECTEDLY, _UNEXPECTED_FAILURE_DETAIL)
    - src/maddening/api/server.py:2932 (_graph_transaction)
  conditions: >-
    an exception raised inside a route that can change the graph (POST
    /graph/nodes, after the node joined the graph) and inside a read (GET
    /graph/params); and a failure injected at every point of every write
    route's body, whose 500 must carry the generic detail and no word of
    the failure -- on a loopback bind, and from a token-holder on a server
    that demands the token (the reply and the graph; the log record is read
    on loopback). Not claimed for simultaneous requests, the runner
    running, an in-flight /sim/run, a server shutting down or wrapper nodes.
