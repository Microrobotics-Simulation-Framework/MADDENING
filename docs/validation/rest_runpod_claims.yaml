- id: REST-033
  area: bounds
  claim: >-
    "An integer parameter over 10^7, more than 10^6 values in one request's
    params, n_steps over 100000 or an out-of-range training argument is a
    422 from the request model, published in /openapi.json.  A node whose
    state would exceed 2*10^7 elements, or whose build would exceed 2 GiB,
    or that would take the graph past 10^8 state elements, is a 400 naming
    the size: those caps are server constants".  These are the size
    refusals that exist, so that one request of the server's audience (a trusted client on loopback, or a token-holder)
    cannot exhaust the host by mistake; they are not claimed to stop a
