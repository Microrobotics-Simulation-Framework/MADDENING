- id: REST-005
  area: auth
  claim: >-
    "A request that arrives from a routable IP is challenged even when the
    server was told the bind is loopback. That backstop is why forgetting
    bind_host costs you a 401, not an open API"; on a loopback bind only a
    direct connection from a loopback address is served without the token: a
    peer that is not a loopback IP literal (a name such as TestClient's
    "testclient", a Unix socket's empty peer, whatever a proxy header put
    there) and a request carrying X-Forwarded-For or Forwarded must present
    it. The peer is scope["client"] as the ASGI server reports it; under
    uvicorn's proxy_headers it is a trusted proxy's X-Forwarded-For value.
  sources:
    - src/maddening/api/README.md:43 (Security)
    - src/maddening/api/auth.py:16 (module docstring, rule 2)
    - src/maddening/api/auth.py:156 (is_routable_peer)
    - docs/release_notes/v0.4.0.md:4227 (The API authenticates when it is not bound to loopback)
    - src/maddening/api/auth.py:485 (APIAuth.required_for_peer)
    - src/maddening/api/auth.py:512 (APIAuth._required_for_request)
  conditions: >-
    loopback bind; peers: public and private IPv4, IPv6, IPv4-mapped IPv6
    (::ffff:203.0.113.5), scoped link-local (fe80::1%eth0), names
    (testclient, localhost, x), an empty peer; X-Forwarded-For naming x,
    testclient, 127.0.0.1, ::1 or localhost, and a Forwarded header, on a
    real loopback uvicorn with uvicorn's default proxy settings and
    in-process behind a proxy middleware that trusts every peer; the
    WebSocket handshake, at the middleware and in the handlers; the token
    presented.
  oracle: >-
    401 without the token, 200 with it; only a direct loopback IP peer
    served without it; nothing stepped, saved or added.
  tests:
    - tests/api/test_bearer_auth.py::test_a_routable_peer_is_challenged_even_on_a_believed_loopback_bind
    - tests/api/test_auth_and_host_rules_hold_at_their_edges.py::test_a_routable_peer_of_any_spelling_is_challenged_on_a_loopback_bind
    - tests/api/test_bearer_auth.py::test_a_loopback_peer_is_not_challenged_on_a_loopback_bind
    - tests/api/test_bearer_auth.py::test_routable_peer_classification
    - tests/api/test_auth_and_host_rules_hold_at_their_edges.py::test_a_routable_peer_is_challenged_on_a_websocket_handshake_too
    - tests/api/test_forwarded_headers_cannot_name_a_trusted_peer.py::test_a_forwarding_header_needs_the_token_even_naming_this_machine
    - tests/api/test_forwarded_headers_cannot_name_a_trusted_peer.py::test_a_routable_peer_cannot_forge_its_way_past_the_backstop
    - tests/api/test_forwarded_headers_cannot_name_a_trusted_peer.py::test_starlettes_own_in_process_client_must_present_the_token
    - tests/api/test_forwarded_headers_cannot_name_a_trusted_peer.py::test_a_connection_with_no_peer_address_must_present_the_token
    - tests/api/test_forwarded_headers_cannot_name_a_trusted_peer.py::test_only_a_loopback_ip_literal_is_served_without_a_token_on_a_loopback_bind
    - tests/api/test_forwarded_headers_cannot_name_a_trusted_peer.py::test_a_forwarding_header_makes_even_a_loopback_peer_present_the_token
    - tests/api/test_forwarded_headers_cannot_name_a_trusted_peer.py::test_a_forwarded_websocket_handshake_is_refused
    - tests/api/test_forwarded_headers_cannot_name_a_trusted_peer.py::test_the_handlers_own_websocket_check_asks_the_same_rule
    - tests/api/test_forwarded_headers_cannot_name_a_trusted_peer.py::test_the_token_still_authenticates_a_forwarded_request
  status: verified
  domains:
    loopback_bind: tests/api/test_bearer_auth.py::test_a_routable_peer_is_challenged_even_on_a_believed_loopback_bind
    non_loopback_bind: n/a
    token_enforced: tests/api/test_bearer_auth.py::test_a_routable_peer_is_challenged_even_on_a_believed_loopback_bind
    no_token: tests/api/test_bearer_auth.py::test_a_loopback_peer_is_not_challenged_on_a_loopback_bind
    concurrent: 'tests/api/test_rest_claims_under_concurrent_requests.py::test_the_claim_holds_under_simultaneous_requests_on_a_loopback_server[REST-005]'
    runner_active: 'tests/api/test_rest_claims_in_every_domain.py::test_the_claim_holds_while_the_runner_runs[REST-005]'
    sim_run_active: 'tests/api/test_rest_claims_in_every_domain.py::test_the_claim_holds_while_a_sim_run_is_in_flight[REST-005]'
    large_payload: n/a
    hostile_input:
      - tests/api/test_auth_and_host_rules_hold_at_their_edges.py::test_a_routable_peer_of_any_spelling_is_challenged_on_a_loopback_bind
      - tests/api/test_forwarded_headers_cannot_name_a_trusted_peer.py::test_a_routable_peer_cannot_forge_its_way_past_the_backstop
    shutdown: n/a
    wrapper_nodes: n/a
    checkpoint_restore: n/a
    dry_run_cpu: n/a
    relabelled_records: n/a
    mixed_commits: n/a

