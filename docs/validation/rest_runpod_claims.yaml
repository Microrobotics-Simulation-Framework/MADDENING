- id: REST-065
  area: structure
  claim: >-
    "GET /graph: Return graph structure (nodes, edges, external inputs)";
    "POST /graph/nodes: Add a node ({type, name, timestep, params})" -- an
    unknown type is a 400, an existing name a 409, and a node whose params
    its constructor or one abstract update refuses is a 400 and is not
    added.  The update is traced the way the graph calls it (the node's
    params pytree injected; with every declared boundary input and with
    none), and must return the fields, shapes and kinds of dtype of the
    node's initial state: "400, and nothing added, for a node the graph
    could not step with its state as built".  A POST /graph/nodes that is refused, or that fails at any
    point, leaves the graph as it was, by the route's transaction.  The
    refusals of names and text in the conditions are the ones that exist,
    stated for the server's audience (a trusted client on loopback, or a token-holder);
    no wider claim is made about pathological names.
  sources:
    - src/maddening/api/README.md:112 (Graph Structure)
    - src/maddening/api/server.py:2788 (add_node)
    - docs/release_notes/v0.4.0.md:4313 (Hardening from the audit rounds)
    - src/maddening/api/README.md:284 (A request that is refused, or that fails, changes nothing)
    - src/maddening/api/README.md:132 (Who the server is for, and what it defends against)
  conditions: >-
    an empty graph; a registered and an unregistered type; bad constructor
    constants. Also a 400 that adds nothing, asked before the type is looked
    up or anything is built: a name holding one of U+0000 to U+001F (tab,
    line feed and carriage return excepted), a surrogate, U+FFFE or U+FFFF
    (a checkpoint, an FMU's model description or a file could not carry
