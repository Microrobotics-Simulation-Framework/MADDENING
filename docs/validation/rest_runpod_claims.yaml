    token_enforced: n/a
    no_token: tests/api/test_auth_and_host_rules_hold_at_their_edges.py::test_every_loopback_spelling_of_the_bind_serves_without_a_token
    concurrent: 'tests/api/test_rest_claims_under_concurrent_requests.py::test_the_claim_holds_under_simultaneous_requests_on_a_loopback_server[REST-001]'
    runner_active: 'tests/api/test_rest_claims_in_every_domain.py::test_the_claim_holds_while_the_runner_runs[REST-001]'
