  sources:
    - src/maddening/sysid.py:2345 (fim)
    - docs/user_guide/parameters.md (opening section)
  conditions: a coupled spring pair under solver="ift", the observed node the other member.
  oracle: J^T J from central differences of the same coupled rollout.
  tests:
