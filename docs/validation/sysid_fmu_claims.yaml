- id: SYS-080
  area: fit_lm
  claim: >-
    converged is True "when the loss reached tol, or when the step an
    iteration proposed ... moved every trainable parameter by no more than
    step_tol of its own magnitude ... or -- once the run has lowered the
    loss at least once -- when every candidate of an iteration was
    rejected down to one damped within step_tol"; "A run that never
    lowered the loss and rejected every candidate is not converged, and
    neither is one that ran out of n_iter"; a residual reading no
    trainable parameter converges at its start; "And neither test fires
    unless the undamped Gauss-Newton step from the iterate ... would also
    move every parameter by no more than step_tol, or, at the floor, would
    not lower the loss: a shrunken step cannot read as stationary"; at the
    floor "if it moves a parameter by more than step_tol and lowers the
    loss it is taken as the iterate and the run goes on"; converged "is
    never reported on a solve whose live columns were not representable
    even framed, or on a loss of 0.0 from a residual that is not zero".
  sources:
    - src/maddening/sysid.py:4878 (fit_lm)
    - src/maddening/sysid.py:4158 (FitResult, converged)
    - docs/user_guide/parameters.md (System identification)
  conditions: >-
    a noiseless fit at its optimum in float32 and under x64; a run of
    rejected candidates; a Marquardt step shrunk to within step_tol,
    rejected from the start (float32) and accepted to the end of the budget
    (x64); a residual reading nothing trainable; a noisy fit
    at the float32 floor, an identity parameter in units 1e-8 to 1e8 (the
    verdict and the answer the same in every unit); an unrepresentable
    solve and a float64 loss that underflows (never converged).  Not a
    parameter whose truth is exactly 0: it has no relative resolution, and
    such a run stops at its floor unconverged unless given a tol (SYS-130).
    Not claimed for 16-bit floats.
  oracle: the flag and the iteration it stopped on.
  tests:
    - tests/core/test_sysid_fit_lm_step_tol.py::test_a_noiseless_float32_fit_at_its_optimum_is_converged
    - tests/core/test_sysid_fit_lm_step_tol.py::test_a_noiseless_float64_fit_at_its_floor_is_converged
    - tests/core/test_sysid_fit_lm_step_tol.py::test_the_ladder_extension_does_not_depend_on_lam_up
    - tests/core/test_sysid_fit_returns_lowest_loss_iterate.py::test_a_shorter_damped_retry_does_not_make_a_rejected_run_converged
    - tests/core/test_sysid_fit_returns_lowest_loss_iterate.py::test_a_residual_that_reads_no_trainable_parameter_is_converged_at_its_start
    - tests/core/test_sysid_noise_model.py::test_fit_lm_never_accepting_a_step_returns_cleanly
    - tests/core/test_sysid_bounded_coordinates_and_residual_scale.py::test_a_shrunken_step_never_reads_as_stationary
    - tests/core/test_sysid_bounded_coordinates_and_residual_scale.py::test_a_run_of_stalled_candidates_is_not_the_rounding_floor
    - tests/core/test_sysid_bounded_coordinates_and_residual_scale.py::test_a_gauss_newton_iterate_is_evaluated_as_it_is_returned
    - tests/core/test_sysid_fit_lm_step_tol.py::test_a_run_that_never_lowered_the_loss_is_not_converged_by_the_floor_rule
    - tests/core/test_sysid_fit_lm_step_tol.py::test_the_floor_rule_never_fires_while_a_bound_coordinate_could_descend
    - tests/core/test_sysid_fit_lm_step_tol.py::test_the_floor_verdict_does_not_depend_on_a_parameters_units
    - tests/core/test_sysid_bounded_coordinates_and_residual_scale.py::test_fit_lm_never_converges_on_a_solve_it_could_not_form
    - tests/core/test_sysid_bounded_coordinates_and_residual_scale.py::test_a_loss_that_underflows_float64_is_never_converged
  status: verified
  notes: >-
    Round 7 (B1, on 04bc3e5): under x64 the floor rule's twelve damped
    candidates ended one rung short of step_tol (4.4e-15 against 3.6e-15)
    and a fit at loss 2.3e-30 read converged=False.  The ladder now goes on
    for the floor rule until a candidate is within step_tol or lam reaches
    its cap.  Round 8 (B1, on d2429a6): at the float32 floor of a noisy fit the
    verdict flipped with an identity parameter's units (40 ulps short and
    unconverged in units 1e-6, 1e3 and 1e8; converged in the others): the
    damped candidates' verdicts were the loss's rounding while the
    Gauss-Newton step still pointed at the optimum.  The floor rule now
    takes that step (MADD-ANO-174).  With that rule and SYS-071's fix
    together, the shrunken-step test's one float32 run (a millionth of the
    step) stopped being stuck: its first candidate had only tied with the
    start, and once it lowered the loss the floor rule's Gauss-Newton step
    carried the run to the truth, converged there, as claimed.  The test now
    holds the step within step_tol in the two runs that leave a fit stuck.
  domains:
    f32: tests/core/test_sysid_fit_lm_step_tol.py::test_a_noiseless_float32_fit_at_its_optimum_is_converged
    f64: tests/core/test_sysid_fit_lm_step_tol.py::test_a_noiseless_float64_fit_at_its_floor_is_converged
