    diagonal of the inverse.
  sources:
    - src/maddening/sysid.py:2345 (fim)
  conditions: a smooth residual in float64; a spring rollout in float32.
  oracle: J^T J from central differences; the inverse of the matrix.
  tests:
    - tests/core/test_sysid_contract_examples.py::test_fim_matches_a_central_finite_difference_and_its_bound_is_the_inverse
    - tests/core/test_sysid_contract_examples.py::test_fim_matches_a_finite_difference_of_a_spring_rollout
  status: verified

