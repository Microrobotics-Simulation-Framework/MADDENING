    are refused, naming them (a shorter leaf would otherwise be read past
    its end, which JAX clamps to its last sample)."
  sources:
    - src/maddening/sysid.py:302 (windowed_loss, observations)
  conditions: a shorter leaf first or later in flatten order; a scalar leaf; init_window_states too.
  oracle: the ValueError and the names it carries.
  tests:
    - tests/core/test_sysid.py::test_observation_leaves_of_unequal_length_are_refused
    - tests/core/test_sysid.py::test_a_scalar_observation_leaf_is_refused_by_name
  status: verified

