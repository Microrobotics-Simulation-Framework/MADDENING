- id: SYS-006
  area: windowed_loss
  claim: >-
    Teacher forcing: "every window restarts from the measured state";
    "Each window is its own lax.scan, so memory is O(window) and gradients
    cannot compound across windows: the coupling warm starts a window
    inherits from the one before it ... enter with their gradient
    stopped."  The loss is zero at the parameters that generated the record
    and positive elsewhere.
  sources:
    - src/maddening/sysid.py:1 (module docstring)
    - src/maddening/sysid.py:302 (windowed_loss)
    - docs/user_guide/parameters.md (System identification)
  conditions: >-
    single-rate graph, with or without coupling groups -- their predictor
    history and IQN-IMVJ warm starts are replayed, not reset (SYS-127) --
    for a record taken from compile() or reset_state(); for multi-rate see
    SYS-011. Not claimed for 16-bit floats or sharded graphs.
  oracle: the loss over the record against the sum of the losses over each window's own slice of it; zero at the truth.
  tests:
    - tests/core/test_sysid_claims_edges.py::test_the_teacher_forced_loss_is_the_sum_of_independent_windows
    - tests/core/test_sysid.py::test_loss_zero_at_truth_positive_elsewhere
    - tests/core/test_sysid_windowed_loss_replays_coupling_warm_starts.py::test_the_loss_is_exactly_zero_and_stationary_at_the_truth
    - tests/core/test_sysid_windowed_loss_replays_coupling_warm_starts.py::test_the_inherited_warm_starts_carry_no_gradient
  status: verified
  notes: >-
    The memory claim (O(window)) is not measured here.  Failing in round 7
    (B1, on 04bc3e5): every window restarted the coupling warm starts at
    zero, so with a predictor or IQN-IMVJ at a finite max_iterations the
    loss at the truth was not zero (1.7e-2 for a quadratic predictor at one
    pass) and a fit started there walked 6.4% away (MADD-ANO-151).
  domains:
    f32: tests/core/test_sysid_claims_edges.py::test_the_teacher_forced_loss_is_the_sum_of_independent_windows
    f64: tests/core/test_sysid_claims_under_x64.py::test_the_teacher_forced_loss_is_the_sum_of_independent_windows_under_x64
