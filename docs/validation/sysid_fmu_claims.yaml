    - tests/fmi/test_advertised_bounds.py::test_log_leaf_with_zero_bound_advertises_smallest_normal
    - tests/fmi/test_advertised_bounds.py::test_log_leaf_with_nonzero_bound_advertises_next_float
    - tests/fmi/test_advertised_bounds.py::test_logit_leaf_advertises_both_open_bounds
    - tests/fmi/test_advertised_bounds.py::test_inclusive_identity_bounds_are_unchanged
    - tests/fmi/test_advertised_bounds.py::test_a_parameter_the_description_bounds_nowhere_stays_unbounded
    - tests/fmi/test_the_bridge_enforces_the_envelope_its_description_advertises.py::test_every_advertised_open_bound_is_settable_and_the_next_float_out_is_not
    - tests/fmi/test_the_bridge_enforces_the_envelope_its_description_advertises.py::test_an_open_bound_is_advertised_as_the_outermost_value_its_check_accepts
    - tests/fmi/test_the_bridge_enforces_the_envelope_its_description_advertises.py::test_the_wrapper_sets_a_logit_parameter_to_its_advertised_max
    - tests/fmi/test_fmu_claims_in_float64.py::test_a_float64_logit_parameters_advertised_bounds_are_settable_with_and_without_specs
    - tests/fmi/test_advertised_bounds.py::test_an_open_bound_at_zero_advertises_the_outermost_value_its_spec_accepts
    - tests/property/test_differential_param_acceptance.py::test_a_logit_edge_whose_neighbour_has_no_coordinate_is_held_by_every_door
  status: verified
  notes: >-
    Failing on 04bc3e5 (B1 round 7): a log leaf with no lower bound, which
    ParamSpec measures from 0, was advertised with no min (MADD-ANO-148).
    Failing on d2429a6 (B1 round 8, L1): a float32 logit leaf under (-1, 1)
    or (-10, 10) advertised max = nextafter(hi, -inf), whose (p - lo) /
    (hi - lo) rounds to 1, so a sidecar with param_specs -- and FMPy through
    the compiled wrapper -- refused the FMU's own advertised max, while one
    without took it; and a bound in the subnormal-spacing band was
    advertised one flushed distance inside (the acceptance oracle's N2).
    Loud (a refusal) and never released, so minor and no registry entry.
    A logit bound of zero (max = -TINY under (-1, 0)) was the same case,
    found by the acceptance oracle's broad draw; its cases run as tests.
  domains:
    f32: tests/fmi/test_advertised_bounds.py::test_log_leaf_with_zero_bound_advertises_smallest_normal
    f64:
