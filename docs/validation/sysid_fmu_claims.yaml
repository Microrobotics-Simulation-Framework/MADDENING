# ---------------------------------------------------------------------------

- id: SYS-001
  area: windowed_loss
  claim: >-
    observations_from_history "Prepend[s] the initial state to a
    run_scan_with_history history ... Returns a pytree with leading axis
    T = 1 + n."
  sources:
    - src/maddening/sysid.py:163 (observations_from_history)
  conditions: any graph and n >= 1 steps.
  oracle: the history and the initial state, element for element.
  tests:
    - tests/core/test_sysid_claims_edges.py::test_observations_from_history_prepends_the_initial_state
  status: verified

- id: SYS-002
  area: windowed_loss
