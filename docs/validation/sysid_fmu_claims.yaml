- id: SYS-084
  area: fit_lm
  claim: >-
    "The damping λ multiplies diag(JᵀJ) (Marquardt scaling)", and "for the
    handful of physical constants a model has it converges in a few
    iterations where Adam needs hundreds".
  sources:
    - src/maddening/sysid.py:3916 (fit_lm)
    - docs/user_guide/parameters.md (System identification)
  conditions: >-
    unstated: the units of a parameter.  Marquardt scaling is invariant to
    them; the floor of SYS-083 is shared by every column.
  oracle: the same linear problem with one identity-transform parameter re-expressed in units 1000x smaller, from the same physical start.
  tests:
    - tests/core/test_sysid_claims_edges.py::test_fit_lm_does_not_depend_on_the_units_of_a_parameter
  status: failing
  finding: >-
    The answer depends on a parameter's units.  r = A diag(u) x - b over
    (stiffness, damping, rest_length), damping in units u (identity
    transform, bounds (0, None)), started at the same physical value:
    u = 1 converges in 5 iterations to damping 3 (loss 1.6e-11); u = 1e-2
    takes 45; u = 1e-3 stops unconverged after 50 at damping 2.12 (loss
    0.92); u = 1e-5 reports converged=True at damping 2.0, never moved
    (loss 1.2); u = 1e4 and 1e6 do not converge in 50.  log-transformed
    parameters are unaffected (their column is p * dr/dp).  The floor
    eps * mean(diag(JᵀJ)) is dominated by the largest column, so a column
    whose diagonal is many decades smaller is damped by roughly
    floor / diag(JᵀJ)_jj every iteration.  Guess: src/maddening/sysid.py
    _marquardt_step (around line 3882), the floor term; #203's per-column
    floor is the fix.
  notes: >-
    Reproducer: the test above (column units 1 and 1e-3).

