- id: FMU-023
  area: bridge stepping
  claim: >-
    "fmi3EnterInitializationMode(startTime) sets the FMU's time ... accepted
    until the instance's first step.  Each fmi3DoStep must start at the
    FMU's current time ... The tolerance is a millionth of a master step
    ... A step size is held to the same absolute tolerance ... A point
    inside it is adopted ... A point outside it is fmi3Error with nothing
    advanced ... restore an FMU state; the clock moves with it"; "Both
    tolerances are a millionth of the master step at any master step ...
    the communication point and the step's end t + h must each lie within
    the tolerance of the start time plus the master steps taken since, plus
    a few ulps of the time per step ... An importer whose every step size
    is a little long is refused, with nothing advanced, once its errors add
    up past the tolerance."; "No rounding slack is ever more than a tenth of
    a master step, so the time the FMU reports stays within a millionth plus
    a tenth of a step of the time it has simulated ... a time whose 16 ulps
    pass a tenth of the master step ... is refused, at
    fmi3EnterInitializationMode, at a doStep that would reach it and at
    fmi3SetFMUState ... An importer that computes each point as start + k *
    h ... is never refused below that time.  One that keeps a running sum
    ... is refused ... once that passes a tenth of a step".
  sources:
    - docs/user_guide/fmu_export.md (Instances and time)
    - src/maddening/fmi/tcp_bridge.py:1 (module docstring, Instances)
    - src/maddening/fmi/tcp_bridge.py:368 (_ROUNDING_SLACK_MAX)
  conditions: >-
    Times whose 16 ulps are at most a tenth of the master step -- below 32 s
    at 1e-12 s, 32768 s at 1e-9 s, 3.4e10 s at 1e-3 s -- which is the domain
    the bridge serves: a start, a step's end or a restored time beyond it
    is refused, the limit pinned at master steps of 1e-12, 1e-9, 1e-6 and
    1e-3 s and at the audit's 1000 s / 1e-12 s and 1.7e9 s / 1e-6 s.  Inside
    it: a jump; a point inside the tolerance; rounded points over a long
    run; step sizes either side of the tolerance at master steps of 1e-2,
    1e-9 and 1e-12 s; an importer biased by a third of the tolerance per
    step; one a hundredth of a step late per step at 16 s and 1e-12 s
    (refused within a tenth of a step); an honest running sum and start + k
    * h over a million steps, from starts of 0, 1 and 1000 s, and the
    running sum's refusal past the cap (about 1.2 million steps from 1 s at
    1e-9 s); a restore; the compiled wrapper. The tolerance is a millionth
    of a master step wherever 16 ulps of the time are below that (times
    under about 2.8e8 master steps from 0); above it the ulp slack, capped
    at a tenth of a step, is the larger part. Not claimed for mixed dtypes
    or 16-bit floats.
  oracle: >-
    the time variable and the state; the bridge's drift tolerance against
    the importer's clock; the refusal and its message; an independent
    search for the resolution limit.
  tests:
    - tests/fmi/test_communication_points.py::test_a_discontinuous_communication_point_is_refused_and_advances_nothing
    - tests/fmi/test_communication_points.py::test_a_point_within_the_tolerance_is_adopted
    - tests/fmi/test_communication_points.py::test_an_importers_rounded_points_are_accepted_over_a_long_run
    - tests/fmi/test_communication_points.py::test_initialize_sets_the_start_time_until_the_first_step
    - tests/fmi/test_communication_points.py::test_restoring_an_fmu_state_moves_the_clock_to_the_snapshot
    - tests/fmi/test_communication_points.py::test_a_step_inside_the_tolerance_leaves_the_next_legal_point_accepted
    - tests/fmi/test_communication_points.py::test_a_step_outside_the_tolerance_is_refused_and_advances_nothing
    - tests/fmi/test_communication_points.py::test_the_wrapper_reports_the_start_time_and_refuses_a_jump
    - tests/fmi/test_communication_points.py::test_the_tolerance_is_a_millionth_of_the_master_step_at_any_step
    - tests/fmi/test_communication_points.py::test_a_biased_importer_is_stopped_before_its_drift_passes_the_tolerance
    - tests/fmi/test_communication_points.py::test_a_point_that_has_drifted_is_refused_even_if_the_step_would_end_back_inside
    - tests/fmi/test_communication_points.py::test_an_honest_importers_clock_stays_inside_the_drift_tolerance
    - tests/fmi/test_communication_points.py::test_a_start_time_the_clock_cannot_resolve_against_the_master_step_is_refused
    - tests/fmi/test_communication_points.py::test_the_resolution_limit_is_where_sixteen_ulps_pass_a_tenth_of_the_master_step
    - tests/fmi/test_communication_points.py::test_a_step_that_would_end_past_the_resolution_limit_is_refused
