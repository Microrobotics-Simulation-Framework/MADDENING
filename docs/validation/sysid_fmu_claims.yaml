- id: SYS-071
  area: fit_multiple_shooting
  claim: >-
    "FitResult.best_loss is the loss of that selected pair, as the run
    evaluated it, before the hold_undetermined guard.  The window states are
    returned exactly as selected; the parameters are too unless the guard
    held a direction ..., in which case the returned pair's loss is within
    the guard's tolerance of best_loss ... and not necessarily equal to it";
    FitResult: best_loss "is the value before the hold_undetermined guard".
  sources:
    - src/maddening/sysid.py:4951 (fit_multiple_shooting)
    - src/maddening/sysid.py:3938 (FitResult, best_loss)
  conditions: >-
    a run the guard does not hold (the pair exact) and one it holds (within
    the tolerance). Not claimed for 16-bit floats.
  oracle: windowed_loss at the returned params and window states.
  tests:
    - tests/core/test_sysid_claims_edges.py::test_multiple_shooting_best_loss_is_the_returned_pairs_within_the_guards_tolerance
    - tests/core/test_sysid_claims_edges.py::test_best_loss_is_the_loss_of_exactly_the_params_returned
    - tests/core/test_sysid_bounded_coordinates_and_residual_scale.py::test_a_gauss_newton_iterate_is_evaluated_as_it_is_returned
  status: verified
  notes: >-
    f64 domain failing on d2429a6: a log leaf no step moved was returned as
    it went in while the run evaluated its exp(log(p)) round trip, so
    best_loss differed from the returned pair's loss by the loss's change
    over that ulp (5.2e-13 relative at k = 30.03). Fixed: the objectives of
    fit, fit_lm and fit_multiple_shooting evaluate exactly the parameters
    to_params returns (_exact_physical_params), so without the guard the
    pair is exact in float32 and float64.
    fit_lm's other way to an iterate, the Gauss-Newton step its floor rule
    takes (SYS-080), is evaluated through the same objective: best_loss is
    that candidate's loss as the run's last act, and the next iteration's
    once it converges on it.
