# System identification, parameters and FMU export: the claims inventory.
#
# Every documented statement about maddening.sysid, the parameter pytree
# and its ParamSpec, and the FMI 3.0 export that a user could rely on,
# with the domain it was stated for, how its truth is known, and a pytest
# node id that fails if it stops being true.  An audit attacks this list;
# a new claim in a docstring, a guide, the release notes or the CHANGELOG
# gets a row here in the same change (docs/developer_guide/
# testing_standards.md, "The claims inventories").
# tests/compliance/test_claims_inventories.py checks every row: its fields,
# that each cited test is collected and runs on every push (or is
# slow-marked and names a per-push witness), that a `failing` row cites a
# strict xfail and that a `verified` row cites none.
#
# Scope:
#   SYS -- src/maddening/sysid.py (windowed_loss, fim, fim_core, fit, fit_lm,
#          fit_multiple_shooting and their results, truth recovery, units),
#          src/maddening/core/params.py (ParamSpec, its bounds and
#          transforms) and node.params / gm.params as fitting and export see
#          them;
#   FMU -- src/maddening/fmi/ (model description, TCP bridge, sidecar, FMU
#          state, the C wrapper and packaging), FMI 3.0 conformance,
#          refusals, timeouts, tokens and the terminated state.
# Covered elsewhere, not repeated here: windowed_loss's mask_unconverged
# beyond its type check (coupling_claims.yaml, CPL-160 to CPL-162); the
# REST parameter routes (the REST surface's own audit area).
#
# Top level: schema_version (1), prefixes (the id prefixes this file owns;
# no other inventory may use them) and claims.
#
# Row fields:
#   id          SYS-NNN or FMU-NNN, unique.
#   area        a grouping label, free text.
#   claim       the documented wording (quoted where it is quoted).
#   sources     file:line or file (section); the first is where it is stated.
#   conditions  the domain the documentation states, or "unstated" parts.
#   oracle      how the truth is known.
#   tests       pytest node ids (without parameters, or with them).
#   status      verified | failing | untested | ambiguous
#   proposed_wording  required for ambiguous: the precise statement the
#                     tests support.
#   finding     required for failing: what breaks, the reproducer and a
#               file:line guess.  Every failing row cites a strict xfail.
#   reason      required for untested: why no test can fail.
#   notes       optional.
#
# Line numbers are those of release/0.4.0 at a0f12ef (the first edition);
# the section name beside each makes it findable when they move.

schema_version: 1

prefixes: [SYS, FMU]

claims:

# ---------------------------------------------------------------------------
