  sources:
    - src/maddening/sysid.py:302 (windowed_loss, window_states / continuity_weight)
  conditions: window states seeded from the truth, and one start moved.
  oracle: zero at the truth; the penalty affine in its weight.
  tests:
    - tests/core/test_sysid.py::test_multiple_shooting_loss_zero_at_truth_and_penalises_gaps
    - tests/core/test_sysid_contract_examples.py::test_the_continuity_penalty_is_affine_in_its_weight_and_charges_a_bumped_start
  status: verified

- id: SYS-009
