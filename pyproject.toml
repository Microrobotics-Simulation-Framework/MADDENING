[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maddening"
version = "0.4.0.dev0"
description = "Modular Automatic Differentiation and Data-Enhanced Neural-network INteracting Graph"
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.12"
authors = [
    { name = "Nicholas Ehsan Roy" },
]
keywords = [
    "simulation",
    "multi-physics",
    "jax",
    "differentiable-simulation",
    "neural-surrogate",
    "gpu",
    "scientific-computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Visualization",
]

# Base install: simulation engine (CPU JAX + NumPy + PyYAML + lineax).
# For GPU acceleration, add the cuda12 or tpu extra.
#
# `lineax` is a core dependency, not an extra: a coupling group at its
# *default* settings (solver="ift", linear_solver="gmres") routes its
# derivative rule through lineax, so a base install without it failed
# at runtime on the default path.  lineax is small and pure JAX
# (equinox + jaxtyping transitively), so the footprint is acceptable.
# It is still imported lazily -- see the note on the `ift` extra.
dependencies = [
    "jax>=0.10,<0.13",
    "jaxlib>=0.10,<0.13",
    "lineax>=0.0.7",
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]

# ── Hardware acceleration ──────────────────────────────────────────
# Base install gives CPU JAX.  These upgrade to GPU/TPU.
# Combine with any other extra:  pip install maddening[cuda12,server]
cuda12 = ["jax[cuda12]>=0.10,<0.13"]
tpu = ["jax[tpu]>=0.10,<0.13"]

# ── Differentiable linear solve (compatibility alias, v0.4.0) ───────
# `lineax` moved into the base dependencies in v0.4.0 because the
# default coupling solver needs it (see the note above).  This extra
# is kept, deliberately empty, so `pip install maddening[ift]` keeps
# resolving for anyone who pinned it in v0.3.x.  Removing it would
# still install, but pip warns on an extra the package does not
# declare (and is moving towards erroring), and warning at every
# downstream install buys nothing.  The wheel keeps a bare
# `Provides-Extra: ift` with no requirements.  lineax is still
# imported lazily: `import maddening` must not pay lineax's ~1 s
# import (equinox + jaxtyping + jax); only a Krylov solve does.
ift = []

# ── Cloud providers ────────────────────────────────────────────────
# One extra per provider.  Installs SkyPilot WITH the provider SDK.
runpod = ["skypilot[runpod]>=0.11"]
lambda = ["skypilot[lambda]>=0.11"]
aws = ["skypilot[aws]>=0.11"]
gcp = ["skypilot[gcp]>=0.11"]

# All providers supported in maddening.cloud.providers (RunPod + Lambda)
cloud = ["skypilot[runpod,lambda]>=0.11"]

# Every provider SkyPilot supports
cloud-all = ["skypilot[all]>=0.11"]

# ── Feature modules (fine-grained) ─────────────────────────────────
# Matplotlib-based visualization (time-series, 2D scene renderers)
viz = ["matplotlib>=3.5"]

# Rich-based terminal renderer (works over SSH, no GUI needed)
terminal = ["rich>=12.0"]

# ZMQ network transport for remote visualization and command channels
network = ["pyzmq>=25.0"]

# FastAPI server for HTTP/WebSocket API
api = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=11.0",
]

# Neural surrogate architectures and training
surrogates = ["equinox>=0.11", "optax>=0.1"]

# 3D visualization (server-side rendering with PyVista/VTK)
viz3d = ["pyvista>=0.42", "Pillow>=9.0"]

# GPU-accelerated 3D visualization (pygfx on WebGPU)
gpu-viz = ["pygfx>=0.16", "rendercanvas>=2.0", "glfw>=2.0", "scikit-image>=0.20"]

# OpenUSD integration (USD read/write, codeless schemas)
usd = ["usd-core>=21.8"]

# WebRTC streaming (GStreamer + signaling)
streaming = ["PyGObject>=3.42", "websockets>=11.0"]

# SBOM generation
sbom = ["cyclonedx-bom>=4.0"]

# zstd compression for the binary state encoder (v0.2 #6).
# Optional; falls back to uncompressed frames when absent.
compression = ["zstandard>=0.22"]

# ── Task bundles ───────────────────────────────────────────────────
# "I'm running a simulation server on a GPU" (Docker image target)
server = [
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=11.0",
    "pyzmq>=25.0",
    "rich>=12.0",
    "matplotlib>=3.5",
    "zstandard>=0.22",
]

# "I'm a thin client viewing a remote simulation"
client = [
    "pyzmq>=25.0",
    "rich>=12.0",
]

# ── Meta extras ────────────────────────────────────────────────────
# Everything (all features + RunPod cloud)
all = [
    "matplotlib>=3.5",
    "rich>=12.0",
    "pyzmq>=25.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=11.0",
    "equinox>=0.11",
    "optax>=0.1",
    "pyvista>=0.42",
    "Pillow>=9.0",
    "pygfx>=0.16",
    "rendercanvas>=2.0",
    "glfw>=2.0",
    "scikit-image>=0.20",
    "skypilot[runpod,lambda]>=0.11",
    "PyGObject>=3.42",
    "zstandard>=0.22",
]

# CI testing -- headless-safe subset (no display-dependent packages)
#
# httpx2 is pulled alongside httpx because starlette's testclient
# auto-detects httpx2 when present and uses it preferentially.  This
# closes the v0.2.1 StarletteDeprecationWarning loop (see C5 in
# plans/MADDENING_v0.3.0_PLAN.md).
ci = [
    "fsspec>=2023.1",   # cloud checkpoint URLs (tests/cloud/test_resume.py)
    "pytest>=7.0",
    "httpx>=0.24",
    "httpx2>=2.0",
    "matplotlib>=3.5",
    "rich>=12.0",
    "pyzmq>=25.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "websockets>=11.0",
    "equinox>=0.11",
    "optax>=0.1",
    "skypilot[runpod]>=0.11",
    "zstandard>=0.22",
    # FMI 3.0 round-trip validation (v0.3.0 A1).  Test-only -- not a
    # runtime dep of maddening.fmi.
    "fmpy>=0.3",
    # (`lineax` used to be listed here: as of v0.4.0 it is a base
    # dependency, so the base install already provides it.)
    # Property-based testing (hypothesis).
    "hypothesis>=6.165,<7",
    # The declared build backend, so tests/test_packaging_py_typed.py can
    # build a real wheel and assert the PEP 561 marker is in it without
    # reaching the network for an isolated build.  MADDENING_REQUIRE_PACKAGING_TESTS
    # in the CI test job turns "hatchling missing" into a failure rather
    # than a silent skip of the only check that proves py.typed ships.
    "hatchling>=1.21",
    # Static type check (non-blocking `typecheck` CI job; see
    # docs/developer_guide/typing.md).  Pinned exactly: the baseline in
    # that document (395 errors / 94 warnings) is tied to this pyright
    # release, and every pyright release changes diagnostics.  Bump it
    # together with the baseline, never alone.  The dev extra keeps a floor.
    "pyright==1.1.414",
]

# Property-based node verification (user-facing).
# Downstream users who want to verify their own nodes install this.
verify = [
    "hypothesis>=6.165,<7",
]

# Development / testing (full -- requires display server for viz3d/gpu-viz)
dev = [
    "fsspec>=2023.1",   # cloud checkpoint URLs (tests/cloud/test_resume.py)
    "pytest>=7.0",
    "httpx>=0.24",
    "httpx2>=2.0",
    "fmpy>=0.3",
    # `pyright` / `python scripts/typing_baseline.py` -- phase-1 typing
    # policy is non-blocking (docs/developer_guide/typing.md).  A floor
    # here; the ci extra pins the exact release the baseline was measured with.
    "pyright>=1.1.414",
    "maddening[all]",
]

[project.urls]
Homepage      = "https://microrobotica.org/maddening/"
Documentation = "https://microrobotica.org/maddening/"
Repository    = "https://github.com/Microrobotics-Simulation-Framework/MADDENING"
Issues        = "https://github.com/Microrobotics-Simulation-Framework/MADDENING/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/maddening"]

[tool.hatch.build.targets.wheel.force-include]
# PEP 561 marker.  Without it a downstream type checker MUST ignore every
# annotation in the package, so the whole typing effort is invisible to
# users of the wheel.  `tests/test_py_typed_marker.py` builds the wheel and
# asserts the member is present -- a force-include that looks right and
# ships nothing is indistinguishable from no marker at all.
"src/maddening/py.typed" = "maddening/py.typed"
"src/maddening/usd/schema/generatedSchema.usda" = "maddening/usd/schema/generatedSchema.usda"
"src/maddening/usd/schema/plugInfo.json" = "maddening/usd/schema/plugInfo.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error",
    # GraphManager.compile() emits informational warnings about disconnected
    # nodes and cycle staggering -- expected in unit tests with minimal graphs.
    "ignore:WARNING. node .* is disconnected:UserWarning",
    "ignore:WARNING. cycle detected:UserWarning",
    # RigidBody2DNode is deprecated but existing tests still exercise it
    "ignore:RigidBody2DNode is deprecated:DeprecationWarning",
    # solver='fori' is deprecated; the fori-vs-ift parity tests keep
    # exercising it until it is removed.
    "ignore:CouplingGroup solver='fori' is deprecated:DeprecationWarning",
    # calibrate()/tune_coupling_params() are deprecated in favour of
    # maddening.sysid.fit; their own tests still exercise them until 0.5.0.
    "ignore:maddening.core.simulation.calibration:DeprecationWarning",
    # ZMQ sockets not always cleanly closed in tests
    "ignore::ResourceWarning:zmq",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # optax 0.2.x sets jax_pmap_shmap_merge which is deprecated in JAX 0.9+
    "ignore:Setting `jax_pmap_shmap_merge`:DeprecationWarning",
    # anyio >= 4.14 deprecates the anyio.abc.BlockingPortal alias that
    # starlette's testclient still imports at module level, which turns
    # every tests/api collection into an error.  Fixed on starlette main
    # (Kludex/starlette#3497) but not in any release as of 1.6.0; drop
    # this filter and bump the starlette floor once it ships.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
    # SelkiesRenderer emits PerformanceWarning on CPU fallback
    "ignore::maddening.warnings.PerformanceWarning",
    # SkyPilot deprecation warnings
    "ignore:.*--cloud.*--region.*--zone.*deprecated:UserWarning",
]
# Custom markers — registered so `filterwarnings=["error"]` above
# doesn't elevate Unknown-Mark warnings to test errors. Mirrors the
# convention already in MIME's pyproject.toml.
markers = [
    "slow: tests over 5 s on the CI runner, or that need a beefy machine (latency benchmarks, full-LBM smokes); see the test time budget in docs/developer_guide/testing_standards.md. Run with `pytest -m 'slow or not slow'`. Default suite excludes them.",
    "gpu: tests that require a CUDA device (auto-skipped on CPU-only hosts).",
]
# Default-skip the slow lane in CI; opt in locally with
#   pytest -m 'slow or not slow'  (full suite)
#   pytest -m slow                 (slow only)
addopts = "-m 'not slow'"
